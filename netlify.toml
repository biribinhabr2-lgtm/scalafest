# ── Google Calendar OAuth callback ────────────────────────────────────────────
# Redireciona para a Supabase Edge Function que troca o code por tokens
[[redirects]]
  from = "/auth/google/callback"
  to   = "https://ybnqjvucyutpdjfpkgzg.supabase.co/functions/v1/google-oauth-callback"
  status = 301
  force  = true
