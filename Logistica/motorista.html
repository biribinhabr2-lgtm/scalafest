<script>
window._sfAppReady=false;
function mostrarErro(msg,detalhe){
  if(window._sfAppReady)return;
  var el=document.getElementById('root');
  if(el){
    el.innerHTML='<div style="padding:24px;font-family:sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A">'+
      '<div style="max-width:400px;width:100%;text-align:center">'+
      '<div style="font-size:40px;margin-bottom:12px">⚠️</div>'+
      '<h2 style="color:#F87171;margin-bottom:8px;font-size:18px">Erro ao carregar</h2>'+
      '<pre style="background:#1E293B;border:1px solid #374151;border-radius:8px;padding:12px;font-size:11px;color:#FCA5A5;white-space:pre-wrap;word-break:break-all;margin-bottom:16px;text-align:left">'+(msg||'Erro desconhecido')+(detalhe?'\n\n'+detalhe:'')+'</pre>'+
      '<button onclick="location.reload()" style="background:#3B82F6;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600">Tentar novamente</button>'+
      '</div></div>';
  }
}
window.addEventListener('error',function(e){
  if(!window._sfAppReady) mostrarErro(e.message, (e.filename?'Arquivo: '+e.filename:'')+(e.lineno?'\nLinha: '+e.lineno+', Col: '+e.colno:''));
});
window.addEventListener('unhandledrejection',function(e){
  if(!window._sfAppReady) mostrarErro('Promise rejeitada: '+(e.reason&&e.reason.message||String(e.reason)));
});
setTimeout(function(){
  if(!window._sfAppReady){
    var el=document.getElementById('root');
    if(el){
      el.innerHTML='<div style="padding:24px;font-family:sans-serif;text-align:center;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A">'+
        '<p style="color:#64748B;margin-bottom:8px">Demorou mais que o esperado…</p>'+
        '<p style="color:#475569;font-size:12px;margin-bottom:16px">Verifique a conexão com a internet.</p>'+
        '<button onclick="location.reload()" style="background:#3B82F6;color:#fff;border:none;padding:14px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600">Recarregar</button>'+
        '</div>';
    }
  }
},40000);
</script>

  --card:#1E293B;
  --card2:#334155;

body{
  background:var(--bg);

<body>
<div id="root"><div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A;gap:14px"><style>@keyframes _sf_spin3{to{transform:rotate(360deg)}}</style><div style="width:44px;height:44px;border:4px solid rgba(255,255,255,.12);border-top-color:#3B82F6;border-radius:50%;animation:_sf_spin3 .85s linear infinite"></div><div style="color:#64748B;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500">Carregando…</div></div></div>
<script>function cdnErr(lib){mostrarErro('Falha ao carregar '+lib+' do CDN (jsDelivr).','Verifique a conexão com a internet e tente recarregar.');}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin onerror="cdnErr('React')"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js" crossorigin></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback} = React;

const API_SECRET = "63ca1c9204286739761235ed738ec5cd138615fe31267aaf4cb429ace26c3410";

const SERVER_DEFAULT = "https://scalafest-production.up.railway.app";

const getServer = () => {
  try {
    const saved = localStorage.getItem("wa_server_url");
    if(!saved || saved.includes("localhost") || saved.includes("127.0.0.1")){
      localStorage.setItem("wa_server_url", SERVER_DEFAULT);
      return SERVER_DEFAULT;
    }
    return saved;
  }
  catch(e) { return SERVER_DEFAULT; }
};

const getMotorista = () => {
  try { return JSON.parse(localStorage.getItem("motorista_logado") || "null"); }
  catch(e) { return null; }
};

const salvarMotorista = (m) => {
  try { localStorage.setItem("motorista_logado", JSON.stringify(m)); } catch(e) {}
};

const limparMotorista = () => {
  try { localStorage.removeItem("motorista_logado"); } catch(e) {}
};

const apiDriver = async (method, path, motoristaId, body) => {
  const url = getServer() + '/api/logistics' + path;
  // Lê admin_id do motorista salvo para isolar tenant corretamente
  const _m = getMotorista();
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-api-secret': API_SECRET,
      'x-motorista-id': motoristaId || '',
      'x-admin-id': _m?.admin_id || '',
      'bypass-tunnel-reminder': 'true',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erro ' + r.status);
  return d;
};

const apiPublic = async (path, body) => {
  const url = getServer() + '/api/logistics' + path;
  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'bypass-tunnel-reminder': 'true',
    },
    body: JSON.stringify(body),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erro ' + r.status);
  return d;
};

// ── STATUS ────────────────────────────────────────────────────────────────────
const STATUS_INFO = {
  pendente:         {label:'Pendente',         color:'#94A3B8',bg:'rgba(148,163,184,.15)'},
  aguardando_saida: {label:'Aguardando saída', color:'#60A5FA',bg:'rgba(96,165,250,.15)'},
  em_deslocamento:  {label:'Em deslocamento',  color:'#FB923C',bg:'rgba(251,146,60,.15)'},
  chegou:           {label:'Chegou ao local',  color:'#34D399',bg:'rgba(52,211,153,.15)'},
  em_evento:        {label:'Em evento',        color:'#A78BFA',bg:'rgba(167,139,250,.15)'},
  retornando:       {label:'Retornando',       color:'#818CF8',bg:'rgba(129,140,248,.15)'},
  finalizado:       {label:'Finalizado',       color:'#4ADE80',bg:'rgba(74,222,128,.15)'},
  cancelado:        {label:'Cancelado',        color:'#F87171',bg:'rgba(248,113,113,.15)'},
};

// Mapa de transições: de qual status cada botão está disponível
const ACOES = [
  {
    status: 'aguardando_saida',
    label:  '📣 Estou pronto para sair',
    cor:    '#3B82F6',
    from:   ['pendente'],
  },
  {
    status: 'em_deslocamento',
    label:  '🚗 Saí para o evento',
    cor:    '#F59E0B',
    from:   ['aguardando_saida', 'pendente'],
  },
  {
    status: 'chegou',
    label:  '📍 Cheguei ao local',
    cor:    '#10B981',
    from:   ['em_deslocamento'],
  },
  {
    status: 'em_evento',
    label:  '🎪 Evento em andamento',
    cor:    '#8B5CF6',
    from:   ['chegou'],
  },
  {
    status: 'retornando',
    label:  '↩️ Iniciando retorno',
    cor:    '#6366F1',
    from:   ['em_evento', 'chegou'],
  },
  {
    status: 'finalizado',
    label:  '✅ Rota finalizada',
    cor:    '#22C55E',
    from:   ['retornando', 'em_evento', 'chegou'],
  },
];

function Spin({size}) {
  const s = size || 28;
  return (
    <div style={{
      width:s, height:s,
      border:'3px solid rgba(255,255,255,.15)',
      borderTopColor:'#3B82F6',
      borderRadius:'50%',
      animation:'spin .7s linear infinite',
      margin:'0 auto',
    }} />
  );
}

function Badge({status}) {
  const s = STATUS_INFO[status] || STATUS_INFO.pendente;
  return (
    <span style={{
      background:s.bg, color:s.color,
      padding:'4px 12px', borderRadius:20,
      fontSize:13, fontWeight:700, display:'inline-block',
    }}>
      {s.label}
    </span>
  );
}

// ── TELA DE LOGIN ─────────────────────────────────────────────────────────────
function TelaLogin({onLogin}) {
  const [tel, setTel] = useState('');
  const [pin, setPin] = useState('');
  const [loading, setLoading] = useState(false);
  const [erro, setErro] = useState('');

  const entrar = async e => {
    e.preventDefault();
    if (!tel || !pin) { setErro('Preencha telefone e PIN.'); return; }
    setLoading(true); setErro('');
    try {
      const m = await apiPublic('/drivers/auth/login', {telefone: tel, pin});
      salvarMotorista(m);
      onLogin(m);
    } catch(e) { setErro(e.message); }
    setLoading(false);
  };

  return (
    <div style={{
      minHeight:'100dvh',
      display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',
      padding:'24px 20px',
    }}>
      {/* Ícone */}
      <div style={{marginBottom:32,textAlign:'center'}}>
        <div style={{fontSize:56,marginBottom:12}}>🚐</div>
        <h1 style={{fontSize:24,fontWeight:800,color:'#F1F5F9'}}>EscalaFest</h1>
        <div style={{fontSize:14,color:'#64748B',marginTop:4}}>App do Motorista</div>
      </div>

      <form onSubmit={entrar} style={{width:'100%',maxWidth:340}}>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:600,color:'#94A3B8',marginBottom:6}}>Telefone</div>
          <input
            type="tel" value={tel} onChange={e=>setTel(e.target.value)}
            placeholder="11999999999" required
            style={{
              width:'100%',padding:'14px 16px',borderRadius:12,
              border:'1.5px solid rgba(255,255,255,.1)',
              background:'rgba(255,255,255,.06)',
              color:'#F1F5F9',fontSize:18,
              outline:'none',
              WebkitAppearance:'none',
            }}
          />
        </div>
        <div style={{marginBottom:24}}>
          <div style={{fontSize:13,fontWeight:600,color:'#94A3B8',marginBottom:6}}>PIN</div>
          <input
            type="password" inputMode="numeric" value={pin} onChange={e=>setPin(e.target.value)}
            placeholder="••••" required
            style={{
              width:'100%',padding:'14px 16px',borderRadius:12,
              border:'1.5px solid rgba(255,255,255,.1)',
              background:'rgba(255,255,255,.06)',
              color:'#F1F5F9',fontSize:24,letterSpacing:8,
              outline:'none',
              WebkitAppearance:'none',
            }}
          />
        </div>
        {erro && (
          <div style={{background:'rgba(239,68,68,.15)',color:'#F87171',borderRadius:10,padding:'10px 14px',fontSize:14,marginBottom:16,border:'1px solid rgba(239,68,68,.2)'}}>
            {erro}
          </div>
        )}
        <button type="submit" disabled={loading}
                style={{
                  width:'100%',padding:16,borderRadius:14,border:'none',
                  background: loading ? 'rgba(59,130,246,.5)' : '#3B82F6',
                  color:'#fff',fontSize:17,fontWeight:700,
                  cursor:loading?'not-allowed':'pointer',
                  transition:'background .15s',
                }}>
          {loading ? <Spin size={22} /> : 'Entrar'}
        </button>
      </form>
    </div>
  );
}

const TIPO_ROTA_LABEL = {
  simples:      '🚗 Ida e volta',
  ida_fica:     '🏕️ Ida e fica',
  personalizada:'📍 Personalizada',
};

const TIPO_PARADA_ICON = {
  encontro:'🤝', embarque:'⬆️', desembarque:'⬇️', pausa:'⏸️',
};

// ── CARD DE ROTA ──────────────────────────────────────────────────────────────
function CartaoRota({rota, motoristaId, onAtualizar}) {
  const [loading, setLoading] = useState(false);
  const [navLoading, setNavLoading] = useState(false);
  const [expandido, setExpandido] = useState(true);

  const confirmada = rota.confirmada_adm === true;
  const paradas    = Array.isArray(rota.paradas_extras) ? rota.paradas_extras : [];

  const atualizar = async (status) => {
    if (!confirmada) {
      alert('Esta rota ainda não foi confirmada pelo administrador.\nAguarde a confirmação antes de iniciar.');
      return;
    }
    setLoading(true);
    try {
      await apiDriver('POST', '/dispatch/' + rota.id + '/status', motoristaId, {status});
      onAtualizar();
    } catch(e) { alert(e.message); }
    setLoading(false);
  };

  const navegar = async () => {
    setNavLoading(true);
    try {
      const d = await apiDriver('GET', '/dispatch/' + rota.id + '/navegar', motoristaId);
      if (d.url) window.open(d.url, '_blank');
      else alert('URL de navegação não disponível.');
    } catch(e) { alert(e.message); }
    setNavLoading(false);
  };

  const acoes = ACOES.filter(a => a.from.includes(rota.status));
  const finalizado = rota.status === 'finalizado' || rota.status === 'cancelado';

  const fmtHora = (iso) => {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
    catch(e) { return iso; }
  };

  return (
    <div className="animate-up" style={{
      background:'#1E293B',borderRadius:20,
      border: confirmada ? '1px solid rgba(34,197,94,.2)' : '1px solid rgba(245,158,11,.25)',
      overflow:'hidden',marginBottom:16,
    }}>
      {/* Header */}
      <div style={{padding:'16px 18px',cursor:'pointer'}} onClick={()=>setExpandido(!expandido)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div style={{flex:1,minWidth:0,marginRight:12}}>
            <div style={{fontWeight:700,fontSize:17,color:'#F1F5F9',marginBottom:4,lineHeight:1.3}}>
              {rota.nome_evento}
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
              <Badge status={rota.status} />
              {rota.tipo_rota && rota.tipo_rota !== 'simples' && (
                <span style={{fontSize:11,background:'rgba(255,255,255,.06)',color:'#94A3B8',padding:'2px 8px',borderRadius:20}}>
                  {TIPO_ROTA_LABEL[rota.tipo_rota] || rota.tipo_rota}
                </span>
              )}
              {paradas.length > 0 && (
                <span style={{fontSize:11,background:'rgba(59,130,246,.12)',color:'#60A5FA',padding:'2px 8px',borderRadius:20}}>
                  {paradas.length} parada(s)
                </span>
              )}
            </div>
          </div>
          <div style={{flexShrink:0,fontSize:18,color:'#475569'}}>
            {expandido ? '▲' : '▼'}
          </div>
        </div>
      </div>

      {expandido && (
        <div style={{padding:'0 18px 18px'}}>

          {/* Banner de confirmação */}
          {!confirmada && !finalizado && (
            <div style={{
              background:'rgba(245,158,11,.12)',border:'1px solid rgba(245,158,11,.3)',
              borderRadius:12,padding:'12px 14px',marginBottom:14,
              display:'flex',gap:10,alignItems:'center',
            }}>
              <span style={{fontSize:20}}>⏳</span>
              <div>
                <div style={{fontWeight:700,fontSize:13,color:'#FCD34D'}}>Aguardando confirmação</div>
                <div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>O administrador ainda não confirmou esta rota. Você pode visualizar os detalhes, mas não pode alterar o status.</div>
              </div>
            </div>
          )}
          {confirmada && rota.status === 'pendente' && (
            <div style={{
              background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.2)',
              borderRadius:12,padding:'10px 14px',marginBottom:14,
              display:'flex',gap:10,alignItems:'center',
            }}>
              <span style={{fontSize:18}}>✅</span>
              <div style={{fontSize:13,color:'#4ADE80',fontWeight:600}}>Rota confirmada pelo administrador — pronto para sair!</div>
            </div>
          )}

          {/* Roteiro visual (timeline) */}
          {(rota.ponto_saida || paradas.length > 0 || rota.ponto_retorno) && (
            <div style={{background:'rgba(255,255,255,.04)',borderRadius:14,padding:'12px 14px',marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:10}}>
                Roteiro
              </div>
              <div style={{position:'relative'}}>
                {/* linha vertical */}
                <div style={{position:'absolute',left:13,top:14,bottom:14,width:2,background:'rgba(255,255,255,.06)',borderRadius:2}} />

                {/* Ponto de saída */}
                {rota.ponto_saida && (
                  <div style={{display:'flex',gap:12,alignItems:'flex-start',marginBottom:12,position:'relative',zIndex:1}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:'#1E3A5F',border:'2px solid #3B82F6',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:13}}>🏠</div>
                    <div style={{paddingTop:4}}>
                      <div style={{fontSize:13,fontWeight:700,color:'#93C5FD'}}>Saída</div>
                      <div style={{fontSize:12,color:'#CBD5E1'}}>{rota.ponto_saida.nome}</div>
                      <div style={{fontSize:11,color:'#475569'}}>{rota.ponto_saida.endereco}</div>
                      {rota.horario_saida_calculado && (
                        <div style={{fontSize:12,color:'#F59E0B',fontWeight:700,marginTop:2}}>🚀 {fmtHora(rota.horario_saida_calculado)}</div>
                      )}
                    </div>
                  </div>
                )}

                {/* Paradas intermediárias */}
                {paradas.map((p,i) => (
                  <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',marginBottom:12,position:'relative',zIndex:1}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:'#1E293B',border:'2px solid #475569',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:13}}>
                      {TIPO_PARADA_ICON[p.tipo||'encontro']}
                    </div>
                    <div style={{paddingTop:4}}>
                      <div style={{fontSize:13,fontWeight:700,color:'#CBD5E1'}}>{p.nome || 'Parada ' + (i+1)}</div>
                      {p.endereco && <div style={{fontSize:12,color:'#94A3B8'}}>{p.endereco}</div>}
                      {p.horario && <div style={{fontSize:12,color:'#F59E0B',fontWeight:600,marginTop:2}}>⏰ {p.horario}</div>}
                    </div>
                  </div>
                ))}

                {/* Evento (destino principal) */}
                <div style={{display:'flex',gap:12,alignItems:'flex-start',marginBottom: rota.tipo_rota !== 'ida_fica' && rota.ponto_retorno ? 12 : 0,position:'relative',zIndex:1}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:'#1E3A5F',border:'2px solid #8B5CF6',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:13}}>🎪</div>
                  <div style={{paddingTop:4}}>
                    <div style={{fontSize:13,fontWeight:700,color:'#C4B5FD'}}>Evento</div>
                    <div style={{fontSize:12,color:'#CBD5E1'}}>{rota.nome_evento}</div>
                    <div style={{fontSize:11,color:'#475569'}}>{rota.endereco_evento}</div>
                    {rota.horario_inicio && (
                      <div style={{fontSize:12,color:'#A78BFA',fontWeight:600,marginTop:2}}>⏰ {rota.horario_inicio}{rota.horario_fim ? ' – ' + rota.horario_fim : ''}</div>
                    )}
                  </div>
                </div>

                {/* Retorno */}
                {rota.tipo_rota !== 'ida_fica' && rota.ponto_retorno && (
                  <div style={{display:'flex',gap:12,alignItems:'flex-start',position:'relative',zIndex:1}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:'#1E3A5F',border:'2px solid #22C55E',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:13}}>🏁</div>
                    <div style={{paddingTop:4}}>
                      <div style={{fontSize:13,fontWeight:700,color:'#86EFAC'}}>Retorno</div>
                      <div style={{fontSize:12,color:'#CBD5E1'}}>{rota.ponto_retorno.nome}</div>
                      <div style={{fontSize:11,color:'#475569'}}>{rota.ponto_retorno.endereco}</div>
                    </div>
                  </div>
                )}
                {rota.tipo_rota === 'ida_fica' && (
                  <div style={{marginTop:8,fontSize:12,color:'#64748B',textAlign:'center',fontStyle:'italic'}}>
                    🏕️ Sem retorno previsto — motorista fica no local
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Info adicional */}
          <div style={{background:'rgba(255,255,255,.04)',borderRadius:12,padding:'12px 14px',marginBottom:16,display:'grid',gap:8}}>
            {!rota.ponto_saida && (
              <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                <span style={{fontSize:16,flexShrink:0}}>📍</span>
                <div>
                  <div style={{fontSize:12,color:'#64748B',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>Destino</div>
                  <div style={{fontSize:14,color:'#CBD5E1',marginTop:1}}>{rota.endereco_evento}</div>
                </div>
              </div>
            )}
            <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
              <span style={{fontSize:16,flexShrink:0}}>📅</span>
              <div>
                <div style={{fontSize:12,color:'#64748B',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>Data</div>
                <div style={{fontSize:14,color:'#CBD5E1',marginTop:1}}>{rota.data_evento}</div>
              </div>
            </div>
            {rota.distancia_km && (
              <div style={{display:'flex',gap:10,alignItems:'center'}}>
                <span style={{fontSize:16,flexShrink:0}}>🛣️</span>
                <div style={{fontSize:14,color:'#CBD5E1'}}>
                  {rota.distancia_km} km
                  {rota.duracao_min ? ' · ' + rota.duracao_min + ' min' : ''}
                </div>
              </div>
            )}
            {rota.veiculo && (
              <div style={{display:'flex',gap:10,alignItems:'center'}}>
                <span style={{fontSize:16,flexShrink:0}}>🚐</span>
                <div style={{fontSize:14,color:'#CBD5E1'}}>
                  {rota.veiculo.nome}
                  {rota.veiculo.placa ? ' · ' + rota.veiculo.placa : ''}
                </div>
              </div>
            )}
            {rota.observacoes && (
              <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                <span style={{fontSize:16,flexShrink:0}}>📝</span>
                <div style={{fontSize:13,color:'#94A3B8'}}>{rota.observacoes}</div>
              </div>
            )}
          </div>

          {/* Botão de Navegação */}
          <button onClick={navegar} disabled={navLoading}
                  style={{
                    width:'100%',padding:'14px',borderRadius:14,
                    background: navLoading ? 'rgba(16,185,129,.4)' : 'rgba(16,185,129,.15)',
                    color:'#34D399',fontSize:15,fontWeight:700,cursor:'pointer',
                    marginBottom:12,display:'flex',alignItems:'center',justifyContent:'center',gap:8,
                    border:'1px solid rgba(16,185,129,.25)',
                  }}>
            {navLoading ? <Spin size={18} /> : '🗺️'}
            {navLoading ? 'Abrindo…' : 'Abrir Navegação Google Maps'}
          </button>

          {/* Ações de status */}
          {!finalizado && confirmada && (
            <div style={{display:'grid',gap:10}}>
              {loading && <div style={{textAlign:'center',padding:12}}><Spin size={24} /></div>}
              {!loading && acoes.map(a => (
                <button key={a.status} onClick={()=>atualizar(a.status)}
                        style={{
                          width:'100%',padding:'16px',borderRadius:14,border:'none',
                          background: a.cor,
                          color:'#fff',fontSize:16,fontWeight:700,
                          cursor:'pointer',
                          boxShadow:'0 4px 12px rgba(0,0,0,.3)',
                        }}>
                  {a.label}
                </button>
              ))}
              {!loading && acoes.length === 0 && (
                <div style={{textAlign:'center',color:'#64748B',fontSize:13,padding:'8px 0'}}>
                  Aguardando próxima ação…
                </div>
              )}
            </div>
          )}
          {finalizado && (
            <div style={{textAlign:'center',padding:'12px 0',color:'#4ADE80',fontSize:15,fontWeight:700}}>
              {rota.status === 'finalizado' ? '✅ Rota concluída!' : '❌ Rota cancelada'}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── PAINEL DO MOTORISTA ───────────────────────────────────────────────────────
function PainelMotorista({motorista, onSair}) {
  const [rotas, setRotas] = useState([]);
  const [loading, setLoading] = useState(false);
  const [erro, setErro] = useState('');
  const [lastUpdate, setLastUpdate] = useState(null);

  const carregar = useCallback(async () => {
    setLoading(true); setErro('');
    try {
      const d = await apiDriver('GET', '/my-routes', motorista.id);
      setRotas(Array.isArray(d) ? d : []);
      setLastUpdate(new Date());
    } catch(e) { setErro(e.message); }
    setLoading(false);
  }, [motorista.id]);

  useEffect(() => {
    carregar();
    const t = setInterval(carregar, 60000);
    return () => clearInterval(t);
  }, [carregar]);

  const sair = () => {
    if (confirm('Sair da conta?')) {
      limparMotorista();
      onSair();
    }
  };

  const hoje = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

  const rotasPendentes  = rotas.filter(r => r.status !== 'finalizado' && r.status !== 'cancelado');
  const rotasFinalizadas = rotas.filter(r => r.status === 'finalizado' || r.status === 'cancelado');

  return (
    <div style={{minHeight:'100dvh',display:'flex',flexDirection:'column'}}>
      {/* Header */}
      <div style={{
        background:'#1E293B',
        padding:'env(safe-area-inset-top,12px) 20px 14px',
        borderBottom:'1px solid rgba(255,255,255,.07)',
        position:'sticky',top:0,zIndex:10,
      }}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontWeight:700,fontSize:17,color:'#F1F5F9'}}>Olá, {motorista.nome.split(' ')[0]}! 👋</div>
            <div style={{fontSize:12,color:'#64748B',marginTop:1,textTransform:'capitalize'}}>{hoje}</div>
          </div>
          <button onClick={sair} style={{background:'transparent',border:'1px solid rgba(255,255,255,.1)',padding:'6px 12px',borderRadius:8,color:'#94A3B8',fontSize:12,cursor:'pointer'}}>
            Sair
          </button>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,padding:'16px 16px 32px',overflowY:'auto'}}>
        {/* Status e Atualizar */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div style={{fontSize:13,color:'#64748B'}}>
            {lastUpdate ? 'Atualizado: ' + lastUpdate.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : ''}
          </div>
          <button onClick={carregar} disabled={loading}
                  style={{background:'rgba(59,130,246,.15)',border:'1px solid rgba(59,130,246,.25)',color:'#60A5FA',padding:'6px 12px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer'}}>
            {loading ? '↺' : '↺ Atualizar'}
          </button>
        </div>

        {erro && (
          <div style={{background:'rgba(239,68,68,.15)',color:'#F87171',borderRadius:12,padding:'12px 16px',fontSize:14,marginBottom:16,border:'1px solid rgba(239,68,68,.2)'}}>
            ⚠️ {erro}
            <div style={{fontSize:12,marginTop:4,color:'#94A3B8'}}>Verifique a conexão e tente atualizar.</div>
          </div>
        )}

        {loading && rotas.length === 0 && (
          <div style={{textAlign:'center',padding:60}}>
            <Spin size={36} />
            <div style={{color:'#64748B',fontSize:14,marginTop:16}}>Carregando rotas…</div>
          </div>
        )}

        {!loading && rotas.length === 0 && !erro && (
          <div style={{textAlign:'center',padding:'60px 20px'}}>
            <div style={{fontSize:56,marginBottom:16}}>😴</div>
            <div style={{fontWeight:700,fontSize:18,color:'#F1F5F9',marginBottom:8}}>Sem rotas hoje</div>
            <div style={{color:'#64748B',fontSize:14}}>Você não tem nenhuma rota atribuída para hoje.</div>
          </div>
        )}

        {/* Rotas ativas */}
        {rotasPendentes.length > 0 && (
          <div>
            <div style={{fontSize:12,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:12}}>
              {rotasPendentes.length} rota(s) ativa(s)
            </div>
            {rotasPendentes.map(r => (
              <CartaoRota key={r.id} rota={r} motoristaId={motorista.id} onAtualizar={carregar} />
            ))}
          </div>
        )}

        {/* Rotas finalizadas */}
        {rotasFinalizadas.length > 0 && (
          <div style={{marginTop: rotasPendentes.length > 0 ? 24 : 0}}>
            <div style={{fontSize:12,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:12}}>
              Concluídas hoje ({rotasFinalizadas.length})
            </div>
            {rotasFinalizadas.map(r => (
              <CartaoRota key={r.id} rota={r} motoristaId={motorista.id} onAtualizar={carregar} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [motorista, setMotorista] = useState(null);
  const [pronto, setPronto] = useState(false);

  useEffect(() => {
    const m = getMotorista();
    setMotorista(m);
    setPronto(true);
  }, []);

  if (!pronto) {
    return (
      <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <Spin size={32} />
      </div>
    );
  }

  if (!motorista) {
    return (
      <TelaLogin onLogin={m => setMotorista(m)} />
    );
  }

  return (
    <PainelMotorista motorista={motorista} onSair={() => setMotorista(null)} />
  );
}

window._sfAppReady=true;
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
