<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>EscalaFest — Logística</title>
<meta name="theme-color" content="#2563EB"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
window._sfAppReady=false;
function mostrarErro(msg,detalhe){
  if(window._sfAppReady)return;
  var el=document.getElementById('root');
  if(el){
    el.innerHTML='<div style="padding:24px;font-family:sans-serif;max-width:600px;margin:0 auto">'+
      '<h2 style="color:#dc2626;margin-bottom:8px">Erro ao carregar</h2>'+
      '<pre style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px;font-size:12px;color:#7f1d1d;white-space:pre-wrap;word-break:break-all;margin-bottom:16px">'+(msg||'Erro desconhecido')+(detalhe?'\n\n'+detalhe:'')+'</pre>'+
      '<p style="font-size:12px;color:#64748b;margin-bottom:16px">Abra o DevTools (F12) → aba Console para ver detalhes completos.</p>'+
      '<button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px">Tentar novamente</button></div>';
  }
}
window.addEventListener('error',function(e){
  if(!window._sfAppReady) mostrarErro(e.message, (e.filename?'Arquivo: '+e.filename:'')+(e.lineno?'\nLinha: '+e.lineno+', Col: '+e.colno:''));
});
window.addEventListener('unhandledrejection',function(e){
  if(!window._sfAppReady) mostrarErro('Promise rejeitada: '+(e.reason&&e.reason.message||String(e.reason)));
});
setTimeout(function(){
  if(!window._sfAppReady){
    var el=document.getElementById('root');
    if(el){
      el.innerHTML='<div style="padding:24px;font-family:sans-serif;text-align:center">'+
        '<p style="color:#64748b;margin-bottom:8px">Demorou mais que o esperado...</p>'+
        '<p style="color:#94a3b8;font-size:12px;margin-bottom:16px">Verifique a conexão com a internet (jsDelivr CDN).</p>'+
        '<button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:600">Recarregar</button></div>';
    }
  }
},40000);
</script>
<style>
:root{
  --bg:#F8FAFC;--card:#FFFFFF;--sidebar:#0F172A;
  --border:#E2E8F0;--text:#0F172A;--text2:#64748B;--text3:#94A3B8;
  --primary:#2563EB;--primary-l:#EFF6FF;
  --success:#16A34A;--warning:#EA580C;--danger:#DC2626;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--border)}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
h1,h2,h3,h4{font-family:'Sora',sans-serif;color:var(--text)}
input,select,textarea{color:var(--text)!important;font-size:16px!important;font-family:'DM Sans',sans-serif}
@media(min-width:768px){input,select,textarea{font-size:13px!important}}
input::placeholder,textarea::placeholder{color:var(--text3)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"><div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F8FAFC;gap:14px"><style>@keyframes _sf_spin2{to{transform:rotate(360deg)}}</style><div style="width:44px;height:44px;border:4px solid #E2E8F0;border-top-color:#2563EB;border-radius:50%;animation:_sf_spin2 .85s linear infinite"></div><div style="color:#64748B;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500">Carregando Logística…</div></div></div>
<script>function cdnErr(lib){mostrarErro('Falha ao carregar '+lib+' do CDN (jsDelivr).','Verifique a conexão com a internet e tente recarregar.');}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin onerror="cdnErr('React')"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js" crossorigin></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback} = React;

const SUPA_URL = "https://ybnqjvucyutpdjfpkgzg.supabase.co";
const SUPA_KEY = "sb_publishable_NnGnQvref4sylej3KR9vqQ_ldWpXeit";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const API_SECRET = "63ca1c9204286739761235ed738ec5cd138615fe31267aaf4cb429ace26c3410";

const getServer = () => {
  try { return localStorage.getItem("wa_server_url") || "http://localhost:3001"; }
  catch(e) { return "http://localhost:3001"; }
};

const api = async (method, path, adminId, body) => {
  const url = getServer() + '/api/logistics' + path;
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-api-secret': API_SECRET,
      'x-admin-id': adminId || '',
      'bypass-tunnel-reminder': 'true',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erro ' + r.status);
  return d;
};

const STATUS_INFO = {
  pendente:         {label:'Pendente',          bg:'#F1F5F9',color:'#475569'},
  aguardando_saida: {label:'Aguardando saída',  bg:'#DBEAFE',color:'#1D4ED8'},
  em_deslocamento:  {label:'Em deslocamento',   bg:'#FED7AA',color:'#C2410C'},
  chegou:           {label:'Chegou',            bg:'#CCFBF1',color:'#0F766E'},
  em_evento:        {label:'Em evento',         bg:'#EDE9FE',color:'#7C3AED'},
  retornando:       {label:'Retornando',        bg:'#E0E7FF',color:'#4338CA'},
  finalizado:       {label:'Finalizado',        bg:'#DCFCE7',color:'#15803D'},
  cancelado:        {label:'Cancelado',         bg:'#FEE2E2',color:'#B91C1C'},
};

function Badge({status}) {
  const s = STATUS_INFO[status] || STATUS_INFO.pendente;
  return (
    <span style={{background:s.bg,color:s.color,padding:'2px 8px',borderRadius:20,fontSize:11,fontWeight:600,whiteSpace:'nowrap',display:'inline-block'}}>
      {s.label}
    </span>
  );
}

function Spin() {
  return (
    <div style={{width:24,height:24,border:'2px solid #E2E8F0',borderTopColor:'#2563EB',borderRadius:'50%',animation:'spin .7s linear infinite',margin:'0 auto'}} />
  );
}

function Erro({msg}) {
  if (!msg) return null;
  return (
    <div style={{background:'#FEF2F2',color:'#DC2626',padding:'8px 12px',borderRadius:8,fontSize:13,marginBottom:12,border:'1px solid #FECACA'}}>
      {msg}
    </div>
  );
}

function Label({children}) {
  return <div style={{fontSize:12,fontWeight:600,color:'#64748B',marginBottom:4}}>{children}</div>;
}

function Campo({label, type, value, onChange, placeholder, required, style}) {
  return (
    <div style={{marginBottom:12}}>
      {label && <Label>{label}</Label>}
      <input type={type||'text'} value={value||''} onChange={onChange}
             placeholder={placeholder||''} required={required}
             style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid #E2E8F0',background:'#fff',...(style||{})}} />
    </div>
  );
}

function Sel({label, value, onChange, children}) {
  return (
    <div style={{marginBottom:12}}>
      {label && <Label>{label}</Label>}
      <select value={value||''} onChange={onChange}
              style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid #E2E8F0',background:'#fff'}}>
        {children}
      </select>
    </div>
  );
}

function Btn({onClick, disabled, style, children}) {
  return (
    <button onClick={onClick} disabled={disabled}
            style={{border:'none',padding:'7px 14px',borderRadius:8,fontSize:13,cursor:disabled?'not-allowed':'pointer',fontWeight:600,opacity:disabled?0.55:1,transition:'opacity .12s',...(style||{})}}>
      {children}
    </button>
  );
}

// ─── ABA AO VIVO ──────────────────────────────────────────────────────────────
function AbaAoVivo({adminId}) {
  const [rotas, setRotas] = useState([]);
  const [loading, setLoading] = useState(false);
  const [erro, setErro] = useState('');

  const carregar = useCallback(async () => {
    setLoading(true); setErro('');
    try {
      const d = await api('GET', '/dispatch/live', adminId);
      setRotas(Array.isArray(d) ? d : []);
    } catch(e) { setErro(e.message); }
    setLoading(false);
  }, [adminId]);

  useEffect(() => {
    carregar();
    const t = setInterval(carregar, 30000);
    return () => clearInterval(t);
  }, [carregar]);

  const mudarStatus = async (id, status) => {
    try { await api('POST', '/dispatch/' + id + '/status', adminId, {status, por:'admin', adminId}); await carregar(); }
    catch(e) { alert(e.message); }
  };

  const abrirNav = async (id) => {
    try { const d = await api('GET', '/dispatch/' + id + '/navegar', adminId); if (d.url) window.open(d.url,'_blank'); }
    catch(e) { alert(e.message); }
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h2 style={{fontSize:18}}>🔴 Painel ao Vivo</h2>
        <Btn onClick={carregar} style={{background:'#EFF6FF',color:'#2563EB'}}>↺ Atualizar</Btn>
      </div>
      <Erro msg={erro} />
      {loading && rotas.length === 0 && <div style={{textAlign:'center',padding:40}}><Spin/></div>}
      {!loading && rotas.length === 0 && (
        <div style={{textAlign:'center',padding:48,color:'#64748B'}}>
          <div style={{fontSize:40,marginBottom:12}}>🚗</div>
          <div>Nenhuma rota ativa no momento.</div>
          <div style={{fontSize:12,marginTop:4,color:'#94A3B8'}}>Atualiza automaticamente a cada 30 segundos.</div>
        </div>
      )}
      <div style={{display:'grid',gap:12}}>
        {rotas.map(r => (
          <div key={r.id} style={{background:'#fff',borderRadius:12,padding:16,border:'1px solid #E2E8F0',boxShadow:'0 1px 3px rgba(0,0,0,.06)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <div>
                <div style={{fontWeight:700,fontSize:15}}>{r.nome_evento}</div>
                <div style={{fontSize:12,color:'#64748B',marginTop:2}}>
                  {(r.motorista && r.motorista.nome) || 'Sem motorista'}
                  {' · '}
                  {(r.veiculo && r.veiculo.nome) || 'Sem veículo'}
                </div>
              </div>
              <Badge status={r.status} />
            </div>
            <div style={{fontSize:12,color:'#64748B',marginBottom:10,display:'flex',flexWrap:'wrap',gap:'4px 12px'}}>
              <span>📍 {r.endereco_evento}</span>
              {r.data_evento && <span>📅 {r.data_evento}</span>}
              {r.horario_inicio && <span>⏰ {r.horario_inicio}</span>}
              {r.horario_saida_calculado && (
                <span>🚀 Saída: {new Date(r.horario_saida_calculado).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>
              )}
              {r.distancia_km && <span>🛣️ {r.distancia_km} km</span>}
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
              <Btn onClick={()=>abrirNav(r.id)} style={{background:'#F0FDF4',color:'#16A34A',fontSize:12}}>🗺️ Navegar</Btn>
              {r.status !== 'finalizado' && r.status !== 'cancelado' && (
                <select onChange={e=>{if(e.target.value){mudarStatus(r.id,e.target.value);e.target.value='';} }}
                        defaultValue=""
                        style={{border:'1px solid #E2E8F0',borderRadius:6,padding:'5px 8px',fontSize:12,background:'#fff',cursor:'pointer'}}>
                  <option value="" disabled>Alterar status…</option>
                  {Object.entries(STATUS_INFO).map(([k,v]) => (
                    <option key={k} value={k}>{v.label}</option>
                  ))}
                </select>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ABA ROTAS ────────────────────────────────────────────────────────────────
const TIPO_ROTA_INFO = {
  simples:      {icon:'🚗', label:'Simples — ida e volta'},
  ida_fica:     {icon:'🏕️', label:'Ida e Fica — sem retorno previsto'},
  personalizada:{icon:'📍', label:'Personalizada — paradas customizadas'},
};

const TIPO_PARADA_INFO = {
  encontro:    {icon:'🤝', label:'Ponto de Encontro'},
  embarque:    {icon:'⬆️', label:'Embarque'},
  desembarque: {icon:'⬇️', label:'Desembarque'},
  pausa:       {icon:'⏸️', label:'Pausa'},
};

function FormRota({form, onChange, onSave, onCancel, motoristas, veiculos, pontos, saving, adminId}) {
  const f = form;
  const set = (k,v) => onChange({...f,[k]:v});

  const [eventos, setEventos] = useState([]);
  const [busca, setBusca] = useState('');
  const [aberto, setAberto] = useState(false);

  // Carrega eventos do sf_dados via Supabase direto
  useEffect(() => {
    if (!adminId) return;
    sb.from('sf_dados').select('dados')
      .eq('user_id', adminId).eq('tipo', 'eventos')
      .order('updated_at', {ascending: false}).limit(1)
      .then(({data}) => {
        const lista = Array.isArray(data && data[0] && data[0].dados) ? data[0].dados : [];
        lista.sort((a,b) => (b.data||'').localeCompare(a.data||''));
        setEventos(lista);
      }).catch(() => {});
  }, [adminId]);

  const importar = (ev) => {
    const dataFmt = ev.data ? String(ev.data).slice(0,10) : '';
    onChange({
      ...f,
      nome_evento:     ev.nome  || '',
      endereco_evento: ev.local || '',
      data_evento:     dataFmt,
      horario_inicio:  ev.horaInicio || '',
      horario_fim:     ev.horaFim    || '',
      evento_ref_id:   String(ev.id  || ''),
    });
    setAberto(false);
    setBusca('');
  };

  const filtrados = eventos.filter(ev =>
    !busca || (ev.nome && ev.nome.toLowerCase().includes(busca.toLowerCase())) ||
    (ev.local && ev.local.toLowerCase().includes(busca.toLowerCase()))
  );

  const fmtData = (d) => {
    if (!d) return '';
    try { return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
    catch(e) { return d; }
  };

  // ── Paradas extras helpers ──
  const paradas = Array.isArray(f.paradas_extras) ? f.paradas_extras : [];

  const addParada = () => {
    onChange({...f, paradas_extras: [...paradas, {nome:'', endereco:'', horario:'', tipo:'encontro'}]});
  };
  const removeParada = (i) => {
    onChange({...f, paradas_extras: paradas.filter((_,idx) => idx !== i)});
  };
  const updateParada = (i, key, val) => {
    onChange({...f, paradas_extras: paradas.map((p,idx) => idx === i ? {...p,[key]:val} : p)});
  };
  const moverParada = (i, dir) => {
    const arr = [...paradas];
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    onChange({...f, paradas_extras: arr});
  };

  return (
    <div style={{background:'#F8FAFC',border:'1px solid #E2E8F0',borderRadius:12,padding:20,marginBottom:16}}>
      <h3 style={{fontSize:15,marginBottom:16}}>{f.id ? 'Editar Rota' : 'Nova Rota'}</h3>

      {/* ── Seletor de Evento Existente ── */}
      {!f.id && (
        <div style={{marginBottom:16}}>
          <Btn onClick={()=>setAberto(!aberto)}
               style={{background: aberto ? '#2563EB' : '#EFF6FF', color: aberto ? '#fff' : '#2563EB', width:'100%', padding:'10px', fontSize:13}}>
            {aberto ? '✕ Fechar lista de eventos' : '📅 Importar de Evento Cadastrado'}
          </Btn>

          {aberto && (
            <div style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:10,marginTop:8,overflow:'hidden'}}>
              <div style={{padding:'10px 12px',borderBottom:'1px solid #F1F5F9'}}>
                <input value={busca} onChange={e=>setBusca(e.target.value)}
                       placeholder="Buscar evento por nome ou local…"
                       style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1px solid #E2E8F0',background:'#F8FAFC',fontSize:13}} />
              </div>
              {filtrados.length === 0 && (
                <div style={{padding:'20px',textAlign:'center',color:'#94A3B8',fontSize:13}}>
                  {eventos.length === 0 ? 'Nenhum evento cadastrado no Dashboard.' : 'Nenhum evento encontrado.'}
                </div>
              )}
              <div style={{maxHeight:260,overflowY:'auto'}}>
                {filtrados.map((ev,i) => (
                  <div key={ev.id || i} onClick={()=>importar(ev)}
                       style={{padding:'10px 14px',borderBottom:'1px solid #F8FAFC',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',transition:'background .1s'}}
                       onMouseEnter={e=>e.currentTarget.style.background='#EFF6FF'}
                       onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <div>
                      <div style={{fontWeight:600,fontSize:13,color:'#0F172A'}}>{ev.nome}</div>
                      <div style={{fontSize:11,color:'#64748B',marginTop:2}}>{ev.local || 'Sem endereço'}</div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0,marginLeft:12}}>
                      <div style={{fontSize:12,fontWeight:600,color:'#2563EB'}}>{fmtData(ev.data)}</div>
                      <div style={{fontSize:11,color:'#94A3B8'}}>{ev.horaInicio || ''}{ev.horaFim ? ' – ' + ev.horaFim : ''}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {f.evento_ref_id && (
            <div style={{marginTop:8,fontSize:12,color:'#16A34A',background:'#F0FDF4',padding:'6px 10px',borderRadius:6}}>
              ✅ Evento importado — edite os campos abaixo se necessário.
            </div>
          )}
        </div>
      )}

      {/* ── Campos básicos ── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:'0 16px'}}>
        <Campo label="Nome do Evento *" value={f.nome_evento} onChange={e=>set('nome_evento',e.target.value)} placeholder="Ex: Casamento Silva" />
        <Campo label="Endereço do Evento *" value={f.endereco_evento} onChange={e=>set('endereco_evento',e.target.value)} placeholder="Rua, nº, cidade" />
        <Campo label="Data *" type="date" value={f.data_evento} onChange={e=>set('data_evento',e.target.value)} />
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 8px'}}>
          <Campo label="Início *" type="time" value={f.horario_inicio} onChange={e=>set('horario_inicio',e.target.value)} />
          <Campo label="Fim *" type="time" value={f.horario_fim} onChange={e=>set('horario_fim',e.target.value)} />
        </div>
        <Sel label="Motorista" value={f.motorista_id} onChange={e=>set('motorista_id',e.target.value)}>
          <option value="">Selecione…</option>
          {motoristas.filter(m=>m.ativo!==false).map(m=><option key={m.id} value={m.id}>{m.nome}</option>)}
        </Sel>
        <Sel label="Veículo" value={f.veiculo_id} onChange={e=>set('veiculo_id',e.target.value)}>
          <option value="">Selecione…</option>
          {veiculos.filter(v=>v.ativo!==false).map(v=><option key={v.id} value={v.id}>{v.nome}{v.placa?' ('+v.placa+')':''}</option>)}
        </Sel>
        <Sel label="Ponto de Saída" value={f.ponto_saida_id} onChange={e=>set('ponto_saida_id',e.target.value)}>
          <option value="">Selecione…</option>
          {pontos.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
        </Sel>
        <Sel label="Ponto de Retorno" value={f.ponto_retorno_id} onChange={e=>set('ponto_retorno_id',e.target.value)}>
          <option value="">Mesmo ponto de saída</option>
          {pontos.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
        </Sel>
      </div>

      {/* ── Tipo de Rota ── */}
      <div style={{marginBottom:16}}>
        <Label>Tipo de Rota</Label>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {Object.entries(TIPO_ROTA_INFO).map(([val,info]) => (
            <div key={val} onClick={()=>set('tipo_rota',val)}
                 style={{
                   flex:'1 1 140px',padding:'10px 12px',borderRadius:10,cursor:'pointer',
                   border: (f.tipo_rota||'simples') === val ? '2px solid #2563EB' : '1.5px solid #E2E8F0',
                   background: (f.tipo_rota||'simples') === val ? '#EFF6FF' : '#fff',
                   transition:'all .1s',
                 }}>
              <div style={{fontSize:18,marginBottom:4}}>{info.icon}</div>
              <div style={{fontSize:12,fontWeight:600,color: (f.tipo_rota||'simples') === val ? '#1D4ED8' : '#475569'}}>{info.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── Paradas Intermediárias ── */}
      <div style={{marginBottom:16}}>

function AbaRotas({adminId}) {
  const hoje = new Date().toISOString().slice(0,10);
  const [data, setData] = useState(hoje);
  const [rotas, setRotas] = useState([]);
  const [motoristas, setMotoristas] = useState([]);
  const [veiculos, setVeiculos] = useState([]);
  const [pontos, setPontos] = useState([]);
  const [form, setForm] = useState(null);
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [erro, setErro] = useState('');

  const carregar = useCallback(async () => {
    setLoading(true); setErro('');
    try {
      const [d, ms, vs, ps] = await Promise.all([
        api('GET', '/dispatch?data=' + data, adminId),
        api('GET', '/drivers', adminId),
        api('GET', '/vehicles', adminId),
        api('GET', '/points', adminId),
      ]);
      setRotas(Array.isArray(d) ? d : []);
      setMotoristas(Array.isArray(ms) ? ms : []);
      setVeiculos(Array.isArray(vs) ? vs : []);
      setPontos(Array.isArray(ps) ? ps : []);
    } catch(e) { setErro(e.message); }
    setLoading(false);
  }, [adminId, data]);

  useEffect(() => { carregar(); }, [carregar]);

  const salvar = async (f) => {
    if (!f.nome_evento || !f.endereco_evento || !f.data_evento || !f.horario_inicio || !f.horario_fim) {
      alert('Preencha: Nome, Endereço, Data, Horário Início e Fim.');
      return;
    }
    setSaving(true);
    try {
      if (f.id) { await api('PUT', '/dispatch/' + f.id, adminId, {...f, adminId}); }
      else       { await api('POST', '/dispatch', adminId, {...f, adminId}); }
      setForm(null);
      carregar();
    } catch(e) { alert('Erro: ' + e.message); }
    setSaving(false);
  };

  const remover = async (id) => {
    if (!confirm('Remover esta rota?')) return;
    try {
      await fetch(getServer() + '/api/logistics/dispatch/' + id + '?adminId=' + adminId, {
        method:'DELETE',
        headers:{'x-api-secret':API_SECRET,'x-admin-id':adminId,'bypass-tunnel-reminder':'true'},
      });
      carregar();
    } catch(e) { alert(e.message); }
  };

  const calcular = async (id) => {
    try { await api('POST', '/dispatch/' + id + '/calcular', adminId, {adminId}); carregar(); }
    catch(e) { alert('Erro ao calcular rota: ' + e.message); }
  };

  const confirmar = async (id) => {
    try { await api('POST', '/dispatch/' + id + '/confirmar', adminId, {}); carregar(); }
    catch(e) { alert('Erro ao confirmar: ' + e.message); }
  };

  const limparAntigas = async () => {
    if (!confirm('Remover todas as rotas de dias anteriores a hoje?\n\nEsta ação não pode ser desfeita.')) return;
    try {
      const d = await api('DELETE', '/dispatch/antigas', adminId);
      alert('✅ ' + (d.removidas || 0) + ' rota(s) antiga(s) removida(s).');
      carregar();
    } catch(e) { alert('Erro: ' + e.message); }
  };

  const abrirNav = async (id) => {
    try { const d = await api('GET', '/dispatch/' + id + '/navegar', adminId); if (d.url) window.open(d.url,'_blank'); }
    catch(e) { alert(e.message); }
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <h2 style={{fontSize:18}}>🚗 Rotas / Despachos</h2>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <input type="date" value={data} onChange={e=>setData(e.target.value)}
                 style={{border:'1px solid #E2E8F0',borderRadius:8,padding:'6px 10px'}} />
          <Btn onClick={()=>setForm({data_evento:data})} style={{background:'#2563EB',color:'#fff'}}>+ Nova Rota</Btn>
          <Btn onClick={limparAntigas} style={{background:'#FEF2F2',color:'#DC2626',fontSize:12}}>🗑️ Limpar antigas</Btn>
        </div>
      </div>
      <Erro msg={erro} />
      {form !== null && (
        <FormRota form={form} onChange={setForm} onSave={salvar} onCancel={()=>setForm(null)}
                  motoristas={motoristas} veiculos={veiculos} pontos={pontos} saving={saving} adminId={adminId} />
      )}
      {loading && rotas.length === 0 && <div style={{padding:32,textAlign:'center'}}><Spin/></div>}
      {!loading && rotas.length === 0 && !form && (
        <div style={{textAlign:'center',padding:48,color:'#64748B'}}>
          <div style={{fontSize:36,marginBottom:12}}>📋</div>
          <div>Nenhuma rota para esta data.</div>
        </div>
      )}
      <div style={{display:'grid',gap:10}}>
        {rotas.map(r => {
          const tipoInfo = TIPO_ROTA_INFO[r.tipo_rota||'simples'];
          const paradas  = Array.isArray(r.paradas_extras) ? r.paradas_extras : [];
          return (
            <div key={r.id} style={{background:'#fff',borderRadius:12,padding:16,border:'1px solid #E2E8F0',boxShadow:'0 1px 3px rgba(0,0,0,.06)'}}>
              {/* Header */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    <div style={{fontWeight:700,fontSize:15}}>{r.nome_evento}</div>
                    <span style={{fontSize:11,background:'#F8FAFC',color:'#475569',padding:'2px 7px',borderRadius:20,border:'1px solid #E2E8F0'}}>
                      {tipoInfo?.icon} {tipoInfo?.label}
                    </span>
                  </div>
                  <div style={{fontSize:12,color:'#64748B',marginTop:2}}>
                    {(r.motorista && r.motorista.nome) || 'Sem motorista'}
                    {' · '}
                    {(r.veiculo && r.veiculo.nome) || 'Sem veículo'}
                    {' · '}
                    {r.horario_inicio || '—'}{r.horario_fim ? ' – ' + r.horario_fim : ''}
                  </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4,flexShrink:0,marginLeft:8}}>
                  <Badge status={r.status} />
                  {r.confirmada_adm
                    ? <span style={{fontSize:11,background:'#F0FDF4',color:'#16A34A',padding:'2px 7px',borderRadius:20,fontWeight:600}}>✅ Confirmada</span>
                    : <span style={{fontSize:11,background:'#FFFBEB',color:'#D97706',padding:'2px 7px',borderRadius:20,fontWeight:600}}>⏳ Aguarda confirmação</span>
                  }
                </div>
              </div>

              {/* Info */}
              <div style={{fontSize:12,color:'#64748B',marginBottom:8,display:'flex',flexWrap:'wrap',gap:'4px 12px'}}>
                <span>📍 {r.endereco_evento}</span>
                {r.horario_saida_calculado && (
                  <span>🚀 {new Date(r.horario_saida_calculado).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>
                )}
                {r.distancia_km && <span>🛣️ {r.distancia_km} km · {r.duracao_min} min</span>}
              </div>

              {/* Timeline de paradas */}
              {paradas.length > 0 && (
                <div style={{background:'#F8FAFC',borderRadius:8,padding:'8px 10px',marginBottom:10,borderLeft:'3px solid #2563EB'}}>
                  <div style={{fontSize:11,fontWeight:700,color:'#475569',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>
                    {paradas.length} parada(s)
                  </div>
                  {paradas.map((p,i) => (
                    <div key={i} style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:4,fontSize:12}}>
                      <span style={{flexShrink:0,color:'#64748B'}}>{TIPO_PARADA_INFO[p.tipo||'encontro']?.icon}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <span style={{fontWeight:600,color:'#0F172A'}}>{p.nome || 'Parada'}</span>
                        {p.horario && <span style={{color:'#2563EB',marginLeft:6}}>{p.horario}</span>}
                        {p.endereco && <div style={{color:'#64748B',fontSize:11,marginTop:1}}>{p.endereco}</div>}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Ações */}
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                <Btn onClick={()=>setForm(r)} style={{background:'#F1F5F9',color:'#475569',fontSize:12}}>✏️ Editar</Btn>
                <Btn onClick={()=>calcular(r.id)} style={{background:'#EFF6FF',color:'#2563EB',fontSize:12}}>📐 Calcular</Btn>
                <Btn onClick={()=>abrirNav(r.id)} style={{background:'#F0FDF4',color:'#16A34A',fontSize:12}}>🗺️ Navegar</Btn>
                {!r.confirmada_adm && (
                  <Btn onClick={()=>confirmar(r.id)} style={{background:'#F0FDF4',color:'#16A34A',fontSize:12,fontWeight:700}}>✅ Confirmar Rota</Btn>
                )}
                <Btn onClick={()=>remover(r.id)} style={{background:'#FEF2F2',color:'#DC2626',fontSize:12}}>🗑️</Btn>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── ABA PONTOS DE ENCONTRO ───────────────────────────────────────────────────
function FormPonto({form, onChange, onSave, onCancel, saving}) {
  const f = form;
  const set = (k,v) => onChange({...f,[k]:v});
  return (
    <div style={{background:'#F8FAFC',border:'1px solid #E2E8F0',borderRadius:12,padding:20,marginBottom:16}}>
      <h3 style={{fontSize:15,marginBottom:16}}>{f.id ? 'Editar Ponto' : 'Novo Ponto de Encontro'}</h3>
      <Campo label="Nome *" value={f.nome} onChange={e=>set('nome',e.target.value)} placeholder="Galpão Central" />
      <Campo label="Endereço completo *" value={f.endereco} onChange={e=>set('endereco',e.target.value)} placeholder="Rua das Flores, 100, São Paulo, SP" />
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
        <Campo label="Latitude (opcional)" type="number" value={f.lat} onChange={e=>set('lat',e.target.value)} placeholder="-23.5505" />
        <Campo label="Longitude (opcional)" type="number" value={f.lng} onChange={e=>set('lng',e.target.value)} placeholder="-46.6333" />
      </div>
      <div style={{marginBottom:16}}>
        <Label>Observações</Label>
        <textarea value={f.observacoes||''} onChange={e=>set('observacoes',e.target.value)}
                  style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid #E2E8F0',fontSize:14,resize:'vertical',minHeight:64}} />
      </div>
      <div style={{display:'flex',gap:8}}>
        <Btn onClick={()=>onSave(f)} disabled={saving} style={{background:'#2563EB',color:'#fff'}}>
          {saving ? 'Salvando…' : 'Salvar'}
        </Btn>
        <Btn onClick={onCancel} style={{background:'#F1F5F9',color:'#475569'}}>Cancelar</Btn>
      </div>
    </div>
  );
}

function AbaPontos({adminId}) {
  const [items, setItems] = useState([]);
  const [form, setForm] = useState(null);
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [erro, setErro] = useState('');

  const carregar = useCallback(async () => {
    setLoading(true); setErro('');
    try { const d = await api('GET','/points',adminId); setItems(Array.isArray(d)?d:[]); }
    catch(e) { setErro(e.message); }
    setLoading(false);
  }, [adminId]);

  useEffect(() => { carregar(); }, [carregar]);

  const salvar = async (f) => {
    if (!f.nome || !f.endereco) { alert('Nome e endereço são obrigatórios.'); return; }
    setSaving(true);
    try {
      if (f.id) { await api('PUT', '/points/' + f.id, adminId, {...f, adminId}); }
      else       { await api('POST', '/points', adminId, {...f, adminId}); }
      setForm(null); carregar();
    } catch(e) { alert('Erro: ' + e.message); }
    setSaving(false);
  };

  const remover = async (id) => {
    if (!confirm('Remover este ponto?')) return;
    try {
      await fetch(getServer() + '/api/logistics/points/' + id + '?adminId=' + adminId, {
        method:'DELETE',
        headers:{'x-api-secret':API_SECRET,'x-admin-id':adminId,'bypass-tunnel-reminder':'true'},
      });
      carregar();
    } catch(e) { alert(e.message); }
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{fontSize:18}}>📍 Pontos de Encontro</h2>
        <Btn onClick={()=>setForm({})} style={{background:'#2563EB',color:'#fff'}}>+ Novo Ponto</Btn>
      </div>
      <Erro msg={erro} />
      {form !== null && (
        <FormPonto form={form} onChange={setForm} onSave={salvar} onCancel={()=>setForm(null)} saving={saving} />
      )}
      {loading && items.length === 0 && <div style={{padding:32,textAlign:'center'}}><Spin/></div>}
      {!loading && items.length === 0 && !form && (
        <div style={{textAlign:'center',padding:48,color:'#64748B'}}>
          <div style={{fontSize:36,marginBottom:12}}>📍</div>
          <div>Nenhum ponto de encontro cadastrado.</div>
        </div>
      )}
      <div style={{display:'grid',gap:10}}>
        {items.map(p => (
          <div key={p.id} style={{background:'#fff',borderRadius:12,padding:14,border:'1px solid #E2E8F0',boxShadow:'0 1px 3px rgba(0,0,0,.06)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>📍 {p.nome}</div>
              <div style={{fontSize:12,color:'#64748B',marginTop:2}}>{p.endereco}</div>
              {p.observacoes && <div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>{p.observacoes}</div>}
            </div>
            <div style={{display:'flex',gap:6}}>
              <Btn onClick={()=>setForm(p)} style={{background:'#F1F5F9',color:'#475569',fontSize:12}}>✏️</Btn>
              <Btn onClick={()=>remover(p.id)} style={{background:'#FEF2F2',color:'#DC2626',fontSize:12}}>🗑️</Btn>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ABA CONFIG ───────────────────────────────────────────────────────────────
function AbaConfig({adminId}) {
  const [cfg, setCfg] = useState({tempo_seguranca_min:30,tempo_carga_min:20,tempo_desmontagem_min:20,google_maps_key:''});
  const [serverUrl, setServerUrl] = useState(getServer);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  // ── WhatsApp state ──────────────────────────────────────────────────────────
  const [waStatus, setWaStatus]   = useState(null);   // { conectado, aguardandoQr, conectando, numero }
  const [waQr, setWaQr]           = useState(null);   // data URL da imagem QR
  const [waLoading, setWaLoading] = useState(false);
  const [waMsg, setWaMsg]         = useState('');
  const waPollingRef              = useRef(null);

  useEffect(() => {
    api('GET','/config',adminId).then(d=>{ if(d&&typeof d==='object') setCfg(p=>({...p,...d})); }).catch(()=>{});
  }, [adminId]);

  // ── WhatsApp helpers ────────────────────────────────────────────────────────

  const waFetch = async (method, endpoint, body) => {
    const url = getServer() + '/api/whatsapp' + endpoint;
    const r = await fetch(url, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'x-api-secret': API_SECRET,
        'x-admin-id': adminId || '',
        'bypass-tunnel-reminder': 'true',
      },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    return r.json();
  };

  const atualizarStatus = async () => {
    try {
      const s = await waFetch('GET', '/status');
      setWaStatus(s);
      if (s.aguardandoQr) {
        try { const q = await waFetch('GET', '/qr'); setWaQr(q.qr || null); }
        catch { setWaQr(null); }
      } else {
        setWaQr(null);
      }
      return s;
    } catch { return null; }
  };

  const iniciarPolling = () => {
    pararPolling();
    waPollingRef.current = setInterval(async () => {
      const s = await atualizarStatus();
      if (s?.conectado) pararPolling();
    }, 3000);
  };

  const pararPolling = () => {
    if (waPollingRef.current) { clearInterval(waPollingRef.current); waPollingRef.current = null; }
  };

  // Busca status inicial ao montar
  useEffect(() => {
    atualizarStatus();
    return () => pararPolling();
  }, [adminId]);

  const conectarWa = async () => {
    setWaLoading(true); setWaMsg('');
    try {
      await waFetch('POST', '/conectar');
      await atualizarStatus();
      iniciarPolling();
      setWaMsg('Aguardando QR code...');
    } catch(e) { setWaMsg('Erro: ' + e.message); }
    setWaLoading(false);
  };

  const desconectarWa = async () => {
    if (!confirm('Desconectar o WhatsApp?')) return;
    setWaLoading(true); setWaMsg('');
    try {
      await waFetch('POST', '/desconectar');
      setWaStatus(null); setWaQr(null);
      setWaMsg('Sessão encerrada.');
    } catch(e) { setWaMsg('Erro: ' + e.message); }
    setWaLoading(false);
  };

  // ── Config save ─────────────────────────────────────────────────────────────
  const salvar = async () => {
    setSaving(true); setMsg('');
    try {
      await api('PUT', '/config', adminId, {...cfg, adminId});
      try { localStorage.setItem('wa_server_url', serverUrl); } catch(e) {}
      setMsg('ok');
    } catch(e) { setMsg('err:' + e.message); }
    setSaving(false);
  };

  const set = (k,v) => setCfg(p=>({...p,[k]:v}));

  // ── WhatsApp status UI ──────────────────────────────────────────────────────
  const waConectado    = waStatus?.conectado;
  const waAguardandoQr = waStatus?.aguardandoQr;
  const waConectando   = waStatus?.conectando;
  const waNumero       = waStatus?.numero;

  const waBadgeStyle = waConectado
    ? {background:'#DCFCE7',color:'#16A34A',border:'1px solid #BBF7D0'}
    : waAguardandoQr || waConectando
      ? {background:'#FEF9C3',color:'#A16207',border:'1px solid #FDE68A'}
      : {background:'#F1F5F9',color:'#64748B',border:'1px solid #E2E8F0'};

  const waLabel = waConectado
    ? `🟢 Conectado${waNumero ? ' — +' + waNumero : ''}`
    : waAguardandoQr
      ? '🟡 Escaneie o QR abaixo'
      : waConectando
        ? '🟡 Conectando...'
        : '⚪ Desconectado';

  return (
    <div>
      <h2 style={{fontSize:18,marginBottom:20}}>⚙️ Configurações</h2>
      <div style={{background:'#fff',borderRadius:12,padding:20,border:'1px solid #E2E8F0',maxWidth:520}}>
        <div style={{fontSize:12,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:12}}>Tempos Operacionais</div>
        <Campo label="Tempo de segurança (min)" type="number" value={cfg.tempo_seguranca_min} onChange={e=>set('tempo_seguranca_min',+e.target.value)} />
        <Campo label="Tempo de carga/embarque (min)" type="number" value={cfg.tempo_carga_min} onChange={e=>set('tempo_carga_min',+e.target.value)} />
        <Campo label="Tempo de desmontagem (min)" type="number" value={cfg.tempo_desmontagem_min} onChange={e=>set('tempo_desmontagem_min',+e.target.value)} />

        <div style={{fontSize:12,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.06em',margin:'20px 0 12px'}}>Integrações</div>
        <Campo label="Google Maps API Key" value={cfg.google_maps_key} onChange={e=>set('google_maps_key',e.target.value)} placeholder="AIzaSy..." />
        <div style={{marginBottom:6}}>
          <Label>URL do Servidor (localhost ou túnel HTTPS)</Label>
          <input value={serverUrl} onChange={e=>setServerUrl(e.target.value)} placeholder="http://localhost:3001"
                 style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid #E2E8F0',background:'#fff'}} />
          <div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>
            Use a URL do túnel (https://escalafest-wa.loca.lt) quando acessar pelo Netlify.
          </div>
        </div>

        <div style={{marginTop:20}}>
          <Btn onClick={salvar} disabled={saving} style={{width:'100%',background:'#2563EB',color:'#fff',padding:'10px',fontSize:14}}>
            {saving ? 'Salvando…' : 'Salvar Configurações'}
          </Btn>
          {msg === 'ok' && (
            <div style={{marginTop:10,color:'#16A34A',fontSize:13,textAlign:'center'}}>✅ Configurações salvas!</div>
          )}
          {msg.startsWith('err:') && (
            <div style={{marginTop:10,color:'#DC2626',fontSize:13}}>{msg.slice(4)}</div>
          )}
        </div>
      </div>

      {/* ── WhatsApp ────────────────────────────────────────────────────────── */}
      <div style={{background:'#fff',borderRadius:12,padding:20,border:'1px solid #E2E8F0',maxWidth:520,marginTop:16}}>
        <div style={{fontSize:12,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:14}}>WhatsApp</div>

        {/* Badge de status */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
          <div style={{padding:'5px 12px',borderRadius:20,fontSize:13,fontWeight:600,...waBadgeStyle}}>
            {waLabel}
          </div>
          {waConectado && (
            <Btn onClick={desconectarWa} disabled={waLoading}
                 style={{fontSize:12,padding:'4px 12px',background:'#FEE2E2',color:'#DC2626',border:'1px solid #FECACA'}}>
              Desconectar
            </Btn>
          )}
          {!waConectado && !waAguardandoQr && !waConectando && (
            <Btn onClick={conectarWa} disabled={waLoading}
                 style={{fontSize:12,padding:'4px 12px',background:'#2563EB',color:'#fff'}}>
              {waLoading ? 'Aguarde...' : 'Conectar'}
            </Btn>
          )}
          {(waAguardandoQr || waConectando) && (
            <Btn onClick={desconectarWa} disabled={waLoading}
                 style={{fontSize:12,padding:'4px 12px',background:'#F1F5F9',color:'#64748B',border:'1px solid #E2E8F0'}}>
              Cancelar
            </Btn>
          )}
        </div>

        {/* QR Code */}
        {waQr && (
          <div style={{textAlign:'center',padding:'16px 0'}}>
            <div style={{fontSize:12,color:'#64748B',marginBottom:10}}>
              Abra o WhatsApp no celular → Dispositivos vinculados → Vincular dispositivo
            </div>
            <img src={waQr} alt="QR WhatsApp"
                 style={{width:220,height:220,borderRadius:12,border:'1px solid #E2E8F0'}} />
            <div style={{fontSize:11,color:'#94A3B8',marginTop:8}}>
              Aguardando escaneio... (atualiza automaticamente)
            </div>
          </div>
        )}

        {/* Mensagem de feedback */}
        {waMsg && (
          <div style={{fontSize:12,color: waMsg.startsWith('Erro') ? '#DC2626' : '#64748B',marginTop:8}}>
            {waMsg}
          </div>
        )}
      </div>

      <div style={{background:'#F8FAFC',borderRadius:12,padding:16,border:'1px solid #E2E8F0',maxWidth:520,marginTop:16}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>🚐 Link do App do Motorista</div>
        <div style={{fontSize:12,color:'#64748B',marginBottom:8}}>
          Envie este link para os motoristas acessarem o app de celular:
        </div>
        <div style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:8,padding:'8px 12px',fontSize:13,fontFamily:'monospace',wordBreak:'break-all',color:'#2563EB'}}>
          {window.location.href.replace('index.html','motorista.html').replace(/\?.*$/,'')}
        </div>
      </div>
    </div>
  );
}

function TelaLogin({onLogin}) {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState('');

  const handleSubmit = async e => {
    e.preventDefault();
    setLoading(true); setMsg('');
    const {data, error} = await sb.auth.signInWithPassword({email, password:senha});
    if (error) setMsg(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message);
    else if (data.session) onLogin(data.session.user);
    setLoading(false);
  };

  return (
    <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F8FAFC',padding:20}}>
      <div style={{width:'100%',maxWidth:380}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{fontSize:48,marginBottom:8}}>🚐</div>
          <h1 style={{fontSize:22,fontWeight:800}}>EscalaFest Logística</h1>
          <div style={{fontSize:13,color:'#64748B',marginTop:4}}>Painel Operacional</div>
        </div>
        <form onSubmit={handleSubmit} style={{background:'#fff',padding:24,borderRadius:16,border:'1px solid #E2E8F0',boxShadow:'0 4px 6px rgba(0,0,0,.04)'}}>
          <Campo label="E-mail" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="admin@exemplo.com" required />
          <Campo label="Senha" type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="••••••••" required />
          {msg && <Erro msg={msg} />}
          <button type="submit" disabled={loading}
                  style={{width:'100%',background:'#2563EB',color:'#fff',border:'none',padding:'10px',borderRadius:8,fontSize:14,cursor:loading?'not-allowed':'pointer',fontWeight:600,marginTop:4,opacity:loading?0.6:1}}>
            {loading ? 'Entrando…' : 'Entrar'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
const TABS = [
  {id:'live',       emoji:'🔴', label:'Ao Vivo',    Comp: AbaAoVivo},
  {id:'rotas',      emoji:'🚗', label:'Rotas',      Comp: AbaRotas},
  {id:'motoristas', emoji:'👤', label:'Motoristas', Comp: AbaMotoristas},
  {id:'veiculos',   emoji:'🚐', label:'Veículos',   Comp: AbaVeiculos},
  {id:'pontos',     emoji:'📍', label:'Pontos',     Comp: AbaPontos},
  {id:'dashboard',  emoji:'📊', label:'Dashboard',  Comp: AbaDashboard},
  {id:'config',     emoji:'⚙️', label:'Config',     Comp: AbaConfig},
];

function App() {
  const [user, setUser] = useState(null);
  const [loadingAuth, setLoadingAuth] = useState(true);
  const [tab, setTab] = useState('live');
  const [aberto, setAberto] = useState(true);
  const [mob, setMob] = useState(() => window.innerWidth < 768);
  const [drawerOpen, setDrawerOpen] = useState(false);

  useEffect(() => {
    const h = () => setMob(window.innerWidth < 768);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({data}) => {
      setUser(data.session?.user || null);
      setLoadingAuth(false);
    });
    const {data:{subscription}} = sb.auth.onAuthStateChange((_e,s) => setUser(s?.user||null));
    return () => subscription.unsubscribe();
  }, []);

  if (loadingAuth) {
    return (
      <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <Spin/>
      </div>
    );
  }

  if (!user) return <TelaLogin onLogin={setUser} />;

  const tabObj = TABS.find(t => t.id === tab) || TABS[0];
  const TabComp = tabObj.Comp;

  const sidebarContent = (isMobile) => (
    <>
      {/* Header */}
      <div style={{padding:'14px 10px',borderBottom:'1px solid rgba(255,255,255,.07)',display:'flex',alignItems:'center',gap:8,minHeight:56}}>
        <button
          onClick={() => isMobile ? setDrawerOpen(false) : setAberto(!aberto)}
          style={{background:'transparent',border:'none',color:'#CBD5E1',cursor:'pointer',fontSize:18,padding:'2px 4px',flexShrink:0,lineHeight:1}}>
          {isMobile ? '✕' : '☰'}
        </button>
        <span style={{color:'#fff',fontFamily:'Sora,sans-serif',fontWeight:800,fontSize:13,whiteSpace:'nowrap',overflow:'hidden'}}>
          Logística
        </span>
      </div>
      {/* Nav */}
      <nav style={{flex:1,padding:'8px 0',overflowY:'auto'}}>
        {TABS.map(t => (
          <button key={t.id} onClick={()=>{setTab(t.id);if(isMobile)setDrawerOpen(false);}}
                  style={{
                    width:'100%',textAlign:'left',
                    padding:'12px 14px',
                    background: tab===t.id ? 'rgba(37,99,235,.25)' : 'transparent',
                    color: tab===t.id ? '#93C5FD' : '#94A3B8',
                    border:'none',
                    borderLeft: tab===t.id ? '3px solid #3B82F6' : '3px solid transparent',
                    cursor:'pointer',fontSize:14,fontWeight:600,
                    display:'flex',alignItems:'center',gap:10,
                    whiteSpace:'nowrap',overflow:'hidden',
                    transition:'background .12s,color .12s',
                  }}>
            <span style={{fontSize:16,flexShrink:0,width:22,textAlign:'center'}}>{t.emoji}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </nav>
      {/* Footer */}
      <div style={{padding:10,borderTop:'1px solid rgba(255,255,255,.07)'}}>
        <div style={{fontSize:11,color:'#475569',marginBottom:6,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',padding:'0 2px'}}>
          {user.email}
        </div>
        <a href="../Dashboard/index.html"
           style={{display:'flex',alignItems:'center',gap:6,
                   background:'rgba(255,255,255,.04)',color:'#94A3B8',border:'1px solid rgba(255,255,255,.07)',
                   padding:'6px 10px',borderRadius:8,fontSize:12,fontWeight:600,
                   textDecoration:'none',marginBottom:6}}>
          <span>📊</span><span>Dashboard</span>
        </a>
        <button onClick={()=>sb.auth.signOut()}
                style={{width:'100%',background:'rgba(220,38,38,.12)',color:'#FCA5A5',border:'1px solid rgba(220,38,38,.2)',padding:'6px',borderRadius:8,fontSize:12,cursor:'pointer',fontWeight:600}}>
          🚪 Sair
        </button>
      </div>
    </>
  );

  return (
    <div style={{display:'flex',minHeight:'100dvh',background:'#F8FAFC'}}>

      {/* Backdrop mobile */}
      {mob && drawerOpen && (
        <div onClick={()=>setDrawerOpen(false)}
             style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:998,backdropFilter:'blur(2px)'}} />
      )}

      {/* Sidebar desktop */}
      {!mob && (
        <aside style={{
          width: aberto ? 210 : 52,
          background:'#0F172A',
          display:'flex',flexDirection:'column',
          flexShrink:0,
          transition:'width .2s ease',
          overflow:'hidden',
          position:'sticky',top:0,height:'100dvh',
        }}>
          {sidebarContent(false)}
        </aside>
      )}

      {/* Drawer mobile (overlay) */}
      {mob && (
        <aside style={{
          position:'fixed',left:0,top:0,height:'100dvh',
          width:260,zIndex:999,
          background:'#0F172A',
          display:'flex',flexDirection:'column',
          transform: drawerOpen ? 'translateX(0)' : 'translateX(-100%)',
          transition:'transform .25s cubic-bezier(.4,0,.2,1)',
          overflowY:'auto',
          boxShadow: drawerOpen ? '4px 0 24px rgba(0,0,0,.4)' : 'none',
        }}>
          {sidebarContent(true)}
        </aside>
      )}

      {/* Content */}
      <main style={{flex:1,padding:mob?'0':24,overflowY:'auto',minWidth:0}}>
        {/* Mobile top bar */}
        {mob && (
          <div style={{
            display:'flex',alignItems:'center',gap:12,
            padding:'12px 16px',
            background:'#0F172A',
            position:'sticky',top:0,zIndex:10,
            borderBottom:'1px solid rgba(255,255,255,.07)',
            marginBottom:0,
          }}>
            <button onClick={()=>setDrawerOpen(true)}
                    style={{background:'transparent',border:'none',color:'#CBD5E1',cursor:'pointer',fontSize:20,padding:'2px',lineHeight:1,flexShrink:0}}>
              ☰
            </button>
            <span style={{color:'#fff',fontFamily:'Sora,sans-serif',fontWeight:800,fontSize:14,flex:1}}>
              {tabObj.emoji} {tabObj.label}
            </span>
          </div>
        )}
        <div style={{maxWidth:920,margin:'0 auto',padding:mob?'16px':0}}>
          <TabComp adminId={user.id} />
        </div>
      </main>
    </div>
  );
}

window._sfAppReady=true;
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
