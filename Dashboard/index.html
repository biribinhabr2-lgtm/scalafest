const PLANOS = [
  {id:"amador",  nome:"Amador",          preco:29.90, precoAnual:345.00, maxFl:10, secretario:false, motorista:false, cor:"#3b82f6", desc:"Sistema completo para equipes pequenas"},
  {id:"pequena", nome:"Pequena Empresa",  preco:49.90, precoAnual:560.00, maxFl:25, secretario:true,  motorista:false, cor:"#8b5cf6", desc:"Com secretária incluída, sem motorista"},
  {id:"grande",  nome:"Grande Empresa",   preco:65.00, precoAnual:700.00, maxFl:40, secretario:true,  motorista:true,  cor:"#0C6E7E", desc:"Acesso completo: secretária e motorista"},
];
const TRIAL_DIAS = 7;
const TRIAL_MAX_FL = 5;

function getPlanoAtual(perfil) {
  if(!perfil) return null;
  const hoje = new Date();

  // Plano pago — verificar vencimento
  if(perfil.plano) {
    const venc = perfil.plano_vencimento ? new Date(perfil.plano_vencimento) : null;
    const planoVencido = venc && hoje > venc;
    const cancelado = !!perfil.plano_cancelado_em;

    if(planoVencido) {
      // Venceu — volta ao trial/gratuito
      return { plano: null, trialAtivo: false, diasRestantes: 0, diasUsados: 999, planoVencido: true };
    }
    // Ativo (mesmo cancelado, até vencer)
    const diasParaVencer = venc ? Math.max(0, Math.ceil((venc - hoje) / (1000*60*60*24))) : null;
    return { plano: perfil.plano, trialAtivo: false, diasRestantes: 0, diasUsados: 0, cancelado, diasParaVencer };
  }

  // Sem plano — verificar trial
  const trialInicio = perfil.trialInicio ? new Date(perfil.trialInicio) : null;
  if(trialInicio) {
    const diasTrial = Math.floor((hoje - trialInicio) / (1000*60*60*24));
    const trialAtivo = diasTrial < TRIAL_DIAS;
    const diasRestantes = Math.max(0, TRIAL_DIAS - diasTrial);
    return { plano: null, trialAtivo, diasRestantes, diasUsados: diasTrial };
  }
  return { plano: null, trialAtivo: false, diasRestantes: 0, diasUsados: 999 };
}

const MASTER_EMAILS = ["biribinhabr2@gmail.com"];

function isMaster(userEmail) {
  return MASTER_EMAILS.includes((userEmail||"").toLowerCase());
}

// Plano Amador é o plano equivalente ao trial gratuito
const PLANO_TRIAL = PLANOS.find(p => p.id === "amador");

function getMaxFl(perfil, userEmail) {
  if(isMaster(userEmail)) return 9999; // admin master — sem limite
  const {plano, trialAtivo} = getPlanoAtual(perfil) || {};
  if(trialAtivo) return PLANO_TRIAL?.maxFl ?? 10; // trial = Amador (10 func.)
  if(!plano) return TRIAL_MAX_FL;
  const p = PLANOS.find(p => p.id === plano);
  return p ? p.maxFl : TRIAL_MAX_FL;
}

// Verifica se o plano atual inclui acesso à secretária
function getSecretariaAcesso(perfil, userEmail) {
  if(isMaster(userEmail)) return true;
  const {plano, trialAtivo} = getPlanoAtual(perfil) || {};
  if(trialAtivo) return PLANO_TRIAL?.secretario ?? false; // trial = Amador (sem secretária)
  if(!plano) return false;
  const p = PLANOS.find(p => p.id === plano);
  return p ? p.secretario : false;
}


function TelaPagamento({perfil,onClose,onPlanoAtivado,userEmail,userId}){
  const[selecionado,setSelecionado]=useState(null);
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState(null);
  const[anual,setAnual]=useState(false);
  const info = getPlanoAtual(perfil);

  const iniciarPagamento=async(plano)=>{
    setLoading(true);
    setMsg(null);
    try{
      const SUPA_FUNC_URL = `${SUPA_URL}/functions/v1/asaas-checkout`;

      const response = await fetch(SUPA_FUNC_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPA_KEY,
          "Authorization": `Bearer ${SUPA_KEY}`,
        },
        body: JSON.stringify({
          plano_id:    plano.id,
          plano_nome:  plano.nome,
          plano_preco: plano.precoExib ?? plano.preco,
          plano_desc:  plano.desc,
          user_id:     userId || "",
          anual:       plano.anual ?? false,
        })
      });

      const data = await response.json();

      if(data.checkout_url){
        window.open(data.checkout_url, "_blank");
        setMsg({tipo:"info", texto:" Janela de pagamento aberta! Conclua o pagamento — o plano é ativado automaticamente assim que confirmado."});
        // Inicia polling: aguarda o webhook do Asaas atualizar sf_perfis
        aguardarAtivacao(plano.id);
      } else {
        throw new Error(data.error || "Sem link de pagamento");
      }
    } catch(e){
      console.error("Pagamento erro:", e);
      setMsg({tipo:"erro", texto:"Sem conexão com o servidor. Verifique sua internet e tente novamente."});
    }
    setLoading(false);
  };

  /** Polling: verifica a cada 3 s se o plano foi ativado (máx ~2 min). */
  const aguardarAtivacao=(planoId)=>{
    setLoading(false);
    const MAX=40;
    let tentativas=0;
    const timer=setInterval(async()=>{
      tentativas++;
      try{
        const{data}=await sb.from("sf_perfis").select("plano,plano_vencimento,plano_ativado_em").eq("id",userId).single();
        if(data?.plano===planoId){
          clearInterval(timer);
          // Delega a atualização do perfil para o App via onPlanoAtivado
          if(onPlanoAtivado) await onPlanoAtivado(planoId);
          onClose&&onClose();
          return;
        }
      }catch(e){console.warn("Poll perfil:",e);}
      if(tentativas>=MAX){
        clearInterval(timer);
        alert("Pagamento recebido, mas a ativação ainda está sendo processada.\n\nRecarregue a página em alguns instantes. Se o plano não aparecer em 5 minutos, entre em contato com o suporte.");
      }
    },3000);
  };

  if(isMaster(userEmail)) return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(3px)"}}>
      <div style={{background:"var(--card)",borderRadius:20,padding:32,textAlign:"center",maxWidth:380}}>
        <div style={{marginBottom:12,display:"flex",justifyContent:"center"}}><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0C6E7E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"/><line x1="5" y1="20" x2="19" y2="20"/></svg></div>
        <h2 style={{margin:"0 0 8px",color:"var(--text)"}}>Conta Master</h2>
        <p style={{color:"var(--text2)",fontSize:14,margin:"0 0 20px"}}>Esta conta tem acesso ilimitado e está isenta de pagamento.</p>
        <Btn onClick={onClose}>Fechar</Btn>
      </div>
    </div>
  );
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(3px)"}}>
      <div style={{background:"var(--card)",borderRadius:20,padding:24,width:"100%",maxWidth:600,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 48px rgba(0,0,0,.2)"}}>

            {info?.trialAtivo
              ?<p style={{margin:"4px 0 0",fontSize:13,color:"var(--success)"}}>Trial ativo — {info.diasRestantes} dia{info.diasRestantes!==1?"s":""} restante{info.diasRestantes!==1?"s":""}</p>
              :!info?.plano&&<p style={{margin:"4px 0 0",fontSize:13,color:"var(--danger)"}}>Trial encerrado — plano gratuito limitado a {TRIAL_MAX_FL} funcionários</p>
            }

          {onClose&&<button onClick={onClose} style={{background:"var(--surface)",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",color:"var(--text2)",fontSize:16}}>×</button>}

// ── MODAL SYNC CALENDAR ────────────────────────────────────────────────────────
function ModalSyncCalendar({userId,onClose,onImportDone}){
  const hoje=localDateStr();
  const em90=new Date(Date.now()+90*24*60*60*1000).toISOString().slice(0,10);
  const[de,setDe]=useState(hoje);
  const[ate,setAte]=useState(em90);
  const[eventos,setEventos]=useState(null);
  const[selecionados,setSelecionados]=useState(new Set());
  const[loading,setLoading]=useState(false);
  const[importing,setImporting]=useState(false);
  const addToast=useToast();

  const buscar=async(inicio,fim)=>{
    setLoading(true);setEventos(null);
    try{
      const{data:tok}=await sb.from("google_calendar_tokens").select("access_token,token_expiry").eq("tenant_id",userId).maybeSingle();
      if(!tok)throw new Error("Google Calendar não conectado");
      if(new Date(tok.token_expiry)<new Date())throw new Error("Token expirado — reconecte em Plano → Integrações");
      const timeMin=new Date(inicio+"T00:00:00").toISOString();
      const timeMax=new Date(fim+"T23:59:59").toISOString();
      const calRes=await fetch(
        "https://www.googleapis.com/calendar/v3/calendars/primary/events?"+
        new URLSearchParams({timeMin,timeMax,singleEvents:"true",orderBy:"startTime",maxResults:"200"}),
        {headers:{Authorization:`Bearer ${tok.access_token}`}}
      );
      const calData=await calRes.json();
      if(!calRes.ok)throw new Error(calData?.error?.message||"Erro na API do Calendar");
      const[eventsLocal,{data:ignoredData}]=await Promise.all([
        evSvc.list(userId),
        sb.from("google_calendar_ignored").select("google_event_id").eq("tenant_id",userId),
      ]);
      const jaImportados=new Set((eventsLocal||[]).filter(e=>e.google_event_id).map(e=>e.google_event_id));
      const ignoradosIds=new Set((ignoredData||[]).map(r=>r.google_event_id));
      const items=(calData.items||[]).filter(ev=>ev.status!=="cancelled"&&ev.summary&&!ignoradosIds.has(ev.id)).map(ev=>({...ev,jaImportado:jaImportados.has(ev.id)}));
      setEventos(items);
      setSelecionados(new Set(items.filter(ev=>!ev.jaImportado).map(ev=>ev.id)));
    }catch(e){addToast(e.message,"erro");setEventos([]);}
    setLoading(false);
  };

  useEffect(()=>{buscar(de,ate);},[]);

  const naoImportados=(eventos||[]).filter(ev=>!ev.jaImportado).length;
  const todosSel=selecionados.size>0&&selecionados.size===naoImportados;
  const toggleAll=()=>setSelecionados(todosSel?new Set():new Set((eventos||[]).filter(ev=>!ev.jaImportado).map(ev=>ev.id)));
  const toggle=id=>setSelecionados(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});

  const importar=async()=>{
    if(!selecionados.size)return;
    setImporting(true);
    try{
      const para=(eventos||[]).filter(ev=>selecionados.has(ev.id));
      let created=0,updated=0,errors=0;
      for(const ev of para){
        const startRaw=ev.start?.dateTime??ev.start?.date;
        const endRaw=ev.end?.dateTime??ev.end?.date;
        if(!startRaw)continue;
        const data=startRaw.substring(0,10);
        const horaInicio=startRaw.length>10?startRaw.substring(11,16):null;
        const horaFim=endRaw?.length>10?endRaw.substring(11,16):null;
        try{
          const existing=await evSvc.getByGcalId(userId,ev.id);
          if(!existing){
            await evSvc.create(userId,{nome:ev.summary,data,horaInicio,horaFim,tipo:"Outro",status:"Em negociação",local:"",obs:"",equipe:[],google_event_id:ev.id,google_calendar_synced:true});
            created++;
          }else{
            const updatedEv=await evSvc.update(userId,existing.id,{nome:ev.summary,data,horaInicio,horaFim});
            if(updatedEv?.triagem_status!=='confirmado'){
              runTriagemEvento(userId,existing.id,ev.summary).catch(()=>{});
            }
            updated++;
          }
        }catch(evErr){console.error("[importar] ev",ev.id,evErr.message);errors++;}
      }
      await sb.from("google_calendar_tokens").update({last_synced_at:new Date().toISOString()}).eq("tenant_id",userId);
      const msg=`${created} importado${created!==1?"s":""}, ${updated} atualizado${updated!==1?"s":""}${errors?" "+errors+" erros":""} `;
      addToast(msg,"ok");
      onImportDone();
      onClose();
    }catch(e){addToast(`Erro: ${e.message}`,"erro");}
    setImporting(false);
  };

  const fmtD=ev=>{
    const s=ev.start?.dateTime??ev.start?.date;
    if(!s)return"";
    const[y,m,d]=s.substring(0,10).split("-");
    return`${d}/${m}/${y}`+(s.length>10?" "+s.substring(11,16):"");
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"var(--card)",borderRadius:16,width:"100%",maxWidth:560,maxHeight:"88vh",display:"flex",flexDirection:"column",boxShadow:"0 24px 64px rgba(0,0,0,.32)"}}>
        {/* Header */}
        <div style={{padding:"18px 22px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:"var(--text)"}}> Importar do Google Calendar</div>
            <div style={{fontSize:12,color:"var(--text2)",marginTop:2}}>Selecione os eventos para trazer ao EscalaFest</div>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:"none",fontSize:20,cursor:"pointer",color:"var(--text3)",lineHeight:1,padding:4}}>×</button>
        </div>
        {/* Filtro de data */}
        <div style={{padding:"12px 22px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",flexShrink:0}}>
          <span style={{fontSize:12,color:"var(--text2)"}}>De</span>
          <input type="date" value={de} onChange={e=>setDe(e.target.value)} style={{border:"1px solid var(--border)",borderRadius:8,padding:"5px 9px",fontSize:12,color:"var(--text)",background:"var(--bg)",fontFamily:"inherit"}}/>
          <span style={{fontSize:12,color:"var(--text2)"}}>Até</span>
          <input type="date" value={ate} onChange={e=>setAte(e.target.value)} style={{border:"1px solid var(--border)",borderRadius:8,padding:"5px 9px",fontSize:12,color:"var(--text)",background:"var(--bg)",fontFamily:"inherit"}}/>
          <button onClick={()=>buscar(de,ate)} disabled={loading} style={{background:"#0C6E7E",border:"none",borderRadius:8,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:600,cursor:loading?"default":"pointer",fontFamily:"inherit",opacity:loading?0.7:1}}>
            {loading?"…":"Buscar"}
          </button>
        </div>
        {/* Lista */}
        <div style={{flex:1,overflowY:"auto"}}>
          {loading&&<div style={{padding:"36px 22px",textAlign:"center",color:"var(--text3)",fontSize:13}}>Buscando eventos…</div>}
          {!loading&&eventos!==null&&eventos.length===0&&<div style={{padding:"36px 22px",textAlign:"center",color:"var(--text3)",fontSize:13}}>Nenhum evento encontrado nesse período</div>}
          {!loading&&eventos&&eventos.length>0&&(
            <>
              <div style={{padding:"8px 22px",display:"flex",alignItems:"center",gap:8,borderBottom:"1px solid var(--border)"}}>
                <input type="checkbox" checked={todosSel} onChange={toggleAll} style={{width:14,height:14,cursor:"pointer"}}/>
                <span style={{fontSize:11,color:"var(--text2)",fontWeight:500}}>
                  {naoImportados===0?"Todos já importados":`Selecionar todos (${naoImportados} novos)`}
                </span>
              </div>
              {eventos.map(ev=>(
                <div key={ev.id} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 22px",borderBottom:"1px solid var(--border)",opacity:ev.jaImportado?0.45:1,background:selecionados.has(ev.id)?"rgba(12,110,126,.05)":"transparent"}}>
                  <input type="checkbox" checked={selecionados.has(ev.id)} disabled={ev.jaImportado} onChange={()=>!ev.jaImportado&&toggle(ev.id)} style={{width:14,height:14,cursor:ev.jaImportado?"default":"pointer",flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.summary}</div>
                    <div style={{fontSize:11,color:"var(--text2)",marginTop:1}}>{fmtD(ev)}</div>
                  </div>
                  {ev.jaImportado&&<span style={{fontSize:10,color:"#16A34A",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:6,padding:"2px 7px",flexShrink:0,fontWeight:600}}>Já importado</span>}
                </div>
              ))}
            </>
          )}
        </div>
        {/* Footer */}
        <div style={{padding:"14px 22px",borderTop:"1px solid var(--border)",display:"flex",justifyContent:"flex-end",gap:10,flexShrink:0}}>
          <button onClick={onClose} style={{background:"transparent",border:"1px solid var(--border)",borderRadius:10,padding:"8px 18px",fontSize:13,color:"var(--text2)",cursor:"pointer",fontFamily:"inherit"}}>Cancelar</button>
          <button onClick={importar} disabled={importing||!selecionados.size} style={{background:selecionados.size?"#0C6E7E":"var(--border)",border:"none",borderRadius:10,padding:"8px 20px",fontSize:13,fontWeight:700,color:selecionados.size?"#fff":"var(--text3)",cursor:selecionados.size&&!importing?"pointer":"default",fontFamily:"inherit",opacity:importing?0.7:1}}>
            {importing?"Importando…":`Importar ${selecionados.size} evento${selecionados.size!==1?"s":""}`}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── SYNC GOOGLE CALENDAR (browser-side, sem edge function) ───────────────────
async function syncCalendarDoBrowser(userId){
  const{data:tok}=await sb.from("google_calendar_tokens").select("*").eq("tenant_id",userId).maybeSingle();
  if(!tok)return null;
  if(new Date(tok.token_expiry)<new Date())return{expired:true};
  const timeMin=new Date().toISOString();
  const timeMax=new Date(Date.now()+90*24*60*60*1000).toISOString();
  const calRes=await fetch(
    "https://www.googleapis.com/calendar/v3/calendars/primary/events?"+
    new URLSearchParams({timeMin,timeMax,singleEvents:"true",orderBy:"startTime",maxResults:"200"}),
    {headers:{Authorization:`Bearer ${tok.access_token}`}}
  );
  const calData=await calRes.json();
  if(!calRes.ok)throw new Error(calData?.error?.message||"Erro na API do Calendar");
  const items=(calData.items||[]).filter(ev=>ev.status!=="cancelled"&&ev.summary);
  // Carrega IDs ignorados em uma só query (evita N+1)
  const{data:ignoredData}=await sb.from("google_calendar_ignored").select("google_event_id").eq("tenant_id",userId);
  const ignoradosIds=new Set((ignoredData||[]).map(r=>r.google_event_id));
  let created=0,updated=0,errors=0;
  for(const ev of items){
    if(ignoradosIds.has(ev.id))continue;
    const startRaw=ev.start?.dateTime??ev.start?.date;
    const endRaw=ev.end?.dateTime??ev.end?.date;
    if(!startRaw)continue;
    const data=startRaw.substring(0,10);
    const horaInicio=startRaw.length>10?startRaw.substring(11,16):null;
    const horaFim=endRaw?.length>10?endRaw.substring(11,16):null;
    try{
      const existing=await evSvc.getByGcalId(userId,ev.id);
      if(!existing){
        await evSvc.create(userId,{nome:ev.summary,data,horaInicio,horaFim,tipo:"Outro",status:"Em negociação",local:"",obs:"",equipe:[],google_event_id:ev.id,google_calendar_synced:true});
        created++;
      }else{
        const updatedEv=await evSvc.update(userId,existing.id,{nome:ev.summary,data,horaInicio,horaFim});
        if(updatedEv?.triagem_status!=='confirmado'){
          runTriagemEvento(userId,existing.id,ev.summary).catch(()=>{});
        }
        updated++;
      }
    }catch(evErr){console.error("[syncCalendar] ev",ev.id,evErr.message);errors++;}
  }
  await sb.from("google_calendar_tokens").update({last_synced_at:new Date().toISOString()}).eq("tenant_id",userId);
  return{created,updated,errors};
}

// ── ABA INTEGRAÇÕES ───────────────────────────────────────────────────────────
function AbaIntegracoes({userId,onSyncDone}){
  const[tokenRow,setTokenRow]=useState(null);
  const[loading,setLoading]=useState(true);
  const[modalOpen,setModalOpen]=useState(false);
  const[syncDays,setSyncDays]=useState(60);
  const[updatingSyncDays,setUpdatingSyncDays]=useState(false);
  const addToast=useToast();

  const carregar=async()=>{
    setLoading(true);
    const{data}=await sb.from("google_calendar_tokens").select("*").eq("tenant_id",userId).maybeSingle();
    setTokenRow(data);
    if(data?.sync_days_ahead)setSyncDays(data.sync_days_ahead);
    setLoading(false);
  };

  const updateSyncDays=async(days)=>{
    if(updatingSyncDays)return;
    setSyncDays(days);
    setUpdatingSyncDays(true);
    await sb.from("google_calendar_tokens").update({sync_days_ahead:days}).eq("tenant_id",userId);
    await fetch(`${SUPA_FUNC_BASE}/sync-google-calendar`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPA_KEY}`},body:JSON.stringify({tenant_id:userId})}).catch(()=>{});
    setUpdatingSyncDays(false);
    addToast(`Importando eventos dos próximos ${days} dias…`,"ok");
    setTimeout(()=>{carregar();if(onSyncDone)onSyncDone();},3000);
  };

  useEffect(()=>{if(userId)carregar();},[userId]);

  const conectar=()=>{
    if(!GCAL_CLIENT_ID){
      alert("Configure o GCAL_CLIENT_ID no código antes de conectar.\nVeja: console.cloud.google.com → APIs & Services → Credentials → OAuth 2.0 Client IDs");
      return;
    }
    const oauthUrl=new URL("https://accounts.google.com/o/oauth2/v2/auth");
    oauthUrl.searchParams.set("client_id",GCAL_CLIENT_ID);
    oauthUrl.searchParams.set("redirect_uri",GCAL_REDIRECT_URI);
    oauthUrl.searchParams.set("response_type","code");
    oauthUrl.searchParams.set("scope","https://www.googleapis.com/auth/calendar.readonly");
    oauthUrl.searchParams.set("access_type","offline");
    oauthUrl.searchParams.set("prompt","consent");
    oauthUrl.searchParams.set("state",btoa(userId));
    window.location.href=oauthUrl.toString();
  };

  const desconectar=async()=>{
    if(!window.confirm("Desconectar o Google Calendar? Eventos já importados não serão apagados."))return;
    await sb.from("google_calendar_tokens").delete().eq("tenant_id",userId);
    setTokenRow(null);
    addToast("Google Calendar desconectado","ok");
  };

  const fmtLastSync=ts=>{
    if(!ts)return"Nunca";
    const diff=Math.round((Date.now()-new Date(ts).getTime())/60000);
    if(diff<1)return"Agora mesmo";
    if(diff===1)return"Há 1 minuto";
    if(diff<60)return`Há ${diff} minutos`;
    const h=Math.round(diff/60);
    return`Há ${h} hora${h!==1?"s":""}`;
  };

  if(loading)return(
    <div style={{marginTop:32,paddingTop:24,borderTop:"1px solid var(--border)"}}>
      <div style={{fontSize:13,color:"var(--text3)"}}>Carregando integrações…</div>
    </div>
  );

  return(
    <div style={{marginTop:32,paddingTop:24,borderTop:"1px solid var(--border)"}}>
      <h3 style={{color:"var(--text)",margin:"0 0 4px",fontSize:15,fontWeight:600}}>Integrações</h3>
      <p style={{color:"var(--text2)",margin:"0 0 16px",fontSize:13}}>Conecte o Google Calendar para importar eventos automaticamente.</p>

      <div style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:12,padding:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <div style={{width:38,height:38,borderRadius:9,background:"#EA43351A",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:20}}></div>
          <div style={{flex:1,minWidth:120}}>
            <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>Google Calendar</div>
            {tokenRow
              ?<div style={{fontSize:11,color:"#16A34A",marginTop:2}}>Conectado · Último sync: {fmtLastSync(tokenRow.last_synced_at)}</div>
              :<div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>Não conectado</div>
            }
          </div>
          {tokenRow
            ?<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
               <button onClick={()=>setModalOpen(true)} style={{background:"#0C6E7E",border:"none",borderRadius:8,padding:"7px 14px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                 ↻ Sincronizar agora
               </button>
               <button onClick={desconectar} style={{background:"transparent",border:"1px solid var(--border)",borderRadius:8,padding:"7px 14px",color:"var(--text3)",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                 Desconectar
               </button>
             </div>
            :<button onClick={conectar} style={{background:"#4285F4",border:"none",borderRadius:8,padding:"8px 16px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
               Conectar Google Calendar
             </button>
          }
        </div>
        {tokenRow&&<>
          <div style={{marginTop:12,fontSize:11,color:"var(--text3)",background:"var(--card)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",lineHeight:1.5}}>
            Sincronização automática a cada 30 min via cron. Novos eventos chegam com status <strong>Em negociação</strong> — complete local, tipo e equipe manualmente. Eventos com  no card foram importados do Calendar.
          </div>
          <div style={{marginTop:14}}>
            <div style={{fontSize:11,fontWeight:600,color:"var(--text2)",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>Importar eventos dos próximos:</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[7,15,30,60,90].map(d=>(
                <button key={d} disabled={updatingSyncDays} onClick={()=>updateSyncDays(d)} style={{padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:600,cursor:updatingSyncDays?"not-allowed":"pointer",border:`1.5px solid ${syncDays===d?"#0C6E7E":"var(--border)"}`,background:syncDays===d?"#0C6E7E":"transparent",color:syncDays===d?"#fff":"var(--text2)",transition:"all .15s",opacity:updatingSyncDays?0.6:1,fontFamily:"inherit"}}>
                  {d} dias
                </button>
              ))}
            </div>
          </div>
        </>}
      </div>
      {modalOpen&&<ModalSyncCalendar userId={userId} onClose={()=>setModalOpen(false)} onImportDone={()=>{carregar();if(onSyncDone)onSyncDone();}}/>}
    </div>
  );
}

// ── useDashboardMetrics ────────────────────────────────────────────────────────
function useDashboardMetrics(eventos,freelancers){
  const now=new Date();
  const mesAtualStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const hojeStr=localDateStr();

  const eventosMes=eventos.filter(ev=>ev.data&&ev.data.startsWith(mesAtualStr));

  const flAtivosIds=new Set();
  eventosMes.forEach(ev=>(ev.equipe||[]).forEach(m=>m.freelancerId&&flAtivosIds.add(m.freelancerId)));

  const proximos=eventos.filter(ev=>ev.data&&ev.data>=hojeStr).sort((a,b)=>a.data.localeCompare(b.data));
  const proximoEvento=proximos[0]||null;
  let diasProximo=null;
  if(proximoEvento){
    const ms=new Date(proximoEvento.data+"T00:00:00")-new Date(hojeStr+"T00:00:00");
    diasProximo=Math.round(ms/86400000);
  }

  let countPendente=0,totalPendente=0;
  eventos.forEach(ev=>(ev.equipe||[]).forEach(m=>{if(!m.pago){countPendente++;totalPendente+=calcCache(m,ev);}}));

  const historico=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const prefix=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const count=eventos.filter(ev=>ev.data&&ev.data.startsWith(prefix)).length;
    const label=d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    historico.push({label,count,isCurrent:i===0});
  }

  return{eventosMes:eventosMes.length,freelancersAtivos:flAtivosIds.size,proximoEvento,diasProximo,countPendente,totalPendente,historico};
}

// ── AbaTemplates — editor de mensagens WhatsApp ─────────────────────────────
function AbaTemplates({adminId,eventos}){
  const [templates,setTemplates]=React.useState([]);
  const [sel,setSel]=React.useState(null);
  const [corpo,setCorpo]=React.useState("");
  const [prevText,setPrevText]=React.useState("");
  const [evSel,setEvSel]=React.useState("");
  const [saving,setSaving]=React.useState(false);
  const [feedback,setFeedback]=React.useState(null); // {tipo:"ok"|"erro",msg:string}
  const [carregando,setCarregando]=React.useState(true);

  const headers={headers:{"bypass-tunnel-reminder":"true","x-api-secret":WA_SECRET,"x-admin-id":adminId}};
  const url=WA_SERVER_URL;

  async function load(){
    setCarregando(true);
    try{
      const r=await fetch(`${url}/api/templates?adminId=${adminId}`,headers);
      const arr=await r.json();
      setTemplates(arr);
      if(!sel&&arr.length>0) setSel(arr[0].chave);
    }catch(e){setFeedback({tipo:"erro",msg:"Falha ao carregar mensagens."});}
    finally{setCarregando(false);}
  }

  React.useEffect(()=>{load();},[adminId]);

  // Sincroniza corpo com template selecionado
  React.useEffect(()=>{
    if(!sel)return;
    const t=templates.find(t=>t.chave===sel);
    if(t)setCorpo(t.corpo||"");
  },[sel,templates]);

  // Atualiza preview ao mudar corpo ou evento
  React.useEffect(()=>{
    if(!corpo||!sel)return;
    const ev=evSel?eventos.find(e=>String(e.id)===evSel):null;
    setPrevText(renderTemplateFrontend(corpo,_mockVars(sel,ev)));
  },[corpo,sel,evSel,eventos]);

  function _mockVars(chave,ev){
    const nome="Ana Silva",evento=ev?.nome||"Festa da Empresa",data=ev?.data?fmtDate(ev.data):"15/09/2026",hora_inicio=ev?.horaInicio||"14:00",hora_fim=ev?.horaFim||"20:00",local=ev?.local||"Salão Principal",funcao="Animador(a)",cache="350,00",pix_linha="💳 PIX: *chave@email.com*",pix="chave@email.com",total="700,00",lista_eventos="• Festa (15/09) — R$ 350,00 [Animador]",data_extenso="SEGUNDA-FEIRA (15/09)",blocos_eventos="*Festa da Empresa*\n📍 Salão\n⏰ 14:00 — 20:00\n@555511999999999 - Animador",link_feedback="https://escalafesta.netlify.app/feedback";
    return{nome,evento,data,hora_inicio,hora_fim,local,funcao,cache,pix_linha,pix,total,lista_eventos,data_extenso,blocos_eventos,link_feedback};
  }

  async function salvar(){
    if(!corpo.trim()){setFeedback({tipo:"erro",msg:"O corpo não pode ser vazio."});return;}
    const tpl=templates.find(t=>t.chave===sel);
    const vars=tpl?.variaveis_disponiveis||[];
    const usados=[...corpo.matchAll(/\{\{(\w+)\}\}/g)].map(m=>`{{${m[1]}}}`);
    const desc=usados.filter(v=>!vars.includes(v));
    if(desc.length){setFeedback({tipo:"erro",msg:`Variáveis não reconhecidas: ${desc.join(", ")}`});return;}
    setSaving(true);setFeedback(null);
    try{
      const r=await fetch(`${url}/api/templates/${sel}?adminId=${adminId}`,{method:"PUT",...headers,headers:{...headers.headers,"Content-Type":"application/json"},body:JSON.stringify({corpo:corpo.trim(),updatedBy:adminId})});
      if(!r.ok){const e=await r.json();throw new Error(e.error||"Erro ao salvar");}
      // Atualiza cache local
      _sfTemplates[sel]={...(_sfTemplates[sel]||{}),corpo:corpo.trim(),ativo:tpl?.ativo!==false};
      setFeedback({tipo:"ok",msg:"Salvo com sucesso."});
      await load();
    }catch(e){setFeedback({tipo:"erro",msg:e.message});}
    finally{setSaving(false);}
  }

  async function restaurar(){
    if(!window.confirm(`Restaurar o texto padrão de "${sel}"?`))return;
    setFeedback(null);
    try{
      const r=await fetch(`${url}/api/templates/${sel}?adminId=${adminId}`,{method:"DELETE",...headers});
      if(!r.ok){const e=await r.json();throw new Error(e.error||"Erro ao restaurar");}
      delete _sfTemplates[sel];
      setFeedback({tipo:"ok",msg:"Padrão restaurado."});
      await load();
    }catch(e){setFeedback({tipo:"erro",msg:e.message});}
  }

  async function toggleAtivo(){
    const tpl=templates.find(t=>t.chave===sel);if(!tpl)return;
    const novoCorpo=tpl.corpo||(tpl.ativo===false?_TPLDEF[sel]?.corpo||"":"");
    setSaving(true);setFeedback(null);
    try{
      await fetch(`${url}/api/templates/${sel}?adminId=${adminId}`,{method:"PUT",...headers,headers:{...headers.headers,"Content-Type":"application/json"},body:JSON.stringify({corpo:novoCorpo,ativo:!tpl.ativo,updatedBy:adminId})});
      _sfTemplates[sel]={...(_sfTemplates[sel]||{}),ativo:!tpl.ativo};
      setFeedback({tipo:"ok",msg:tpl.ativo?"Mensagem desativada.":"Mensagem ativada."});
      await load();
    }catch(e){setFeedback({tipo:"erro",msg:e.message});}
    finally{setSaving(false);}
  }

  function inserirVar(v){
    const ta=document.getElementById("tpl-editor");if(!ta)return;
    const s=ta.selectionStart,e=ta.selectionEnd;
    const novo=corpo.slice(0,s)+v+corpo.slice(e);
    setCorpo(novo);
    setTimeout(()=>{ta.focus();ta.setSelectionRange(s+v.length,s+v.length);},10);
  }

  const selTpl=templates.find(t=>t.chave===sel);
  const isCustom=!!(selTpl&&selTpl.id); // tem id do banco = foi customizado
  const isDormant=sel==="lembrete_vespera"||sel==="feedback_pos_evento";

  if(carregando)return <div style={{padding:32,color:"var(--text2)"}}>Carregando...</div>;

  return(
    <div style={{padding:"24px",maxWidth:900,margin:"0 auto"}}>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:18,fontWeight:700,color:"var(--text)",margin:"0 0 4px"}}>Mensagens WhatsApp</h2>
        <p style={{fontSize:13,color:"var(--text2)",margin:0}}>Edite os textos enviados automaticamente ou via botão. O envio e os destinatários não mudam.</p>
      </div>

      <div style={{display:"flex",gap:20,alignItems:"flex-start",flexWrap:"wrap"}}>
        {/* Lista de templates */}
        <div style={{width:200,flexShrink:0}}>
          {templates.map(t=>(
            <button key={t.chave} onClick={()=>{setSel(t.chave);setFeedback(null);}} style={{display:"block",width:"100%",textAlign:"left",padding:"9px 12px",marginBottom:4,borderRadius:8,border:"none",background:sel===t.chave?"rgba(12,110,126,.15)":"transparent",color:sel===t.chave?"var(--primary)":"var(--text2)",fontWeight:sel===t.chave?600:400,fontSize:13,cursor:"pointer",fontFamily:"inherit",borderLeft:sel===t.chave?"3px solid var(--primary)":"3px solid transparent",transition:"all .12s"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,justifyContent:"space-between"}}>
                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.nome}</span>
                {t.ativo===false&&<span style={{fontSize:10,color:"var(--danger)",flexShrink:0}}>off</span>}
              </div>
            </button>
          ))}
        </div>

        {/* Editor */}
        {selTpl&&(
          <div style={{flex:1,minWidth:280}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap"}}>
              <h3 style={{fontSize:15,fontWeight:700,color:"var(--text)",margin:0,flex:1}}>{selTpl.nome}</h3>
              {isDormant&&<span style={{fontSize:11,background:"#FFF7ED",color:"#EA580C",border:"1px solid #FED7AA",borderRadius:6,padding:"2px 8px"}}>sem envio implementado</span>}
              {isCustom&&selTpl.updated_at&&(
                <span style={{fontSize:11,color:"var(--text3)"}}>
                  Editado {new Date(selTpl.updated_at).toLocaleDateString("pt-BR")}
                </span>
              )}
            </div>

            {/* Variáveis disponíveis */}
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:600,color:"var(--text2)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}}>Variaveis disponíveis (clique para inserir)</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {(selTpl.variaveis_disponiveis||[]).map(v=>(
                  <button key={v} onClick={()=>inserirVar(v)} style={{fontSize:11,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:5,padding:"2px 8px",color:"var(--primary)",cursor:"pointer",fontFamily:"monospace",fontWeight:600}}>{v}</button>
                ))}
              </div>
              {sel==="escala_diaria_grupo"&&<div style={{fontSize:11,color:"var(--text3)",marginTop:6}}>{"{{blocos_eventos}}"} = lista gerada automaticamente com os eventos e membros do dia.</div>}
              {sel==="caches_pendentes_lote"&&<div style={{fontSize:11,color:"var(--text3)",marginTop:6}}>{"{{lista_eventos}}"} = lista gerada automaticamente com todos os cachês pendentes do freelancer.</div>}
            </div>

            {/* Editor de texto */}
            <textarea
              id="tpl-editor"
              value={corpo}
              onChange={e=>setCorpo(e.target.value)}
              rows={10}
              style={{width:"100%",boxSizing:"border-box",fontFamily:"monospace",fontSize:13,padding:"10px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",resize:"vertical",lineHeight:1.55}}
            />

            {/* Feedback de validação */}
            {feedback&&(
              <div style={{marginTop:8,padding:"8px 12px",borderRadius:7,background:feedback.tipo==="ok"?"var(--success-light)":"var(--danger-light)",color:feedback.tipo==="ok"?"var(--success)":"var(--danger)",fontSize:13,fontWeight:500}}>
                {feedback.msg}
              </div>
            )}

            {/* Botões */}
            <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
              <button onClick={salvar} disabled={saving} style={{background:"var(--primary)",color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",opacity:saving?.6:1}}>
                {saving?"Salvando...":"Salvar"}
              </button>
              {isCustom&&(
                <button onClick={restaurar} disabled={saving} style={{background:"var(--surface)",color:"var(--text2)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 14px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
                  Restaurar padrao
                </button>
              )}
              <button onClick={toggleAtivo} disabled={saving} style={{background:"var(--surface)",color:selTpl.ativo===false?"var(--success)":"var(--danger)",border:`1px solid ${selTpl.ativo===false?"var(--success)":"var(--danger)"}44`,borderRadius:8,padding:"8px 14px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
                {selTpl.ativo===false?"Ativar":"Desativar"}
              </button>
            </div>

            {/* Preview */}
            <div style={{marginTop:20}}>
              <div style={{fontSize:11,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8,display:"flex",alignItems:"center",gap:10}}>
                Pre-visualizacao
                {eventos.length>0&&(
                  <select value={evSel} onChange={e=>setEvSel(e.target.value)} style={{fontSize:11,border:"1px solid var(--border)",borderRadius:5,padding:"2px 6px",background:"var(--surface)",color:"var(--text)",fontFamily:"inherit"}}>
                    <option value="">— evento de exemplo —</option>
                    {[...eventos].sort((a,b)=>b.data?.localeCompare(a.data||"")||0).slice(0,20).map(ev=>(
                      <option key={ev.id} value={String(ev.id)}>{ev.nome} ({fmtDate(ev.data)})</option>
                    ))}
                  </select>
                )}
              </div>
              <pre style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap",wordBreak:"break-word",color:"var(--text)",margin:0,maxHeight:260,overflowY:"auto"}}>{prevText}</pre>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

      setFl(fls||FL_INIT);setEv(evs||[]);setDisp(dsp||DISP_INIT);
      setFuncoes(fns||FUNCOES_INIT);setTreinamentos(trs||[]);
      const bnsCarregados=bns||BONUS_INIT;
      setBonificacoesState(bnsCarregados);
      NIVEIS_BONUS=bnsCarregados;
      const prgCarregadas=pergs||PERGUNTAS_INIT;
      setPerguntasState(prgCarregadas);
    }catch(e){
      console.error("Erro ao carregar dados:",e);
      if(addToast) addToast("Falha ao carregar dados. Verifique a conexão e recarregue.","erro");
    }finally{
      setCarregando(false);
    }
  };

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>setUser(session?.user||null));
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>setUser(session?.user||null));
    const h=()=>setMob(window.innerWidth<640);
    window.addEventListener("resize",h);
    // Tratar retorno do OAuth Google Calendar
    const sp=new URLSearchParams(window.location.search);
    if(sp.get("success")==="calendar_connected"){
      setTimeout(()=>addToast("Google Calendar conectado com sucesso!","ok"),500);
      window.history.replaceState({},"","/dashboard");
    }
    if(sp.get("error")==="oauth_failed"){
      setTimeout(()=>addToast("Falha ao conectar o Google Calendar.","erro"),500);
      window.history.replaceState({},"","/dashboard");
    }
    if(sp.get("error")==="no_refresh_token"){
      setTimeout(()=>addToast("Google: revogue o acesso em myaccount.google.com/permissions e tente novamente.","erro"),500);
      window.history.replaceState({},"","/dashboard");
    }
    return()=>{subscription.unsubscribe();window.removeEventListener("resize",h);};
  },[]);

  useEffect(()=>{
    if(!user){setCarregando(false);setPerfil(null);return;}
    setCarregando(true);
    sb.from("sf_perfis").select("*").eq("id",user.id).single().then(async({data:p,error})=>{
      try{
        if(p&&(p.role==="funcionario"||p.role==="secretario"||p.role==="motorista")){
          setPerfil(p);
        } else if(p&&p.role==="admin"){
          // Existing admin — preserve trialInicio, never overwrite it
          let perfilFinal = p;
          if(!p.trialInicio){
            // Sem trialInicio — usar created_at do auth como referência
            const {data:userData}=await sb.auth.getUser();
            const trialInicio=(userData?.user?.created_at)||new Date().toISOString();
            await sb.from("sf_perfis").update({trialInicio}).eq("id",user.id);
            perfilFinal = {...p, trialInicio};
          }
          setPerfil(perfilFinal);
          await carregarDados(user.id);
          return;
        } else {
          // New user — only register as admin if no profile exists yet
          // This prevents funcionarios from escalating to admin
          const{data:existing}=await sb.from("sf_perfis").select("id").eq("id",user.id).single();
          if(!existing){
            const novoPerfil={id:user.id,role:"admin",admin_id:user.id,trialInicio:new Date().toISOString(),plano:null};
            await sb.from("sf_perfis").upsert(novoPerfil,{onConflict:"id"});
            setPerfil(novoPerfil);
            await carregarDados(user.id);
            return;
          } else {
            // Profile exists but no recognized role — treat as funcionario for safety
            setPerfil({...existing,role:"funcionario"});
          }
        }
      }catch(e){
        console.error("Erro no perfil:",e);
      }finally{
        setCarregando(false);
      }
    }).catch(e=>{
      console.error("Erro ao buscar perfil:",e);
      if(addToast) addToast("Erro ao conectar com o servidor. Tente recarregar.","erro");
      setCarregando(false);
    });
  },[user?.id]);

  // Redireciona para aba Plano quando plano pago vence
  useEffect(()=>{
    if(!perfil||!user) return;
    const info=getPlanoAtual(perfil);
    if(info?.planoVencido&&!isMaster(user.email)) setAba("plano");
  },[perfil?.plano,perfil?.plano_vencimento]);

  const schedSave=(tipo,dados)=>{if(!user)return;clearTimeout(saveTimer.current[tipo]);setSalvando(true);const delay=tipo==="freelancers"?0:1500;saveTimer.current[tipo]=setTimeout(async()=>{const ok=await cloudSave(user.id,tipo,dados);if(!ok&&addToast)addToast("Falha ao salvar dados. Verifique a conexão e tente novamente.","erro");setSalvando(false);},delay);};

  // Ativar plano após confirmação verificada pelo backend
  const onPlanoAtivado=async()=>{
    // O webhook do Asaas já atualizou sf_perfis — recarregamos do banco
    if(!user)return;
    const{data}=await sb.from("sf_perfis").select("*").eq("id",user.id).single();
    if(data) setPerfil(data);
    setModalPlano(false);
  };

  // Asaas não redireciona de volta com parâmetros — a ativação é via webhook.
  // O polling já é iniciado em aguardarAtivacao() dentro de TelaPagamento.

  // Limites e acessos pelo plano
  const maxFl=getMaxFl(perfil,user?.email);
  const temSecretaria=getSecretariaAcesso(perfil,user?.email);
  const setFlS=v=>{const next=typeof v==="function"?v(fl):v;setFl(next);schedSave("freelancers",next);};
  const setDispS=v=>{const next=typeof v==="function"?v(disp):v;setDisp(next);schedSave("disponibilidade",next);};
  const setFuncoesS=v=>{const next=typeof v==="function"?v(funcoes):v;setFuncoes(next);schedSave("funcoes",next);};
  const setTreinamentosS=v=>{const next=typeof v==="function"?v(treinamentos):v;setTreinamentos(next);schedSave("treinamentos",next);};
  const setBonificacoes=v=>{const next=typeof v==="function"?v(bonificacoes):v;setBonificacoesState(next);NIVEIS_BONUS=next;schedSave("bonificacoes",next);};
  const setPerguntas=v=>{const next=typeof v==="function"?v(perguntas):v;setPerguntasState(next);schedSave("perguntas_feedback",next);};
  const logout=async()=>{await sb.auth.signOut();setUser(null);setPerfil(null);setFl([]);setEv([]);setDisp({});setFuncoes([]);setTreinamentos([]);};
  const resetarDados=()=>{if(!window.confirm("Tem certeza?"))return;setFlS(FL_INIT);evSvc.deleteAll(user.id).then(()=>setEv([]));setDispS(DISP_INIT);setFuncoesS(FUNCOES_INIT);};
  const refresh=()=>{if(user)carregarDados(user.id);};
  const onSyncCalendar=()=>{if(user)setModalSyncOpen(true);};
  const triageCount=ev.filter(e=>e.triagem_status==='pendente'||e.triagem_status==='nao_identificado').length;

  if(user===undefined||carregando)return <Loader/>;
  if(!user)return <TelaLogin onLogin={u=>setUser(u)}/>;
  if(perfil?.role==="motorista"||perfil?.role==="funcionario"||perfil?.role==="secretario")return <AppFuncionario user={user} perfil={perfil} onLogout={logout} adminId={perfil.admin_id} perguntas={perguntas}/>;
  return(
    <div style={{display:"flex",flexDirection:"column",height:mob?undefined:"100vh",background:"var(--bg)"}}>
      {/* Header — Central de Escala */}
      <header style={{background:"#0C6E7E",borderBottom:"none",padding:"0 24px",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,zIndex:100,boxShadow:"0 1px 4px rgba(0,0,0,.15)",...(mob?{position:"sticky",top:0}:{})}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <img src={LOGO_URL} alt="EscalaFest" style={{height:40,objectFit:"contain",flexShrink:0}}/>
          <div style={{display:"flex",flexDirection:"column",justifyContent:"center",lineHeight:1.1}}>
            <span style={{fontFamily:"'Sora',sans-serif",fontWeight:800,fontSize:mob?16:18,color:"#fff",letterSpacing:"-0.01em"}}>EscalaFest</span>
            {!mob&&<span style={{fontSize:10,fontWeight:500,color:"rgba(255,255,255,.6)",letterSpacing:"0.1em",textTransform:"uppercase",marginTop:1}}>Central de Escala</span>}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {/* Plano badge */}
          {(()=>{
            const info=getPlanoAtual(perfil);
            if(!info)return null;
            const p=PLANOS.find(p=>p.id===info.plano);
            if(isMaster(user.email))return <span style={{fontSize:16,lineHeight:1}}><svg width="16" height="32" viewBox="0 0 24 24" fill="none" stroke="#0C6E7E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"/><line x1="5" y1="20" x2="19" y2="20"/></svg></span>;
            if(p)return <button onClick={()=>setModalPlano(true)} style={{background:p.cor+"33",border:`1px solid ${p.cor}55`,borderRadius:6,padding:"4px 10px",color:p.cor,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{p.nome}</button>;
            if(info.trialAtivo)return <button onClick={()=>setModalPlano(true)} style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.18)",borderRadius:6,padding:"4px 10px",color:"rgba(255,255,255,.9)",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Trial · {info.diasRestantes}d</button>;
            return <button onClick={()=>setModalPlano(true)} style={{background:"rgba(254,242,242,.15)",border:"1px solid rgba(252,165,165,.4)",borderRadius:6,padding:"4px 10px",color:"#FCA5A5",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Assinar</button>;
          })()}
          {/* Refresh — desktop only */}
          {!mob&&<button onClick={refresh} title="Atualizar dados" className="sf-header-btn" style={{width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.15)",borderRadius:"50%",color:"rgba(255,255,255,.8)",fontSize:15,cursor:"pointer",fontFamily:"inherit",transition:"background .15s",flexShrink:0}}>↻</button>}
          {/* Sino de notificações */}
          <SinoNotificacoes userId={user.id} onNavegar={()=>setAba("eventos")}/>
          {/* Avatar */}
          <div title={user.email} style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.12))",border:"1.5px solid rgba(255,255,255,.3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"#fff",flexShrink:0,letterSpacing:"0.02em"}}>{user.email?user.email[0].toUpperCase():"?"}</div>
          {/* Sair — desktop only (mobile has it in bottom nav) */}
          {!mob&&<button onClick={logout} style={{background:"rgba(0,0,0,.18)",border:"1px solid rgba(255,255,255,.12)",borderRadius:7,padding:"5px 12px",color:"rgba(255,255,255,.75)",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:500,flexShrink:0}}>Sair</button>}
        </div>
      </header>
      {/* Banner trial */}
      <BannerPlano perfil={perfil} onUpgrade={()=>setModalPlano(true)} userEmail={user.email}/>
      {/* ── DESKTOP layout: sticky sidebar + inner-scroll main ── */}
      {!mob&&(
        <div style={{display:"flex",height:"calc(100vh - 52px)",overflow:"hidden"}}>
          <Sidebar aba={aba} setAba={setAba} onReset={resetarDados} userEmail={user.email} onLogout={logout} onRefresh={refresh} onSyncCalendar={onSyncCalendar} perfil={perfil} badges={{triagem:triageCount}}/>
          <main style={{flex:1,overflowY:"auto",position:"relative",background:"var(--bg)"}}>
            {salvando&&<div style={{position:"fixed",bottom:24,right:24,background:"#0F172A",borderRadius:12,padding:"9px 16px",fontSize:12,color:"#E2E8F0",zIndex:999,fontWeight:500,boxShadow:"0 8px 28px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:9,backdropFilter:"blur(8px)"}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:"#0C6E7E",flexShrink:0,animation:"pulseDot 1.4s ease-in-out infinite"}}/>
              Sincronizando...
            </div>}
            {aba==="inicio"&&<AbaInicio eventos={ev} freelancers={fl} loading={carregando} setAba={setAba}/>}
            {aba==="eventos"&&<AbaEventos eventos={ev} setEventos={setEv} freelancers={fl} disponibilidade={disp} funcoes={funcoes} userId={user.id} rosterTarget={rosterTarget} onRosterTargetConsumed={()=>setRosterTarget(null)}/>}
            {aba==="checklist"&&<ChecklistPage eventos={ev} tenantId={user.id}/>}
            {aba==="triagem"&&<AbaTriagem tenantId={user.id} onSugerirEscala={(eid)=>{setRosterTarget(eid);setAba("eventos");}}/>}
            {aba==="modelos"&&<AbaModelos tenantId={user.id}/>}
            {aba==="equipe"&&<AbaEquipeAdmin freelancers={fl} setFreelancers={setFlS} eventos={ev} funcoes={funcoes} adminUser={user} maxFl={maxFl} onUpgrade={()=>setModalPlano(true)} temSecretaria={temSecretaria}/>}
            {aba==="funcoes"&&<AbaFuncoes funcoes={funcoes} setFuncoes={setFuncoesS}/>}
            {aba==="servicos"&&<AbaServicos tenantId={user.id} funcoes={funcoes}/>}
            {aba==="disponibilidade"&&<AbaDisponibilidade freelancers={fl} disponibilidade={disp} setDisponibilidade={setDispS}/>}
            {aba==="treinamentos"&&<AbaTreinamentos treinamentos={treinamentos} setTreinamentos={setTreinamentosS} adminId={user.id} user={user} perfil={perfil} freelancers={fl}/>}
            {aba==="bonificacoes"&&<AbaBonificacoes bonificacoes={bonificacoes} setBonificacoes={setBonificacoes}/>}
            {aba==="feedback"&&<AbaFeedbackAdmin freelancers={fl} eventos={ev} adminId={user.id} perguntas={perguntas} setPerguntas={setPerguntas}/>}
            {aba==="plano"&&<AbaPlano perfil={perfil} userEmail={user.email} userId={user.id} onSyncDone={()=>carregarDados(user.id)} onUpgrade={()=>setModalPlano(true)} onPlanoAtivado={onPlanoAtivado} onCancelar={async()=>{
  const venc=perfil?.plano_vencimento?new Date(perfil.plano_vencimento).toLocaleDateString("pt-BR"):null;
  const msg=venc?`Seu plano continuará ativo até ${venc}. Após essa data, voltará ao plano gratuito.`:"Seu plano será cancelado.";
  if(window.confirm("Cancelar assinatura?\n\n"+msg)){
    await sb.from("sf_perfis").update({plano_cancelado_em:new Date().toISOString()}).eq("id",user.id);
    setPerfil(p=>({...p,plano_cancelado_em:new Date().toISOString()}));
  }
}}/>}
            {aba==="mensagens"&&<AbaTemplates adminId={user.id} eventos={ev}/>}
            {aba==="ranking"&&<AbaRanking freelancers={fl} eventos={ev} adminId={user.id}/>}
            {aba==="relatorios"&&<AbaRelatorios eventos={ev} setEventos={setEv} freelancers={fl} funcoes={funcoes} userId={user.id}/>}
          </main>
        </div>
      )}
      {/* ── MOBILE layout: body scroll, sticky header, fixed bottom nav ── */}
      {mob&&(
        <main style={{flex:1,position:"relative",background:"var(--bg)",paddingBottom:"calc(64px + env(safe-area-inset-bottom,0px))"}}>
          {salvando&&<div style={{position:"fixed",bottom:"calc(64px + env(safe-area-inset-bottom,0px))",right:16,background:"#0F172A",borderRadius:12,padding:"9px 16px",fontSize:12,color:"#E2E8F0",zIndex:999,fontWeight:500,boxShadow:"0 8px 28px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:9,backdropFilter:"blur(8px)"}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:"#0C6E7E",flexShrink:0,animation:"pulseDot 1.4s ease-in-out infinite"}}/>
            Sincronizando...
          </div>}
          {aba==="inicio"&&<AbaInicio eventos={ev} freelancers={fl} loading={carregando} setAba={setAba}/>}
          {aba==="eventos"&&<AbaEventos eventos={ev} setEventos={setEv} freelancers={fl} disponibilidade={disp} funcoes={funcoes} userId={user.id} rosterTarget={rosterTarget} onRosterTargetConsumed={()=>setRosterTarget(null)}/>}
          {aba==="checklist"&&<ChecklistPage eventos={ev} tenantId={user.id}/>}
          {aba==="triagem"&&<AbaTriagem tenantId={user.id} onSugerirEscala={(eid)=>{setRosterTarget(eid);setAba("eventos");}}/>}
          {aba==="modelos"&&<AbaModelos tenantId={user.id}/>}
          {aba==="equipe"&&<AbaEquipeAdmin freelancers={fl} setFreelancers={setFlS} eventos={ev} funcoes={funcoes} adminUser={user} maxFl={maxFl} onUpgrade={()=>setModalPlano(true)} temSecretaria={temSecretaria}/>}
          {aba==="funcoes"&&<AbaFuncoes funcoes={funcoes} setFuncoes={setFuncoesS}/>}
          {aba==="servicos"&&<AbaServicos tenantId={user.id} funcoes={funcoes}/>}
          {aba==="disponibilidade"&&<AbaDisponibilidade freelancers={fl} disponibilidade={disp} setDisponibilidade={setDispS}/>}
          {aba==="treinamentos"&&<AbaTreinamentos treinamentos={treinamentos} setTreinamentos={setTreinamentosS} adminId={user.id} user={user} perfil={perfil} freelancers={fl}/>}
          {aba==="bonificacoes"&&<AbaBonificacoes bonificacoes={bonificacoes} setBonificacoes={setBonificacoes}/>}
          {aba==="feedback"&&<AbaFeedbackAdmin freelancers={fl} eventos={ev} adminId={user.id} perguntas={perguntas} setPerguntas={setPerguntas}/>}
          {aba==="plano"&&<AbaPlano perfil={perfil} userEmail={user.email} userId={user.id} onSyncDone={()=>carregarDados(user.id)} onUpgrade={()=>setModalPlano(true)} onPlanoAtivado={onPlanoAtivado} onCancelar={async()=>{
  const venc=perfil?.plano_vencimento?new Date(perfil.plano_vencimento).toLocaleDateString("pt-BR"):null;
  const msg=venc?`Seu plano continuará ativo até ${venc}. Após essa data, voltará ao plano gratuito.`:"Seu plano será cancelado.";
  if(window.confirm("Cancelar assinatura?\n\n"+msg)){
    await sb.from("sf_perfis").update({plano_cancelado_em:new Date().toISOString()}).eq("id",user.id);
    setPerfil(p=>({...p,plano_cancelado_em:new Date().toISOString()}));
  }
}}/>}
          {aba==="mensagens"&&<AbaTemplates adminId={user.id} eventos={ev}/>}
          {aba==="relatorios"&&<AbaRelatorios eventos={ev} setEventos={setEv} freelancers={fl} funcoes={funcoes} userId={user.id}/>}
        </main>
      )}
      {mob&&<Sidebar aba={aba} setAba={setAba} mobile onReset={resetarDados} userEmail={user.email} onLogout={logout} onRefresh={refresh} perfil={perfil} badges={{triagem:triageCount}}/>}
      {/* Modal de planos */}
      {modalPlano&&<TelaPagamento perfil={perfil} onClose={()=>setModalPlano(false)} onPlanoAtivado={onPlanoAtivado} userEmail={user.email} userId={user.id}/>}
      {/* Modal sync Calendar (acionado pelo botão ↻ Sync da sidebar) */}
      {modalSyncOpen&&<ModalSyncCalendar userId={user.id} onClose={()=>setModalSyncOpen(false)} onImportDone={()=>{carregarDados(user.id);setModalSyncOpen(false);}}/>}
    </div>
  );
}
window._sfAppReady=true;
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><ToastProvider><App/></ToastProvider></ErrorBoundary>);



</script>

<script>
// ── PWA: Service Worker via Blob (sem arquivo externo) ────────────────────────
(function(){
  // Injetar manifest dinamicamente
  const manifest = {
    name:"EscalaFest",
    short_name:"EscalaFest",
    start_url:"/",
    display:"standalone",
    background_color:"#F8FAFC",
    theme_color:"#2563EB",
    icons:[
      {src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%232563EB'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EEF%3C/text%3E%3C/svg%3E",sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},
      {src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%232563EB'/%3E%3Ctext x='256' y='340' font-size='260' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EEF%3C/text%3E%3C/svg%3E",sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const mUrl = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = mUrl;
  document.head.appendChild(link);

  // Apple touch icon inline SVG
  const iconSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%238b5cf6'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ESF%3C/text%3E%3C/svg%3E";
  const appleLink = document.createElement('link');
  appleLink.rel = 'apple-touch-icon'; appleLink.href = iconSvg;
  document.head.appendChild(appleLink);

  // SW via Blob só funciona em localhost — Vercel e outros hosts bloqueiam blob: para SW
  if (!('serviceWorker' in navigator)) return;
  const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isLocalhost) return; // produção usa Notification API direta, sem SW

  // SW inline via Blob — sem arquivo externo necessário
  const swCode = `
const CACHE = 'sf-v3';
self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
});
self.addEventListener('activate', e => {
  e.waitUntil(Promise.all([
    caches.keys().then(ks => Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))),
    self.clients.claim()
  ]));
});
self.addEventListener('fetch', e => {
  if (e.request.url.includes('supabase') || e.request.url.includes('fonts') || e.request.url.includes('unpkg') || e.request.url.includes('cdn.jsdelivr')) return;
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});
self.addEventListener('message', e => {
  if (e.data && e.data.type === 'NOTIFY') {
    self.registration.showNotification(e.data.title, {
      body: e.data.body,
      tag: e.data.tag || 'sf',
      renotify: true,
      vibrate: [200, 100, 200],
      icon: e.data.icon || ''
    });
  }
});
self.addEventListener('notificationclick', e => {
  e.notification.close();
  e.waitUntil(clients.matchAll({type:'window'}).then(cs => {
    if (cs.length) return cs[0].focus();
    return clients.openWindow('/');
  }));
});
  `;

  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(swBlob);

  navigator.serviceWorker.register(swUrl, {scope:'/'})
    .then(reg => {
      window._swReg = reg;

      // Instalar prompt PWA
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        window._installPrompt = e;
        window.dispatchEvent(new Event('sf-instalavel'));
      });
    })
    .catch(()=>{});
})();

// Disparar notificação via SW (funciona com aba em background no Android)
window.sfNotify = function(title, body, tag) {
  if (Notification.permission !== 'granted') return;
  // Tentar via SW primeiro (melhor suporte mobile)
  if (window._swReg && window._swReg.active) {
    window._swReg.active.postMessage({type:'NOTIFY', title, body, tag: tag||'sf'});
  } else {
    try { new Notification(title, {body}); } catch(e) {}
  }
};
</script>
