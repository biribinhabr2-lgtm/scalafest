// ── PICKER DE MODELOS (modal bottom-sheet para escolher kits do catálogo) ─────
function PickerModelos({categoria,kits,imgUrls,onSelect,onClose}){
  const[busca,setBusca]=useState("");
  const[expanded,setExpanded]=useState({});
  const[checkedItems,setCheckedItems]=useState({});
  const CATLABEL={material:"Material",figurino:"Figurino",checklist:"Checklist"};
  const CATEMOJI={material:"",figurino:"",checklist:""};
  const catKits=kits.filter(k=>k.categoria===categoria&&(!busca||k.nome.toLowerCase().includes(busca.toLowerCase())||k.items.some(i=>i.nome.toLowerCase().includes(busca.toLowerCase()))));
  const totalChecked=Object.values(checkedItems).filter(Boolean).length;
  const toggleKit=kit=>{
    const allChecked=kit.items.every(i=>checkedItems[i.id]);
    setCheckedItems(prev=>{const next={...prev};kit.items.forEach(i=>next[i.id]=!allChecked);return next;});
  };
  const toggleItem=id=>setCheckedItems(p=>({...p,[id]:!p[id]}));
  const confirm=()=>{
    const allItems=kits.flatMap(k=>k.items.map(i=>({kitItem:i,kit:k})));
    onSelect(allItems.filter(({kitItem})=>checkedItems[kitItem.id]));
  };
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"#000000c0",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",borderRadius:"16px 16px 0 0",width:"100%",maxWidth:520,maxHeight:"80vh",display:"flex",flexDirection:"column",overflow:"hidden",boxShadow:"0 -8px 32px rgba(0,0,0,.3)"}}>
        <div style={{padding:"16px 16px 10px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{fontWeight:700,fontSize:15,color:"var(--text)"}}> Catálogo — {CATLABEL[categoria]||categoria}</div>
          <button onClick={onClose} style={{background:"transparent",border:"none",cursor:"pointer",fontSize:20,color:"var(--text3)",padding:"0 4px",lineHeight:1,fontFamily:"inherit"}}>×</button>
        </div>
        <div style={{padding:"10px 16px",borderBottom:"1px solid var(--border)",flexShrink:0}}>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar kit ou item..." autoFocus
            style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",fontSize:13,color:"var(--text)",fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"8px 16px 4px",WebkitOverflowScrolling:"touch"}}>
          {catKits.length===0?(
            <div style={{textAlign:"center",color:"var(--text3)",fontSize:13,padding:"28px 0"}}>
              {kits.filter(k=>k.categoria===categoria).length===0
                ?"Nenhum kit cadastrado. Acesse  Modelos para criar."
                :"Nenhum resultado para a busca."}
            </div>
          ):catKits.map(kit=>{
            const isExpanded=!!expanded[kit.id];
            const kitAllChecked=kit.items.length>0&&kit.items.every(i=>checkedItems[i.id]);
            const kitSomeChecked=kit.items.some(i=>checkedItems[i.id]);
            const kitCheckedCount=kit.items.filter(i=>checkedItems[i.id]).length;
            const capaUrl=kit.capa_image_path?imgUrls[kit.capa_image_path]:null;
            return(
              <div key={kit.id} style={{marginBottom:8,border:`1px solid ${kitSomeChecked?"var(--primary)":"var(--border)"}`,borderRadius:10,overflow:"hidden",background:kitSomeChecked?"var(--primary-light)":"var(--bg)"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px"}}>
                  <input type="checkbox" checked={kitAllChecked}
                    ref={el=>{if(el)el.indeterminate=kitSomeChecked&&!kitAllChecked;}}
                    onChange={()=>toggleKit(kit)}
                    style={{width:16,height:16,accentColor:"var(--primary)",cursor:"pointer",flexShrink:0}}/>
                  {capaUrl
                    ?<img src={capaUrl} alt={kit.nome} style={{width:40,height:40,borderRadius:7,objectFit:"cover",flexShrink:0,border:"1px solid var(--border)"}}/>
                    :<div style={{width:40,height:40,borderRadius:7,background:"var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{CATEMOJI[categoria]||""}</div>
                  }
                  <div onClick={()=>setExpanded(p=>({...p,[kit.id]:!p[kit.id]}))} style={{flex:1,minWidth:0,cursor:"pointer",userSelect:"none"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}> {kit.nome}</div>
                    <div style={{fontSize:11,color:"var(--text3)",marginTop:1}}>{kit.items.length} {kit.items.length===1?"item":"itens"}{kitCheckedCount>0?` · ${kitCheckedCount} selecionado${kitCheckedCount>1?"s":""}`:""}</div>
                  </div>
                  <span onClick={()=>setExpanded(p=>({...p,[kit.id]:!p[kit.id]}))} style={{fontSize:11,color:"var(--text3)",transform:isExpanded?"rotate(90deg)":"none",transition:"transform .2s",flexShrink:0,cursor:"pointer"}}>›</span>
                </div>
                {isExpanded&&(
                  <div style={{borderTop:"1px solid var(--border)",padding:"6px 12px 10px"}}>
                    {kit.items.length===0?(
                      <div style={{fontSize:12,color:"var(--text3)",textAlign:"center",padding:"8px 0"}}>Kit vazio</div>
                    ):kit.items.map(item=>{
                      const imgUrl=item.image_path?imgUrls[item.image_path]:null;
                      const isSel=!!checkedItems[item.id];
                      return(
                        <div key={item.id} onClick={()=>toggleItem(item.id)}
                          style={{display:"flex",alignItems:"center",gap:10,padding:"7px 8px",marginBottom:4,background:isSel?"var(--primary-light)":"transparent",borderRadius:8,cursor:"pointer",border:`1px solid ${isSel?"var(--primary)":"transparent"}`}}>
                          <input type="checkbox" checked={isSel} onChange={()=>toggleItem(item.id)} onClick={e=>e.stopPropagation()}
                            style={{width:15,height:15,accentColor:"var(--primary)",cursor:"pointer",flexShrink:0}}/>
                          {imgUrl
                            ?<img src={imgUrl} alt={item.nome} style={{width:34,height:34,borderRadius:6,objectFit:"cover",flexShrink:0,border:"1px solid var(--border)"}}/>
                            :<div style={{width:34,height:34,borderRadius:6,background:"var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0,opacity:.4}}>{CATEMOJI[categoria]||""}</div>
                          }
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:12,fontWeight:600,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.nome}</div>
                            {item.obs&&<div style={{fontSize:11,color:"var(--text3)",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.obs}</div>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div style={{padding:"12px 16px",borderTop:"1px solid var(--border)",flexShrink:0}}>
          <button onClick={confirm} disabled={totalChecked===0}
            style={{width:"100%",background:"var(--primary)",border:"none",borderRadius:10,padding:"11px",color:"#fff",fontSize:14,fontWeight:700,cursor:totalChecked>0?"pointer":"not-allowed",opacity:totalChecked>0?1:0.45,fontFamily:"inherit",transition:"opacity .15s"}}>
            {totalChecked===0?"Selecione ao menos 1 item":`Adicionar ${totalChecked} item${totalChecked>1?"s":""}`}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── ABA SERVIÇOS — catálogo de serviços ─────────────────────────────────────
function AbaServicos({tenantId,funcoes}){
  const addToast=useToast();
  const[services,setServices]=useState([]);
  const[loading,setLoading]=useState(true);
  const[busca,setBusca]=useState("");
  const[filtroAtivo,setFiltroAtivo]=useState("todos");
  const[form,setForm]=useState(null);
  const[keywords,setKeywords]=useState([]);
  const[roles,setRoles]=useState([]);
  const[novaKw,setNovaKw]=useState("");
  const[saving,setSaving]=useState(false);
  const[confirmar,setConfirmar]=useState(null);
  const[kits,setKits]=useState([]);

  const loadServices=async()=>{
    setLoading(true);
    const{data,error}=await sb.from("services")
      .select("*, service_keywords(id,keyword,origem), service_roles(id,funcao,quantidade,obrigatorio)")
      .eq("tenant_id",tenantId)
      .order("nome");
    if(!error)setServices(data||[]);
    setLoading(false);
  };

  const loadKits=async()=>{
    try{const{data}=await sb.from("template_kits").select("id,nome,categoria").eq("tenant_id",tenantId).order("nome");setKits(data||[]);}catch(e){}
  };

  useEffect(()=>{if(tenantId){loadServices();loadKits();}},[tenantId]);

  const normalizeKw=kw=>kw.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();

  const openNew=()=>{setForm({nome:"",categoria:"outro",duracao_padrao_min:"",template_kit_id:"",ativo:true});setKeywords([]);setRoles([]);setNovaKw("");};

  const openEdit=svc=>{
    setForm({...svc,duracao_padrao_min:svc.duracao_padrao_min??""  ,template_kit_id:svc.template_kit_id??""});
    setKeywords(svc.service_keywords||[]);
    setRoles(svc.service_roles||[]);
    setNovaKw("");
  };

  const cancelForm=()=>{setForm(null);setKeywords([]);setRoles([]);};

  const addKw=()=>{
    const norm=normalizeKw(novaKw);
    if(!norm)return;
    if(keywords.some(k=>k.keyword===norm)){setNovaKw("");return;}
    setKeywords(p=>[...p,{id:"_new_"+Date.now(),keyword:norm,origem:"manual",_new:true}]);
    setNovaKw("");
  };

  const removeKw=id=>setKeywords(p=>p.map(k=>k.id===id?{...k,_delete:true}:k));

  const addRole=()=>{
    const fns=(funcoes||[]);
    const vis=roles.filter(r=>!r._delete);
    const disp=fns.find(f=>!vis.some(r=>r.funcao===f.nome));
    if(!disp)return;
    setRoles(p=>[...p,{id:"_new_"+Date.now(),funcao:disp.nome,quantidade:1,obrigatorio:true,_new:true}]);
  };

  const removeRole=id=>setRoles(p=>p.map(r=>r.id===id?{...r,_delete:true}:r));
  const updateRole=(id,patch)=>setRoles(p=>p.map(r=>r.id===id?{...r,...patch}:r));

  const salvar=async()=>{
    if(!form.nome?.trim()){addToast("Nome é obrigatório","erro");return;}
    setSaving(true);
    try{
      const payload={
        tenant_id:tenantId,
        nome:form.nome.trim(),
        categoria:form.categoria||null,
        duracao_padrao_min:form.duracao_padrao_min?parseInt(form.duracao_padrao_min):null,
        template_kit_id:form.template_kit_id||null,
        ativo:form.ativo,
      };
      let svcId=form.id;
      if(svcId){
        const{error}=await sb.from("services").update({...payload,updated_at:new Date().toISOString()}).eq("id",svcId);
        if(error)throw error;
      }else{
        const{data,error}=await sb.from("services").insert(payload).select().single();
        if(error)throw error;
        svcId=data.id;
      }
      const toDel=keywords.filter(k=>!k._new&&k._delete);
      const toIns=keywords.filter(k=>k._new&&!k._delete);
      if(toDel.length)await sb.from("service_keywords").delete().in("id",toDel.map(k=>k.id));
      if(toIns.length)await sb.from("service_keywords").insert(toIns.map(k=>({service_id:svcId,keyword:k.keyword,origem:k.origem})));
      const toDelR=roles.filter(r=>!r._new&&r._delete);
      const toInsR=roles.filter(r=>r._new&&!r._delete);
      const toUpdR=roles.filter(r=>!r._new&&!r._delete);
      if(toDelR.length)await sb.from("service_roles").delete().in("id",toDelR.map(r=>r.id));
      if(toInsR.length)await sb.from("service_roles").insert(toInsR.map(r=>({service_id:svcId,funcao:r.funcao,quantidade:r.quantidade,obrigatorio:r.obrigatorio})));
      for(const r of toUpdR)await sb.from("service_roles").update({funcao:r.funcao,quantidade:r.quantidade,obrigatorio:r.obrigatorio}).eq("id",r.id);
      addToast(form.id?"Serviço atualizado":"Serviço criado","ok");
      await loadServices();
      setForm(null);
    }catch(e){addToast("Erro ao salvar: "+(e.message||""),"erro");}
    setSaving(false);
  };

  const toggleAtivo=async svc=>{
    await sb.from("services").update({ativo:!svc.ativo}).eq("id",svc.id);
    setServices(p=>p.map(s=>s.id===svc.id?{...s,ativo:!s.ativo}:s));
  };

  const excluir=async id=>{
    const{error}=await sb.from("services").delete().eq("id",id);
    if(!error){setServices(p=>p.filter(s=>s.id!==id));addToast("Serviço removido","ok");}
    setConfirmar(null);
  };

  const CATS=[{id:"personagem",label:"Personagem"},{id:"recreacao",label:"Recreação"},{id:"oficina",label:"Oficina"},{id:"outro",label:"Outro"}];
  const catCor={personagem:"#a855f7",recreacao:"#3b82f6",oficina:"#f59e0b",outro:"#64748b"};

  const filtrado=services
    .filter(s=>filtroAtivo==="ativos"?s.ativo:filtroAtivo==="inativos"?!s.ativo:true)
    .filter(s=>!busca||s.nome.toLowerCase().includes(busca.toLowerCase()));

  const IcnServ=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>;

  if(loading)return <div style={{padding:32,color:"var(--text3)",fontSize:13}}>Carregando...</div>;

  // ── FORM ─────────────────────────────────────────────────────────────────────
  if(form){
    const kwVis=keywords.filter(k=>!k._delete);
    const rolesVis=roles.filter(r=>!r._delete);
    const fns=(funcoes||[]);
    const fnsSemRole=fns.filter(f=>!rolesVis.some(r=>r.funcao===f.nome));
    return(
      <div style={{padding:"24px 28px",flex:1,overflowY:"auto",maxWidth:720}}>
        <button onClick={cancelForm} style={{background:"none",border:"none",color:"var(--text3)",cursor:"pointer",fontFamily:"inherit",fontSize:13,marginBottom:20,display:"flex",alignItems:"center",gap:6,padding:0}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar
        </button>
        <h2 style={{color:"var(--text)",margin:"0 0 24px",fontSize:20,fontWeight:800,letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:28,height:28,borderRadius:8,background:"#0C6E7E",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff"}}><IcnServ/></span>
          {form.id?"Editar serviço":"Novo serviço"}
        </h2>

        <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",padding:20,marginBottom:20}}>
          <div style={{fontWeight:700,color:"var(--text)",fontSize:13,marginBottom:14,textTransform:"uppercase",letterSpacing:"0.06em",opacity:.7}}>Dados básicos</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
            <div style={{gridColumn:"span 2"}}><Inp label="Nome" value={form.nome} onChange={e=>setForm(f=>({...f,nome:e.target.value}))} placeholder="Ex: Animação Infantil"/></div>
            <Sel label="Categoria" value={form.categoria||""} onChange={e=>setForm(f=>({...f,categoria:e.target.value}))}>
              <option value="">Sem categoria</option>
              {CATS.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
            </Sel>
            <Inp label="Duração padrão (min)" type="number" min="0" value={form.duracao_padrao_min} onChange={e=>setForm(f=>({...f,duracao_padrao_min:e.target.value}))} placeholder="Ex: 120"/>
            <div style={{gridColumn:"span 2"}}>
              <Sel label="Kit de checklist padrão" value={form.template_kit_id||""} onChange={e=>setForm(f=>({...f,template_kit_id:e.target.value}))}>
                <option value="">Nenhum</option>
                {kits.map(k=><option key={k.id} value={k.id}>{k.nome} ({k.categoria})</option>)}
              </Sel>
            </div>
          </div>
          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--text2)",fontWeight:500,userSelect:"none"}}>
            <input type="checkbox" checked={!!form.ativo} onChange={e=>setForm(f=>({...f,ativo:e.target.checked}))} style={{width:16,height:16,cursor:"pointer",accentColor:"var(--primary)"}}/>
            Serviço ativo
          </label>
        </div>

        <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",padding:20,marginBottom:20}}>
          <div style={{fontWeight:700,color:"var(--text)",fontSize:13,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em",opacity:.7}}>Palavras-chave</div>
          <div style={{fontSize:11,color:"var(--text3)",marginBottom:14}}>Usadas para reconhecer este serviço em nomes de eventos. Armazenadas normalizadas (sem acento, minúsculas).</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
            {kwVis.map(k=>(
              <span key={k.id} style={{display:"inline-flex",alignItems:"center",gap:5,background:k.origem==="manual"?"var(--primary-light)":"#F0FDF4",border:`1px solid ${k.origem==="manual"?"#bfdbfe":"#bbf7d0"}`,borderRadius:99,padding:"3px 8px 3px 10px",fontSize:12,fontWeight:500,color:k.origem==="manual"?"var(--primary)":"var(--success)"}}>
                {k.keyword}
                <span style={{background:k.origem==="manual"?"#bfdbfe55":"#bbf7d055",borderRadius:99,padding:"0 5px",fontSize:10,fontWeight:700}}>{k.origem==="manual"?"manual":"aprendido"}</span>
                <button onClick={()=>removeKw(k.id)} style={{background:"none",border:"none",cursor:"pointer",color:"inherit",padding:"0 2px",display:"flex",alignItems:"center",opacity:.6,fontSize:14,lineHeight:1}}>&times;</button>
              </span>
            ))}
            {kwVis.length===0&&<span style={{fontSize:12,color:"var(--text3)"}}>Nenhuma palavra-chave</span>}
          </div>
          <div style={{display:"flex",gap:8}}>
            <div style={{flex:1}}><Inp value={novaKw} onChange={e=>setNovaKw(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addKw();}}} placeholder="Adicionar palavra-chave..."/></div>
            <Btn variant="ghost" onClick={addKw} style={{alignSelf:"flex-end"}}>Adicionar</Btn>
          </div>
        </div>

        <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",padding:20,marginBottom:24}}>
          <div style={{fontWeight:700,color:"var(--text)",fontSize:13,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em",opacity:.7}}>Equipe necessária</div>
          <div style={{fontSize:11,color:"var(--text3)",marginBottom:14}}>Funções e quantidades sugeridas ao criar a escala deste serviço.</div>
          {rolesVis.length>0&&(
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
              {rolesVis.map(r=>(
                <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,background:"var(--bg)",borderRadius:8,padding:"8px 12px",border:"1px solid var(--border)"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <select value={r.funcao} onChange={e=>updateRole(r.id,{funcao:e.target.value})} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"5px 8px",color:"var(--text)",fontSize:13,fontFamily:"inherit",width:"100%"}}>
                      {fns.map(f=><option key={f.id} value={f.nome}>{f.nome}</option>)}
                    </select>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                    <label style={{fontSize:11,color:"var(--text3)",whiteSpace:"nowrap"}}>Qtd</label>
                    <input type="number" min="1" value={r.quantidade} onChange={e=>updateRole(r.id,{quantidade:Math.max(1,parseInt(e.target.value)||1)})} style={{width:50,background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"5px 8px",color:"var(--text)",fontSize:13,fontFamily:"inherit",textAlign:"center"}}/>
                  </div>
                  <label style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontSize:12,color:"var(--text2)",whiteSpace:"nowrap",userSelect:"none",flexShrink:0}}>
                    <input type="checkbox" checked={!!r.obrigatorio} onChange={e=>updateRole(r.id,{obrigatorio:e.target.checked})} style={{width:14,height:14,cursor:"pointer",accentColor:"var(--primary)"}}/>
                    Obrig.
                  </label>
                  <button onClick={()=>removeRole(r.id)} style={{background:"#FEF2F255",border:"1px solid #FECACA",borderRadius:6,color:"#DC2626",cursor:"pointer",padding:"4px 8px",fontSize:11,fontFamily:"inherit",flexShrink:0}}>Remover</button>
                </div>
              ))}
            </div>
          )}
          <Btn variant="ghost" small onClick={addRole} style={{opacity:fnsSemRole.length===0?0.4:1}} disabled={fnsSemRole.length===0}>+ Adicionar função</Btn>
        </div>

        <div style={{display:"flex",gap:10,justifyContent:"flex-end",paddingBottom:32}}>
          <Btn variant="ghost" onClick={cancelForm}>Cancelar</Btn>
          <Btn onClick={salvar} disabled={saving}>{saving?"Salvando...":"Salvar serviço"}</Btn>
        </div>
      </div>
    );
  }

  // ── LISTA ─────────────────────────────────────────────────────────────────────
  return(
    <div style={{padding:"24px 28px",flex:1,overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:12,paddingBottom:20,borderBottom:"1px solid var(--border)"}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:20,fontWeight:800,letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:28,height:28,borderRadius:8,background:"#0C6E7E",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff"}}><IcnServ/></span>
            Serviços
          </h2>
          <p style={{color:"var(--text3)",margin:"4px 0 0 36px",fontSize:12,fontWeight:500}}>Catálogo para reconhecimento de eventos e sugestão de escala</p>
        </div>
        <Btn onClick={openNew}>+ Novo serviço</Btn>
      </div>

      <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{flex:1,minWidth:180}}><Inp value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar serviço..."/></div>
        <div style={{display:"flex",gap:6}}>
          {[["todos","Todos"],["ativos","Ativos"],["inativos","Inativos"]].map(([v,l])=>(
            <button key={v} onClick={()=>setFiltroAtivo(v)} style={{padding:"6px 14px",borderRadius:8,border:`1px solid ${filtroAtivo===v?"var(--primary)":"var(--border)"}`,background:filtroAtivo===v?"var(--primary-light)":"var(--card)",color:filtroAtivo===v?"var(--primary)":"var(--text2)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
          ))}
        </div>
      </div>

      {filtrado.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px",color:"var(--text3)"}}>
          <div style={{marginBottom:10,opacity:.35,display:"flex",justifyContent:"center"}}><IcnServ/></div>
          <div style={{fontSize:13}}>Nenhum serviço encontrado</div>
          {!busca&&filtroAtivo==="todos"&&<div style={{marginTop:14}}><Btn onClick={openNew}>+ Criar primeiro serviço</Btn></div>}
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
          {filtrado.map(svc=>{
            const kwCount=(svc.service_keywords||[]).length;
            const roleCount=(svc.service_roles||[]).length;
            const cor=catCor[svc.categoria]||catCor.outro;
            return(
              <Card key={svc.id} style={{opacity:svc.ativo?1:0.58}}>
                <div style={{marginBottom:10}}>
                  <div style={{fontWeight:700,color:"var(--text)",fontSize:15,marginBottom:6,wordBreak:"break-word"}}>{svc.nome}</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {svc.categoria&&<span style={{background:cor+"18",color:cor,border:`1px solid ${cor}44`,borderRadius:99,fontSize:10,fontWeight:700,padding:"2px 8px"}}>{CATS.find(c=>c.id===svc.categoria)?.label||svc.categoria}</span>}
                    <span style={{background:svc.ativo?"var(--success-light)":"#F1F5F9",color:svc.ativo?"var(--success)":"var(--text3)",border:`1px solid ${svc.ativo?"#bbf7d0":"var(--border)"}`,borderRadius:99,fontSize:10,fontWeight:700,padding:"2px 8px"}}>{svc.ativo?"Ativo":"Inativo"}</span>
                  </div>
                </div>
                <div style={{display:"flex",gap:14,marginBottom:14,fontSize:11,color:"var(--text3)"}}>
                  <span>{kwCount} palavra{kwCount!==1?"s":""}-chave</span>
                  <span>{roleCount} função{roleCount!==1?"ões":""}</span>
                  {svc.duracao_padrao_min?<span>{svc.duracao_padrao_min} min</span>:null}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <Btn small variant="ghost" style={{flex:1,justifyContent:"center"}} onClick={()=>openEdit(svc)}>Editar</Btn>
                  <Btn small variant={svc.ativo?"ghost":"success"} onClick={()=>toggleAtivo(svc)}>{svc.ativo?"Desativar":"Ativar"}</Btn>
                  <Btn small variant="danger" onClick={()=>setConfirmar(svc)}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                  </Btn>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      <ConfirmDelete
        open={!!confirmar}
        onClose={()=>setConfirmar(null)}
        onConfirm={()=>excluir(confirmar.id)}
        titulo={`Excluir "${confirmar?.nome}"?`}
        descricao="Remove o serviço e todas as suas palavras-chave e funções. Eventos existentes não são afetados."
      />
    </div>
  );
}

// ── ABA TRIAGEM — revisão de reconhecimento automático de serviços ────────────
function AbaTriagem({tenantId,onSugerirEscala}){
  const[eventos,setEventos]=React.useState([]);
  const[servicos,setServicos]=React.useState([]);
  const[loading,setLoading]=React.useState(true);
  const[saving,setSaving]=React.useState(null); // eventId being saved
  const[criarModal,setCriarModal]=React.useState(null); // {eventId, blocoIdx, nomeBruto}
  const[novoNome,setNovoNome]=React.useState('');
  const[confirmadoRecente,setConfirmadoRecente]=React.useState(null); // {id,nome} post-confirm banner
  // Per-event local overrides: {[eventId]: {[blocoIdx]: serviceId|null}}
  const[sel,setSel]=React.useState({});
  const addToast=useToast();

  const carregar=React.useCallback(async()=>{
    setLoading(true);
    try{
      const[{data:evs},{data:svcs}]=await Promise.all([
        sb.from('events').select('id,nome,data,hora_inicio,hora_fim,titulo_original,cliente,triagem_status')
          .eq('tenant_id',tenantId).in('triagem_status',['pendente','nao_identificado']).order('data',{ascending:true}).limit(200),
        sb.from('services').select('id,nome').eq('tenant_id',tenantId).eq('ativo',true).order('nome'),
      ]);
      const evIds=(evs||[]).map(e=>e.id);
      let svcRows=[];
      if(evIds.length>0){
        const{data:sr}=await sb.from('event_services').select('id,event_id,service_id,nome_bruto,duracao_min,ordem').in('event_id',evIds).order('ordem');
        svcRows=sr||[];
      }
      const svcByEvent={};
      for(const r of svcRows){
        if(!svcByEvent[r.event_id])svcByEvent[r.event_id]=[];
        svcByEvent[r.event_id].push(r);
      }
      setEventos((evs||[]).map(e=>({...e,blocos:(svcByEvent[e.id]||[]).sort((a,b)=>a.ordem-b.ordem)})));
      setServicos(svcs||[]);
    }catch(e){addToast('Erro ao carregar triagem: '+e.message,'erro');}
    setLoading(false);
  },[tenantId]);

  React.useEffect(()=>{carregar();},[carregar]);

  const getServiceId=(eventId,blocoIdx,defaultId)=>{
    return sel[eventId]?.[blocoIdx]!==undefined?sel[eventId]?.[blocoIdx]:defaultId;
  };
  const setSvcSel=(eventId,blocoIdx,serviceId)=>{
    setSel(s=>({...s,[eventId]:{...s[eventId],[blocoIdx]:serviceId}}));
  };

  const confirmar=async(ev)=>{
    setSaving(ev.id);
    try{
      // Aplicar seleções do usuário nos blocos
      const blocos=ev.blocos;
      for(let i=0;i<blocos.length;i++){
        const chosenId=getServiceId(ev.id,i,blocos[i].service_id);
        if(chosenId!==blocos[i].service_id){
          // Atualizar event_services
          await sb.from('event_services').update({service_id:chosenId}).eq('id',blocos[i].id);
          // Aprender keyword
          if(chosenId&&blocos[i].nome_bruto){
            const kw=_sfNormNome(blocos[i].nome_bruto);
            if(kw.length>=2){
              await sb.from('service_keywords').upsert({service_id:chosenId,keyword:kw,origem:'aprendido'},{onConflict:'service_id,keyword',ignoreDuplicates:true});
            }
          }
          // Aplicar kit
          await _sfAplicarKit(tenantId,ev.id,chosenId);
        }
      }
      await sb.from('events').update({triagem_status:'confirmado'}).eq('id',ev.id).eq('tenant_id',tenantId);
      addToast('Evento confirmado','ok');
      setConfirmadoRecente({id:ev.id,nome:ev.titulo_original||ev.nome});
      setEventos(prev=>prev.filter(e=>e.id!==ev.id));
    }catch(e){addToast('Erro: '+e.message,'erro');}
    setSaving(null);
  };

  const criarServico=async()=>{
    if(!novoNome.trim()||!criarModal)return;
    try{
      const{data:svc,error}=await sb.from('services').insert({tenant_id:tenantId,nome:novoNome.trim()}).select('id,nome').single();
      if(error)throw new Error(error.message);
      const kw=_sfNormNome(novoNome.trim());
      if(kw.length>=2)await sb.from('service_keywords').insert({service_id:svc.id,keyword:kw,origem:'manual'});
      setServicos(s=>[...s,svc].sort((a,b)=>a.nome.localeCompare(b.nome)));
      setSvcSel(criarModal.eventId,criarModal.blocoIdx,svc.id);
      addToast(`Serviço "${svc.nome}" criado`,'ok');
      setCriarModal(null);setNovoNome('');
    }catch(e){addToast('Erro: '+e.message,'erro');}
  };

  const fmtD=d=>{if(!d)return'';const[y,m,dv]=d.split('-');return`${dv}/${m}/${y}`;};

  if(loading)return<div style={{padding:'40px 28px',color:'var(--text3)',fontSize:14}}>Carregando triagem…</div>;

  return(
    <div style={{padding:'24px 28px',flex:1,overflowY:'auto'}}>
      <div style={{marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
        <div>
          <h2 style={{color:'var(--text)',margin:'0 0 2px',fontSize:18,fontWeight:600}}>Triagem de Eventos</h2>
          <p style={{color:'var(--text2)',margin:0,fontSize:13}}>{eventos.length} evento{eventos.length!==1?'s':''} pendente{eventos.length!==1?'s':''} de revisão</p>
        </div>
        <button onClick={carregar} style={{background:'transparent',border:'1px solid var(--border)',borderRadius:8,padding:'7px 14px',fontSize:12,color:'var(--text2)',cursor:'pointer',fontFamily:'inherit'}}>↻ Atualizar</button>
      </div>
      {confirmadoRecente&&(
        <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:10,padding:'10px 14px',marginBottom:14,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16A34A" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span style={{fontSize:13,color:'#15803D',fontWeight:600,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>Confirmado: {confirmadoRecente.nome}</span>
          {onSugerirEscala&&<button onClick={()=>onSugerirEscala(confirmadoRecente.id)} style={{background:'#15803D',color:'#fff',border:'none',borderRadius:7,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:5}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Sugerir escala
          </button>}
          <button onClick={()=>setConfirmadoRecente(null)} style={{background:'transparent',border:'none',color:'#16A34A',cursor:'pointer',fontSize:16,padding:0,lineHeight:1,opacity:0.7}}>×</button>
        </div>
      )}
      {eventos.length===0&&<div style={{textAlign:'center',color:'var(--text3)',padding:'48px 0',fontSize:14}}>Nenhum evento pendente de triagem.</div>}
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {eventos.map(ev=>(
          <div key={ev.id} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,overflow:'hidden'}}>
            {/* Header do evento */}
            <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:700,color:'var(--text)',fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.titulo_original||ev.nome}</div>
                <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
                  {fmtD(ev.data)}{ev.hora_inicio?' · '+ev.hora_inicio.slice(0,5):''}
                  {ev.cliente&&<span style={{marginLeft:8,color:'var(--text3)'}}>— {ev.cliente}</span>}
                </div>
              </div>
              <span style={{fontSize:11,fontWeight:600,padding:'3px 9px',borderRadius:6,flexShrink:0,
                background:ev.triagem_status==='nao_identificado'?'#FEF3C7':'#EFF6FF',
                color:ev.triagem_status==='nao_identificado'?'#92400E':'#1D4ED8'}}>
                {ev.triagem_status==='nao_identificado'?'Não identificado':'Pendente'}
              </span>
            </div>
            {/* Blocos de serviço */}
            <div style={{padding:'12px 16px',display:'flex',flexDirection:'column',gap:8}}>
              {ev.blocos.length===0&&<div style={{fontSize:13,color:'var(--text3)'}}>Título sem blocos de serviço reconhecíveis.</div>}
              {ev.blocos.map((b,i)=>{
                const chosen=getServiceId(ev.id,i,b.service_id);
                return(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                    <span style={{fontSize:12,color:'var(--text2)',minWidth:0,flex:'0 0 auto',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={b.nome_bruto}>
                      {b.nome_bruto}
                    </span>
                    {b.duracao_min&&<span style={{fontSize:11,color:'var(--text3)',flexShrink:0}}>{b.duracao_min}min</span>}
                    <span style={{color:'var(--text3)',fontSize:11,flexShrink:0}}>→</span>
                    <select value={chosen||''} onChange={e=>setSvcSel(ev.id,i,e.target.value||null)}
                      style={{flex:1,minWidth:120,border:'1px solid var(--border)',borderRadius:7,padding:'5px 8px',fontSize:12,color:'var(--text)',background:'var(--bg)',fontFamily:'inherit',cursor:'pointer'}}>
                      <option value=''>— Não identificado —</option>
                      {servicos.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
                    </select>
                    <button onClick={()=>{setCriarModal({eventId:ev.id,blocoIdx:i,nomeBruto:b.nome_bruto});setNovoNome(b.nome_bruto||'');}}
                      style={{flexShrink:0,background:'transparent',border:'1px solid var(--border)',borderRadius:7,padding:'5px 9px',fontSize:11,color:'var(--text2)',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>
                      + Criar
                    </button>
                  </div>
                );
              })}
            </div>
            {/* Rodapé */}
            <div style={{padding:'10px 16px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'flex-end'}}>
              <button onClick={()=>confirmar(ev)} disabled={saving===ev.id}
                style={{background:'#0C6E7E',border:'none',borderRadius:8,padding:'7px 20px',fontSize:13,fontWeight:700,color:'#fff',cursor:saving===ev.id?'default':'pointer',fontFamily:'inherit',opacity:saving===ev.id?0.7:1}}>
                {saving===ev.id?'Salvando…':'✓ Confirmar'}
              </button>
            </div>
          </div>
        ))}
      </div>
      {/* Mini-modal criar serviço */}
      {criarModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={e=>e.target===e.currentTarget&&setCriarModal(null)}>
          <div style={{background:'var(--card)',borderRadius:14,padding:24,width:'100%',maxWidth:380,boxShadow:'0 16px 48px rgba(0,0,0,.3)'}}>
            <div style={{fontWeight:700,fontSize:16,color:'var(--text)',marginBottom:4}}>Criar serviço</div>
            <div style={{fontSize:12,color:'var(--text2)',marginBottom:14}}>Bloco: <em>{criarModal.nomeBruto}</em></div>
            <input value={novoNome} onChange={e=>setNovoNome(e.target.value)} placeholder="Nome do serviço"
              style={{width:'100%',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px',fontSize:13,color:'var(--text)',background:'var(--bg)',fontFamily:'inherit',boxSizing:'border-box',marginBottom:14}}
              onKeyDown={e=>e.key==='Enter'&&criarServico()}/>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button onClick={()=>setCriarModal(null)} style={{background:'transparent',border:'1px solid var(--border)',borderRadius:8,padding:'7px 16px',fontSize:13,color:'var(--text2)',cursor:'pointer',fontFamily:'inherit'}}>Cancelar</button>
              <button onClick={criarServico} disabled={!novoNome.trim()} style={{background:'#0C6E7E',border:'none',borderRadius:8,padding:'7px 18px',fontSize:13,fontWeight:700,color:'#fff',cursor:novoNome.trim()?'pointer':'default',fontFamily:'inherit',opacity:novoNome.trim()?1:0.5}}>Criar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ABA MODELOS — biblioteca de kits reutilizáveis ───────────────────────────
function AbaModelos({tenantId}){
  const[kits,setKits]=useState([]);
  const[loading,setLoading]=useState(true);
  const[imgUrls,setImgUrls]=useState({});
  const[subAba,setSubAba]=useState("material");
  const[busca,setBusca]=useState("");
  const[viewKitId,setViewKitId]=useState(null);
  // Kit modal
  const[kitModal,setKitModal]=useState(null);
  const[kitImgFile,setKitImgFile]=useState(null);
  const[kitImgPreview,setKitImgPreview]=useState(null);
  const[kitRemoveImg,setKitRemoveImg]=useState(false);
  const[savingKit,setSavingKit]=useState(false);
  const[confirmaKit,setConfirmaKit]=useState(null);
  // Item modal
  const[itemModal,setItemModal]=useState(null);
  const[itemImgFile,setItemImgFile]=useState(null);
  const[itemImgPreview,setItemImgPreview]=useState(null);
  const[itemRemoveImg,setItemRemoveImg]=useState(false);
  const[savingItem,setSavingItem]=useState(false);
  const[confirmaItem,setConfirmaItem]=useState(null);
  const[lightbox,setLightbox]=useState(null);

  const CATS=[
    {id:"material",label:"Material"},
    {id:"figurino",label:"Figurino"},
    {id:"checklist",label:"Checklist"},
  ];
  const CATEMOJI={material:"",figurino:"",checklist:""};

  const resolveImgs=async paths=>{
    if(!paths.length)return{};
    const urlMap={};
    await Promise.all(paths.map(async p=>{
      try{const{data}=await sb.storage.from("catalog-images").createSignedUrl(p,3600);if(data?.signedUrl)urlMap[p]=data.signedUrl;}catch(e){}
    }));
    return urlMap;
  };

  const load=async()=>{
    setLoading(true);
    const{data:kitsRaw}=await sb.from("template_kits").select("*").eq("tenant_id",tenantId).order("created_at");
    const{data:itemsRaw}=await sb.from("template_kit_items").select("*").eq("tenant_id",tenantId).order("ordem").order("created_at");
    const built=(kitsRaw||[]).map(k=>({...k,items:(itemsRaw||[]).filter(i=>i.kit_id===k.id)}));
    setKits(built);
    const allPaths=[...new Set([
      ...(kitsRaw||[]).filter(k=>k.capa_image_path).map(k=>k.capa_image_path),
      ...(itemsRaw||[]).filter(i=>i.image_path).map(i=>i.image_path),
    ])];
    setImgUrls(await resolveImgs(allPaths));
    _kitCache.delete(tenantId);
    setLoading(false);
  };
  useEffect(()=>{if(tenantId)load();},[tenantId]);

  const viewKit=viewKitId?kits.find(k=>k.id===viewKitId):null;

  // ── Kit CRUD ──────────────────────────────────────────────────────────────
  const openNewKit=()=>{setKitModal({nome:"",descricao:"",categoria:subAba,capa_image_path:null});setKitImgFile(null);setKitImgPreview(null);setKitRemoveImg(false);};
  const openEditKit=kit=>{setKitModal({...kit});setKitImgFile(null);setKitImgPreview(kit.capa_image_path&&imgUrls[kit.capa_image_path]?imgUrls[kit.capa_image_path]:null);setKitRemoveImg(false);};
  const handleKitImgFile=e=>{
    const f=e.target.files?.[0];if(!f)return;
    setKitImgFile(f);setKitRemoveImg(false);
    const r=new FileReader();r.onload=ev=>setKitImgPreview(ev.target.result);r.readAsDataURL(f);e.target.value="";
  };
  const saveKit=async()=>{
    if(!kitModal?.nome?.trim()){window.alert("Nome obrigatório.");return;}
    setSavingKit(true);
    try{
      const isNew=!kitModal.id;
      let capa_image_path=kitModal.capa_image_path||null;
      if(isNew){
        const{data:created,error}=await sb.from("template_kits").insert({
          tenant_id:tenantId,categoria:kitModal.categoria,nome:kitModal.nome.trim(),
          descricao:kitModal.descricao?.trim()||null,capa_image_path:null,
        }).select().single();
        if(error)throw error;
        if(kitImgFile){
          const blob=await compressImage(kitImgFile);
          const path=`${tenantId}/kits/${created.id}.webp`;
          const{error:upErr}=await sb.storage.from("catalog-images").upload(path,blob,{contentType:"image/webp",upsert:true});
          if(!upErr){
            capa_image_path=path;
            await sb.from("template_kits").update({capa_image_path:path}).eq("id",created.id);
            const{data:ud}=await sb.storage.from("catalog-images").createSignedUrl(path,3600);
            if(ud?.signedUrl)setImgUrls(p=>({...p,[path]:ud.signedUrl}));
          }
        }
        setKits(p=>[...p,{...created,capa_image_path,items:[]}]);
      }else{
        if(kitImgFile){
          const blob=await compressImage(kitImgFile);
          const path=`${tenantId}/kits/${kitModal.id}.webp`;
          await sb.storage.from("catalog-images").upload(path,blob,{contentType:"image/webp",upsert:true});
          capa_image_path=path;
          const{data:ud}=await sb.storage.from("catalog-images").createSignedUrl(path,3600);
          if(ud?.signedUrl)setImgUrls(p=>({...p,[path]:ud.signedUrl}));
        }else if(kitRemoveImg&&kitModal.capa_image_path){
          try{await sb.storage.from("catalog-images").remove([kitModal.capa_image_path]);}catch(e){}
          setImgUrls(p=>{const n={...p};delete n[kitModal.capa_image_path];return n;});
          capa_image_path=null;
        }
        const{data:updated,error}=await sb.from("template_kits").update({
          nome:kitModal.nome.trim(),descricao:kitModal.descricao?.trim()||null,capa_image_path,
        }).eq("id",kitModal.id).select().single();
        if(error)throw error;
        setKits(p=>p.map(k=>k.id===kitModal.id?{...k,...updated}:k));
      }
      _kitCache.delete(tenantId);
      setKitModal(null);setKitImgFile(null);setKitImgPreview(null);setKitRemoveImg(false);
    }catch(err){window.alert("Erro ao salvar kit: "+(err.message||String(err)));}
    setSavingKit(false);
  };
  const doExcluirKit=async kit=>{
    setConfirmaKit(null);
    if(kit.capa_image_path)try{await sb.storage.from("catalog-images").remove([kit.capa_image_path]);}catch(e){}
    const itemPaths=kit.items.filter(i=>i.image_path).map(i=>i.image_path);
    if(itemPaths.length)try{await sb.storage.from("catalog-images").remove(itemPaths);}catch(e){}
    await sb.from("template_kits").delete().eq("id",kit.id);
    setKits(p=>p.filter(k=>k.id!==kit.id));
    if(viewKitId===kit.id)setViewKitId(null);
    setImgUrls(p=>{const n={...p};if(kit.capa_image_path)delete n[kit.capa_image_path];itemPaths.forEach(pp=>delete n[pp]);return n;});
    _kitCache.delete(tenantId);
  };

  // ── Item CRUD ─────────────────────────────────────────────────────────────
  const openNewItem=kit=>{setItemModal({kit_id:kit.id,nome:"",obs:"",image_path:null,ordem:kit.items.length});setItemImgFile(null);setItemImgPreview(null);setItemRemoveImg(false);};
  const openEditItem=item=>{setItemModal({...item});setItemImgFile(null);setItemImgPreview(item.image_path&&imgUrls[item.image_path]?imgUrls[item.image_path]:null);setItemRemoveImg(false);};
  const handleItemImgFile=e=>{
    const f=e.target.files?.[0];if(!f)return;
    setItemImgFile(f);setItemRemoveImg(false);
    const r=new FileReader();r.onload=ev=>setItemImgPreview(ev.target.result);r.readAsDataURL(f);e.target.value="";
  };
  const saveItem=async()=>{
    if(!itemModal?.nome?.trim()){window.alert("Nome obrigatório.");return;}
    setSavingItem(true);
    try{
      const isNew=!itemModal.id;
      let image_path=itemModal.image_path||null;
      if(isNew){
        const{data:created,error}=await sb.from("template_kit_items").insert({
          kit_id:itemModal.kit_id,tenant_id:tenantId,nome:itemModal.nome.trim(),
          obs:itemModal.obs?.trim()||null,image_path:null,ordem:itemModal.ordem,
        }).select().single();
        if(error)throw error;
        if(itemImgFile){
          const blob=await compressImage(itemImgFile);
          const path=`${tenantId}/items/${created.id}.webp`;
          const{error:upErr}=await sb.storage.from("catalog-images").upload(path,blob,{contentType:"image/webp",upsert:true});
          if(!upErr){
            image_path=path;
            await sb.from("template_kit_items").update({image_path:path}).eq("id",created.id);
            const{data:ud}=await sb.storage.from("catalog-images").createSignedUrl(path,3600);
            if(ud?.signedUrl)setImgUrls(pp=>({...pp,[path]:ud.signedUrl}));
          }
        }
        setKits(p=>p.map(k=>k.id===itemModal.kit_id?{...k,items:[...k.items,{...created,image_path}]}:k));
      }else{
        if(itemImgFile){
          const blob=await compressImage(itemImgFile);
          const path=`${tenantId}/items/${itemModal.id}.webp`;
          await sb.storage.from("catalog-images").upload(path,blob,{contentType:"image/webp",upsert:true});
          image_path=path;
          const{data:ud}=await sb.storage.from("catalog-images").createSignedUrl(path,3600);
          if(ud?.signedUrl)setImgUrls(pp=>({...pp,[path]:ud.signedUrl}));
        }else if(itemRemoveImg&&itemModal.image_path){
          try{await sb.storage.from("catalog-images").remove([itemModal.image_path]);}catch(e){}
          setImgUrls(pp=>{const n={...pp};delete n[itemModal.image_path];return n;});
          image_path=null;
        }
        const{data:updated,error}=await sb.from("template_kit_items").update({
          nome:itemModal.nome.trim(),obs:itemModal.obs?.trim()||null,image_path,
        }).eq("id",itemModal.id).select().single();
        if(error)throw error;
        setKits(p=>p.map(k=>({...k,items:k.items.map(i=>i.id===itemModal.id?updated:i)})));
      }
      _kitCache.delete(tenantId);
      setItemModal(null);setItemImgFile(null);setItemImgPreview(null);setItemRemoveImg(false);
    }catch(err){window.alert("Erro ao salvar item: "+(err.message||String(err)));}
    setSavingItem(false);
  };
  const doExcluirItem=async item=>{
    setConfirmaItem(null);
    if(item.image_path)try{await sb.storage.from("catalog-images").remove([item.image_path]);}catch(e){}
    await sb.from("template_kit_items").delete().eq("id",item.id);
    setKits(p=>p.map(k=>({...k,items:k.items.filter(i=>i.id!==item.id)})));
    setImgUrls(p=>{if(!item.image_path)return p;const n={...p};delete n[item.image_path];return n;});
    _kitCache.delete(tenantId);
  };
  const moveItem=async(item,dir)=>{
    const kit=kits.find(k=>k.id===item.kit_id);if(!kit)return;
    const idx=kit.items.findIndex(i=>i.id===item.id);
    const newIdx=idx+dir;
    if(newIdx<0||newIdx>=kit.items.length)return;
    const updated=[...kit.items];
    [updated[idx],updated[newIdx]]=[updated[newIdx],updated[idx]];
    await Promise.all([
      sb.from("template_kit_items").update({ordem:newIdx}).eq("id",updated[newIdx].id),
      sb.from("template_kit_items").update({ordem:idx}).eq("id",updated[idx].id),
    ]);
    updated[idx]={...updated[idx],ordem:idx};
    updated[newIdx]={...updated[newIdx],ordem:newIdx};
    setKits(p=>p.map(k=>k.id===item.kit_id?{...k,items:updated}:k));
    _kitCache.delete(tenantId);
  };

  if(loading)return(
    <div style={{padding:"40px 16px",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text3)",fontSize:14}}>Carregando kits...</div>
  );

  const visibleKits=kits.filter(k=>k.categoria===subAba&&(!busca||k.nome.toLowerCase().includes(busca.toLowerCase())||k.items.some(i=>i.nome.toLowerCase().includes(busca.toLowerCase()))));

  // Modais reutilizados em grid e detail view
  const kitFormModal=kitModal&&(
    <div onClick={()=>!savingKit&&setKitModal(null)} style={{position:"fixed",inset:0,background:"#000000c0",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",borderRadius:16,width:"100%",maxWidth:440,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,.4)"}}>
        <div style={{padding:"18px 20px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontWeight:700,fontSize:16,color:"var(--text)"}}>{kitModal.id?"Editar kit":"Novo kit"}</div>
          <button onClick={()=>!savingKit&&setKitModal(null)} style={{background:"transparent",border:"none",cursor:"pointer",fontSize:20,color:"var(--text3)",padding:"0 4px",lineHeight:1,fontFamily:"inherit"}}>×</button>
        </div>
        <div style={{padding:"18px 20px",display:"flex",flexDirection:"column",gap:14}}>
          {!kitModal.id&&(
            <div>
              <label style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:8}}>Categoria</label>
              <div style={{display:"flex",gap:8}}>
                {CATS.map(c=>(
                  <button key={c.id} onClick={()=>setKitModal(p=>({...p,categoria:c.id}))}
                    style={{flex:1,padding:"7px 4px",borderRadius:8,border:`1px solid ${kitModal.categoria===c.id?"var(--primary)":"var(--border)"}`,background:kitModal.categoria===c.id?"var(--primary)":"var(--bg)",color:kitModal.categoria===c.id?"#fff":"var(--text2)",fontSize:12,fontWeight:kitModal.categoria===c.id?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                    {c.emoji}<br/><span style={{fontSize:10}}>{c.label}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
          <div>
            <label style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>Nome do kit *</label>
            <input value={kitModal.nome||""} onChange={e=>setKitModal(p=>({...p,nome:e.target.value}))}
              placeholder="Ex: Animação Gui, Kit Cinderela"
              style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 12px",fontSize:13,color:"var(--text)",fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>Descrição</label>
            <textarea value={kitModal.descricao||""} onChange={e=>setKitModal(p=>({...p,descricao:e.target.value}))}
              placeholder="Ex: Kit completo para animação infantil 4h" rows={2}
              style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 12px",fontSize:13,color:"var(--text)",fontFamily:"inherit",outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:8}}>Foto de capa</label>
            {kitImgPreview&&!kitRemoveImg?(
              <div style={{position:"relative",display:"inline-block",marginBottom:8}}>
                <img src={kitImgPreview} alt="preview" style={{width:120,height:90,objectFit:"cover",borderRadius:8,border:"1px solid var(--border)",display:"block"}}/>
                <button onClick={()=>{setKitRemoveImg(true);setKitImgPreview(null);setKitImgFile(null);}}
                  style={{position:"absolute",top:-8,right:-8,background:"#EF4444",border:"none",borderRadius:"50%",width:22,height:22,color:"#fff",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit",lineHeight:1}}>×</button>
              </div>
            ):(
              <label style={{display:"inline-flex",alignItems:"center",gap:6,background:"var(--bg)",border:"1px dashed var(--border)",borderRadius:8,padding:"8px 14px",fontSize:12,cursor:"pointer",color:"var(--text2)",userSelect:"none"}}>

// ── ABA ANEXOS (seção dentro do painel de detalhe do evento) ──────────────────
function AbaAnexos({eventId,eventDate,tenantId}){
  const[atts,setAtts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[uploading,setUploading]=useState(false);
  const[lightbox,setLightbox]=useState(null);

  const load=async()=>{
    setLoading(true);
    const{data}=await sb.from("event_attachments").select("*").eq("event_id",String(eventId)).order("created_at",{ascending:true});
    setAtts(data||[]);
    setLoading(false);
  };
  useEffect(()=>{if(eventId)load();},[eventId]);

  const compress=file=>new Promise(resolve=>{
    const img=new Image();
    const burl=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1600;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(burl);
      const mt=file.type==="image/png"?"image/png":"image/webp";
      c.toBlob(b=>resolve(b),mt,0.8);
    };
    img.onerror=()=>{URL.revokeObjectURL(burl);resolve(file);};
    img.src=burl;
  });

  const handleFiles=async e=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length)return;
    setUploading(true);
    for(const file of files){
      try{
        const blob=await compress(file);
        const ext=file.type==="image/png"?"png":"webp";
        const uid=Date.now()+"-"+Math.random().toString(36).slice(2,8);
        const path=`${tenantId}/${eventId}/${uid}.${ext}`;
        const{error:upErr}=await sb.storage.from("event-attachments").upload(path,blob,{contentType:blob.type});
        if(upErr)throw upErr;
        await sb.from("event_attachments").insert({tenant_id:tenantId,event_id:String(eventId),event_date:eventDate,storage_path:path,file_name:file.name,uploaded_by:"admin"});
      }catch(err){console.error("upload:",err);window.alert("Erro ao enviar "+file.name+": "+(err.message||String(err)));}
    }
    await load();
    setUploading(false);
    e.target.value="";
  };

  const handleDelete=async att=>{
    if(!window.confirm(`Excluir "${att.file_name}"?`))return;
    await sb.storage.from("event-attachments").remove([att.storage_path]);
    await sb.from("event_attachments").delete().eq("id",att.id);
    setAtts(prev=>prev.filter(a=>a.id!==att.id));
  };

  return(
    <div style={{marginTop:16,paddingTop:16,borderTop:"1px solid var(--border)"}}>
      <div style={{fontWeight:700,color:"var(--text)",fontSize:14,marginBottom:10}}> Fotos e Anexos{atts.length>0&&<span style={{color:"var(--text3)",fontWeight:400,fontSize:12}}> ({atts.length})</span>}</div>
      <label style={{display:"inline-flex",alignItems:"center",gap:6,background:uploading?"var(--border)":"var(--primary)",color:uploading?"var(--text3)":"#fff",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:uploading?"not-allowed":"pointer",marginBottom:12,userSelect:"none",transition:"background .15s"}}>
        {uploading?"Enviando...":" Adicionar Fotos"}
        <input type="file" accept="image/jpeg,image/png,image/webp" multiple style={{display:"none"}} onChange={handleFiles} disabled={uploading}/>
      </label>
      {loading
        ?<div style={{color:"var(--text3)",fontSize:12,padding:"8px 0"}}>Carregando...</div>
        :atts.length===0
          ?<div style={{color:"var(--text3)",fontSize:12,textAlign:"center",padding:"10px 0",background:"var(--card)",borderRadius:8}}>Nenhuma foto anexada ainda</div>
          :<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            {atts.map(a=><ThumbnailCard key={a.id} att={a} onOpen={(url,name)=>setLightbox({url,name})} onDelete={handleDelete}/>)}
          </div>
      }
      {lightbox&&(
        <div onClick={()=>setLightbox(null)} style={{position:"fixed",inset:0,background:"#000000d4",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{position:"relative",maxWidth:"90vw",maxHeight:"90vh"}}>
            <img src={lightbox.url} alt={lightbox.name} style={{maxWidth:"100%",maxHeight:"85vh",borderRadius:8,objectFit:"contain",display:"block"}}/>
            <button onClick={()=>setLightbox(null)} style={{position:"absolute",top:-14,right:-14,background:"#fff",border:"none",borderRadius:"50%",width:28,height:28,fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit",color:"#111"}}>×</button>
            <div style={{marginTop:8,textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.6)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{lightbox.name}</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── CHECKLIST PAGE — visão consolidada de checklists/materiais/figurinos ──────
function ChecklistPage({eventos,tenantId}){
  const hoje=localDateStr();
  const[aberto,setAberto]=useState(null);
  const[filtro,setFiltro]=useState("todos");
  const evFuturos=[...eventos]
    .filter(e=>e.data>=hoje)
    .sort((a,b)=>a.data.localeCompare(b.data)||(a.horaInicio||"").localeCompare(b.horaInicio||""));
  const evPassados=[...eventos]
    .filter(e=>e.data<hoje)
    .sort((a,b)=>b.data.localeCompare(a.data));
  const evLista=filtro==="passados"?evPassados:evFuturos;
  const fmtBR=d=>{if(!d)return"";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;};
  if(eventos.length===0)return(
    <div style={{padding:"40px 28px",textAlign:"center",color:"var(--text3)",fontSize:14}}>
      Nenhum evento cadastrado ainda.
    </div>
  );
  return(
    <div style={{padding:"24px 28px",flex:1,overflowY:"auto"}}>

  );
}

// ── PAINEL SUGESTÃO DE ESCALA ─────────────────────────────────────────────────
function PainelSugestaoEscala({loading,data,sel,setSel,expandido,setExpandido,aplicando,novos,enviarConfNow,setEnviarConfNow,ev,onAplicar,onClose,waEscala}){
  if(loading)return(
    <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:16,marginBottom:12,textAlign:"center",color:"var(--text3)",fontSize:13}}>Buscando sugestões…</div>
  );

  const vagas=data.vagas||[];
  const jaNoTime=fid=>(ev.equipe||[]).some(m=>String(m.freelancerId)===String(fid));
  const temParaAplicar=Object.entries(sel).some(([,fid])=>!jaNoTime(fid));
  return(
    <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:14,marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontWeight:700,color:"#1D4ED8",fontSize:13,display:"flex",alignItems:"center",gap:5}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

        </span>

      {vagas.length===0&&<div style={{fontSize:12,color:"var(--text3)",textAlign:"center",padding:"8px 0"}}>Nenhuma vaga mapeada para este evento.</div>}
      {vagas.map((vaga,vi)=>(
        <div key={vi} style={{marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",color:"var(--text2)",marginBottom:5}}>

            <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:7,padding:"7px 10px",marginBottom:5,fontSize:12,color:"#92400E",display:"flex",alignItems:"flex-start",gap:6}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,marginTop:1}}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              {vaga.semSugestao}
            </div>
          )}
          {Array.from({length:vaga.quantidade},(_,si)=>{
            const key=`${vi}_${si}`;
            const cand=vaga.sugeridos?.[si];
            if(!cand)return(
              <div key={si} style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:7,padding:"7px 10px",marginBottom:4,fontSize:12,color:"var(--danger)"}}>Vaga sem sugestão disponível</div>
            );
            const selFid=sel[key]!==undefined?sel[key]:cand.freelancerId;
            const selCand=vaga.candidatos?.find(c=>c.freelancerId===selFid)||cand;
            const jaEscalado=jaNoTime(selFid);
            const exp=expandido[key];
            const outrosSel=Object.entries(sel).filter(([k])=>k!==key).map(([,v])=>String(v));
            const alternativas=(vaga.candidatos||[]).filter(c=>!c.eliminado&&String(c.freelancerId)!==String(selFid)&&!outrosSel.includes(String(c.freelancerId)));
            return(
              <div key={si} style={{background:jaEscalado?"#F0FDF4":"var(--card)",border:`1px solid ${jaEscalado?"#BBF7D0":"var(--border)"}`,borderRadius:7,padding:"7px 10px",marginBottom:4}}>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  <Avatar nome={selCand.nome} size={26}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,color:jaEscalado?"var(--success)":"var(--text)",display:"flex",alignItems:"center",gap:4}}>
                      {selCand.nome}
                      {jaEscalado&&<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                    </div>
                    <div style={{fontSize:10,color:"var(--text3)",marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{(selCand.motivos||[]).join(" · ")||"—"}</div>
                  </div>
                  {!jaEscalado&&alternativas.length>0&&(
                    <button onClick={()=>setExpandido(ex=>({...ex,[key]:!ex[key]}))} style={{background:"var(--border)",border:"none",borderRadius:5,padding:"3px 8px",fontSize:10,color:"var(--text2)",cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>{exp?"▲":"Trocar"}</button>
                  )}
                </div>
                {exp&&(
                  <div style={{marginTop:7,borderTop:"1px solid var(--border)",paddingTop:7,display:"flex",flexDirection:"column",gap:3,maxHeight:200,overflowY:"auto"}}>
                    {alternativas.map(alt=>(
                      <button key={alt.freelancerId} onClick={()=>{setSel(s=>({...s,[key]:alt.freelancerId}));setExpandido(ex=>({...ex,[key]:false}));}}
                        style={{display:"flex",alignItems:"center",gap:7,background:"transparent",border:"1px solid var(--border)",borderRadius:6,padding:"5px 8px",cursor:"pointer",textAlign:"left",fontFamily:"inherit",width:"100%"}}>
                        <Avatar nome={alt.nome} size={20}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:11,fontWeight:600,color:"var(--text)"}}>{alt.nome}</div>
                          <div style={{fontSize:10,color:"var(--text3)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{(alt.motivos||[]).join(" · ")||"—"}</div>
                        </div>
                        <span style={{fontSize:10,color:"var(--text3)",flexShrink:0}}>{typeof alt.score==="number"?alt.score.toFixed(1):""}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
      {novos.length===0&&(
        <div style={{borderTop:"1px solid #BFDBFE",paddingTop:10,marginTop:4,display:"flex",flexDirection:"column",gap:7}}>
          <label style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:"var(--text2)",cursor:"pointer"}}>
            <input type="checkbox" checked={enviarConfNow} onChange={e=>setEnviarConfNow(e.target.checked)} style={{accentColor:"#1D4ED8"}}/>
            Enviar confirmações por WhatsApp após aplicar
          </label>
          <button disabled={aplicando||!temParaAplicar} onClick={()=>onAplicar(ev)}
            style={{background:aplicando||!temParaAplicar?"var(--border)":"#1D4ED8",color:aplicando||!temParaAplicar?"var(--text3)":"#fff",border:"none",borderRadius:8,padding:"8px 14px",fontSize:13,fontWeight:700,cursor:aplicando||!temParaAplicar?"not-allowed":"pointer",fontFamily:"inherit"}}>
            {aplicando?"Aplicando…":"Aplicar escala"}
          </button>
        </div>
      )}
      {novos.length>0&&(
        <div style={{borderTop:"1px solid #BBF7D0",paddingTop:10,marginTop:4}}>
          <div style={{fontSize:12,fontWeight:700,color:"#15803D",marginBottom:enviarConfNow?6:0,display:"flex",alignItems:"center",gap:5}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            {novos.length} membro{novos.length!==1?"s":""} escalado{novos.length!==1?"s":""}
            {enviarConfNow?" — envie as confirmações:":"."}
          </div>
          {enviarConfNow&&novos.map(({freelancer:f,membro:m},i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:7,marginTop:5}}>
              <Avatar nome={f.nome} size={22}/>
              <span style={{fontSize:12,flex:1,color:"var(--text)"}}>{f.nome}</span>
              <WaBtn url={waEscala(f,ev,m)} tipo="escala" small/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── ABA EVENTOS ────────────────────────────────────────────────────────────────
function AbaEventos({eventos,setEventos,freelancers,disponibilidade,funcoes,userId,gestaoMode=false,rosterTarget,onRosterTargetConsumed}){
  const addToast=useToast();
  const[modal,setModal]=useState(null);
  const[detalhe,setDetalhe]=useState(null);
  const[form,setForm]=useState({});
  const[mf,setMf]=useState({freelancerId:"",funcao:"",cache:"",obs:""});
  const[filtro,setFiltro]=useState("");
  const[editCache,setEditCache]=useState(null); // {fid, val} quando editando inline
  const[gcal,setGcal]=useState(null);
  const[conflito,setConflito]=useState(null);
  const[confirmar,setConfirmar]=useState(null);
  const[confirmacoesMap,setConfirmacoesMap]=useState({});
  // ── WhatsApp — Escala do Dia ─────────────────────────────────────────────────
  const[waEnviando,setWaEnviando]=useState(false);
  const[waResultado,setWaResultado]=useState(null);
  const[waGrupos,setWaGrupos]=useState([]);
  const[waGrupoSel,setWaGrupoSel]=useState(()=>{try{return localStorage.getItem("wa_grupo_sel")||"";}catch(e){return "";}});
  const[waData,setWaData]=useState(()=>new Date().toISOString().slice(0,10));
  const[waUrl,setWaUrl]=useState(WA_SERVER_URL);
  const[waAdminId,setWaAdminId]=useState(null);
  const[waConectado,setWaConectado]=useState(null); // null=desconhecido, true, false
  const[pdfCarregando,setPdfCarregando]=useState(false);
  // ── Sugestão de escala ───────────────────────────────────────────────────────
  const[rosterPanel,setRosterPanel]=useState(null);
  const[rosterData,setRosterData]=useState(null);
  const[rosterLoading,setRosterLoading]=useState(false);
  const[rosterSel,setRosterSel]=useState({});
  const[rosterExpandido,setRosterExpandido]=useState({});
  const[rosterAplicando,setRosterAplicando]=useState(false);
  const[rosterNovos,setRosterNovos]=useState([]);
  const[enviarConfNow,setEnviarConfNow]=useState(true);
  // Carrega adminId da sessão uma vez
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>setWaAdminId(session?.user?.id||null)).catch(()=>{});
  },[]);
  const waHeaders=(extra={})=>{const h={"bypass-tunnel-reminder":"true",...extra};if(WA_SECRET)h["x-api-secret"]=WA_SECRET;if(waAdminId)h["x-admin-id"]=waAdminId;return h;};
  // Carrega grupos quando tiver adminId; detecta se WhatsApp está conectado
  useEffect(()=>{
    if(!waAdminId)return;
    const url=waUrl||WA_SERVER_URL;
    fetch(url+"/api/whatsapp/grupos",{headers:waHeaders()}).then(r=>{
      if(r.status===503||r.status===401){setWaConectado(false);return[];}
      return r.json();
    }).then(d=>{
      if(Array.isArray(d)){
        setWaConectado(d.length>=0); // chegou array = conectado
        setWaGrupos(d);
        const saved=localStorage.getItem("wa_grupo_sel");
        if(saved&&d.find(g=>g.jid===saved))setWaGrupoSel(saved);
      }
    }).catch(()=>setWaConectado(false));
  },[waUrl,waAdminId]);
  const enviarEscalaDia=async()=>{
    if(!waGrupoSel){window.alert("Selecione um grupo primeiro.");return;}
    setWaEnviando(true);setWaResultado(null);
    try{
      const{data:{session}}=await sb.auth.getSession();
      const adminId=session?.user?.id;
      if(!adminId)throw new Error("Sessão expirada. Faça login novamente.");
      const url=waUrl||WA_SERVER_URL;
      const headers=waHeaders({"Content-Type":"application/json"});
      const r=await fetch(url+"/api/escala/enviar-dia",{method:"POST",headers,body:JSON.stringify({adminId,data:waData,grupoJid:waGrupoSel})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||"Erro desconhecido no servidor.");
      setWaResultado(d);
    }catch(e){setWaResultado({error:e.message});}
    finally{setWaEnviando(false);}
  };
  // Disponibilidade cloud: carregada dos próprios freelancers (têm userId)
  const[dispCloud,setDispCloud]=useState({}); // {freelancerId: {data: status}}
  const fl=id=>freelancers.find(f=>f.id===id);
  const det=detalhe?eventos.find(e=>e.id===detalhe):null;
  // Fechar painel de sugestão ao trocar/fechar evento
  useEffect(()=>{ setRosterPanel(null);setRosterNovos([]); },[detalhe]);

  // Carregar disponibilidade de todos os freelancers via sf_perfis (fallback por nome se sem userId)
  useEffect(()=>{
    if(!freelancers.length)return;
    const norm=s=>s?.normalize("NFD").replace(/[̀-ͯ]/g,"").trim().toLowerCase()||"";
    const load=async()=>{
      // 1. Tentar resolver userId pelo sf_perfis (admin_id = admin atual)
      const{data:{session}}=await sb.auth.getSession();
      const adminId=session?.user?.id;
      let nomeMap={};
      if(adminId){
        const{data:perfis}=await sb.from("sf_perfis").select("id,nome").eq("admin_id",adminId);
        (perfis||[]).forEach(p=>{if(p.nome)nomeMap[norm(p.nome)]=p.id;});
      }
      // 2. Para cada freelancer, resolver uid (userId salvo > lookup por nome)
      const resolvidos=freelancers.map(f=>({
        fid:f.id,
        uid:f.userId||(nomeMap[norm(f.nome)]||null)
      })).filter(x=>x.uid);
      if(!resolvidos.length)return;
      // 3. Carregar disponibilidade de cada um
      const results=await Promise.all(resolvidos.map(({fid,uid})=>
        crossLoad(uid,"disponibilidade").then(d=>({fid,d:d||{}}))
      ));
      const map={};
      results.forEach(({fid,d})=>{map[fid]=d;});
      setDispCloud(map);
    };
    load().catch(()=>{});
  },[freelancers.map(f=>f.id).join(",")]);

  // Abre drawer no evento alvo vindo da Triagem
  useEffect(()=>{
    if(!rosterTarget)return;
    setDetalhe(rosterTarget);
    const ev=eventos.find(e=>e.id===rosterTarget);
    if(ev)abrirSugestaoEscala(ev);
    onRosterTargetConsumed?.();
  },[rosterTarget]);

  const abrirSugestaoEscala=async(ev)=>{
    setRosterPanel(ev.id);
    setRosterLoading(true);
    setRosterData(null);
    setRosterSel({});
    setRosterExpandido({});
    setRosterNovos([]);
    try{
      const url=waUrl||WA_SERVER_URL;
      const r=await fetch(url+"/api/roster/sugerir",{method:"POST",headers:waHeaders({"Content-Type":"application/json"}),body:JSON.stringify({adminId:userId,eventId:ev.id})});
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||r.statusText);}
      const d=await r.json();
      setRosterData(d);
      const initSel={};
      (d.vagas||[]).forEach((v,vi)=>(v.sugeridos||[]).forEach((c,si)=>{initSel[`${vi}_${si}`]=c.freelancerId;}));
      setRosterSel(initSel);
    }catch(err){
      console.error("[abrirSugestaoEscala]",err.message);
      addToast?.("Erro ao buscar sugestões: "+err.message,"erro");
      setRosterPanel(null);
    }
    setRosterLoading(false);
  };

  const aplicarSugestaoEscala=async(ev)=>{
    setRosterAplicando(true);
    const novos=[];
    try{
      const decisions=[];
      const jaNaEquipe=fid=>(ev.equipe||[]).some(m=>String(m.freelancerId)===String(fid));
      for(const[key,freelancerId]of Object.entries(rosterSel)){
        if(jaNaEquipe(freelancerId))continue;
        const[viStr,siStr]=key.split("_");
        const vi=parseInt(viStr,10);
        const vaga=rosterData?.vagas?.[vi];
        if(!vaga)continue;
        const fl=freelancers.find(f=>String(f.id)===String(freelancerId));
        const dur=duracaoEvento(ev);
        const nivelBonus=fl?.nivelBonus||null;
        const nivelObj=NIVEIS_BONUS.find(n=>n.id===nivelBonus);
        const bonusAuto=dur>(nivelObj?.tempoMin??180)&&!!nivelBonus;
        const membro={freelancerId:+freelancerId,funcao:vaga.funcao,cache:fnDef(vaga.funcao),obs:"",pago:false,turnos:1,bonusMultTurnos:false,bonus:nivelBonus?{nivel:nivelBonus,ativo:bonusAuto}:null};
        try{
          const atualizado=await evSvc.upsertMember(userId,ev.id,membro);
          setEventos(evs=>evs.map(e=>e.id===ev.id?atualizado:e));
        }catch(e){console.error("[roster upsert]",e.message);addToast?.("Erro ao escalar "+(fl?.nome||"")+" : "+e.message,"erro");continue;}
        if(fl)novos.push({freelancer:fl,membro});
        const sugerido=vaga.sugeridos?.[parseInt(siStr,10)];
        decisions.push({funcao:vaga.funcao,sugeridoFreelancerId:sugerido?.freelancerId||String(freelancerId),escolhidoFreelancerId:String(freelancerId)});
      }
      if(decisions.length>0){
        const url=waUrl||WA_SERVER_URL;
        fetch(url+"/api/roster/confirmar",{method:"POST",headers:waHeaders({"Content-Type":"application/json"}),body:JSON.stringify({adminId:userId,eventId:ev.id,decisions})}).catch(e=>console.warn("[roster confirmar]",e.message));
      }
      setRosterNovos(novos);
      if(novos.length>0)addToast?.(novos.length+" membro(s) escalado(s)","ok");
      else addToast?.("Todos já estavam escalados","aviso");
    }catch(err){console.error("[aplicarSugestaoEscala]",err.message);addToast?.("Erro ao aplicar escala: "+err.message,"erro");}
    setRosterAplicando(false);
  };

  // Carregar confirmacoes de todos os freelancers com userId ao abrir detalhe
  useEffect(()=>{
    if(!det)return;
    const flsComId=freelancers.filter(f=>f.userId&&det.equipe?.find(m=>m.freelancerId===f.id));
    if(!flsComId.length)return;
    Promise.all(flsComId.map(f=>crossLoad(f.userId,"confirmacoes").then(d=>({fid:f.id,data:d||{}}))))
      .then(results=>{
        const map={};
        results.forEach(({fid,data})=>{map[fid]=data;});
        setConfirmacoesMap(map);
      }).catch(()=>{});
  },[det?.id]);
  const fnCor=nome=>(funcoes.find(f=>f.nome===nome)||{}).cor||"var(--text3)";
  const fnDef=nome=>(funcoes.find(f=>f.nome===nome)||{}).cacheDefault||0;
  const setFnMembro=nome=>setMf(f=>({...f,funcao:nome,cache:fnDef(nome)>0?String(fnDef(nome)):f.cache,obs:""}));
  useEffect(()=>{if(funcoes.length>0&&!mf.funcao)setMf(f=>({...f,funcao:funcoes[0].nome,cache:String(fnDef(funcoes[0].nome)||"")}));},[funcoes]);
  const checkDisp=(fid,ev)=>{
    if(!fid||!ev?.data)return null;
    const fidNum=+fid;
    const freela=freelancers.find(f=>f.id===fidNum);
    // Prioridade: disponibilidade marcada pelo próprio freelancer (cloud) > admin
    // Prioridade: dados do próprio freelancer (dispCloud) > dados marcados pelo admin
    const cloudData=dispCloud[fidNum];
    const dispFreela=(cloudData&&Object.keys(cloudData).length>0)?cloudData:(disponibilidade[fidNum]||{});
    const d=dispFreela[ev.data];
    const hMin=h=>{if(!h)return null;const[hh,mm]=h.split(":");return+hh*60+(+mm||0);};
    const evIni=hMin(ev.horaInicio);const evFim=hMin(ev.horaFim);

    // Conflito de horário com outro evento (margem 1h)
    const conflitoEvento=eventos.find(e=>{
      if(e.id===ev.id||e.data!==ev.data)return false;
      if(!e.equipe.find(m=>m.freelancerId===fidNum))return false;
