<!-- React + ReactDOM carregados no fim do body — sem defer para garantir ordem correta no mobile -->
<script>
// Fallback: captura erros e mostra detalhes completos
function mostrarErro(msg,detalhe){
  var el=document.getElementById('root');
  if(el){
    el.innerHTML='<div style="padding:24px;font-family:sans-serif;background:#fff;min-height:100vh">'+
      '<h2 style="color:#dc2626;margin:0 0 8px">Erro ao carregar</h2>'+
      '<pre style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px;font-size:12px;color:#7f1d1d;white-space:pre-wrap;word-break:break-all;margin-bottom:16px;max-width:640px">'+(msg||'Erro desconhecido')+(detalhe?'\n\n'+detalhe:'')+'</pre>'+
      '<p style="font-size:12px;color:#64748b;margin-bottom:16px">Abra o DevTools (F12) → aba Console para ver detalhes completos.</p>'+
      '<button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer">Tentar novamente</button>'+
      '</div>';
  }
}
window._sfAppReady=false;
window.addEventListener('error',function(e){
  if(!window._sfAppReady) mostrarErro(e.message,(e.filename?'Arquivo: '+e.filename:'')+(e.lineno?'\nLinha: '+e.lineno+', Col: '+e.colno:''));
});
window.addEventListener('unhandledrejection',function(e){
  if(!window._sfAppReady) mostrarErro('Promise rejeitada: '+(e.reason&&e.reason.message||String(e.reason)));
});
// Timeout generoso para conexões lentas no mobile (Babel ~7 MB via CDN)
setTimeout(function(){
  if(!window._sfAppReady){
    var el=document.getElementById('root');
    if(el){
      el.innerHTML='<div style="padding:24px;font-family:sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc">'+
        '<p style="color:#64748b;font-size:14px;margin:0 0 8px">Demorou mais que o esperado...</p>'+
        '<p style="color:#94a3b8;font-size:12px;margin:0 0 16px">Verifique a conexão com a internet (jsDelivr CDN).</p>'+
        '<button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600">Recarregar</button>'+
        '</div>';
    }
  }
},40000);
</script>

// Cloud storage — salva/carrega dados do Supabase por tipo
const cloudSave = async (userId, tipo, dados) => {
  const {error} = await sb.from("sf_dados").upsert(
    {user_id: userId, tipo, dados, updated_at: new Date().toISOString()},
    {onConflict: "user_id,tipo"}
  );
  if(error) console.error("Erro ao salvar:", error);
};
const cloudLoad = async (userId, tipo) => {
  try{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000));
    const query=sb.from("sf_dados").select("dados").eq("user_id",userId).eq("tipo",tipo)
      .order("updated_at",{ascending:false}).limit(1);
    const {data,error} = await Promise.race([query,timeout]);
    if(error || !data?.length) return null;
    return data[0].dados;
  }catch{ return null; }
};
// Salva/carrega interações de treinamento (confirmações + comentários) por usuário

// ── NOTIFICAÇÕES ──────────────────────────────────────────────────────────────
const pedirPermissaoNotificacao=async()=>{
  if(!("Notification" in window))return false;
  if(Notification.permission==="granted")return true;
  try{
    const r=await Notification.requestPermission();
    if(r==="granted"){
      // Resetar "primeiro acesso" para que eventos atuais sejam notificados
      // mas NÃO resetar "vistos" para não re-notificar tudo
    }
    return r==="granted";
  }catch(e){
    return new Promise(resolve=>Notification.requestPermission(r=>resolve(r==="granted")));
  }
};
const dispararNotificacao=(titulo,corpo,tag)=>{
  if(Notification.permission!=="granted")return;
  // Safari iOS: notificações diretas apenas (não suporta SW Blob)
  const isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  if(!isSafari&&window.sfNotify){window.sfNotify(titulo,corpo,tag);return;}
  try{new Notification(titulo,{body:corpo,tag:tag||undefined});}
  catch(e){}
};
const crossLoad = async (userId, tipo) => {

// ── BONIFICAÇÕES ───────────────────────────────────────────────────────────────
const BONUS_INIT = [

  {id:"master", label:"Master", valor:20, cor:"#f59e0b"},
];
// Referência global — atualizada pelo App para que calcCache funcione sem prop drilling
let NIVEIS_BONUS = [...BONUS_INIT];
const toMin = h => { if(!h) return 0; const[hh,mm]=h.split(":"); return +hh*60+(+mm||0); };
const duracaoEvento = ev => {
  if(!ev?.horaInicio||!ev?.horaFim) return 0;
  return toMin(ev.horaFim) - toMin(ev.horaInicio);
};
// Calcula cachê total (base + bonificação se ativa)
const calcCache = (membro, ev) => {
  if(!membro) return 0;
  const base = membro.cache || 0;
  const bonus = membro.bonus;
  if(!bonus?.ativo) return base;
  const nivel = NIVEIS_BONUS.find(n => n.id === bonus.nivel);
  return base + (nivel?.valor || 0);
};

// ── TELA DE LOGIN ──────────────────────────────────────────────────────────────
function TelaLogin({onLogin}){
  const[email,setEmail]=useState("");
  const[senha,setSenha]=useState("");
  const[modo,setModo]=useState("login"); // login | cadastro | esqueci
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState(null); // {tipo:"erro"|"ok", texto}

  const handleEmail = async e => {
    e.preventDefault();
    setLoading(true); setMsg(null);
    if(modo==="esqueci"){
      const {error} = await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
      setMsg(error?{tipo:"erro",texto:error.message}:{tipo:"ok",texto:"E-mail de recuperação enviado! Verifique sua caixa de entrada."});
      setLoading(false); return;
    }
    const fn = modo==="cadastro" ? sb.auth.signUp.bind(sb.auth) : sb.auth.signInWithPassword.bind(sb.auth);
    const {data,error} = await fn({email,password:senha});
    if(error) setMsg({tipo:"erro",texto:error.message==="Invalid login credentials"?"E-mail ou senha incorretos.":error.message});
    else if(modo==="cadastro"&&!data.session) setMsg({tipo:"ok",texto:"Conta criada! Verifique seu e-mail para confirmar."});
    else if(data.session) onLogin(data.session.user);
    setLoading(false);
  };

  const handleGoogle = async () => {
    setLoading(true);
    const {error} = await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.href}});
    if(error){setMsg({tipo:"erro",texto:error.message});setLoading(false);}
  };

  return(
    <div style={{minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
      <div style={{width:"100%",maxWidth:420}}>

          </div>
          <div style={{fontSize:11,color:"var(--text3)",letterSpacing:"0.06em",marginTop:4,textTransform:"uppercase",fontWeight:600}}>Painel Operacional</div>
        </div>

        {/* Card */}
        <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",padding:28,boxShadow:"var(--shadow-sm)"}}>
          <h2 style={{color:"var(--text)",margin:"0 0 20px",fontSize:16,fontWeight:600,textAlign:"center",letterSpacing:"-0.01em"}}>
            {modo==="login"?"Entrar":modo==="cadastro"?"Criar conta":"Recuperar senha"}
          </h2>

          {/* Google */}
          {modo!=="esqueci"&&(
            <>
              <button onClick={handleGoogle} disabled={loading} style={{width:"100%",background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"11px 20px",fontSize:14,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:20,fontFamily:"inherit",opacity:0.5}} title="Em breve — requer configuração no Google Cloud">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.3 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5L31.8 34c-2 1.4-4.6 2.2-7.8 2.2-5.2 0-9.5-3.5-11.1-8.2l-6.5 5C9.8 39.5 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.2-2.3 4.1-4.3 5.4l5.7 4.9C40.3 35.1 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
                Entrar com Google (em breve)
              </button>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
                <div style={{flex:1,height:1,background:"var(--border)"}}/>
                <span style={{fontSize:12,color:"var(--text3)"}}>entre com e-mail</span>
                <div style={{flex:1,height:1,background:"var(--border)"}}/>
              </div>
            </>
          )}

          <form onSubmit={handleEmail} style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>E-mail</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="seu@email.com"
                style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"9px 12px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",width:"100%"}}/>
            </div>
            {modo!=="esqueci"&&(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>Senha</label>
                <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} required minLength={6} placeholder="••••••••"
                  style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"9px 12px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",width:"100%"}}/>
              </div>
            )}

            {msg&&(
              <div style={{background:msg.tipo==="erro"?"var(--danger-light)":"var(--success-light)",border:`1px solid ${msg.tipo==="erro"?"var(--danger-light)":"var(--success-light)"}`,borderRadius:10,padding:"10px 14px",fontSize:13,color:msg.tipo==="erro"?"var(--danger)":"var(--success)"}}>
                {msg.texto}
              </div>
            )}

            <button type="submit" disabled={loading} style={{background:"var(--primary)",border:"none",borderRadius:"var(--radius)",padding:"10px 20px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginTop:4,width:"100%"}}>
              {loading?"Aguarde...":(modo==="login"?"Entrar":modo==="cadastro"?"Criar conta":"Enviar e-mail")}
            </button>
          </form>

          {/* Links */}
          <div style={{marginTop:20,display:"flex",flexDirection:"column",gap:10,alignItems:"center"}}>
            {modo==="login"&&(<>
              <button onClick={()=>{setModo("esqueci");setMsg(null);}} style={{background:"none",border:"none",color:"var(--text2)",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>Esqueci minha senha</button>
              <button onClick={()=>{setModo("cadastro");setMsg(null);}} style={{background:"none",border:"none",color:"var(--primary)",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>Não tem conta? Criar conta grátis</button>
            </>)}
            {modo==="cadastro"&&(<button onClick={()=>{setModo("login");setMsg(null);}} style={{background:"none",border:"none",color:"var(--primary)",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>Já tem conta? Entrar</button>)}
            {modo==="esqueci"&&(<button onClick={()=>{setModo("login");setMsg(null);}} style={{background:"none",border:"none",color:"var(--primary)",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>← Voltar ao login</button>)}
          </div>
        </div>
      </div>
    </div>
  );
}

const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const localDateStr=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};


const fmtDate=d=>{if(!d||typeof d!=="string")return"";const p=d.split("-");if(p.length<3)return d;return`${p[2]}/${p[1]}/${p[0]}`;};
const initials=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const avatarColor=n=>{const c=["var(--warning)","#3b82f6","#a855f7","var(--success)","#ec4899","#f97316","var(--primary)","#14b8a6","var(--danger)"];let h=0;for(let x of n)h=(h*31+x.charCodeAt(0))%c.length;return c[h];};
const limparTel=t=>t?t.replace(/\D/g,""):"";
const toGCal=(data,hora)=>{const[y,m,d]=data.split("-");const[hh,mm]=(hora||"00:00").split(":");return`${y}${m}${d}T${hh}${mm}00`;};
const waEscala=(f,ev,m)=>{const t=limparTel(f.telefone);if(!t)return null;const msg=`Olá, *${f.nome}*! 👋\n\nVocê foi escalado(a) para:\n\n🎪 *${ev.nome}*\n📅 ${fmtDate(ev.data)}\n⏰ ${ev.horaInicio} — ${ev.horaFim}\n📍 ${ev.local}\n🎭 Função: *${m.funcao}*\n💰 Cachê: *R$ ${m.cache.toFixed(2).replace(".",",")}*\n\nConfirme sua presença! 🙏`;return`https://wa.me/55${t}?text=${encodeURIComponent(msg)}`;};
const waPag=(f,ev,m)=>{const t=limparTel(f.telefone);if(!t)return null;const msg=`Olá, *${f.nome}*! 👋\n\nPagamento pendente:\n\n🎪 *${ev.nome}*\n📅 ${fmtDate(ev.data)}\n💰 R$ ${m.cache.toFixed(2).replace(".",",")}${f.pix?`\n\n💳 PIX: *${f.pix}*`:""}\n\nObrigado! ✅`;return`https://wa.me/55${t}?text=${encodeURIComponent(msg)}`;};

const Btn=({children,variant="primary",small,...p})=>{
  const v={
    primary:{background:"#0C6E7E",color:"#fff",border:"none",boxShadow:"0 1px 3px rgba(12,110,126,.3)"},
    ghost:{background:"#fff",color:"#374151",border:"1px solid #CBD5E1"},
    danger:{background:"#DC2626",color:"#fff",border:"none"},
    success:{background:"#fff",color:"#16A34A",border:"1px solid #BBF7D0"},
  };
  const hov={primary:"#0A5A68",ghost:"#F1F5F9",danger:"#B91C1C",success:"#F0FDF4"};
  const base=p.style?.background||v[variant].background;
  const baseColor=p.style?.color||v[variant].color;
  return <button {...p} style={{...v[variant],borderRadius:9,padding:small?"4px 10px":"8px 16px",fontSize:small?12:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",display:"inline-flex",alignItems:"center",gap:6,whiteSpace:"nowrap",transition:"background .15s,box-shadow .15s",...p.style}}
    onMouseEnter={e=>{e.currentTarget.style.background=hov[variant];e.currentTarget.style.color=baseColor;}}
    onMouseLeave={e=>{e.currentTarget.style.background=base;e.currentTarget.style.color=baseColor;}}
  >{children}</button>;
};
const Modal=({open,onClose,title,children})=>{if(!open)return null;return(<div style={{position:"fixed",inset:0,background:"rgba(7,18,37,.6)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(6px)"}}>  {/* backdrop — fechamento por clique externo desativado */}<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:24,width:"100%",maxWidth:520,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 48px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05)"}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,paddingBottom:14,borderBottom:"1px solid var(--border)"}}><h3 style={{color:"var(--text)",margin:0,fontSize:15,fontWeight:700}}>{title}</h3><button onClick={onClose} style={{background:"var(--bg)",border:"1px solid var(--border)",color:"var(--text2)",cursor:"pointer",fontSize:13,lineHeight:1,padding:"5px 8px",borderRadius:7,fontFamily:"inherit"}}>✕</button></div>{children}</div></div>);};

function AbaFuncoes({funcoes,setFuncoes}){
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({});
  const[confirmar,setConfirmar]=useState(null);
  const salvar=()=>{if(!form.nome)return;if(form.id)setFuncoes(f=>f.map(x=>x.id===form.id?{...form}:x));else setFuncoes(f=>[...f,{...form,id:Date.now(),pedirObs:!!form.pedirObs}]);setModal(false);};
  const excluir=id=>{setFuncoes(f=>f.filter(x=>x.id!==id));setConfirmar(null);};
  return(
    <div style={{padding:"24px 28px",flex:1,overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:12,paddingBottom:20,borderBottom:"1px solid var(--border)"}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:20,fontWeight:800,letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:28,height:28,borderRadius:8,background:"#7C3AED",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            </span>
            Funções
          </h2>
          <p style={{color:"var(--text3)",margin:"4px 0 0 36px",fontSize:12,fontWeight:500}}>Gerencie funções e cachês padrão</p>
        </div>
        <Btn onClick={()=>{setForm({nome:"",cor:"var(--primary)",cacheDefault:0,pedirObs:false});setModal(true);}}>+ Nova função</Btn>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:14}}>
        {funcoes.map(fn=>(
          <Card key={fn.id}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
              <div style={{width:40,height:40,borderRadius:8,background:fn.cor+"18",border:`1px solid ${fn.cor}44`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><div style={{width:12,height:12,borderRadius:"50%",background:fn.cor}}/></div>
              <div style={{flex:1}}><div style={{fontWeight:700,color:"var(--text)",fontSize:16}}>{fn.nome}</div><div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}><div style={{width:10,height:10,borderRadius:"50%",background:fn.cor}}/><span style={{fontSize:11,color:"var(--text3)"}}>{fn.cor}</span></div></div>
            </div>
            <div style={{background:"var(--bg)",borderRadius:8,padding:"9px 12px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",border:"1px solid var(--border)"}}>
              <span style={{fontSize:12,color:"var(--text2)"}}>Cachê padrão</span>
              <span style={{fontSize:15,fontWeight:800,color:fn.cor}}>R$ {(fn.cacheDefault||0).toFixed(2).replace(".",",")}</span>
            </div>
            {fn.pedirObs&&<div style={{background:"#fef9c3",border:"1px solid #fde047",borderRadius:7,padding:"5px 10px",marginBottom:10,fontSize:11,color:"#92400e",display:"flex",alignItems:"center",gap:6}}>
              📝 <span>Solicita observação na escala</span>
            </div>}
            <div style={{display:"flex",gap:8}}>
              <Btn small variant="ghost" style={{flex:1,justifyContent:"center"}} onClick={()=>{setForm({...fn});setModal(true);}}>Editar</Btn>
              <Btn small variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>setConfirmar(fn)}>Excluir</Btn>
            </div>
          </Card>
        ))}
        <button onClick={()=>{setForm({nome:"",cor:"var(--primary)",cacheDefault:0,pedirObs:false});setModal(true);}} style={{border:"2px dashed var(--border2)",borderRadius:"var(--radius-lg)",padding:20,background:"transparent",color:"var(--text3)",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,minHeight:140,fontFamily:"inherit",fontSize:13}}>
          <span style={{fontSize:22,color:"var(--text3)"}}>+</span>Nova função
        </button>
      </div>
      <Modal open={modal} onClose={()=>setModal(false)} title={form.id?"Editar Função":"Nova Função"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Inp label="Nome da Função" value={form.nome||""} onChange={e=>setForm(f=>({...f,nome:e.target.value}))} placeholder="Ex: Mestre de Cerimônias"/>
          <Inp label="Cachê Padrão (R$)" type="number" value={form.cacheDefault||""} onChange={e=>setForm(f=>({...f,cacheDefault:+e.target.value}))} placeholder="0,00"/>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:8}}>Cor da Função</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
              {CORES_PRESET.map(c=>(<button key={c} onClick={()=>setForm(f=>({...f,cor:c}))} style={{width:30,height:30,borderRadius:8,background:c,border:form.cor===c?"3px solid #fff":"2px solid transparent",cursor:"pointer"}}/>))}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="color" value={form.cor||"var(--primary)"} onChange={e=>setForm(f=>({...f,cor:e.target.value}))} style={{width:42,height:38,borderRadius:8,border:"1px solid var(--border)",background:"var(--bg)",cursor:"pointer",padding:2}}/>
              <Inp value={form.cor||""} onChange={e=>setForm(f=>({...f,cor:e.target.value}))} placeholder="var(--primary)" style={{flex:1}}/>
            </div>
          </div>
          {form.nome&&(<div style={{background:"var(--bg)",borderRadius:10,padding:12,display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:12,color:"var(--text2)"}}>Preview:</span>
            <Badge label={form.nome} color={form.cor||"var(--text3)"}/>
            {form.cacheDefault>0&&<span style={{fontSize:13,color:form.cor,fontWeight:700}}>R$ {(+form.cacheDefault).toFixed(2).replace(".",",")}</span>}
          </div>)}
          {/* Checkbox pedirObs */}
          <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",background:form.pedirObs?"#fef9c3":"var(--bg)",border:`1px solid ${form.pedirObs?"#fde047":"var(--border)"}`,borderRadius:10,padding:"11px 14px",transition:"all .15s"}}>
            <input type="checkbox" checked={!!form.pedirObs} onChange={e=>setForm(f=>({...f,pedirObs:e.target.checked}))} style={{width:16,height:16,marginTop:1,accentColor:"#d97706",cursor:"pointer",flexShrink:0}}/>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>📝 Solicitar observação na escala</div>
              <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>Ao escalar um funcionário com esta função, aparece um campo de observação obrigatório. O texto fica visível no PDF de pagamentos.</div>
            </div>
          </label>
          <div style={{display:"flex",justifyContent:"flex-end",gap:10}}><Btn variant="ghost" onClick={()=>setModal(false)}>Cancelar</Btn><Btn onClick={salvar}>Salvar</Btn></div>
        </div>
      </Modal>
      <ConfirmDelete open={!!confirmar} onClose={()=>setConfirmar(null)} onConfirm={()=>excluir(confirmar.id)} titulo={`Excluir função "${confirmar?.nome}"?`} descricao="Esta função será removida. Eventos já escalados não serão afetados."/>
    </div>
  );
}




// ── ABA EVENTOS ────────────────────────────────────────────────────────────────
function AbaEventos({eventos,setEventos,freelancers,disponibilidade,funcoes}){
  const[modal,setModal]=useState(null);
  const[detalhe,setDetalhe]=useState(null);
  const[form,setForm]=useState({});
  const[mf,setMf]=useState({freelancerId:"",funcao:"",cache:"",obs:""});
  const[filtro,setFiltro]=useState("");
  const[gcal,setGcal]=useState(null);
  const[conflito,setConflito]=useState(null);
  const[confirmar,setConfirmar]=useState(null);
  const[confirmacoesMap,setConfirmacoesMap]=useState({});
  // ── WhatsApp — Escala do Dia ─────────────────────────────────────────────────
  const[waEnviando,setWaEnviando]=useState(false);
  const[waResultado,setWaResultado]=useState(null);
  const[waGrupos,setWaGrupos]=useState([]);
  const[waGrupoSel,setWaGrupoSel]=useState(()=>{try{return localStorage.getItem("wa_grupo_sel")||"";}catch(e){return "";}});
  const[waData,setWaData]=useState(()=>new Date().toISOString().slice(0,10));
  const[waUrl,setWaUrl]=useState(WA_SERVER_URL);
  const[waAdminId,setWaAdminId]=useState(null);
  const[waConectado,setWaConectado]=useState(null); // null=desconhecido, true, false
  // Carrega adminId da sessão uma vez
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>setWaAdminId(session?.user?.id||null)).catch(()=>{});
  },[]);
  const waHeaders=(extra={})=>{const h={"bypass-tunnel-reminder":"true",...extra};if(WA_SECRET)h["x-api-secret"]=WA_SECRET;if(waAdminId)h["x-admin-id"]=waAdminId;return h;};
  // Carrega grupos quando tiver adminId; detecta se WhatsApp está conectado
  useEffect(()=>{
    if(!waAdminId)return;
    const url=waUrl||WA_SERVER_URL;
    fetch(url+"/api/whatsapp/grupos",{headers:waHeaders()}).then(r=>{
      if(r.status===503||r.status===401){setWaConectado(false);return[];}
      return r.json();
    }).then(d=>{
      if(Array.isArray(d)){
        setWaConectado(d.length>=0); // chegou array = conectado
        setWaGrupos(d);
        const saved=localStorage.getItem("wa_grupo_sel");
        if(saved&&d.find(g=>g.jid===saved))setWaGrupoSel(saved);
      }
    }).catch(()=>setWaConectado(false));
  },[waUrl,waAdminId]);
  const enviarEscalaDia=async()=>{
    if(!waGrupoSel){window.alert("Selecione um grupo primeiro.");return;}
    setWaEnviando(true);setWaResultado(null);
    try{
      const{data:{session}}=await sb.auth.getSession();
      const adminId=session?.user?.id;
      if(!adminId)throw new Error("Sessão expirada. Faça login novamente.");
      const url=waUrl||WA_SERVER_URL;
      const headers=waHeaders({"Content-Type":"application/json"});
      const r=await fetch(url+"/api/escala/enviar-dia",{method:"POST",headers,body:JSON.stringify({adminId,data:waData,grupoJid:waGrupoSel})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||"Erro desconhecido no servidor.");
      setWaResultado(d);
    }catch(e){setWaResultado({error:e.message});}
    finally{setWaEnviando(false);}
  };
  // Disponibilidade cloud: carregada dos próprios freelancers (têm userId)
  const[dispCloud,setDispCloud]=useState({}); // {freelancerId: {data: status}}
  const fl=id=>freelancers.find(f=>f.id===id);
  const det=detalhe?eventos.find(e=>e.id===detalhe):null;

  // Carregar disponibilidade de todos os freelancers via sf_perfis (fallback por nome se sem userId)
  useEffect(()=>{
    if(!freelancers.length)return;
    const norm=s=>s?.normalize("NFD").replace(/[̀-ͯ]/g,"").trim().toLowerCase()||"";
    const load=async()=>{
      // 1. Tentar resolver userId pelo sf_perfis (admin_id = admin atual)
      const{data:{session}}=await sb.auth.getSession();
      const adminId=session?.user?.id;
      let nomeMap={};
      if(adminId){
        const{data:perfis}=await sb.from("sf_perfis").select("id,nome").eq("admin_id",adminId);
        (perfis||[]).forEach(p=>{if(p.nome)nomeMap[norm(p.nome)]=p.id;});
      }
      // 2. Para cada freelancer, resolver uid (userId salvo > lookup por nome)
      const resolvidos=freelancers.map(f=>({
        fid:f.id,
        uid:f.userId||(nomeMap[norm(f.nome)]||null)
      })).filter(x=>x.uid);
      if(!resolvidos.length)return;
      // 3. Carregar disponibilidade de cada um
      const results=await Promise.all(resolvidos.map(({fid,uid})=>
        crossLoad(uid,"disponibilidade").then(d=>({fid,d:d||{}}))
      ));
      const map={};
      results.forEach(({fid,d})=>{map[fid]=d;});
      setDispCloud(map);
    };
    load().catch(()=>{});
  },[freelancers.map(f=>f.id).join(",")]);

  // Carregar confirmacoes de todos os freelancers com userId ao abrir detalhe
  useEffect(()=>{
    if(!det)return;
    const flsComId=freelancers.filter(f=>f.userId&&det.equipe?.find(m=>m.freelancerId===f.id));
    if(!flsComId.length)return;
    Promise.all(flsComId.map(f=>crossLoad(f.userId,"confirmacoes").then(d=>({fid:f.id,data:d||{}}))))
      .then(results=>{
        const map={};
        results.forEach(({fid,data})=>{map[fid]=data;});
        setConfirmacoesMap(map);
      }).catch(()=>{});
  },[det?.id]);
  const fnCor=nome=>(funcoes.find(f=>f.nome===nome)||{}).cor||"var(--text3)";
  const fnDef=nome=>(funcoes.find(f=>f.nome===nome)||{}).cacheDefault||0;
  const setFnMembro=nome=>setMf(f=>({...f,funcao:nome,cache:fnDef(nome)>0?String(fnDef(nome)):f.cache,obs:""}));
  useEffect(()=>{if(funcoes.length>0&&!mf.funcao)setMf(f=>({...f,funcao:funcoes[0].nome,cache:String(fnDef(funcoes[0].nome)||"")}));},[funcoes]);
  const checkDisp=(fid,ev)=>{
    if(!fid||!ev?.data)return null;
    const fidNum=+fid;
    const freela=freelancers.find(f=>f.id===fidNum);
    // Prioridade: disponibilidade marcada pelo próprio freelancer (cloud) > admin
    // Prioridade: dados do próprio freelancer (dispCloud) > dados marcados pelo admin
    const cloudData=dispCloud[fidNum];
    const dispFreela=(cloudData&&Object.keys(cloudData).length>0)?cloudData:(disponibilidade[fidNum]||{});
    const d=dispFreela[ev.data];
    const hMin=h=>{if(!h)return null;const[hh,mm]=h.split(":");return+hh*60+(+mm||0);};
    const evIni=hMin(ev.horaInicio);const evFim=hMin(ev.horaFim);

    // Conflito de horário com outro evento (margem 1h)
    const conflitoEvento=eventos.find(e=>{
      if(e.id===ev.id||e.data!==ev.data)return false;
      if(!e.equipe.find(m=>m.freelancerId===fidNum))return false;
      if(!evIni||!evFim||!hMin(e.horaInicio)||!hMin(e.horaFim))return true;
      const eIni=hMin(e.horaInicio)-60;const eFim=hMin(e.horaFim)+60;
      return evIni<eFim&&evFim>eIni;
    });
    if(conflitoEvento){
      return{tipo:"conflito",msg:`Conflito com "${conflitoEvento.nome}" (${conflitoEvento.horaInicio}–${conflitoEvento.horaFim}) — margem de 1h`,cor:"var(--danger)"};
    }

    // Indisponível no dia
    if(d==="indisponivel")return{tipo:"indisponivel",msg:"Indisponível neste dia",cor:"var(--danger)"};

    // Disponibilidade parcial com comparação de horário
    if(d&&typeof d==="object"&&d.status==="parcial"){
      let alerta=null;
      if(evIni!=null&&evFim!=null){
        if(d.tipo==="apos"){const limMin=hMin(d.hora);if(limMin!=null&&evIni<limMin)alerta=`Disponível somente após ${d.hora} — evento começa às ${ev.horaInicio}`;}
        else if(d.tipo==="antes"){const limMin=hMin(d.hora);if(limMin!=null&&evFim>limMin)alerta=`Disponível somente até ${d.hora} — evento termina às ${ev.horaFim}`;}
        else if(d.tipo==="entre"){const ini=hMin(d.hora);const fim=hMin(d.hora2);if(ini!=null&&fim!=null&&(evIni<ini||evFim>fim))alerta=`Disponível somente entre ${d.hora}–${d.hora2}`;}
      }
      const label=d.tipo==="apos"?`Após ${d.hora}`:d.tipo==="antes"?`Até ${d.hora}`:d.tipo==="entre"?`${d.hora}–${d.hora2}`:d.obs||"Parcial";
      return{tipo:"parcial",msg:alerta||`Disponibilidade parcial: ${label}`,cor:"var(--warning)",bloqueio:!!alerta};
    }
    if(d==="parcial")return{tipo:"parcial",msg:"Disponibilidade parcial",cor:"var(--warning)"};
    if(d==="disponivel")return{tipo:"disponivel",msg:"Disponível ✓",cor:"var(--success)"};
    return{tipo:"sem_info",msg:"Não informado",cor:"var(--text3)"};
  };
  const salvar=()=>{if(!form.nome||!form.data)return;if(form.id)setEventos(ev=>ev.map(e=>e.id===form.id?{...e,...form}:e));else setEventos(ev=>[...ev,{...form,id:Date.now(),equipe:[]}]);setModal(null);};
  const excluir=id=>{setEventos(ev=>ev.filter(e=>e.id!==id));if(detalhe===id)setDetalhe(null);setConfirmar(null);};
  const addMembro=eid=>{
    if(!mf.freelancerId||!mf.funcao)return;
    const fnObj=funcoes.find(fn=>fn.nome===mf.funcao);
    if(fnObj?.pedirObs&&!mf.obs)return; // obs obrigatória
    const ev=eventos.find(e=>e.id===eid);
    const al=checkDisp(mf.freelancerId,ev);
    if(al&&(al.tipo==="indisponivel"||al.tipo==="conflito"||(al.tipo==="parcial"&&al.bloqueio))){
      const f=freelancers.find(x=>x.id===+mf.freelancerId);
      setConflito({...al,nome:f?.nome,onOk:()=>{
        const novoMembro=buildMembro(mf,ev);
        setEventos(evs=>evs.map(e=>e.id===eid?{...e,equipe:[...e.equipe,novoMembro]}:e));
        setMf(f=>({...f,freelancerId:"",cache:"",busca:"",obs:""}));setConflito(null);
      }});return;
    }
    const novoMembro=buildMembro(mf,ev);
    setEventos(evs=>evs.map(e=>e.id===eid?{...e,equipe:[...e.equipe,novoMembro]}:e));
    setMf(f=>({...f,freelancerId:"",cache:"",busca:"",obs:""}));
  };

  // Constrói objeto membro com bônus automático
  const buildMembro=(mf,ev)=>{
    const fl=freelancers.find(f=>f.id===+mf.freelancerId);
    const dur=duracaoEvento(ev);
    const nivelBonus=fl?.nivelBonus||null;
    const bonusAuto=dur>180&&!!nivelBonus; // >3h ativa automaticamente
    return {
      freelancerId:+mf.freelancerId,
      funcao:mf.funcao,
      cache:+mf.cache||0,
      obs:mf.obs||"",
      pago:false,
      bonus:nivelBonus?{nivel:nivelBonus,ativo:bonusAuto}:null
    };
  };
  const togPago=(eid,fid)=>setEventos(ev=>ev.map(e=>e.id===eid?{...e,equipe:e.equipe.map(m=>m.freelancerId===fid?{...m,pago:!m.pago}:m)}:e));
  const remMembro=(eid,fid)=>setEventos(ev=>ev.map(e=>e.id===eid?{...e,equipe:e.equipe.filter(m=>m.freelancerId!==fid)}:e));
  const hoje=localDateStr();
  const evOrdenados=[...eventos].sort((a,b)=>{const d=a.data.localeCompare(b.data);return d!==0?d:a.horaInicio.localeCompare(b.horaInicio);});
  const evFuturos=evOrdenados.filter(e=>e.data>=hoje);
  const evPassados=evOrdenados.filter(e=>e.data<hoje).reverse(); // mais recentes primeiro
  const evFilt=evFuturos.filter(e=>e.nome.toLowerCase().includes(filtro.toLowerCase())||e.tipo.toLowerCase().includes(filtro.toLowerCase())||e.local?.toLowerCase().includes(filtro.toLowerCase()));
  const evPassFilt=evPassados.filter(e=>e.nome.toLowerCase().includes(filtro.toLowerCase())||e.tipo.toLowerCase().includes(filtro.toLowerCase())||e.local?.toLowerCase().includes(filtro.toLowerCase()));
  const[verPassados,setVerPassados]=useState(false);
  return(
    <div style={{padding:24,flex:1,overflowY:"auto"}}>
      {/* ── Page Header ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:20,fontWeight:800,letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:28,height:28,borderRadius:8,background:"#0C6E7E",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
            </span>
            Eventos
          </h2>
          <p style={{color:"var(--text3)",margin:"4px 0 0 36px",fontSize:12,fontWeight:500}}>{evFuturos.length} próximos · {evPassados.length} anteriores</p>
        </div>
        <div style={{display:"flex",gap:8}}>
          <input value={filtro} onChange={e=>setFiltro(e.target.value)} placeholder="Buscar evento..." style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:9,padding:"8px 14px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",minWidth:170}}/>
          <Btn onClick={()=>{setForm({nome:"",tipo:"Aniversário Infantil",data:"",horaInicio:"",horaFim:"",local:"",status:"Confirmado",obs:""});setModal("novo");}}>＋ Novo Evento</Btn>
        </div>
      </div>
      {/* ── Painel Enviar Escala do Dia via WhatsApp ── */}
      <div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:12,padding:"12px 16px",marginBottom:16,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:13,fontWeight:700,color:"#15803D",marginRight:4}}>📲 Escala do Dia</span>
        <input type="date" value={waData} onChange={e=>setWaData(e.target.value)} style={{fontSize:12,padding:"5px 8px",borderRadius:8,border:"1px solid #BBF7D0",background:"#fff",color:"var(--text)",fontFamily:"inherit"}}/>
        {waConectado===false
          ?<span style={{fontSize:11,color:"#DC2626",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"4px 10px"}}>
              ⚠️ WhatsApp desconectado —{" "}
              <a href="../Logistica/index.html" style={{color:"#DC2626",fontWeight:700}}>configure em Logística → Config</a>
            </span>
          :waGrupos.length>0
            ?<select value={waGrupoSel} onChange={e=>{setWaGrupoSel(e.target.value);try{localStorage.setItem("wa_grupo_sel",e.target.value);}catch(err){}}} style={{fontSize:12,padding:"5px 8px",borderRadius:8,border:"1px solid #BBF7D0",background:"#fff",color:"var(--text)",fontFamily:"inherit",flex:1,minWidth:120,maxWidth:220}}>
                <option value="">Selecionar grupo…</option>
                {waGrupos.map(g=><option key={g.jid} value={g.jid}>{g.nome}</option>)}
              </select>
            :<span style={{fontSize:11,color:"#15803D",opacity:0.7}}>
                {waConectado===null?"Verificando...":"Sem grupos — entre em um grupo pelo WhatsApp"}
              </span>
        }
        <button disabled={waEnviando||!waGrupoSel} onClick={enviarEscalaDia} style={{background:waEnviando||!waGrupoSel?"#128C7E66":"#128C7E",color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:waEnviando||!waGrupoSel?"not-allowed":"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
          {waEnviando?"⏳ Enviando...":"📤 Enviar"}
        </button>
        <button title="Configurar URL do servidor" onClick={()=>{
          const atual=localStorage.getItem("wa_server_url")||"https://scalafest-production.up.railway.app";
          const nova=window.prompt("URL do servidor WhatsApp (ex: https://xxxx.loca.lt)",atual);
          if(nova!==null){const url=nova.trim().replace(/\/$/,"");localStorage.setItem("wa_server_url",url);setWaUrl(url);}
        }} style={{background:"transparent",border:"1px solid #BBF7D0",borderRadius:8,padding:"5px 9px",fontSize:13,cursor:"pointer",color:"#15803D"}}>⚙️</button>
        {waResultado&&<div style={{width:"100%",marginTop:4,fontSize:12,color:waResultado.error?"var(--danger)":"#15803D"}}>
          {waResultado.error
            ?"❌ "+waResultado.error
            :"✅ Enviado! "+waResultado.totalEventos+" evento(s) · "+waResultado.totalFuncionarios+" funcionário(s)"+(waResultado.semTelefone&&waResultado.semTelefone.length>0?" · 📵 sem tel: "+waResultado.semTelefone.join(", "):"")
          }
        </div>}
      </div>
      {/* ── Stats rápidos ── */}
      {(evFuturos.length>0||evPassados.length>0)&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
        <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 16px"}}>
          <div style={{fontSize:11,fontWeight:600,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Próximos</div>
          <div style={{fontSize:22,fontWeight:800,color:"var(--text)",letterSpacing:"-0.02em"}}>{evFuturos.length}</div>
        </div>
        <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 16px"}}>
          <div style={{fontSize:11,fontWeight:600,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Confirmados</div>
          <div style={{fontSize:22,fontWeight:800,color:"#16A34A",letterSpacing:"-0.02em"}}>{evFuturos.filter(e=>e.status==="Confirmado").length}</div>
        </div>
        <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 16px"}}>
          <div style={{fontSize:11,fontWeight:600,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Equipe total</div>
          <div style={{fontSize:22,fontWeight:800,color:"var(--primary)",letterSpacing:"-0.02em"}}>{[...new Set(evFuturos.flatMap(e=>e.equipe.map(m=>m.freelancerId)))].length}</div>
        </div>
      </div>}

      {/* Eventos futuros / atuais */}

                  .filter(f=>(mf.busca||"")===""||f.nome.toLowerCase().includes((mf.busca||"").toLowerCase()));
                if(flsBase.length===0)return<div style={{color:"var(--text3)",fontSize:12,textAlign:"center",padding:8}}>Nenhum resultado</div>;

                const sorted=[...flsBase].sort((a,b)=>{
                  const d=getOrdem(a)-getOrdem(b);

                  return mf.sortEstrelas?((b.estrelas||0)-(a.estrelas||0))||a.nome.localeCompare(b.nome,"pt-BR"):a.nome.localeCompare(b.nome,"pt-BR");

                  {bg:"#fffbeb",bord:"#d97706",txt:"#b45309",icon:"⚠️"},  // parcial

              <Sel label="Função" value={mf.funcao} onChange={e=>setFnMembro(e.target.value)}>

              <Inp label="Cachê (R$)" type="number" value={mf.cache} onChange={e=>setMf(f=>({...f,cache:e.target.value}))} placeholder="0,00"/>
              {mf.funcao&&fnDef(mf.funcao)>0&&mf.cache!==String(fnDef(mf.funcao))&&(
                <button onClick={()=>setMf(f=>({...f,cache:String(fnDef(mf.funcao))}))} style={{background:"#8b5cf615",border:"1px solid #8b5cf633",borderRadius:8,padding:"6px 10px",fontSize:11,color:"var(--primary)",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                  ↩ Restaurar padrão de {mf.funcao}: R$ {fnDef(mf.funcao).toFixed(2).replace(".",",")}
                </button>
              )}
              {/* Campo de observação — aparece quando a função tem pedirObs */}
              {mf.funcao&&funcoes.find(fn=>fn.nome===mf.funcao)?.pedirObs&&(
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:"#92400e",textTransform:"uppercase",letterSpacing:1,display:"flex",alignItems:"center",gap:5,marginBottom:6}}>
                    📝 Observação <span style={{color:"var(--danger)",fontSize:10}}>(obrigatória)</span>
                  </label>
                  <textarea
                    value={mf.obs||""}
                    onChange={e=>setMf(f=>({...f,obs:e.target.value}))}
                    placeholder="Ex: Levar fantasia X, chegar 30min antes, ponto de encontro..."
                    rows={2}
                    style={{background:"#fef9c3",border:`1.5px solid ${mf.obs?"#fde047":"var(--danger)"}`,borderRadius:8,padding:"8px 12px",color:"var(--text)",fontSize:12,outline:"none",fontFamily:"inherit",resize:"vertical",width:"100%",boxSizing:"border-box"}}
                  />
                  {!mf.obs&&<div style={{fontSize:10,color:"var(--danger)",marginTop:3}}>⚠ Esta função requer uma observação</div>}
                </div>
              )}
              {/* Preview de bônus */}
              {(()=>{
                const flSel=freelancers.find(f=>f.id===+mf.freelancerId);
                if(!flSel?.nivelBonus||!mf.cache)return null;
                const nivel=NIVEIS_BONUS.find(n=>n.id===flSel.nivelBonus);
                const dur=duracaoEvento(det);
                const autoAtivo=dur>180;
                return(
                  <div style={{background:nivel.cor+"15",border:`1px solid ${nivel.cor}33`,borderRadius:8,padding:"8px 12px",fontSize:12}}>
                    <div style={{color:nivel.cor,fontWeight:700,marginBottom:2}}>⭐ Bônus {nivel.label} configurado</div>
                    <div style={{color:"var(--text2)"}}>
                      {autoAtivo
                        ?`Evento com mais de 3h → bônus de R$${nivel.valor} ativado automaticamente. Total: R$ ${(+mf.cache+nivel.valor).toFixed(2).replace(".",",")}`
                        :`Evento com menos de 3h → bônus inativo por padrão. Você pode ativar manualmente após escalar.`}
                    </div>
                  </div>
                );
              })()}
              <Btn onClick={()=>addMembro(det.id)} style={{width:"100%",justifyContent:"center",opacity:(mf.freelancerId&&mf.funcao&&!(funcoes.find(fn=>fn.nome===mf.funcao)?.pedirObs&&!mf.obs))?1:0.4}}>＋ Adicionar à Escala</Btn>
              {!mf.freelancerId&&<div style={{fontSize:11,color:"var(--text3)",textAlign:"center"}}>👆 Selecione um freelancer primeiro</div>}
            </div>
          </div>
        </div>)}
      </div>

      <Modal open={!!modal} onClose={()=>setModal(null)} title={form.id?"Editar Evento":"Novo Evento"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Inp label="Nome do Evento" value={form.nome||""} onChange={e=>setForm(f=>({...f,nome:e.target.value}))}/>
          <Sel label="Tipo" value={form.tipo||"Aniversário Infantil"} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>{["Aniversário Infantil","Aniversário Adulto","Corporativo","Escolar","Casamento","Formatura","Outro"].map(t=><option key={t}>{t}</option>)}</Sel>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}><Inp label="Data" type="date" value={form.data||""} onChange={e=>setForm(f=>({...f,data:e.target.value}))}/><Inp label="Início" type="time" value={form.horaInicio||""} onChange={e=>setForm(f=>({...f,horaInicio:e.target.value}))}/><Inp label="Fim" type="time" value={form.horaFim||""} onChange={e=>setForm(f=>({...f,horaFim:e.target.value}))}/></div>
          <Inp label="Local" value={form.local||""} onChange={e=>setForm(f=>({...f,local:e.target.value}))} placeholder="Endereço completo"/>
          <Sel label="Status" value={form.status||"Confirmado"} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>{["Confirmado","Em negociação","Cancelado"].map(s=><option key={s}>{s}</option>)}</Sel>
          <Inp label="Observações" value={form.obs||""} onChange={e=>setForm(f=>({...f,obs:e.target.value}))}/>
          {/* Logística */}
          <div style={{background:"var(--bg)",borderRadius:10,padding:14,display:"flex",flexDirection:"column",gap:10}}>
            <div style={{fontWeight:700,color:"var(--text2)",fontSize:12,textTransform:"uppercase",letterSpacing:1}}>🚌 Logística (opcional)</div>
            <Inp label="Horário no Quintal — Saquarema" type="time" value={form.horarioQuintal||""} onChange={e=>setForm(f=>({...f,horarioQuintal:e.target.value}))} placeholder="Ex: 14:00"/>
            <Inp label="Horário no Galpão — Araruama" type="time" value={form.horarioGalpao||""} onChange={e=>setForm(f=>({...f,horarioGalpao:e.target.value}))} placeholder="Ex: 15:30"/>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>Obs. de Logística</label>
              <textarea value={form.obsLogistica||""} onChange={e=>setForm(f=>({...f,obsLogistica:e.target.value}))} placeholder="Ex: Levar fantasia X, ponto de encontro no estacionamento..." rows={2} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",resize:"vertical"}}/>
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:10}}><Btn variant="ghost" onClick={()=>setModal(null)}>Cancelar</Btn><Btn onClick={salvar}>Salvar</Btn></div>
        </div>
      </Modal>
      <Modal open={!!conflito} onClose={()=>setConflito(null)} title="⚠️ Atenção">
        {conflito&&<div style={{display:"flex",flexDirection:"column",gap:14}}><div style={{background:conflito.cor+"15",border:`1px solid ${conflito.cor}44`,borderRadius:10,padding:16,textAlign:"center"}}><div style={{fontSize:30,marginBottom:8}}>{conflito.tipo==="conflito"?"❌":conflito.tipo==="indisponivel"?"🚫":"⚠️"}</div><div style={{fontWeight:700,color:conflito.cor}}>{conflito.nome}</div><div style={{fontSize:13,color:"var(--text2)",marginTop:4}}>{conflito.msg}</div></div><div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><Btn variant="ghost" onClick={()=>setConflito(null)}>Cancelar</Btn><Btn variant="danger" onClick={conflito.onOk}>Adicionar mesmo assim</Btn></div></div>}
      </Modal>
      <Modal open={!!gcal} onClose={()=>setGcal(null)} title="📅 Google Agenda">
        {gcal&&<div style={{display:"flex",flexDirection:"column",gap:14}}><div style={{background:"var(--bg)",borderRadius:10,padding:14,fontSize:13,color:"var(--text2)"}}><div style={{fontWeight:700,color:"var(--text)",marginBottom:6}}>{gcal.nome}</div><div>📅 {fmtDate(gcal.data)} ⏰ {gcal.horaInicio}–{gcal.horaFim}</div><div>📍 {gcal.local}</div></div><Btn onClick={()=>{const p=new URLSearchParams({action:"TEMPLATE",text:gcal.nome,dates:`${toGCal(gcal.data,gcal.horaInicio)}/${toGCal(gcal.data,gcal.horaFim)}`,location:gcal.local});window.open(`https://calendar.google.com/calendar/render?${p}`,"_blank");setGcal(null);}} style={{background:"linear-gradient(135deg,#1a73e8,#4285f4)",border:"none",color:"#fff",justifyContent:"center"}}>🌐 Abrir no Google Calendar →</Btn></div>}
      </Modal>
      <ConfirmDelete open={!!confirmar} onClose={()=>setConfirmar(null)} onConfirm={()=>excluir(confirmar.id)} titulo={`Excluir "${confirmar?.nome}"?`} descricao="O evento e todas as escalas serão removidos permanentemente."/>
    </div>
  );
}


// ── ABA DISPONIBILIDADE ────────────────────────────────────────────────────────
function AbaDisponibilidade({freelancers,disponibilidade,setDisponibilidade}){
  const hoje=new Date();
  const[mes,setMes]=useState(hoje.getMonth());
  const[ano,setAno]=useState(hoje.getFullYear());
  const[sel,setSel]=useState(freelancers[0]?.id);
  const[busca,setBusca]=useState("");
  const[dispCloud,setDispCloud]=useState({});
  const[diaPopup,setDiaPopup]=useState(null); // data YYYY-MM-DD selecionada para popup

  const selFl=freelancers.find(f=>f.id===sel);

  // Carregar disponibilidade de TODOS os freelancers com userId ao montar
  useEffect(()=>{
    const flsComId=freelancers.filter(f=>f.userId);
    if(!flsComId.length)return;
    Promise.all(flsComId.map(f=>
      crossLoad(f.userId,"disponibilidade").then(d=>({id:f.id,d:d||{}}))
    )).then(results=>{
      const bulk={};
      results.forEach(({id,d})=>{bulk[id]=d;});
      setDispCloud(prev=>({...bulk,...prev}));
    });
  },[freelancers.map(f=>f.id+":"+(f.userId||"")).join(",")]);

  // Quando selecionar, recarregar do Supabase para garantir dados frescos
  useEffect(()=>{
    if(!selFl?.userId)return;
    crossLoad(selFl.userId,"disponibilidade").then(d=>{
      setDispCloud(prev=>({...prev,[sel]:d||{}}));
    });
  },[sel,selFl?.userId]);

  // Disponibilidade: se tem userId, usa do Supabase; senão usa do estado local do admin
  const getRawDisp=()=> selFl?.userId ? (dispCloud[sel]||{}) : (disponibilidade[sel]||{});
  const getStatusAdmin=k=>{const v=getRawDisp()[k];if(!v)return null;if(typeof v==="string")return v;return v?.status||"parcial";};
  const getCorAdmin=k=>{const s=getStatusAdmin(k);return DCORES[s]||null;};
  const getLabelAdmin=k=>{
    const v=getRawDisp()[k];
    if(!v||typeof v==="string")return null;
    if(v.tipo==="apos")return`Após ${v.hora}`;
    if(v.tipo==="antes")return`Até ${v.hora}`;
    if(v.tipo==="entre")return`${v.hora}–${v.hora2}`;
    return v.obs||"Parcial";
  };

  const dias=new Date(ano,mes+1,0).getDate();
  const prim=new Date(ano,mes,1).getDay();

  const togDia=dia=>{
    const k=`${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
    const ciclo=["disponivel","parcial","indisponivel",undefined];
    const rawD=getRawDisp();
    const curVal=typeof rawD[k]==="object"?rawD[k]?.status:rawD[k];
    const idx=ciclo.indexOf(curVal);
    const prox=ciclo[(idx+1)%ciclo.length];
    if(selFl?.userId){
      // Atualiza localmente (somente leitura para o admin — só o funcionário edita)
      setDispCloud(prev=>({...prev,[sel]:{...(prev[sel]||{}),[k]:prox}}));
    } else {
      setDisponibilidade(d=>({...d,[sel]:{...(d[sel]||{}),[k]:prox}}));
    }
  };

  const getDiasLivres=f=>{
    const d=f.userId?(dispCloud[f.id]||{}):(disponibilidade[f.id]||{});
    return Object.values(d).filter(v=>v==="disponivel").length;
  };

  // Get status of any freelancer on a given date key
  const getStatusFl=(f,k)=>{
    const d=f.userId?(dispCloud[f.id]||{}):(disponibilidade[f.id]||{});
    const v=d[k];
    if(!v)return null;
    if(typeof v==="string")return v;
    return v?.status||"parcial";
  };
  const getLabelFl=(f,k)=>{
    const d=f.userId?(dispCloud[f.id]||{}):(disponibilidade[f.id]||{});
    const v=d[k];
    if(!v||typeof v==="string")return null;
    if(v.tipo==="apos")return`Após ${v.hora}`;
    if(v.tipo==="antes")return`Até ${v.hora}`;
    if(v.tipo==="entre")return`${v.hora}–${v.hora2}`;
    return v.obs||"Parcial";
  };

  const filt=freelancers.filter(f=>f.nome?.toLowerCase().includes(busca.toLowerCase()));

  return(
    <div style={{padding:"24px 28px",flex:1,overflowY:"auto"}}>
      <div style={{marginBottom:20,paddingBottom:20,borderBottom:"1px solid var(--border)"}}><h2 style={{color:"var(--text)",margin:"0 0 4px",fontSize:18,fontWeight:600}}>Disponibilidade</h2>
      <p style={{color:"var(--text2)",margin:0,fontSize:13}}>Funcionários com acesso marcam a própria disponibilidade.</p></div>
      <div style={{display:"grid",gridTemplateColumns:"200px 1fr",gap:20}}>
        <div>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍" style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"8px 12px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",width:"100%",marginBottom:8,boxSizing:"border-box"}}/>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {filt.map(f=>{
              const n=getDiasLivres(f);
              return(<button key={f.id} onClick={()=>{setSel(f.id);}} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 10px",background:sel===f.id?"var(--primary-light)":"var(--card)",border:`1px solid ${sel===f.id?"var(--primary)":"var(--border)"}`,borderRadius:10,cursor:"pointer",textAlign:"left",width:"100%",fontFamily:"inherit"}}>
                <Avatar nome={f.nome} size={28}/>
                <div style={{flex:1,overflow:"hidden"}}>
                  <div style={{fontWeight:600,color:"var(--text)",fontSize:12,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{f.nome}</div>
                  <div style={{fontSize:10,color:f.userId?"var(--success)":"var(--text3)"}}>{f.userId?"✅ App ·":""} {n} dias livres</div>
                </div>
              </button>);
            })}
          </div>
        </div>
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <button onClick={()=>{if(mes===0){setMes(11);setAno(a=>a-1);}else setMes(m=>m-1);}} style={{background:"none",border:"none",color:"var(--text2)",cursor:"pointer",fontSize:22}}>‹</button>
            <div style={{fontWeight:700,color:"var(--text)",fontSize:14}}>{MESES[mes]} {ano} — {selFl?.nome}</div>
            <button onClick={()=>{if(mes===11){setMes(0);setAno(a=>a+1);}else setMes(m=>m+1);}} style={{background:"none",border:"none",color:"var(--text2)",cursor:"pointer",fontSize:22}}>›</button>
          </div>
          {selFl?.userId&&<div style={{background:"var(--success-light)",border:"1px solid #10b98133",borderRadius:8,padding:"8px 12px",fontSize:12,color:"var(--success)",marginBottom:12}}>✅ Disponibilidade marcada pelo próprio funcionário via app</div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:6}}>{["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=><div key={d} style={{textAlign:"center",fontSize:10,color:"var(--text3)",fontWeight:700,padding:"3px 0"}}>{d}</div>)}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
            {Array.from({length:prim}).map((_,i)=><div key={`e${i}`}/>)}
            {Array.from({length:dias}).map((_,i)=>{
              const dia=i+1;
              const k=`${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
              const cor=getCorAdmin(k);
              const label=getLabelAdmin(k);
              // Count how many freelancers have any status on this day
              const totalDisp=freelancers.filter(f=>{
                const d=f.userId?(dispCloud[f.id]||{}):(disponibilidade[f.id]||{});
                return d[k]==="disponivel";
              }).length;
              return(
                <div key={dia} style={{display:"flex",flexDirection:"column",gap:2}}>
                  <button onClick={()=>{setDiaPopup(k);}} style={{background:cor?cor+"22":"var(--surface)",border:`1px solid ${cor?cor+"55":"var(--border)"}`,borderRadius:7,padding:"7px 2px",color:cor||"var(--text3)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit",textAlign:"center",lineHeight:1,position:"relative"}}>
                    {dia}
                    {totalDisp>0&&<div style={{fontSize:7,marginTop:1,color:"var(--success)",fontWeight:700}}>{totalDisp}✓</div>}
                    {label&&!totalDisp&&<div style={{fontSize:7,marginTop:1,fontWeight:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",padding:"0 1px"}}>{label}</div>}
                  </button>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:14,marginTop:14,flexWrap:"wrap"}}>{Object.entries({disponivel:"Disponível",indisponivel:"Indisponível",parcial:"Parcial"}).map(([k,l])=><div key={k} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"var(--text2)"}}><div style={{width:10,height:10,borderRadius:3,background:DCORES[k]}}/>{l}</div>)}</div>
          <div style={{fontSize:11,color:"var(--text3)",marginTop:8}}>Clique em qualquer dia para ver a disponibilidade de todos</div>
        </Card>
      </div>

      {/* Popup de disponibilidade do dia */}
      {diaPopup&&(()=>{
        if(!diaPopup)return null; const [y,m,d]=diaPopup.split("-");
        const dataFmt=`${d}/${m}/${y}`;
        const disps=[],parciais=[],indisps=[],semInfo=[];
        freelancers.forEach(f=>{
          const st=getStatusFl(f,diaPopup);
          const lb=getLabelFl(f,diaPopup);
          const item={f,lb};
          if(st==="disponivel")disps.push(item);
          else if(st==="parcial")parciais.push(item);
          else if(st==="indisponivel")indisps.push(item);
          else semInfo.push(item);
        });
        const sortNome=(a,b)=>a.f.nome.localeCompare(b.f.nome,"pt-BR");
        disps.sort(sortNome);parciais.sort(sortNome);indisps.sort(sortNome);semInfo.sort(sortNome);
        const Section=({titulo,cor,bg,items})=>items.length===0?null:(
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:cor,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6,display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:cor}}/>{titulo} ({items.length})
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {items.map(({f,lb})=>(
                <div key={f.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:bg,borderRadius:"var(--radius)",border:`1px solid ${cor}33`}}>
                  <Avatar nome={f.nome} size={28}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,color:"var(--text)",fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{f.nome}</div>
                    {lb&&<div style={{fontSize:11,color:cor,marginTop:1}}>{lb}</div>}
                  </div>
                  {f.estrelas>0&&<div style={{color:"#f59e0b",fontSize:11}}>{"★".repeat(f.estrelas)}</div>}
                </div>
              ))}
            </div>
          </div>
        );
        return(
          <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(2px)"}}>  {/* backdrop — fechamento por clique externo desativado */}
            <div style={{background:"var(--card)",borderRadius:"var(--radius-lg)",padding:24,width:"100%",maxWidth:440,maxHeight:"80vh",overflowY:"auto",boxShadow:"0 20px 40px rgba(0,0,0,.15)"}} onClick={e=>e.stopPropagation()}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,paddingBottom:14,borderBottom:"1px solid var(--border)"}}>
                <div>
                  <div style={{fontWeight:700,color:"var(--text)",fontSize:16}}>Disponibilidade</div>
                  <div style={{fontSize:12,color:"var(--text2)",marginTop:2}}>{dataFmt}</div>
                </div>
                <button onClick={()=>setDiaPopup(null)} style={{background:"var(--surface)",border:"none",borderRadius:6,padding:"5px 8px",cursor:"pointer",color:"var(--text2)",fontSize:14}}>✕</button>
              </div>
              <Section titulo="Disponíveis" cor="var(--success)" bg="var(--success-light)" items={disps}/>
              <Section titulo="Restrição" cor="var(--warning)" bg="#FFFBEB" items={parciais}/>
              <Section titulo="Indisponíveis" cor="var(--danger)" bg="var(--danger-light)" items={indisps}/>
              <Section titulo="Sem informação" cor="var(--text3)" bg="var(--bg)" items={semInfo}/>
            </div>
          </div>
        );
      })()}
    </div>
  );
}
