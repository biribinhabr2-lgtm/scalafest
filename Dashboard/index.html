    </div>
  );
}

// ── ÁREA DO FUNCIONÁRIO ────────────────────────────────────────────────────────

function DisponibilidadeFuncionario({user,perfil,disp,setDisp}){
  const hoje=new Date();
  const[mes,setMes]=useState(hoje.getMonth());
  const[ano,setAno]=useState(hoje.getFullYear());
  const[modalParcial,setModalParcial]=useState(null); // key do dia
  const[parcialForm,setParcialForm]=useState({tipo:"apos",hora:"12:00",obs:""});
  const dias=new Date(ano,mes+1,0).getDate();
  const prim=new Date(ano,mes,1).getDay();
  const dispAtual=disp||{};
  const nDisp=Object.values(dispAtual).filter(v=>v==="disponivel").length;
  const nParcial=Object.values(dispAtual).filter(v=>typeof v==="object"&&v?.status==="parcial").length;

  // disp[k] pode ser: "disponivel" | "indisponivel" | {status:"parcial",tipo:"apos"|"antes"|"entre"|"obs",hora,hora2,obs}
  const getStatus=k=>{const v=dispAtual[k];if(!v)return null;if(typeof v==="string")return v;return v?.status||"parcial";};
  const getCor=k=>{const s=getStatus(k);return DCORES[s]||null;};
  const getLabel=k=>{
    const v=dispAtual[k];
    if(!v||typeof v==="string")return null;
    if(v.tipo==="apos")return`Após ${v.hora}`;
    if(v.tipo==="antes")return`Até ${v.hora}`;
    if(v.tipo==="entre")return`${v.hora}–${v.hora2}`;
    return v.obs||"Parcial";
  };

  const togDia=dia=>{
    const k=`${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
    const cur=getStatus(k);
    if(cur==="disponivel"){setDisp(d=>({...d,[k]:"indisponivel"}));return;}
    if(cur==="indisponivel"){setDisp(d=>({...d,[k]:undefined}));return;}
    if(cur==="parcial"){
      // Abrir modal para editar detalhe
      const v=dispAtual[k];
      setParcialForm(typeof v==="object"?{tipo:v.tipo||"apos",hora:v.hora||"12:00",hora2:v.hora2||"18:00",obs:v.obs||""}:{tipo:"apos",hora:"12:00",hora2:"18:00",obs:""});
      setModalParcial(k);return;
    }
    if(!cur){
      // Disponível direto
      setDisp(d=>({...d,[k]:"disponivel"}));return;
    }
  };

  const abrirParcial=dia=>{
    const k=`${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
    const v=dispAtual[k];
    setParcialForm(typeof v==="object"&&v?.status==="parcial"?{tipo:v.tipo||"apos",hora:v.hora||"12:00",hora2:v.hora2||"18:00",obs:v.obs||""}:{tipo:"apos",hora:"12:00",hora2:"18:00",obs:""});
    setModalParcial(k);
  };

  const salvarParcial=()=>{
    if(!modalParcial)return;
    setDisp(d=>({...d,[modalParcial]:{status:"parcial",...parcialForm}}));
    setModalParcial(null);
  };

  const fmtDia=k=>{if(!k)return"";const[y,m,d]=k.split("-");return`${d}/${m}`;};

  return(
    <div style={{padding:"16px 16px 24px"}}>
      <h2 style={{color:"var(--text)",margin:"0 0 4px",fontSize:18,fontWeight:600}}>Minha Disponibilidade</h2>
      <p style={{color:"var(--text3)",margin:"0 0 10px",fontSize:13}}>Olá, <strong style={{color:"var(--text)"}}>{perfil?.nome||user.email}</strong>! Marque os dias disponíveis.</p>
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        <span style={{background:"var(--success-light)",color:"var(--success)",border:"1px solid #10b98133",borderRadius:8,fontSize:12,padding:"4px 12px",fontWeight:600}}>{nDisp} disponíveis</span>
        {nParcial>0&&<span style={{background:"#FFFBEB",color:"var(--warning)",border:"1px solid #f59e0b33",borderRadius:8,fontSize:12,padding:"4px 12px",fontWeight:600}}>{nParcial} parciais</span>}
      </div>

      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:"16px 12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <button onClick={()=>{if(mes===0){setMes(11);setAno(a=>a-1);}else setMes(m=>m-1);}} style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text2)",cursor:"pointer",fontSize:18,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <div style={{fontWeight:700,color:"var(--text)",fontSize:16,fontFamily:"'Sora',sans-serif"}}>{MESES[mes]} {ano}</div>
          <button onClick={()=>{if(mes===11){setMes(0);setAno(a=>a+1);}else setMes(m=>m+1);}} style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text2)",cursor:"pointer",fontSize:18,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:8}}>
          {["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"var(--text3)",fontWeight:700,padding:"4px 0"}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,minWidth:0}}>
          {Array.from({length:prim}).map((_,i)=><div key={`e${i}`}/>)}
          {Array.from({length:dias}).map((_,i)=>{
            const dia=i+1;
            const k=`${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
            const status=getStatus(k);
            const cor=getCor(k);
            const label=getLabel(k);
            const isHoje=localDateStr()===k;
            return(
              <div key={dia} style={{display:"flex",flexDirection:"column",gap:2,minWidth:0,overflow:"hidden"}}>
                <button onClick={()=>togDia(dia)} style={{background:cor?cor+"22":"var(--surface)",border:`${isHoje?"2px":"1px"} solid ${cor?cor+"88":isHoje?"var(--primary)":"var(--border)"}`,borderRadius:8,padding:"8px 2px",color:cor||"var(--text3)",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",textAlign:"center",lineHeight:1,width:"100%",minWidth:0,overflow:"hidden",boxSizing:"border-box"}}>
                  {dia}
                  {label&&<div style={{fontSize:8,marginTop:2,fontWeight:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"100%",padding:"0 1px"}}>{label}</div>}
                </button>
                {status==="parcial"&&<button onClick={()=>abrirParcial(dia)} style={{background:"#FFFBEB",border:"1px solid #f59e0b44",borderRadius:4,padding:"2px",fontSize:9,color:"var(--warning)",cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>⚠</button>}
                {!status&&<button onClick={()=>abrirParcial(dia)} style={{background:"#2a304722",border:"1px dashed #2a3047",borderRadius:4,padding:"2px",fontSize:9,color:"var(--text3)",cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>½</button>}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:14,marginTop:14,flexWrap:"wrap"}}>
          {[["disponivel","var(--success)","Disponível"],["parcial","var(--warning)","Parcial (com restrição)"],["indisponivel","var(--danger)","Indisponível"]].map(([k,c,l])=>(
            <div key={k} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--text2)"}}><div style={{width:12,height:12,borderRadius:3,background:c}}/>{l}</div>
          ))}
        </div>
        <div style={{marginTop:12,background:"var(--bg)",borderRadius:10,padding:"10px 14px",fontSize:12,color:"var(--text3)"}}>
          Toque no dia: vazio→Disponível → Indisponível → Limpar<br/>
          Toque em <strong>½</strong> ou <strong>✎</strong> para marcar disponibilidade parcial com horário
        </div>
      </div>

      {/* Modal Disponibilidade Parcial */}
      {modalParcial&&(
        <div style={{position:"fixed",inset:0,background:"#000a",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>  {/* backdrop — fechamento por clique externo desativado */}
          <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:20,padding:28,width:"100%",maxWidth:420}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{color:"var(--text)",margin:0,fontSize:18}}>Disponibilidade Parcial — {fmtDia(modalParcial)}</h3>
              <button onClick={()=>setModalParcial(null)} style={{background:"none",border:"none",color:"var(--text2)",cursor:"pointer",fontSize:22}}>×</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:8}}>Tipo de restrição</label>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {[
                    ["apos","Disponível após","Tenho compromisso de manhã"],
                    ["antes","Disponível até","Tenho compromisso à tarde"],
                    ["entre","Disponível entre horários","Janela específica"],
                    ["obs","Outra restrição","Descrever livremente"],
                  ].map(([val,titulo,sub])=>(
                    <button key={val} onClick={()=>setParcialForm(f=>({...f,tipo:val}))} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:parcialForm.tipo===val?"var(--warning-light)":"var(--surface)",border:`1px solid ${parcialForm.tipo===val?"var(--warning)":"var(--border)"}`,borderRadius:10,cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
                      <div style={{width:18,height:18,borderRadius:"50%",border:`2px solid ${parcialForm.tipo===val?"var(--warning)":"var(--text3)"}`,background:parcialForm.tipo===val?"var(--warning)":"transparent",flexShrink:0}}/>
                      <div><div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{titulo}</div><div style={{fontSize:11,color:"var(--text3)"}}>{sub}</div></div>
                    </button>
                  ))}
                </div>
              </div>

              {(parcialForm.tipo==="apos"||parcialForm.tipo==="antes")&&(
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>{parcialForm.tipo==="apos"?"Disponível após":"Disponível até"}</label>
                  <input type="time" value={parcialForm.hora} onChange={e=>setParcialForm(f=>({...f,hora:e.target.value}))} style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",color:"var(--text)",fontSize:18,outline:"none",fontFamily:"inherit",width:"100%"}}/>
                  <div style={{fontSize:12,color:"var(--warning)",marginTop:4}}>
                    {parcialForm.tipo==="apos"?`Estarei disponível a partir das ${parcialForm.hora}`:`Estarei disponível até às ${parcialForm.hora}`}
                  </div>
                </div>
              )}

              {parcialForm.tipo==="entre"&&(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>Janela de disponibilidade</label>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      <label style={{fontSize:11,color:"var(--text3)"}}>Das</label>
                      <input type="time" value={parcialForm.hora} onChange={e=>setParcialForm(f=>({...f,hora:e.target.value}))} style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"inherit"}}/>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      <label style={{fontSize:11,color:"var(--text3)"}}>Até</label>
                      <input type="time" value={parcialForm.hora2||"18:00"} onChange={e=>setParcialForm(f=>({...f,hora2:e.target.value}))} style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"inherit"}}/>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:"var(--warning)"}}>Disponível das {parcialForm.hora} às {parcialForm.hora2||"18:00"}</div>
                </div>
              )}

              {parcialForm.tipo==="obs"&&(
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>Descreva a restrição</label>
                  <textarea value={parcialForm.obs} onChange={e=>setParcialForm(f=>({...f,obs:e.target.value}))} placeholder="Ex: Só posso até as 15h, tenho compromisso depois..." rows={3} style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",color:"var(--text)",fontSize:14,outline:"none",fontFamily:"inherit",resize:"vertical"}}/>
                </div>
              )}

              <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:4}}>
                <button onClick={()=>{setDisp(d=>({...d,[modalParcial]:undefined}));setModalParcial(null);}} style={{background:"transparent",border:"1px solid var(--border)",borderRadius:10,padding:"10px 16px",color:"var(--text2)",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>Limpar dia</button>
                <button onClick={salvarParcial} style={{background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:10,padding:"10px 20px",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Salvar</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MeusEventosFl({meuFl,meusEventos,fnCor,fmtD,freelancers,user,confirmacoes,setConfirmacoes,adminId}){
  const[busca,setBusca]=useState("");
  const[verPass,setVerPass]=useState(false);
  const[recusandoId,setRecusandoId]=useState(null);
  const[motivoRecusa,setMotivoRecusa]=useState("");
  const hoje=localDateStr();
  const evOrd=[...meusEventos].sort((a,b)=>{const d=a.data.localeCompare(b.data);return d!==0?d:(a.horaInicio||"").localeCompare(b.horaInicio||"");});
  const evProx=evOrd.filter(ev=>ev.data>=hoje);
  const evAnt=evOrd.filter(ev=>ev.data<hoje).reverse();
  const filtrar=list=>list.filter(ev=>ev.nome.toLowerCase().includes(busca.toLowerCase())||ev.local?.toLowerCase().includes(busca.toLowerCase()));
  const CardEv=({ev,compact})=>{
    const mb=ev.equipe.find(m=>m.freelancerId===meuFl.id);
    if(compact)return(
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:14}}>
        <div style={{fontWeight:700,color:"var(--text)",fontSize:14,marginBottom:6}}>{ev.nome}</div>
        <div style={{fontSize:12,color:"var(--text3)",marginBottom:8}}>{fmtD(ev.data)} {ev.horaInicio}–{ev.horaFim} · {ev.local}</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <span style={{background:fnCor(mb?.funcao)+"22",color:fnCor(mb?.funcao),border:`1px solid ${fnCor(mb?.funcao)}44`,borderRadius:6,fontSize:11,fontWeight:600,padding:"2px 8px"}}>{mb?.funcao}</span>
          <span style={{background:"var(--primary-light)",color:"var(--primary)",border:"1px solid #8b5cf644",borderRadius:6,fontSize:11,fontWeight:700,padding:"2px 8px"}}> R$ {calcCache(mb,ev).toFixed(2).replace(".",",")}</span>
          <span style={{background:mb?.pago?"var(--success-light)":"var(--warning-light)",color:mb?.pago?"var(--success)":"var(--warning)",border:`1px solid ${mb?.pago?"#10b98144":"var(--warning-light)"}`,borderRadius:6,fontSize:11,fontWeight:600,padding:"2px 8px"}}>{mb?.pago?"Pago":"Pendente"}</span>
        </div>
      </div>
    );
    return(
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:"16px 12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div><div style={{fontWeight:700,color:"var(--text)",fontSize:16,marginBottom:4}}>{ev.nome}</div><div style={{fontSize:12,color:"var(--text2)"}}>{ev.tipo}</div></div>
          <span style={{background:ev.status==="Confirmado"?"var(--success-light)":"var(--warning-light)",color:ev.status==="Confirmado"?"var(--success)":"var(--warning)",border:`1px solid ${ev.status==="Confirmado"?"#10b98144":"var(--warning-light)"}`,borderRadius:6,fontSize:11,fontWeight:600,padding:"3px 10px"}}>{ev.status}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          <div style={{background:"var(--bg)",borderRadius:10,padding:"10px 14px"}}><div style={{fontSize:11,color:"var(--text3)",marginBottom:3}}>DATA</div><div style={{fontSize:14,fontWeight:600,color:"var(--text)"}}>{fmtD(ev.data)}</div></div>
          <div style={{background:"var(--bg)",borderRadius:10,padding:"10px 14px"}}><div style={{fontSize:11,color:"var(--text3)",marginBottom:3}}>HORÁRIO</div><div style={{fontSize:14,fontWeight:600,color:"var(--text)"}}>{ev.horaInicio}–{ev.horaFim}</div></div>
          <div style={{background:"var(--bg)",borderRadius:10,padding:"10px 14px",gridColumn:"1/-1"}}><div style={{fontSize:11,color:"var(--text3)",marginBottom:3}}>LOCAL</div><div style={{fontSize:13,color:"var(--text)"}}>{ev.local}</div></div>
        </div>
        {/* Observações do evento */}
        {ev.obs&&(
          <div style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,padding:12,marginBottom:14,fontSize:13,display:"flex",flexDirection:"column",gap:4}}>
            <div style={{fontWeight:600,color:"var(--text2)",fontSize:11,textTransform:"uppercase",letterSpacing:"0.06em"}}>Observações</div>
            <div style={{color:"var(--text)",lineHeight:1.5}}>{ev.obs}</div>
          </div>
        )}
        {adminId&&<AbaEventItems eventId={ev.id} legacyId={ev.legacy_id||null} tenantId={adminId} readOnly categorias={["material","figurino"]}/>}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12,alignItems:"center"}}>
          <span style={{background:fnCor(mb?.funcao)+"22",color:fnCor(mb?.funcao),border:`1px solid ${fnCor(mb?.funcao)}44`,borderRadius:6,fontSize:12,fontWeight:600,padding:"4px 12px"}}>{mb?.funcao}</span>
          <span style={{background:"var(--primary-light)",color:"var(--primary)",border:"1px solid #bfdbfe",borderRadius:6,fontSize:12,fontWeight:700,padding:"4px 12px"}}> R$ {calcCache(mb,ev).toFixed(2).replace(".",",")}
            {mb?.bonus?.ativo&&(()=>{const n=NIVEIS_BONUS.find(x=>x.id===mb.bonus.nivel);return n?<span style={{fontSize:10,opacity:0.8}}> (+R${n.valor})</span>:null;})()}
          </span>
          <span style={{background:mb?.pago?"var(--success-light)":"#FFFBEB",color:mb?.pago?"var(--success)":"var(--warning)",border:`1px solid ${mb?.pago?"#bbf7d0":"#fde68a"}`,borderRadius:6,fontSize:12,fontWeight:600,padding:"4px 12px"}}>{mb?.pago?" Pago":"Pendente"}</span>
        </div>
        {/* Confirmar / Recusar presença */}
        {(()=>{
          const conf=getConfFl(confirmacoes,ev);
          const status=getConfStatus(conf);
          const recusandoEste=recusandoId===ev.id;
          if(status==='confirmed') return(
            <div style={{marginTop:12,padding:"10px 14px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:"var(--success)"}}>Presença confirmada</div>
                {conf.em&&<div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>em {new Date(conf.em).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>}
              </div>
              <button onClick={()=>setConfirmacoes(c=>({...c,[ev.id]:undefined}))} style={{background:"transparent",border:"1px solid var(--border)",borderRadius:8,padding:"6px 12px",color:"var(--text3)",fontSize:11,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>Desfazer</button>
            </div>
          );
          if(status==='declined') return(
            <div style={{marginTop:12,padding:"10px 14px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:"var(--danger)"}}>Presença recusada</div>
                {conf.motivo&&<div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>Motivo: {conf.motivo}</div>}
              </div>
              <button onClick={()=>setConfirmacoes(c=>({...c,[ev.id]:undefined}))} style={{background:"transparent",border:"1px solid #FECACA",borderRadius:8,padding:"6px 12px",color:"var(--danger)",fontSize:11,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>Desfazer</button>
            </div>
          );
          if(recusandoEste) return(
            <div style={{marginTop:12,padding:"12px 14px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:10}}>
              <div style={{fontSize:12,fontWeight:600,color:"var(--danger)",marginBottom:8}}>Motivo da recusa (opcional)</div>
              <textarea value={motivoRecusa} onChange={e=>setMotivoRecusa(e.target.value)} placeholder="Ex: Conflito de agenda, outro compromisso..." rows={2} style={{width:"100%",background:"var(--card)",border:"1px solid #FECACA",borderRadius:8,padding:"8px 10px",fontSize:13,color:"var(--text)",fontFamily:"inherit",outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button onClick={()=>{
                  const motivo=motivoRecusa.trim();
                  console.log(`[EscalaFest] ${meuFl.nome} recusou presença em "${ev.nome}"${motivo?` — Motivo: ${motivo}`:''}`);
                  setConfirmacoes(c=>({...c,[ev.id]:{status:'declined',em:new Date().toISOString(),motivo:motivo||null}}));
                  setRecusandoId(null);setMotivoRecusa("");
                }} style={{flex:1,background:"var(--danger)",border:"none",borderRadius:8,padding:"8px 16px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Confirmar recusa</button>
                <button onClick={()=>{setRecusandoId(null);setMotivoRecusa("");}} style={{background:"transparent",border:"1px solid var(--border)",borderRadius:8,padding:"8px 14px",fontSize:12,color:"var(--text2)",cursor:"pointer",fontFamily:"inherit"}}>Cancelar</button>
              </div>
            </div>
          );
          return(
            <div style={{marginTop:12,padding:"10px 14px",background:"#F8FAFC",border:"1px solid var(--border)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:"var(--text2)"}}>Confirme sua presença</div>
                <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>Confirme ou recuse sua escalação</div>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button onClick={()=>{
                  console.log(`[EscalaFest] ${meuFl.nome} confirmou presença em "${ev.nome}"`);
                  setConfirmacoes(c=>({...c,[ev.id]:{status:'confirmed',em:new Date().toISOString()}}));
                }} style={{background:"var(--success)",border:"none",borderRadius:8,padding:"8px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>✓ Confirmar</button>
                <button onClick={()=>{setRecusandoId(ev.id);setMotivoRecusa("");}} style={{background:"var(--danger-light)",border:"1px solid #FECACA",borderRadius:8,padding:"8px 12px",color:"var(--danger)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>✗ Recusar</button>
              </div>
            </div>
          );
        })()}
      </div>
    );
  };
  return(
    <div style={{padding:"16px 16px 80px"}}>
      <h2 style={{color:"var(--text)",margin:"0 0 4px",fontSize:18,fontWeight:600}}>Meus Eventos</h2>
      <p style={{color:"var(--text3)",margin:"0 0 16px",fontSize:13}}>Eventos em que você está escalado</p>
      {!meuFl&&<div style={{background:"#FFFBEB",border:"1px solid #f59e0b33",borderRadius:10,padding:20,textAlign:"center",color:"var(--warning)",fontSize:14}}>
        Seu cadastro ainda não foi vinculado. Peça ao coordenador para te adicionar com o e-mail <strong>{user.email}</strong>
      </div>}
      {meuFl&&<>
        <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar evento..." style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"8px 14px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",width:"100%",marginBottom:16,boxSizing:"border-box"}}/>
        {evProx.length===0&&!busca&&<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:32,textAlign:"center",color:"var(--text3)",marginBottom:16}}>Nenhum evento próximo escalado.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {filtrar(evProx).map(ev=><CardEv key={ev.id} ev={ev}/>)}
        </div>

// ── MINHA ESCALA (funcionário) ───────────────────────────────────────────────
function AbaMInhaEscala({meuFl,meusEventos,fnCor,fmtD,user,confirmacoes,setConfirmacoes,adminId}){
  const[view,setView]=useState("lista");
  const[mes,setMes]=useState(new Date().getMonth());
  const[ano,setAno]=useState(new Date().getFullYear());
  const[diaAtivo,setDiaAtivo]=useState(null);
  const[aberto,setAberto]=useState({});
  const[recusandoId,setRecusandoId]=useState(null);
  const[motivoRecusa,setMotivoRecusa]=useState("");
  const[verAnt,setVerAnt]=useState(false);
  const hoje=localDateStr();
  const evOrd=[...meusEventos].sort((a,b)=>a.data.localeCompare(b.data)||((a.horaInicio||"").localeCompare(b.horaInicio||"")));
  const evFut=evOrd.filter(ev=>ev.data>=hoje);
  const evAnt=evOrd.filter(ev=>ev.data<hoje).reverse();
  const pendConf=evFut.filter(ev=>getConfStatus(getConfFl(confirmacoes,ev))==="pending").length;
  const evPorData=meusEventos.reduce((a,ev)=>{if(!a[ev.data])a[ev.data]=[];a[ev.data].push(ev);return a;},{});

  const gerarICS=ev=>{
    if(!meuFl)return;
    const mb=ev.equipe?.find(m=>m.freelancerId===meuFl.id);
    const dt=(d,h)=>d.replace(/-/g,"")+`T`+(h||"00:00").replace(":","")+"00";
    const s=x=>(x||"").replace(/[,;\r\n]/g," ");
    const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EscalaFest//PT","BEGIN:VEVENT",
      `DTSTART;TZID=America/Sao_Paulo:${dt(ev.data,ev.horaInicio)}`,
      `DTEND;TZID=America/Sao_Paulo:${dt(ev.data,ev.horaFim||ev.horaInicio)}`,
      `SUMMARY:${s(ev.nome)}`,`LOCATION:${s(ev.local)}`,
      `DESCRIPTION:Função: ${s(mb?.funcao)} | Cachê: R$ ${calcCache(mb,ev).toFixed(2)}`,
      `UID:${ev.id}@escalafest`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
    const a=Object.assign(document.createElement("a"),{
      href:URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"})),
      download:`${(ev.nome||"evento").replace(/[^a-z0-9]/gi,"_")}.ics`
    });
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  };

  const ConfWidget=({ev})=>{
    const conf=getConfFl(confirmacoes,ev);
    const status=getConfStatus(conf);
    const este=recusandoId===ev.id;
    if(status==="confirmed")return(
      <div style={{marginTop:10,padding:"8px 12px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <div><div style={{fontSize:12,fontWeight:600,color:"var(--success)"}}>Presença confirmada</div>{conf?.em&&<div style={{fontSize:10,color:"var(--text3)",marginTop:1}}>{new Date(conf.em).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>}</div>
        <button onClick={()=>setConfirmacoes(c=>({...c,[ev.id]:undefined}))} style={{background:"transparent",border:"1px solid var(--border)",borderRadius:6,padding:"4px 10px",color:"var(--text3)",fontSize:11,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>Desfazer</button>
      </div>);
    if(status==="declined")return(
      <div style={{marginTop:10,padding:"8px 12px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <div><div style={{fontSize:12,fontWeight:600,color:"var(--danger)"}}>Presença recusada</div>{conf?.motivo&&<div style={{fontSize:11,color:"var(--text2)",marginTop:1}}>{conf.motivo}</div>}</div>
        <button onClick={()=>setConfirmacoes(c=>({...c,[ev.id]:undefined}))} style={{background:"transparent",border:"1px solid #FECACA",borderRadius:6,padding:"4px 10px",color:"var(--danger)",fontSize:11,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>Desfazer</button>
      </div>);
    if(este)return(
      <div style={{marginTop:10,padding:"10px 12px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8}}>
        <div style={{fontSize:12,fontWeight:600,color:"var(--danger)",marginBottom:6}}>Motivo da recusa (opcional)</div>
        <textarea value={motivoRecusa} onChange={e=>setMotivoRecusa(e.target.value)} placeholder="Ex: Conflito de agenda..." rows={2} style={{width:"100%",background:"var(--card)",border:"1px solid #FECACA",borderRadius:6,padding:"6px 8px",fontSize:13,color:"var(--text)",fontFamily:"inherit",outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:8,marginTop:6}}>
          <button onClick={()=>{const m=motivoRecusa.trim();setConfirmacoes(c=>({...c,[ev.id]:{status:"declined",em:new Date().toISOString(),motivo:m||null}}));setRecusandoId(null);setMotivoRecusa("");}} style={{flex:1,background:"var(--danger)",border:"none",borderRadius:6,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Confirmar recusa</button>
          <button onClick={()=>{setRecusandoId(null);setMotivoRecusa("");}} style={{background:"transparent",border:"1px solid var(--border)",borderRadius:6,padding:"6px 12px",fontSize:12,color:"var(--text2)",cursor:"pointer",fontFamily:"inherit"}}>Cancelar</button>
        </div>
      </div>);
    return(
      <div style={{marginTop:10,padding:"8px 12px",background:"#F8FAFC",border:"1px solid var(--border)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <div style={{fontSize:12,fontWeight:600,color:"var(--text2)"}}>Confirme sua presença</div>
        <div style={{display:"flex",gap:6,flexShrink:0}}>
          <button onClick={()=>setConfirmacoes(c=>({...c,[ev.id]:{status:"confirmed",em:new Date().toISOString()}}))} style={{background:"var(--success)",border:"none",borderRadius:6,padding:"6px 12px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>✓ Confirmar</button>
          <button onClick={()=>{setRecusandoId(ev.id);setMotivoRecusa("");}} style={{background:"var(--danger-light)",border:"1px solid #FECACA",borderRadius:6,padding:"6px 10px",color:"var(--danger)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>✗ Recusar</button>
        </div>
      </div>);
  };

  const CardEscala=({ev})=>{
    const mb=ev.equipe?.find(m=>m.freelancerId===meuFl?.id);
    const conf=getConfFl(confirmacoes,ev);
    const status=getConfStatus(conf);
    const isOpen=!!aberto[ev.id];
    const isHoje=ev.data===hoje;
    const isFut=ev.data>=hoje;
    const statusEmoji=status==="confirmed"?"✓":status==="declined"?"✗":"";
    return(
      <div style={{background:"var(--card)",border:`1px solid ${isHoje?"var(--primary)":"var(--border)"}`,borderRadius:12,overflow:"hidden"}}>
        {isHoje&&<div style={{background:"var(--primary)",padding:"3px 14px",fontSize:10,fontWeight:700,color:"#fff",letterSpacing:"0.07em",textTransform:"uppercase"}}> HOJE</div>}
        <div onClick={()=>setAberto(p=>({...p,[ev.id]:!p[ev.id]}))} style={{padding:"12px 14px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,userSelect:"none"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,color:"var(--text)",fontSize:15,marginBottom:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.nome}</div>
            <div style={{fontSize:12,color:"var(--text2)",display:"flex",flexWrap:"wrap",gap:"2px 8px"}}>
              <span>{fmtD(ev.data)}</span><span>{ev.horaInicio}–{ev.horaFim}</span>
            </div>
            {ev.local&&<div style={{fontSize:12,color:"var(--text3)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.local}</div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
            <span style={{fontSize:14}}>{statusEmoji} </span>
            <span style={{fontSize:9,color:"var(--text3)",display:"block",transition:"transform .2s",transform:isOpen?"rotate(180deg)":"none"}}>▼</span>
          </div>
        </div>
        <div style={{padding:"0 14px 12px",display:"flex",gap:6,flexWrap:"wrap"}}>
          {mb?.funcao&&<span style={{background:fnCor(mb.funcao)+"22",color:fnCor(mb.funcao),border:`1px solid ${fnCor(mb.funcao)}44`,borderRadius:6,fontSize:11,fontWeight:600,padding:"3px 10px"}}>{mb.funcao}</span>}
          <span style={{background:"var(--primary-light)",color:"var(--primary)",border:"1px solid #bfdbfe",borderRadius:6,fontSize:11,fontWeight:700,padding:"3px 10px"}}> R$ {calcCache(mb,ev).toFixed(2).replace(".",",")}</span>
          <span style={{background:mb?.pago?"var(--success-light)":"#FFFBEB",color:mb?.pago?"var(--success)":"var(--warning)",border:`1px solid ${mb?.pago?"#bbf7d0":"#fde68a"}`,borderRadius:6,fontSize:11,fontWeight:600,padding:"3px 10px"}}>{mb?.pago?" Pago":"Pendente"}</span>
        </div>
        {isOpen&&(
          <div style={{borderTop:"1px solid var(--border)",padding:"14px",display:"flex",flexDirection:"column",gap:12}}>
            {ev.obs&&(
              <div style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",fontSize:12}}>
                <div style={{fontWeight:600,color:"var(--text2)",fontSize:10,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>Observações</div>
                <div style={{color:"var(--text)",lineHeight:1.5}}>{ev.obs}</div>
              </div>)}
            {isFut&&<ConfWidget ev={ev}/>}
          </div>
        )}
      </div>
    );
  };
  return(
    <div style={{padding:"16px 16px 80px"}}>
      {pendConf>0&&<div style={{background:"#FFFBEB",border:"1px solid #fde68a",borderRadius:10,padding:"10px 16px",marginBottom:16,fontSize:13,color:"#92400e",fontWeight:600}}>
        Você tem {pendConf} evento{pendConf>1?"s":""} aguardando confirmação
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {evFut.map(ev=><CardEscala key={ev.id} ev={ev}/>)}
        {evFut.length===0&&<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:24,textAlign:"center",color:"var(--text3)"}}>Nenhum evento próximo escalado.</div>}
      </div>
      {evAnt.length>0&&(
        <div style={{marginTop:20}}>
          <button onClick={()=>setVerAnt(v=>!v)} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 16px",color:"var(--text2)",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600,marginBottom:12,width:"100%",display:"flex",alignItems:"center",gap:8}}>
            <span>{verAnt?"▼":"›"}</span> Eventos Anteriores ({evAnt.length})
          </button>
          {verAnt&&<div style={{display:"flex",flexDirection:"column",gap:10,opacity:0.75}}>
            {evAnt.map(ev=><CardEscala key={ev.id} ev={ev}/>)}
          </div>}
        </div>
      )}
    </div>
  );
}

function AppFuncionario({user,perfil,onLogout,adminId,perguntas}){
  const[aba,setAba]=useState("disponibilidade");
  const[mob,setMob]=useState(window.innerWidth<640);
  const[disp,setDisp]=useState({});
  const[eventos,setEventos]=useState([]);
  const[freelancers,setFreelancers]=useState([]);
  const[funcoes,setFuncoes]=useState([]);
  const[treinamentos,setTreinamentos]=useState([]);
  const[salvando,setSalvando]=useState(false);
  const[carregando,setCarregando]=useState(true);
  const[confirmacoes,setConfirmacoesState]=useState({});
  const[notifPermissao,setNotifPermissao]=useState(()=>{
    try{return typeof Notification!=="undefined"?Notification.permission:"unsupported";}
    catch{return "unsupported";}
  });
  const[pendFeedbackCount,setPendFeedbackCount]=useState(0);
  const[resolvedAdmin,setResolvedAdmin]=useState(adminId);
  const[nivelAcesso,setNivelAcesso]=useState("freelancer");
  const addToast=useToast();
  const saveTimer=useRef({});

  useEffect(()=>{const h=()=>setMob(window.innerWidth<640);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);

  useEffect(()=>{
    const load=async()=>{
      try{
        const {data:p}=await sb.from("sf_perfis").select("admin_id,nivel_acesso").eq("id",user.id).single();
        const resolvedAdminId=p?.admin_id||adminId;
        setResolvedAdmin(resolvedAdminId);
        setNivelAcesso(p?.nivel_acesso||"freelancer");
        if(!resolvedAdminId){setCarregando(false);return;}
        const[dsp,evs,fls,fns,trs,cfms]=await Promise.all([
          cloudLoad(user.id,"disponibilidade"),
          evSvc.list(resolvedAdminId),
          crossLoad(resolvedAdminId,"freelancers"),
          crossLoad(resolvedAdminId,"funcoes"),
          crossLoad(resolvedAdminId,"treinamentos"),
          cloudLoad(user.id,"confirmacoes"),
        ]);
        setDisp(dsp||{});setEventos(evs||[]);setFreelancers(fls||[]);
        setFuncoes(fns||FUNCOES_INIT);setTreinamentos(trs||[]);
        setConfirmacoesState(cfms||{});
      } catch(e){
        console.error("Erro ao carregar dados do funcionário:",e);
      } finally {
        setCarregando(false);
      }
    };
    load();
  },[user.id,adminId]);

  const schedSaveDisp=dados=>{clearTimeout(saveTimer.current.disp);setSalvando(true);saveTimer.current.disp=setTimeout(async()=>{await cloudSave(user.id,"disponibilidade",dados);setSalvando(false);},1500);};
  const setDispS=v=>{const next=typeof v==="function"?v(disp):v;setDisp(next);schedSaveDisp(next);};
  const setConfirmacoes=v=>{const next=typeof v==="function"?v(confirmacoes):v;setConfirmacoesState(next);cloudSave(user.id,"confirmacoes",next);};

  // ── NOTIFICAÇÕES ──────────────────────────────────────────────────────────
  // Solicitar permissão apenas quando usuário clicar no botão (não auto — mobile bloqueia)

  // Checar eventos do dia e novos eventos ao escalar (polling a cada 3 min)
  useEffect(()=>{
    if(carregando)return;
    const VISTO_KEY=`sf_notif_vistos_${user.id}`;
    const PRIMEIRO_KEY=`sf_notif_primeiro_${user.id}`;

    const check=async(isPrimeiro)=>{
      const hoje=localDateStr();
      if(!resolvedAdmin)return;
      const evsFrescos=await evSvc.list(resolvedAdmin).catch(()=>[]);
      const fls=await crossLoad(resolvedAdmin,"freelancers")||[];
      const meuFl=fls.find(f=>f.userId===user.id||f.email?.toLowerCase()===user.email?.toLowerCase());
      if(!meuFl)return;
      const vistos=JSON.parse(localStorage.getItem(VISTO_KEY)||"[]");
      const novosVistos=[...vistos];

      evsFrescos.forEach(ev=>{
        const membro=ev.equipe?.find(m=>m.freelancerId===meuFl.id);
        if(!membro)return;
        const chaveEscala=`escala_${ev.id}`;
        if(!vistos.includes(chaveEscala)){
          // Na primeira verificação, apenas marcar como visto sem notificar
          // (evita notificar eventos antigos na primeira vez que o funcionário abre o app)
          if(!isPrimeiro){
            dispararNotificacao("Você foi escalado!",`${ev.nome} — ${ev.data?ev.data.split("-").reverse().join("/"):""} às ${ev.horaInicio}`,chaveEscala);
          }
          novosVistos.push(chaveEscala);
        }
        // Notificação do dia do evento — sempre notifica (mesmo na primeira vez)
        if(ev.data===hoje){
          const chaveDia=`dia_${ev.id}_${hoje}`;
          if(!vistos.includes(chaveDia)){
            dispararNotificacao(
              `Evento hoje: ${ev.nome}`,
              `${ev.horaInicio}–${ev.horaFim} · ${ev.local}`,
              chaveDia
            );
            novosVistos.push(chaveDia);
          }
        }
      });
      if(novosVistos.length!==vistos.length){const capped=novosVistos.length>300?novosVistos.slice(-300):novosVistos;localStorage.setItem(VISTO_KEY,JSON.stringify(capped));}
    };

    // Primeira checagem: marcar tudo como visto sem notificar
    const isPrimeiro=!localStorage.getItem(PRIMEIRO_KEY);
    if(isPrimeiro)localStorage.setItem(PRIMEIRO_KEY,"1");
    check(isPrimeiro);
    const interval=setInterval(()=>check(false),3*60*1000);
    return()=>clearInterval(interval);
  },[carregando,resolvedAdmin]);

  // Encontrar o freelancer pelo userId OU email
  const meuFl=freelancers.find(f=>f.userId===user.id)||freelancers.find(f=>f.email?.toLowerCase()===user.email?.toLowerCase());
  const meusEventos=meuFl?eventos.filter(ev=>Array.isArray(ev.equipe)&&ev.equipe.find(m=>m.freelancerId===meuFl.id)):[];
  const fnCor=nome=>(funcoes.find(f=>f.nome===nome)||{}).cor||"var(--text3)";
  const fmtD=d=>{if(!d)return"";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;};

  // ── Todos os hooks ANTES do return condicional (Rules of Hooks) ──────────────
  const[gSubAba,setGSubAba]=useState("pendentes");
  const[gFMes,setGFMes]=useState("");
  const isSecretaria=perfil?.role==="secretario";
  const isGestao=nivelAcesso==="gestao";
  const ABAS_GESTAO=["checklist","todos_eventos","modelos"];
  useEffect(()=>{if(ABAS_GESTAO.includes(aba)&&!isGestao)setAba("disponibilidade");},[aba,isGestao]);

  if(carregando)return(<div style={{minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",flexDirection:"column",gap:16}}><img src={LOGO_URL} alt="EscalaFest" style={{height:90,objectFit:"contain"}}/><div style={{color:"var(--text3)",fontSize:14}}>Carregando...</div></div>);
  const NAV=isSecretaria?[
    {id:"eventos_admin",label:"Eventos"},
    {id:"disponibilidade_admin",label:"Disponib."},
    {id:"treinamentos_admin",label:"Treinos"},
    {id:"disponibilidade",label:"Minha Disp."},
    {id:"minha_escala",label:"Minha Escala"},
    {id:"feedback",label:"Feedback"},
    {id:"ranking",label:"Ranking"},
    {id:"triagem",label:"Triagem"},
  ]:[
    ...(isGestao?[{id:"todos_eventos",label:"Eventos"}]:[]),
    {id:"disponibilidade",label:"Disponibilidade"},
    {id:"eventos",label:"Meus Eventos"},
    {id:"ganhos",label:"Ganhos"},
    {id:"minha_escala",label:"Minha Escala"},
    {id:"treinamentos",label:"Treinamentos"},
    {id:"feedback",label:"Feedback"},
    {id:"ranking",label:"Ranking"},
    ...(isGestao?[
      {id:"checklist",label:"Checklist"},
      {id:"modelos",label:"Modelos"},
      {id:"servicos",label:"Serviços"},
      {id:"triagem",label:"Triagem"},
    ]:[]),
  ];
  const ganhosPorMes=meusEventos.reduce((acc,ev)=>{
    const mb=ev.equipe?.find(m=>m.freelancerId===meuFl?.id);
    if(!mb||!ev.data)return acc;
    const mes=ev.data.slice(0,7);
    const total=calcCache(mb,ev);
    if(!acc[mes])acc[mes]={mes,total:0,pago:0,pendente:0,eventos:[]};
    acc[mes].total+=total;
    if(mb.pago)acc[mes].pago+=total;
    else acc[mes].pendente+=total;
    acc[mes].eventos.push({...ev,membro:mb});
    return acc;
  },{});
  // Sorted oldest → newest
  const mesesOrdenados=Object.values(ganhosPorMes).sort((a,b)=>a.mes.localeCompare(b.mes));
  const mesesFiltrados=gFMes?mesesOrdenados.filter(m=>m.mes===gFMes):mesesOrdenados;
  const fmtMes=m=>{const[y,mo]=m.split("-");return`${MESES[+mo-1]} ${y}`;};
  const totalGeral=mesesOrdenados.reduce((s,m)=>s+m.total,0);
  const totalPago=mesesOrdenados.reduce((s,m)=>s+m.pago,0);
  const totalPendente=mesesOrdenados.reduce((s,m)=>s+m.pendente,0);
  const totalMesesFiltPend=mesesFiltrados.reduce((s,m)=>s+m.pendente,0);
  const totalMesesFiltPago=mesesFiltrados.reduce((s,m)=>s+m.pago,0);
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",background:"var(--bg)"}}>
      {/* Header — igual ao admin */}
      <header style={{background:"#0C6E7E",borderBottom:"none",padding:"0 20px",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,zIndex:100,boxShadow:"0 1px 4px rgba(0,0,0,.15)"}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <img src={LOGO_URL} alt="EscalaFest" style={{height:40,objectFit:"contain"}}/>
          {!mob&&<span style={{fontSize:11,fontWeight:600,color:"rgba(255,255,255,.55)",letterSpacing:"0.08em",textTransform:"uppercase"}}>Colaborador</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {!mob&&<button onClick={()=>{setCarregando(true);window.location.reload();}} className="sf-header-btn" title="Atualizar" style={{width:32,height:32,borderRadius:"50%",background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.18)",color:"rgba(255,255,255,.9)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit",fontSize:17,lineHeight:1,padding:0}}>↻</button>}

// Renderiza filhos apenas para admin ou nível gestão
function GestaoOnly({children,nivelAcesso}){
  return(nivelAcesso==="admin"||nivelAcesso==="gestao")?children:null;
}

// ── ABA EQUIPE COM CRIAR CONTA ─────────────────────────────────────────────────
function AbaEquipeAdmin({freelancers,setFreelancers,eventos,funcoes,adminUser,maxFl,onUpgrade,temSecretaria}){
  const[modal,setModal]=useState(false);const[modalCriar,setModalCriar]=useState(false);
  const[form,setForm]=useState({});const[formCriar,setFormCriar]=useState({email:"",senha:"",nome:"",telefone:"",funcoes:[],pix:"",obs:"",secretaria:false,nivel_acesso:"freelancer"});
  const[busca,setBusca]=useState("");const[confirmar,setConfirmar]=useState(null);const[loading,setLoading]=useState(false);const[msg,setMsg]=useState(null);
  const salvar=async()=>{
    if(!form.nome)return;
    const updated=form.id
      ?freelancers.map(f=>f.id===form.id?{...form}:f)
      :[...freelancers,{...form,id:Date.now()}];
    setFreelancers(updated);
    if(form.userId)await sb.from("sf_perfis").update({nivel_acesso:form.nivel_acesso||"freelancer"}).eq("id",form.userId);
    setModal(false);
  };
  const excluir=id=>{const updated=freelancers.filter(f=>f.id!==id);setFreelancers(updated);setConfirmar(null);};
  const togFn=fn=>setForm(f=>({...f,funcoes:(f.funcoes||[]).includes(fn)?f.funcoes.filter(x=>x!==fn):[...(f.funcoes||[]),fn]}));
  const togFnC=fn=>setFormCriar(f=>({...f,funcoes:(f.funcoes||[]).includes(fn)?f.funcoes.filter(x=>x!==fn):[...(f.funcoes||[]),fn]}));
  const evCount=id=>eventos.filter(ev=>ev.equipe?.find(m=>m.freelancerId===id)).length;
  const[filtroBonus,setFiltroBonus]=useState("todos");
  const filtBase=[...freelancers].filter(f=>f.nome?.toLowerCase().includes(busca.toLowerCase())).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  const filt=filtroBonus==="todos"?filtBase:filtroBonus==="sem"?filtBase.filter(f=>!f.nivelBonus):filtroBonus==="gestao"?filtBase.filter(f=>f.nivel_acesso==="gestao"):filtBase.filter(f=>f.nivelBonus===filtroBonus);
  const fnCor=nome=>(funcoes.find(f=>f.nome===nome)||{}).cor||"var(--text3)";
  const criarFuncionario=async()=>{
    if(!formCriar.email||!formCriar.senha||!formCriar.nome){setMsg({tipo:"erro",texto:"Preencha e-mail, senha e nome."});return;}
    setLoading(true);setMsg(null);

    // Criar um cliente Supabase separado para não afetar a sessão do admin.
    // storageKey único evita que o BroadcastChannel de auth seja compartilhado com sb,
    // impedindo que o SIGNED_IN do novo usuário dispare onAuthStateChange no admin.
    const sbTemp=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"sf-register-temp"}});
    const{data,error}=await sbTemp.auth.signUp({email:formCriar.email,password:formCriar.senha});

    if(error){
      setMsg({tipo:"erro",texto:error.message==="User already registered"?"Este e-mail já está cadastrado.":error.message});
      setLoading(false);return;
    }

    const uid=data.user?.id;
    if(uid){
      const roleAtrib=formCriar.secretaria?"secretario":"funcionario";
      await sb.from("sf_perfis").upsert({
        id:uid,role:roleAtrib,
        nome:formCriar.nome,telefone:formCriar.telefone,
        funcoes:formCriar.funcoes,pix:formCriar.pix,obs:formCriar.obs,
        admin_id:adminUser.id,
        nivel_acesso:formCriar.secretaria?"freelancer":(formCriar.nivel_acesso||"freelancer")
      });
      const novoFl={
        id:Date.now(),nome:formCriar.nome,telefone:formCriar.telefone,
        email:formCriar.email,funcoes:formCriar.funcoes,pix:formCriar.pix,
        obs:formCriar.obs,userId:uid,secretaria:formCriar.secretaria,
        nivel_acesso:formCriar.secretaria?"freelancer":(formCriar.nivel_acesso||"freelancer")
      };
      // Computar o novo array explicitamente para garantir valor correto ao salvar
      const novosFlArr=[...freelancers,novoFl];
      setFreelancers(novosFlArr);
      const tipoLabel=formCriar.secretaria?"secretária":"funcionário";
      setMsg({tipo:"ok",texto:`Conta de ${tipoLabel} criada! Envie o link do app, o e-mail "${formCriar.email}" e a senha.`});
      setTimeout(()=>setModalCriar(false),2500);
    } else {
      setMsg({tipo:"erro",texto:"Não foi possível obter o ID do usuário."});
    }
    setLoading(false);
  };
  return(
    <div style={{padding:24,flex:1,overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:20,fontWeight:800,letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:28,height:28,borderRadius:8,background:"#2563EB",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            Equipe
          </h2>
          <p style={{color:"var(--text3)",margin:"4px 0 0 36px",fontSize:12,fontWeight:500}}>{filt.length} de {freelancers.length} profissionais</p>

// ── ERROR BOUNDARY ────────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={erro:null};}
  static getDerivedStateFromError(e){return{erro:e};}
  componentDidCatch(e,info){console.error("[EscalaFest] Erro:",e,info);}
  render(){
    if(this.state.erro){
      return(
        <div style={{minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"#F8FAFC",flexDirection:"column",gap:16,padding:24,textAlign:"center"}}>
          <div style={{fontSize:32}}></div>
          <div style={{fontWeight:700,color:"#0F172A",fontSize:16}}>Algo deu errado</div>
          <div style={{fontSize:12,color:"#64748B",maxWidth:320}}>{this.state.erro?.message||"Erro inesperado"}</div>
          <button onClick={()=>window.location.reload()} style={{background:"#2563EB",color:"#fff",border:"none",borderRadius:8,padding:"10px 24px",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Recarregar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const Loader=()=>{
  const[slow,setSlow]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setSlow(true),6000);return()=>clearTimeout(t);},[]);
  return(
    <div style={{minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",flexDirection:"column",gap:16}}>
      <img src={LOGO_URL} alt="EscalaFest" style={{height:80,objectFit:"contain"}}/>
      <div style={{color:"var(--text3)",fontSize:12,letterSpacing:"0.04em"}}>Carregando...</div>
      {slow&&<button onClick={()=>window.location.reload()} style={{marginTop:8,background:"var(--primary)",border:"none",borderRadius:"var(--radius)",padding:"8px 20px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Tentar novamente</button>}
    </div>
  );
};

// ── CARD TREINO (componente separado para evitar perda de foco no mobile) ─────
function CardTreino({t,past,readOnly,meuId,meuNome,onTogglePresenca,onSalvarComentario,onExcluirComentario,treinoAberto,setTreinoAberto,interacoes}){
  const[novoComentario,setNovoComentario]=useState("");
  const inputRef=useRef(null);
  const inter=interacoes||{confirmados:{},comentarios:[]};
  const confirmados=inter.confirmados||{};
  const comentarios=[...(inter.comentarios||[])].sort((a,b)=>a.at.localeCompare(b.at));
  const euConfirmei=!!confirmados[meuId];
  const nConfirmados=Object.keys(confirmados).length;
  const aberto=treinoAberto===t.id;
  const fmtDia=d=>{if(!d)return"";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;};
  const diasRestantes=d=>{const diff=Math.ceil((new Date(d)-new Date())/(1000*60*60*24));if(diff<0)return null;if(diff===0)return"Hoje!";if(diff===1)return"Amanhã";return`em ${diff} dias`;};
  const fmtHora=iso=>{try{return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch{return"";}};
  const dias=diasRestantes(t.data);

  const enviar=()=>{
    if(!novoComentario.trim())return;
    onSalvarComentario(t,novoComentario.trim());
    setNovoComentario("");
    // Manter foco no input após enviar
    setTimeout(()=>inputRef.current?.focus(),50);
  };

  return(
    <div style={{background:"var(--card)",border:`1px solid ${past?"var(--border)":euConfirmei?"var(--success-light)":"var(--primary-light)"}`,borderRadius:16,overflow:"hidden",opacity:past?0.85:1}}>
      <div style={{padding:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,color:"var(--text)",fontSize:16,marginBottom:4}}>{t.titulo}</div>
            {t.descricao&&<div style={{fontSize:13,color:"var(--text2)",marginBottom:6}}>{t.descricao}</div>}
          </div>
          {dias&&<span style={{background:"var(--primary-light)",color:"var(--primary)",border:"1px solid #8b5cf633",borderRadius:8,fontSize:11,fontWeight:700,padding:"3px 10px",whiteSpace:"nowrap",marginLeft:8}}>{dias}</span>}
        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:14}}>
          <span style={{fontSize:13,color:"var(--text2)"}}>{fmtDia(t.data)}</span>
          {t.hora&&<span style={{fontSize:13,color:"var(--text2)"}}>{t.hora}</span>}
          {t.local&&<span style={{fontSize:13,color:"var(--text2)"}}>{t.local}</span>}
        </div>
        {!past&&(
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
            <button onClick={()=>onTogglePresenca(t)} style={{background:euConfirmei?"var(--success-light)":"var(--surface)",border:`1px solid ${euConfirmei?"var(--success)":"var(--border)"}`,borderRadius:10,padding:"8px 16px",color:euConfirmei?"var(--success)":"var(--text2)",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
              {euConfirmei?"Confirmado":"Confirmar presença"}
            </button>
            {nConfirmados>0&&<div style={{fontSize:12,color:"var(--text3)"}}>
              <span style={{color:"var(--success)",fontWeight:700}}>{nConfirmados}</span> {nConfirmados===1?"confirmação":"confirmações"}
              {!readOnly&&<span style={{color:"var(--text3)",marginLeft:4}}>({Object.values(confirmados).map(c=>c.nome).join(", ")})</span>}
            </div>}
          </div>
        )}
        {past&&nConfirmados>0&&<div style={{fontSize:12,color:"var(--text3)",marginBottom:12}}>{nConfirmados} {nConfirmados===1?"pessoa confirmou":"pessoas confirmaram"}</div>}
        <button onClick={()=>setTreinoAberto(aberto?null:t.id)} style={{display:"flex",alignItems:"center",gap:6,background:"transparent",border:"none",color:"var(--text3)",cursor:"pointer",fontFamily:"inherit",fontSize:12,padding:0,marginBottom:!readOnly&&!past?10:0}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          {comentarios.length>0?`${comentarios.length} comentário${comentarios.length!==1?"s":""}`:("Comentários e dúvidas")}
          <span style={{fontSize:10,marginLeft:2}}>{aberto?"▲":"▼"}</span>
        </button>
        {!readOnly&&!past&&(
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <Btn small variant="ghost" style={{flex:1,justifyContent:"center"}} onClick={()=>{}/* handled by parent */}>Editar</Btn>
            <Btn small variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>{}/* handled by parent */}>Excluir</Btn>
          </div>
        )}
      </div>
      {aberto&&(
        <div style={{borderTop:"1px solid var(--border)",padding:"14px 20px",background:"var(--bg)"}}>
          {comentarios.length===0&&<div style={{fontSize:13,color:"var(--text3)",marginBottom:14,textAlign:"center"}}>Nenhum comentário ainda.</div>}
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
            {comentarios.map(c=>(
              <div key={c.id} style={{background:"var(--card)",borderRadius:10,padding:"10px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
                <div style={{width:30,height:30,borderRadius:"50%",background:avatarColor(c.nome||"?"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",flexShrink:0}}>
                  {(c.nome||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span style={{fontSize:12,fontWeight:700,color:"var(--text)"}}>{c.nome}</span>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:10,color:"var(--text3)"}}>{fmtHora(c.at)}</span>
                      {(c.userId===meuId||!readOnly)&&<button onClick={()=>onExcluirComentario(t,c.id)} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:12,padding:"0 2px",opacity:0.6}}>×</button>}
                    </div>
                  </div>
                  <div style={{fontSize:13,color:"var(--text2)",wordBreak:"break-word"}}>{c.texto}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <input
              ref={inputRef}
              value={novoComentario}
              onChange={e=>setNovoComentario(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar();}}}
              placeholder="Escreva um comentário ou dúvida..."
              style={{flex:1,background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 14px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit"}}
            />
            <button onClick={enviar} disabled={!novoComentario.trim()} style={{background:"var(--primary)",border:"none",borderRadius:10,padding:"9px 16px",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",opacity:novoComentario.trim()?1:0.4}}>
              Enviar
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ABA TREINAMENTOS ──────────────────────────────────────────────────────────
function AbaTreinamentos({treinamentos,setTreinamentos,adminId,readOnly,user,perfil,freelancers}) /* refactored */{
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({});
  const[confirmar,setConfirmar]=useState(null);
  const[treinoAberto,setTreinoAberto]=useState(null);
  const[filtro,setFiltro]=useState("todos");
  const[verPass,setVerPass]=useState(false);
  // interacoes: {treinoId: {confirmados:{userId:{nome,at}}, comentarios:[{id,userId,nome,texto,at}]}}
  const[interacoes,setInteracoes]=useState({});
  const[carregandoInt,setCarregandoInt]=useState(false);
  const hoje=localDateStr();
  const meuId=user?.id;
  const meuNome=perfil?.nome||user?.email||"Você";
  const resolvedAdminId=adminId||user?.id;

  // Carregar interações: admin carrega de todos os freelancers, funcionário só as suas
  useEffect(()=>{
    if(!resolvedAdminId||!treinamentos.length)return;
    setCarregandoInt(true);
    const carregarTodas=async()=>{
      let merged={};
      if(!readOnly){
        // Admin: carregar interações de todos os freelancers com userId
        const comUserId=(freelancers||[]).filter(f=>f.userId);
        // Também carregar as próprias do admin
        const fontes=[{userId:meuId},...comUserId];
        await Promise.all(fontes.map(async f=>{
          const dados=await loadInteracoes(f.userId,resolvedAdminId);
          // Merge: para cada treinoId, mesclar confirmados e comentarios
          Object.entries(dados||{}).forEach(([tid,inter])=>{
            if(!merged[tid])merged[tid]={confirmados:{},comentarios:[]};
            merged[tid].confirmados={...merged[tid].confirmados,...(inter.confirmados||{})};
            // Comentários: adicionar sem duplicar pelo id
            (inter.comentarios||[]).forEach(c=>{
              if(!merged[tid].comentarios.find(x=>x.id===c.id))
                merged[tid].comentarios.push(c);
            });
          });
        }));
        // Ordenar comentários por data
        Object.values(merged).forEach(m=>{m.comentarios.sort((a,b)=>a.at.localeCompare(b.at));});
      } else {
        // Funcionário: carregar só as suas próprias
        merged=await loadInteracoes(meuId,resolvedAdminId)||{};
      }
      setInteracoes(merged);
      setCarregandoInt(false);
    };
    carregarTodas();
  },[resolvedAdminId,treinamentos.length,readOnly]);

  // Salvar interações do usuário atual
  const salvarMinhasInteracoes=async(novasInter)=>{
    await saveInteracoes(meuId,resolvedAdminId,novasInter);
  };

  // Obter interações mescladas para exibição (só admin vê tudo, funcionário vê as suas)
  const getInter=(tid)=>interacoes[tid]||{confirmados:{},comentarios:[]};

  const togglePresenca=(treino)=>{
    const tid=String(treino.id);
    // Atualiza localmente
    const minhasInter={...interacoes};
    if(!minhasInter[tid])minhasInter[tid]={confirmados:{},comentarios:[]};
    const novosConf={...minhasInter[tid].confirmados};
    if(novosConf[meuId])delete novosConf[meuId];
    else novosConf[meuId]={nome:meuNome,at:new Date().toISOString()};
    minhasInter[tid]={...minhasInter[tid],confirmados:novosConf};
    setInteracoes({...minhasInter});
    // Salvar só as minhas interações
    const minhas={};
    Object.entries(minhasInter).forEach(([k,v])=>{
      const confMeu=v.confirmados[meuId]?{[meuId]:v.confirmados[meuId]}:{};
      const comsMeus=v.comentarios.filter(c=>c.userId===meuId);
      if(Object.keys(confMeu).length||comsMeus.length)
        minhas[k]={confirmados:confMeu,comentarios:comsMeus};
    });
    salvarMinhasInteracoes(minhas);
  };

  const salvarComentario=(treino,texto)=>{
    const tid=String(treino.id);
    const novo={id:Date.now(),userId:meuId,nome:meuNome,texto,at:new Date().toISOString()};
    const minhasInter={...interacoes};
    if(!minhasInter[tid])minhasInter[tid]={confirmados:{},comentarios:[]};
    minhasInter[tid]={...minhasInter[tid],comentarios:[...minhasInter[tid].comentarios,novo]};
    setInteracoes({...minhasInter});
    // Salvar só as minhas
    const minhas={};
    Object.entries(minhasInter).forEach(([k,v])=>{
      const confMeu=v.confirmados[meuId]?{[meuId]:v.confirmados[meuId]}:{};
      const comsMeus=v.comentarios.filter(c=>c.userId===meuId);
      if(Object.keys(confMeu).length||comsMeus.length)
        minhas[k]={confirmados:confMeu,comentarios:comsMeus};
    });
    salvarMinhasInteracoes(minhas);
  };

  const excluirComentario=(treino,comentId)=>{
    const tid=String(treino.id);
    setInteracoes(prev=>{
      const novo={...prev,[tid]:{...prev[tid],comentarios:(prev[tid]?.comentarios||[]).filter(c=>c.id!==comentId)}};
      // Salvar
      const minhas={};
      Object.entries(novo).forEach(([k,v])=>{
        const confMeu=v.confirmados[meuId]?{[meuId]:v.confirmados[meuId]}:{};
        const comsMeus=v.comentarios.filter(c=>c.userId===meuId);
        if(Object.keys(confMeu).length||comsMeus.length)
          minhas[k]={confirmados:confMeu,comentarios:comsMeus};
      });
      salvarMinhasInteracoes(minhas);
      return novo;
    });
  };

  const ordenados=[...treinamentos].sort((a,b)=>a.data.localeCompare(b.data)||(a.hora||"").localeCompare(b.hora||""));
  const proximos=ordenados.filter(t=>t.data>=hoje);
  const passados=ordenados.filter(t=>t.data<hoje).reverse();

  const aplicarFiltro=lista=>{
    if(filtro==="confirmados")return lista.filter(t=>getInter(String(t.id)).confirmados[meuId]);
    if(filtro==="pendentes")return lista.filter(t=>!getInter(String(t.id)).confirmados[meuId]);
    return lista;
  };

  const salvar=()=>{
    if(!form.titulo||!form.data)return;
    if(form.id)setTreinamentos(t=>t.map(x=>x.id===form.id?{...form}:x));
    else setTreinamentos(t=>[...t,{...form,id:Date.now()}]);
    setModal(false);
  };
  const excluir=id=>{setTreinamentos(t=>t.filter(x=>x.id!==id));setConfirmar(null);};
  const proxFilt=aplicarFiltro(proximos);

  return(
    <div style={{padding:24,flex:1,overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:18,fontWeight:700,letterSpacing:"-0.01em"}}>Treinamentos</h2>
          <p style={{color:"var(--text3)",margin:"3px 0 0",fontSize:12}}>{readOnly?"Confirme presença e tire dúvidas":"Gerencie treinamentos — equipe confirma e comenta"}</p>
        </div>
        {!readOnly&&<Btn onClick={()=>{setForm({titulo:"",descricao:"",data:"",hora:"",local:""});setModal(true);}}>＋ Novo Treinamento</Btn>}
      </div>

      {/* Filtros */}
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {[["todos","Todos",proximos.length],["confirmados","Confirmei",proximos.filter(t=>getInter(String(t.id)).confirmados[meuId]).length],["pendentes","Pendentes",proximos.filter(t=>!getInter(String(t.id)).confirmados[meuId]).length]].map(([v,l,n])=>(
          <button key={v} onClick={()=>setFiltro(v)} style={{background:filtro===v?"var(--primary-light)":"var(--card)",border:`1px solid ${filtro===v?"var(--primary)":"var(--border)"}`,borderRadius:10,padding:"7px 14px",color:filtro===v?"var(--primary)":"var(--text2)",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
            {l} <span style={{background:filtro===v?"var(--primary-light)":"var(--surface)",borderRadius:20,padding:"1px 7px",fontSize:11}}>{n}</span>
          </button>
        ))}
        {carregandoInt&&<span style={{fontSize:11,color:"var(--text3)",alignSelf:"center"}}>carregando...</span>}
      </div>

      {proxFilt.length===0&&<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:32,textAlign:"center",color:"var(--text3)",marginBottom:20}}>
        {filtro==="confirmados"?"Você ainda não confirmou nenhum.":filtro==="pendentes"?"Você confirmou todos!":readOnly?"Nenhum treinamento agendado.":"Nenhum treinamento próximo. Crie um novo!"}
      </div>}

      <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:24}}>
        {proxFilt.map(t=>(
          <div key={t.id}>
            <CardTreino t={t} readOnly={readOnly} meuId={meuId} meuNome={meuNome}
              interacoes={getInter(String(t.id))}
              onTogglePresenca={togglePresenca}
              onSalvarComentario={salvarComentario}
              onExcluirComentario={excluirComentario}
              treinoAberto={treinoAberto} setTreinoAberto={setTreinoAberto}
            />
            {!readOnly&&t.data>=hoje&&(
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <Btn small variant="ghost" style={{flex:1,justifyContent:"center"}} onClick={()=>{setForm({...t});setModal(true);}}>Editar</Btn>
                <Btn small variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>setConfirmar(t)}>Excluir</Btn>
              </div>
            )}
          </div>
        ))}
      </div>

      {passados.length>0&&(
        <div>
          <button onClick={()=>setVerPass(v=>!v)} style={{display:"flex",alignItems:"center",gap:8,background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 16px",color:"var(--text2)",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600,marginBottom:12}}>
            <span>{verPass?"▼":"›"}</span> Treinamentos Anteriores ({passados.length})
          </button>
          {verPass&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
            {passados.map(t=><CardTreino key={t.id} t={t} past readOnly={readOnly} meuId={meuId} meuNome={meuNome}
              interacoes={getInter(String(t.id))}
              onTogglePresenca={togglePresenca} onSalvarComentario={salvarComentario} onExcluirComentario={excluirComentario}
              treinoAberto={treinoAberto} setTreinoAberto={setTreinoAberto}/>)}
          </div>}
        </div>
      )}

      <Modal open={modal} onClose={()=>setModal(false)} title={form.id?"Editar Treinamento":"Novo Treinamento"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Inp label="Título" value={form.titulo||""} onChange={e=>setForm(f=>({...f,titulo:e.target.value}))} placeholder="Ex: Treinamento de Personagem"/>
          <Inp label="Descrição (opcional)" value={form.descricao||""} onChange={e=>setForm(f=>({...f,descricao:e.target.value}))} placeholder="Detalhes do treinamento..."/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="Data" type="date" value={form.data||""} onChange={e=>setForm(f=>({...f,data:e.target.value}))}/>
            <Inp label="Horário" type="time" value={form.hora||""} onChange={e=>setForm(f=>({...f,hora:e.target.value}))}/>
          </div>
          <Inp label="Local (opcional)" value={form.local||""} onChange={e=>setForm(f=>({...f,local:e.target.value}))} placeholder="Endereço ou link online"/>
          <div style={{display:"flex",justifyContent:"flex-end",gap:10}}>
            <Btn variant="ghost" onClick={()=>setModal(false)}>Cancelar</Btn>
            <Btn onClick={salvar}>Salvar</Btn>
          </div>
        </div>
      </Modal>
      <ConfirmDelete open={!!confirmar} onClose={()=>setConfirmar(null)} onConfirm={()=>excluir(confirmar?.id)} titulo={`Excluir "${confirmar?.titulo}"?`} descricao="O treinamento será removido."/>
    </div>
  );
}

// ── ABA BONIFICAÇÕES ───────────────────────────────────────────────────────────
function AbaBonificacoes({bonificacoes,setBonificacoes}){
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({});
  const[confirmar,setConfirmar]=useState(null);

  const salvar=()=>{
    if(!form.label||!form.valor)return;
    const id=form.id||(form.label.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"")||Date.now().toString());
    if(form.id){
      setBonificacoes(b=>b.map(x=>x.id===form.id?{...form}:x));
    } else {
      setBonificacoes(b=>[...b,{...form,id}]);
    }
    setModal(false);
  };

  const excluir=id=>{setBonificacoes(b=>b.filter(x=>x.id!==id));setConfirmar(null);};

  const CORES=[
    "#3b82f6","#a855f7","#f59e0b","#10b981","#ef4444","#ec4899",
    "#f97316","#06b6d4","#84cc16","#6366f1","#14b8a6","#dc2626",
  ];

  return(
    <div style={{padding:"24px 28px",flex:1,overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,paddingBottom:20,borderBottom:"1px solid var(--border)",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:18,fontWeight:600}}>Bonificações</h2>
          <p style={{color:"var(--text2)",margin:"4px 0 0",fontSize:13}}>Configure níveis de bônus atribuídos aos profissionais. O bônus é adicionado ao cachê base.</p>
        </div>
        <Btn onClick={()=>{setForm({label:"",valor:"",cor:"#3b82f6"});setModal(true);}}>+ Nova bonificação</Btn>
      </div>

      {bonificacoes.length===0&&(
        <div style={{textAlign:"center",color:"var(--text3)",padding:"48px 0",fontSize:14}}>
          Nenhuma bonificação cadastrada.<br/>
          <span style={{fontSize:12}}>Crie ao menos uma para poder atribuí-la aos profissionais.</span>
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>
        {bonificacoes.map(b=>(
          <Card key={b.id}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
              <div style={{width:44,height:44,borderRadius:10,background:b.cor+"22",border:`2px solid ${b.cor}55`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <div style={{width:18,height:18,borderRadius:"50%",background:b.cor}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,color:"var(--text)",fontSize:16}}>{b.label}</div>
                <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>ID: {b.id}</div>
              </div>
            </div>
            <div style={{background:"var(--bg)",borderRadius:8,padding:"10px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center",border:"1px solid var(--border)"}}>
              <span style={{fontSize:12,color:"var(--text2)"}}>Cachê extra por evento</span>
              <span style={{fontSize:18,fontWeight:800,color:b.cor}}>+ R$ {Number(b.valor).toFixed(2).replace(".",",")}</span>
            </div>
            <div style={{fontSize:12,color:"var(--text2)",marginBottom:14,lineHeight:1.5}}>
              {(()=>{const t=b.tempoMin??180;const h=t>=60?`${Math.floor(t/60)}h${t%60?String(t%60).padStart(2,"0")+"min":""}`:t+"min";return<>Ativado automaticamente em eventos acima de <strong>{h}</strong>. Pode ser ativado/desativado manualmente na escala.</>})()}
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn small variant="ghost" style={{flex:1,justifyContent:"center"}} onClick={()=>{setForm({...b});setModal(true);}}>Editar</Btn>
              <Btn small variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>setConfirmar(b)}>Excluir</Btn>
            </div>
          </Card>
        ))}

        <button onClick={()=>{setForm({label:"",valor:"",cor:"#3b82f6"});setModal(true);}} style={{border:"2px dashed var(--border2)",borderRadius:"var(--radius-lg)",padding:20,background:"transparent",color:"var(--text3)",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,minHeight:180,fontFamily:"inherit",fontSize:13}}>
          <span style={{fontSize:22}}>+</span>Nova bonificação
        </button>

      <Modal open={modal} onClose={()=>setModal(false)} title={form.id?"Editar bonificação":"Nova bonificação"}>

          <Inp label="Cachê extra (R$)" type="number" min="0" step="1" value={form.valor||""} onChange={e=>setForm(f=>({...f,valor:+e.target.value}))} placeholder="Ex: 15"/>
          <div>
            <Inp label="Tempo mínimo do evento para ativar automaticamente (minutos)" type="number" min="1" step="15" value={form.tempoMin??180} onChange={e=>setForm(f=>({...f,tempoMin:+e.target.value}))} placeholder="180"/>

              {CORES.map(c=>(<button key={c} onClick={()=>setForm(f=>({...f,cor:c}))} style={{width:32,height:32,borderRadius:8,background:c,border:form.cor===c?"3px solid var(--text)":"2px solid transparent",cursor:"pointer",flexShrink:0}}/>))}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="color" value={form.cor||"#3b82f6"} onChange={e=>setForm(f=>({...f,cor:e.target.value}))} style={{width:42,height:36,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",padding:2}}/>
