// ── APP ────────────────────────────────────────────────────────────────────────
// ── ABA MOTORISTAS (ADMIN) ────────────────────────────────────────────────────
function AbaMotoristas({freelancers,eventos,motoristaDias,setMotoristaDias}){
  const hoje=localDateStr();
  const[dataSel,setDataSel]=useState(hoje);
  const fmtD=d=>{if(!d)return"";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;};

  const motoristas=freelancers.filter(f=>f.motorista&&f.userId);
  const evsDia=[...eventos].filter(e=>e.data===dataSel).sort((a,b)=>(a.horaInicio||"").localeCompare(b.horaInicio||""));
  const alocadosDia=motoristaDias[dataSel]||[];

  // Armazena pelo userId (auth ID) para o motorista encontrar sem depender do freelancer numérico
  const togMotorista=userId=>{
    setMotoristaDias(d=>{
      const cur=d[dataSel]||[];
      const next=cur.includes(userId)?cur.filter(x=>x!==userId):[...cur,userId];
      if(next.length===0){const{[dataSel]:_,...rest}=d;return rest;}
      return{...d,[dataSel]:next};
    });
  };

  // Navegar entre dias com eventos
  const diasComEventos=[...new Set(eventos.map(e=>e.data))].sort();
  const idxAtual=diasComEventos.indexOf(dataSel);
  const irPara=d=>setDataSel(d);

  return(
    <div style={{padding:"24px 28px",flex:1,overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24,paddingBottom:20,borderBottom:"1px solid var(--border)",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:18,fontWeight:600}}>🚗 Escala de Motoristas</h2>
          <p style={{color:"var(--text2)",margin:"4px 0 0",fontSize:13}}>Aloque motoristas por dia — eles verão todos os eventos da data no app</p>
        </div>
      </div>

      {motoristas.length===0?(
        <div style={{textAlign:"center",color:"var(--text3)",padding:"48px 0",fontSize:14,background:"var(--card)",border:"1px solid var(--border)",borderRadius:12}}>
          <div style={{fontSize:32,marginBottom:12}}>🚗</div>
          <div style={{fontWeight:600,color:"var(--text)",marginBottom:6}}>Nenhum motorista cadastrado</div>
          <div style={{fontSize:12}}>Vá em <strong>Equipe → Criar Acesso</strong> e selecione o tipo <strong>Motorista</strong>.</div>
        </div>
      ):(
        <>
          {/* Seletor de data */}
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:20,flexWrap:"wrap"}}>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <label style={{fontSize:11,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>Data</label>
              <input type="date" value={dataSel} onChange={e=>setDataSel(e.target.value)} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 14px",color:"var(--text)",fontSize:14,outline:"none",fontFamily:"inherit"}}/>
            </div>
            {diasComEventos.length>0&&(
              <div style={{display:"flex",gap:6,alignSelf:"flex-end",flexWrap:"wrap"}}>
                {idxAtual>0&&<button onClick={()=>irPara(diasComEventos[idxAtual-1])} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",color:"var(--text2)",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>‹ {fmtD(diasComEventos[idxAtual-1])}</button>}
                {idxAtual<diasComEventos.length-1&&<button onClick={()=>irPara(diasComEventos[idxAtual+1])} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",color:"var(--text2)",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{fmtD(diasComEventos[idxAtual+1])} ›</button>}
              </div>
            )}
            <div style={{alignSelf:"flex-end",paddingBottom:2,fontSize:13,color:"var(--text3)"}}>
              {evsDia.length===0?"Sem eventos nesta data":`${evsDia.length} evento${evsDia.length!==1?"s":""} nesta data`}
            </div>
          </div>

          {/* Grid principal */}
          <div style={{display:"grid",gridTemplateColumns:"minmax(260px,1fr) minmax(260px,1.4fr)",gap:20}}>

            {/* Coluna: Motoristas */}
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Motoristas — {fmtD(dataSel)}</div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {motoristas.map(f=>{
                  const alocado=alocadosDia.includes(f.userId);
                  return(
                    <button key={f.id} onClick={()=>togMotorista(f.userId)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:alocado?"#0C6E7E12":"var(--card)",border:`2px solid ${alocado?"#0C6E7E":"var(--border)"}`,borderRadius:12,cursor:"pointer",textAlign:"left",fontFamily:"inherit",transition:"all .12s"}}>
                      <div style={{width:40,height:40,borderRadius:"50%",background:avatarColor(f.nome),display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:"#fff",flexShrink:0}}>{initials(f.nome)}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,color:"var(--text)",fontSize:14}}>{f.nome}</div>
                        {f.telefone&&<div style={{fontSize:11,color:"var(--text3)"}}>📱 {f.telefone}</div>}
                      </div>
                      <div style={{width:26,height:26,borderRadius:"50%",border:`2px solid ${alocado?"#0C6E7E":"var(--border)"}`,background:alocado?"#0C6E7E":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:13,fontWeight:700,flexShrink:0,transition:"all .12s"}}>
                        {alocado?"✓":""}
                      </div>
                    </button>
                  );
                })}
              </div>
              {alocadosDia.length>0&&(
                <div style={{marginTop:14,background:"#0C6E7E12",border:"1px solid #0C6E7E33",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#0C6E7E",fontWeight:600}}>
                  ✅ {alocadosDia.length} motorista{alocadosDia.length!==1?"s":""} alocado{alocadosDia.length!==1?"s":""} para {fmtD(dataSel)}
                </div>
              )}
            </div>

            {/* Coluna: Eventos do dia */}
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Eventos do dia — visíveis ao motorista</div>
              {evsDia.length===0?(
                <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:32,textAlign:"center",color:"var(--text3)",fontSize:13}}>
                  Nenhum evento em {fmtD(dataSel)}
                </div>
              ):(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {evsDia.map(ev=>(
                    <div key={ev.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px"}}>
                      <div style={{fontWeight:700,color:"var(--text)",fontSize:14,marginBottom:6}}>{ev.nome}</div>
                      <div style={{fontSize:12,color:"var(--text2)",marginBottom:4}}>⏰ {ev.horaInicio}–{ev.horaFim}</div>
                      {ev.local&&<div style={{fontSize:12,color:"var(--text3)",marginBottom:6}}>📍 {ev.local}</div>}
                      {(ev.horarioQuintal||ev.horarioGalpao||ev.obsLogistica)&&(
                        <div style={{background:"#0C6E7E10",border:"1px solid #0C6E7E25",borderRadius:8,padding:"8px 10px",fontSize:12}}>
                          <div style={{fontWeight:700,color:"#0C6E7E",fontSize:10,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Logística</div>
                          {ev.horarioQuintal&&<div style={{color:"var(--text)"}}>🏡 Quintal Saquarema: <strong>{ev.horarioQuintal}</strong></div>}
                          {ev.horarioGalpao&&<div style={{color:"var(--text)"}}>🏭 Galpão Araruama: <strong>{ev.horarioGalpao}</strong></div>}
                          {ev.obsLogistica&&<div style={{color:"var(--text2)",marginTop:4}}>📋 {ev.obsLogistica}</div>}
                        </div>
                      )}
                      <div style={{marginTop:8,fontSize:11,color:"var(--text3)"}}>
                        {(ev.equipe||[]).length} pessoa{(ev.equipe||[]).length!==1?"s":""} na equipe
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Resumo de todas as alocações */}
          {Object.keys(motoristaDias).length>0&&(
            <div style={{marginTop:32,paddingTop:24,borderTop:"1px solid var(--border)"}}>
              <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>Todas as alocações</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {Object.entries(motoristaDias)
                  .sort(([a],[b])=>a.localeCompare(b))
                  .map(([date,ids])=>{
                    const nomes=ids.map(id=>motoristas.find(f=>f.userId===id)?.nome).filter(Boolean);
                    if(!nomes.length)return null;
                    const qtdEvs=eventos.filter(e=>e.data===date).length;
                    const isPast=date<hoje;
                    return(
                      <button key={date} onClick={()=>setDataSel(date)} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",background:dataSel===date?"#0C6E7E12":"var(--card)",border:`1px solid ${dataSel===date?"#0C6E7E":"var(--border)"}`,borderRadius:10,cursor:"pointer",textAlign:"left",fontFamily:"inherit",opacity:isPast?0.6:1}}>
                        <span style={{fontSize:13,fontWeight:700,color:dataSel===date?"#0C6E7E":"var(--text)",minWidth:76}}>📅 {fmtD(date)}</span>
                        <span style={{fontSize:12,color:"#0C6E7E",flex:1}}>🚗 {nomes.join(", ")}</span>
                        <span style={{fontSize:11,color:"var(--text3)",flexShrink:0}}>{qtdEvs} evento{qtdEvs!==1?"s":""}</span>
                        <button onClick={e=>{e.stopPropagation();setMotoristaDias(d=>{const{[date]:_,...rest}=d;return rest;});}} style={{background:"transparent",border:"1px solid #fecaca",borderRadius:6,padding:"3px 8px",color:"var(--danger)",fontSize:11,cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>Remover</button>
                      </button>
                    );
                  })
                }
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function App(){
  const[user,setUser]=useState(undefined);
  const[perfil,setPerfil]=useState(null);
  const[aba,setAba]=useState("eventos");
  const[fl,setFl]=useState([]);
  const[ev,setEv]=useState([]);
  const[disp,setDisp]=useState({});
  const[funcoes,setFuncoes]=useState([]);
  const[treinamentos,setTreinamentos]=useState([]);
  const[bonificacoes,setBonificacoesState]=useState(BONUS_INIT);
  const[perguntas,setPerguntasState]=useState(PERGUNTAS_INIT);
  const[motoristaDias,setMotoristaDiasState]=useState({});
  const[carregando,setCarregando]=useState(true);
  const[salvando,setSalvando]=useState(false);
  const[mob,setMob]=useState(typeof window!=="undefined"&&window.innerWidth<640);
  const[modalPlano,setModalPlano]=useState(false);
  const saveTimer=useRef({});

  const carregarDados=async(userId)=>{
    setCarregando(true);
    try{
      const[fls,evs,dsp,fns,trs,bns,pergs,md]=await Promise.all([
        cloudLoad(userId,"freelancers"),
        cloudLoad(userId,"eventos"),
        cloudLoad(userId,"disponibilidade"),
        cloudLoad(userId,"funcoes"),
        cloudLoad(userId,"treinamentos"),
        cloudLoad(userId,"bonificacoes"),
        cloudLoad(userId,"perguntas_feedback"),
        cloudLoad(userId,"motorista_escala"),
      ]);
      setFl(fls||FL_INIT);setEv(evs||EV_INIT);setDisp(dsp||DISP_INIT);
      setFuncoes(fns||FUNCOES_INIT);setTreinamentos(trs||[]);
      const bnsCarregados=bns||BONUS_INIT;
      setBonificacoesState(bnsCarregados);
      NIVEIS_BONUS=bnsCarregados;
      const prgCarregadas=pergs||PERGUNTAS_INIT;
      setPerguntasState(prgCarregadas);
      setMotoristaDiasState(md||{});
    }catch(e){
      console.error("Erro ao carregar dados:",e);
    }finally{
      setCarregando(false);
    }
  };

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>setUser(session?.user||null));
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>setUser(session?.user||null));
    const h=()=>setMob(window.innerWidth<640);
    window.addEventListener("resize",h);
    return()=>{subscription.unsubscribe();window.removeEventListener("resize",h);};
  },[]);

  useEffect(()=>{
    if(!user){setCarregando(false);setPerfil(null);return;}
    setCarregando(true);
    sb.from("sf_perfis").select("*").eq("id",user.id).single().then(async({data:p,error})=>{
      try{
        if(p&&(p.role==="funcionario"||p.role==="secretario"||p.role==="motorista")){
          setPerfil(p);
        } else if(p&&p.role==="admin"){
          // Existing admin — preserve trialInicio, never overwrite it
          let perfilFinal = p;
          if(!p.trialInicio){
            // Sem trialInicio — usar created_at do auth como referência
            const {data:userData}=await sb.auth.getUser();
            const trialInicio=(userData?.user?.created_at)||new Date().toISOString();
            await sb.from("sf_perfis").update({trialInicio}).eq("id",user.id);
            perfilFinal = {...p, trialInicio};
          }
          setPerfil(perfilFinal);
          await carregarDados(user.id);
          return;
        } else {
          // New user — only register as admin if no profile exists yet
          // This prevents funcionarios from escalating to admin
          const{data:existing}=await sb.from("sf_perfis").select("id").eq("id",user.id).single();
          if(!existing){
            const novoPerfil={id:user.id,role:"admin",admin_id:user.id,trialInicio:new Date().toISOString(),plano:null};
            await sb.from("sf_perfis").upsert(novoPerfil,{onConflict:"id"});
            setPerfil(novoPerfil);
            await carregarDados(user.id);
            return;
          } else {
            // Profile exists but no recognized role — treat as funcionario for safety
            setPerfil({...existing,role:"funcionario"});
          }
        }
      }catch(e){
        console.error("Erro no perfil:",e);
      }finally{
        setCarregando(false);
      }
    }).catch(e=>{
      console.error("Erro ao buscar perfil:",e);
      setCarregando(false);
    });
  },[user?.id]);

  const schedSave=(tipo,dados)=>{if(!user)return;clearTimeout(saveTimer.current[tipo]);setSalvando(true);saveTimer.current[tipo]=setTimeout(async()=>{await cloudSave(user.id,tipo,dados);setSalvando(false);},1500);};

  // Ativar plano após confirmação verificada pelo backend
  const onPlanoAtivado=async()=>{
    // O webhook do Asaas já atualizou sf_perfis — recarregamos do banco
    if(!user)return;
    const{data}=await sb.from("sf_perfis").select("*").eq("id",user.id).single();
    if(data) setPerfil(data);
    setModalPlano(false);
  };

  // Asaas não redireciona de volta com parâmetros — a ativação é via webhook.
  // O polling já é iniciado em aguardarAtivacao() dentro de TelaPagamento.

  // Limites e acessos pelo plano
  const maxFl=getMaxFl(perfil,user?.email);
  const temSecretaria=getSecretariaAcesso(perfil,user?.email);
  const temMotorista=getMotoristaAcesso(perfil,user?.email);
  const setFlS=v=>{const next=typeof v==="function"?v(fl):v;setFl(next);schedSave("freelancers",next);};
  const setEvS=v=>{const next=typeof v==="function"?v(ev):v;setEv(next);schedSave("eventos",next);};
  const setDispS=v=>{const next=typeof v==="function"?v(disp):v;setDisp(next);schedSave("disponibilidade",next);};
  const setFuncoesS=v=>{const next=typeof v==="function"?v(funcoes):v;setFuncoes(next);schedSave("funcoes",next);};
  const setTreinamentosS=v=>{const next=typeof v==="function"?v(treinamentos):v;setTreinamentos(next);schedSave("treinamentos",next);};
  const setBonificacoes=v=>{const next=typeof v==="function"?v(bonificacoes):v;setBonificacoesState(next);NIVEIS_BONUS=next;schedSave("bonificacoes",next);};
  const setPerguntas=v=>{const next=typeof v==="function"?v(perguntas):v;setPerguntasState(next);schedSave("perguntas_feedback",next);};
  const setMotoristaDias=v=>{const next=typeof v==="function"?v(motoristaDias):v;setMotoristaDiasState(next);if(user)cloudSave(user.id,"motorista_escala",next);};
  const logout=async()=>{await sb.auth.signOut();setUser(null);setPerfil(null);setFl([]);setEv([]);setDisp({});setFuncoes([]);setTreinamentos([]);};
  const resetarDados=()=>{if(!window.confirm("Tem certeza?"))return;setFlS(FL_INIT);setEvS(EV_INIT);setDispS(DISP_INIT);setFuncoesS(FUNCOES_INIT);};
  const refresh=()=>{if(user)carregarDados(user.id);};

  if(user===undefined||carregando)return <Loader/>;
  if(!user)return <TelaLogin onLogin={u=>setUser(u)}/>;
  if(perfil?.role==="motorista")return <AppMotorista user={user} perfil={perfil} onLogout={logout} adminId={perfil.admin_id}/>;
  if(perfil?.role==="funcionario"||perfil?.role==="secretario")return <AppFuncionario user={user} perfil={perfil} onLogout={logout} adminId={perfil.admin_id} perguntas={perguntas}/>;
  return(
    <div style={{display:"flex",flexDirection:"column",height:mob?undefined:"100vh",background:"var(--bg)"}}>
      {/* Header — Central de Escala */}
      <header style={{background:"#0C6E7E",borderBottom:"none",padding:"0 24px",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,zIndex:100,boxShadow:"0 1px 4px rgba(0,0,0,.15)",...(mob?{position:"sticky",top:0}:{})}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <img src={LOGO_URL} alt="EscalaFest" style={{height:40,objectFit:"contain",flexShrink:0}}/>
          <div style={{display:"flex",flexDirection:"column",justifyContent:"center",lineHeight:1.1}}>
            <span style={{fontFamily:"'Sora',sans-serif",fontWeight:800,fontSize:mob?16:18,color:"#fff",letterSpacing:"-0.01em"}}>EscalaFest</span>
            {!mob&&<span style={{fontSize:10,fontWeight:500,color:"rgba(255,255,255,.6)",letterSpacing:"0.1em",textTransform:"uppercase",marginTop:1}}>Central de Escala</span>}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {/* Plano badge */}
          {(()=>{
            const info=getPlanoAtual(perfil);
            if(!info)return null;
            const p=PLANOS.find(p=>p.id===info.plano);
            if(isMaster(user.email))return <span style={{fontSize:16,lineHeight:1}}>👑</span>;
            if(p)return <button onClick={()=>setModalPlano(true)} style={{background:p.cor+"33",border:`1px solid ${p.cor}55`,borderRadius:6,padding:"4px 10px",color:p.cor,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{p.nome}</button>;
            if(info.trialAtivo)return <button onClick={()=>setModalPlano(true)} style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.18)",borderRadius:6,padding:"4px 10px",color:"rgba(255,255,255,.9)",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Trial · {info.diasRestantes}d</button>;
            return <button onClick={()=>setModalPlano(true)} style={{background:"rgba(254,242,242,.15)",border:"1px solid rgba(252,165,165,.4)",borderRadius:6,padding:"4px 10px",color:"#FCA5A5",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Assinar</button>;
          })()}
          {/* Refresh — desktop only */}
          {!mob&&<button onClick={refresh} title="Atualizar dados" className="sf-header-btn" style={{width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.15)",borderRadius:"50%",color:"rgba(255,255,255,.8)",fontSize:15,cursor:"pointer",fontFamily:"inherit",transition:"background .15s",flexShrink:0}}>↻</button>}
          {/* Avatar */}
          <div title={user.email} style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.12))",border:"1.5px solid rgba(255,255,255,.3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"#fff",flexShrink:0,letterSpacing:"0.02em"}}>{user.email?user.email[0].toUpperCase():"?"}</div>
          {/* Sair — desktop only (mobile has it in bottom nav) */}
          {!mob&&<button onClick={logout} style={{background:"rgba(0,0,0,.18)",border:"1px solid rgba(255,255,255,.12)",borderRadius:7,padding:"5px 12px",color:"rgba(255,255,255,.75)",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:500,flexShrink:0}}>Sair</button>}
        </div>
      </header>
      {/* Banner trial */}
      <BannerPlano perfil={perfil} onUpgrade={()=>setModalPlano(true)} userEmail={user.email}/>
      {/* ── DESKTOP layout: sticky sidebar + inner-scroll main ── */}
      {!mob&&(
        <div style={{display:"flex",height:"calc(100vh - 52px)",overflow:"hidden"}}>
          <Sidebar aba={aba} setAba={setAba} onReset={resetarDados} userEmail={user.email} onLogout={logout} onRefresh={refresh} perfil={perfil}/>
          <main style={{flex:1,overflowY:"auto",position:"relative",background:"var(--bg)"}}>
            {salvando&&<div style={{position:"fixed",bottom:24,right:24,background:"#0F172A",borderRadius:12,padding:"9px 16px",fontSize:12,color:"#E2E8F0",zIndex:999,fontWeight:500,boxShadow:"0 8px 28px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:9,backdropFilter:"blur(8px)"}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:"#0C6E7E",flexShrink:0,animation:"pulseDot 1.4s ease-in-out infinite"}}/>
              Sincronizando...
            </div>}
            {aba==="eventos"&&<AbaEventos eventos={ev} setEventos={setEvS} freelancers={fl} disponibilidade={disp} funcoes={funcoes}/>}
            {aba==="equipe"&&<AbaEquipeAdmin freelancers={fl} setFreelancers={setFlS} eventos={ev} funcoes={funcoes} adminUser={user} maxFl={maxFl} onUpgrade={()=>setModalPlano(true)} temSecretaria={temSecretaria} temMotorista={temMotorista}/>}
            {aba==="motoristas"&&(temMotorista
              ? <AbaMotoristas freelancers={fl} eventos={ev} motoristaDias={motoristaDias} setMotoristaDias={setMotoristaDias}/>
              : <AbaLocked recurso="Escala de Motoristas" emoji="🚗" planoNecessario="Grande Empresa" onUpgrade={()=>setModalPlano(true)}/>
            )}
            {aba==="funcoes"&&<AbaFuncoes funcoes={funcoes} setFuncoes={setFuncoesS}/>}
            {aba==="disponibilidade"&&<AbaDisponibilidade freelancers={fl} disponibilidade={disp} setDisponibilidade={setDispS}/>}
            {aba==="treinamentos"&&<AbaTreinamentos treinamentos={treinamentos} setTreinamentos={setTreinamentosS} adminId={user.id} user={user} perfil={perfil} freelancers={fl}/>}
            {aba==="bonificacoes"&&<AbaBonificacoes bonificacoes={bonificacoes} setBonificacoes={setBonificacoes}/>}
            {aba==="feedback"&&<AbaFeedbackAdmin freelancers={fl} eventos={ev} adminId={user.id} perguntas={perguntas} setPerguntas={setPerguntas}/>}
            {aba==="plano"&&<AbaPlano perfil={perfil} userEmail={user.email} onUpgrade={()=>setModalPlano(true)} onPlanoAtivado={onPlanoAtivado} onCancelar={async()=>{
  const venc=perfil?.plano_vencimento?new Date(perfil.plano_vencimento).toLocaleDateString("pt-BR"):null;
  const msg=venc?`Seu plano continuará ativo até ${venc}. Após essa data, voltará ao plano gratuito.`:"Seu plano será cancelado.";
  if(window.confirm("Cancelar assinatura?\n\n"+msg)){
    await sb.from("sf_perfis").update({plano_cancelado_em:new Date().toISOString()}).eq("id",user.id);
    setPerfil(p=>({...p,plano_cancelado_em:new Date().toISOString()}));
  }
}}/>}
            {aba==="relatorios"&&<AbaRelatorios eventos={ev} setEventos={setEvS} freelancers={fl} funcoes={funcoes}/>}
          </main>
        </div>
      )}
      {/* ── MOBILE layout: body scroll, sticky header, fixed bottom nav ── */}
      {mob&&(
        <main style={{flex:1,position:"relative",background:"var(--bg)",paddingBottom:"calc(64px + env(safe-area-inset-bottom,0px))"}}>
          {salvando&&<div style={{position:"fixed",bottom:"calc(64px + env(safe-area-inset-bottom,0px))",right:16,background:"#0F172A",borderRadius:12,padding:"9px 16px",fontSize:12,color:"#E2E8F0",zIndex:999,fontWeight:500,boxShadow:"0 8px 28px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:9,backdropFilter:"blur(8px)"}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:"#0C6E7E",flexShrink:0,animation:"pulseDot 1.4s ease-in-out infinite"}}/>
            Sincronizando...
          </div>}
          {aba==="eventos"&&<AbaEventos eventos={ev} setEventos={setEvS} freelancers={fl} disponibilidade={disp} funcoes={funcoes}/>}
          {aba==="equipe"&&<AbaEquipeAdmin freelancers={fl} setFreelancers={setFlS} eventos={ev} funcoes={funcoes} adminUser={user} maxFl={maxFl} onUpgrade={()=>setModalPlano(true)} temSecretaria={temSecretaria} temMotorista={temMotorista}/>}
          {aba==="motoristas"&&(temMotorista
            ? <AbaMotoristas freelancers={fl} eventos={ev} motoristaDias={motoristaDias} setMotoristaDias={setMotoristaDias}/>
            : <AbaLocked recurso="Escala de Motoristas" emoji="🚗" planoNecessario="Grande Empresa" onUpgrade={()=>setModalPlano(true)}/>
          )}
          {aba==="funcoes"&&<AbaFuncoes funcoes={funcoes} setFuncoes={setFuncoesS}/>}
          {aba==="disponibilidade"&&<AbaDisponibilidade freelancers={fl} disponibilidade={disp} setDisponibilidade={setDispS}/>}
          {aba==="treinamentos"&&<AbaTreinamentos treinamentos={treinamentos} setTreinamentos={setTreinamentosS} adminId={user.id} user={user} perfil={perfil} freelancers={fl}/>}
          {aba==="bonificacoes"&&<AbaBonificacoes bonificacoes={bonificacoes} setBonificacoes={setBonificacoes}/>}
          {aba==="feedback"&&<AbaFeedbackAdmin freelancers={fl} eventos={ev} adminId={user.id} perguntas={perguntas} setPerguntas={setPerguntas}/>}
          {aba==="plano"&&<AbaPlano perfil={perfil} userEmail={user.email} onUpgrade={()=>setModalPlano(true)} onPlanoAtivado={onPlanoAtivado} onCancelar={async()=>{
  const venc=perfil?.plano_vencimento?new Date(perfil.plano_vencimento).toLocaleDateString("pt-BR"):null;
  const msg=venc?`Seu plano continuará ativo até ${venc}. Após essa data, voltará ao plano gratuito.`:"Seu plano será cancelado.";
  if(window.confirm("Cancelar assinatura?\n\n"+msg)){
    await sb.from("sf_perfis").update({plano_cancelado_em:new Date().toISOString()}).eq("id",user.id);
    setPerfil(p=>({...p,plano_cancelado_em:new Date().toISOString()}));
  }
}}/>}
          {aba==="relatorios"&&<AbaRelatorios eventos={ev} setEventos={setEvS} freelancers={fl} funcoes={funcoes}/>}
        </main>
      )}
      {mob&&<Sidebar aba={aba} setAba={setAba} mobile onReset={resetarDados} userEmail={user.email} onLogout={logout} onRefresh={refresh} perfil={perfil}/>}
      {/* Modal de planos */}
      {modalPlano&&<TelaPagamento perfil={perfil} onClose={()=>setModalPlano(false)} onPlanoAtivado={onPlanoAtivado} userEmail={user.email} userId={user.id}/>}
    </div>
  );
}
window._sfAppReady=true;
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);



</script>

<script>
// ── PWA: Service Worker via Blob (sem arquivo externo) ────────────────────────
(function(){
  // Injetar manifest dinamicamente
  const manifest = {
    name:"EscalaFest",
    short_name:"EscalaFest",
    start_url:"/",
    display:"standalone",
    background_color:"#F8FAFC",
    theme_color:"#2563EB",
    icons:[
      {src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%232563EB'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EEF%3C/text%3E%3C/svg%3E",sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},
      {src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%232563EB'/%3E%3Ctext x='256' y='340' font-size='260' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EEF%3C/text%3E%3C/svg%3E",sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const mUrl = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = mUrl;
  document.head.appendChild(link);

  // Apple touch icon inline SVG
  const iconSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%238b5cf6'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ESF%3C/text%3E%3C/svg%3E";
  const appleLink = document.createElement('link');
  appleLink.rel = 'apple-touch-icon'; appleLink.href = iconSvg;
  document.head.appendChild(appleLink);

  // SW via Blob só funciona em localhost — Vercel e outros hosts bloqueiam blob: para SW
  if (!('serviceWorker' in navigator)) return;
  const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isLocalhost) return; // produção usa Notification API direta, sem SW

  // SW inline via Blob — sem arquivo externo necessário
  const swCode = `
const CACHE = 'sf-v3';
self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
});
self.addEventListener('activate', e => {
  e.waitUntil(Promise.all([
    caches.keys().then(ks => Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))),
    self.clients.claim()
  ]));
});
self.addEventListener('fetch', e => {
  if (e.request.url.includes('supabase') || e.request.url.includes('fonts') || e.request.url.includes('unpkg') || e.request.url.includes('cdn.jsdelivr')) return;
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});
self.addEventListener('message', e => {
  if (e.data && e.data.type === 'NOTIFY') {
    self.registration.showNotification(e.data.title, {
      body: e.data.body,
      tag: e.data.tag || 'sf',
      renotify: true,
      vibrate: [200, 100, 200],
      icon: e.data.icon || ''
    });
  }
});
self.addEventListener('notificationclick', e => {
  e.notification.close();
  e.waitUntil(clients.matchAll({type:'window'}).then(cs => {
    if (cs.length) return cs[0].focus();
    return clients.openWindow('/');
  }));
});
  `;

  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(swBlob);

  navigator.serviceWorker.register(swUrl, {scope:'/'})
    .then(reg => {
      window._swReg = reg;

      // Instalar prompt PWA
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        window._installPrompt = e;
        window.dispatchEvent(new Event('sf-instalavel'));
      });
    })
    .catch(()=>{});
})();

// Disparar notificação via SW (funciona com aba em background no Android)
window.sfNotify = function(title, body, tag) {
  if (Notification.permission !== 'granted') return;
  // Tentar via SW primeiro (melhor suporte mobile)
  if (window._swReg && window._swReg.active) {
    window._swReg.active.postMessage({type:'NOTIFY', title, body, tag: tag||'sf'});
  } else {
    try { new Notification(title, {body}); } catch(e) {}
  }
};
</script>
</body>
</html>
