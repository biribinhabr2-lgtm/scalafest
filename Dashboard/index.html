              </div>
              {evProx.length===0?<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:40,textAlign:"center",color:"var(--text3)",fontSize:13}}>Nenhum evento futuro escalado.</div>:<div style={{display:"flex",flexDirection:"column",gap:14}}>{evProx.map(ev=><CardRoteiro key={ev.id} ev={ev}/>)}</div>}
            </div>
          )}
          {aba==="anteriores"&&(
            <div style={{padding:"16px 16px 80px"}}>
              <div style={{marginBottom:16}}>

                <p style={{color:"var(--text3)",margin:0,fontSize:13}}>{evAnt.length} evento{evAnt.length!==1?"s":""} realizados</p>
              </div>
              {evAnt.length===0?<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:40,textAlign:"center",color:"var(--text3)",fontSize:13}}>Nenhum evento anterior.</div>:<div style={{display:"flex",flexDirection:"column",gap:10}}>{evAnt.map(ev=><CardRoteiro key={ev.id} ev={ev} compact/>)}</div>}
            </div>
          )}

      </div>

              <button key={n.id} onClick={()=>setAba(n.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"10px 6px",background:"transparent",border:"none",borderBottom:aba===n.id?"2px solid #3B82F6":"2px solid transparent",color:aba===n.id?"#93C5FD":"#64748B",fontWeight:aba===n.id?600:400,fontSize:10,cursor:"pointer",fontFamily:"inherit",position:"relative"}}>

                {n.id==="hoje"&&evHoje.length>0&&<span style={{position:"absolute",top:6,right:"calc(50% - 18px)",background:"#EF4444",color:"#fff",borderRadius:20,fontSize:8,fontWeight:700,padding:"0 4px",lineHeight:"14px"}}>{evHoje.length}</span>}
              </button>
            ))}

            <button onClick={onLogout} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"10px 12px",background:"transparent",border:"none",color:"#EF4444",fontSize:16,cursor:"pointer"}}>⏻</button>
          </div>

      )}
    </div>
  );
}

function AppFuncionario({user,perfil,onLogout,adminId,perguntas}){
  const[aba,setAba]=useState("disponibilidade");
  const[mob,setMob]=useState(window.innerWidth<640);
  const[disp,setDisp]=useState({});
  const[eventos,setEventos]=useState([]);
  const[freelancers,setFreelancers]=useState([]);
  const[funcoes,setFuncoes]=useState([]);
  const[treinamentos,setTreinamentos]=useState([]);
  const[salvando,setSalvando]=useState(false);
  const[carregando,setCarregando]=useState(true);
  const[confirmacoes,setConfirmacoesState]=useState({});
  const[notifPermissao,setNotifPermissao]=useState(()=>{
    try{return typeof Notification!=="undefined"?Notification.permission:"unsupported";}
    catch{return "unsupported";}
  });
  const[pendFeedbackCount,setPendFeedbackCount]=useState(0);
  const[resolvedAdmin,setResolvedAdmin]=useState(adminId);
  const saveTimer=useRef({});

  useEffect(()=>{const h=()=>setMob(window.innerWidth<640);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);

  useEffect(()=>{
    const load=async()=>{
      try{
        const {data:p}=await sb.from("sf_perfis").select("admin_id").eq("id",user.id).single();
        const resolvedAdminId=p?.admin_id||adminId;
        setResolvedAdmin(resolvedAdminId);
        if(!resolvedAdminId){setCarregando(false);return;}
        const[dsp,evs,fls,fns,trs,cfms]=await Promise.all([
          cloudLoad(user.id,"disponibilidade"),
          crossLoad(resolvedAdminId,"eventos"),
          crossLoad(resolvedAdminId,"freelancers"),
          crossLoad(resolvedAdminId,"funcoes"),
          crossLoad(resolvedAdminId,"treinamentos"),
          cloudLoad(user.id,"confirmacoes"),
        ]);
        setDisp(dsp||{});setEventos(evs||[]);setFreelancers(fls||[]);
        setFuncoes(fns||FUNCOES_INIT);setTreinamentos(trs||[]);
        setConfirmacoesState(cfms||{});
      } catch(e){
        console.error("Erro ao carregar dados do funcionário:",e);
      } finally {
        setCarregando(false);
      }
    };
    load();
  },[user.id,adminId]);

  const schedSaveDisp=dados=>{clearTimeout(saveTimer.current.disp);setSalvando(true);saveTimer.current.disp=setTimeout(async()=>{await cloudSave(user.id,"disponibilidade",dados);setSalvando(false);},1500);};
  const setDispS=v=>{const next=typeof v==="function"?v(disp):v;setDisp(next);schedSaveDisp(next);};
  const setConfirmacoes=v=>{const next=typeof v==="function"?v(confirmacoes):v;setConfirmacoesState(next);cloudSave(user.id,"confirmacoes",next);};

  // ── NOTIFICAÇÕES ──────────────────────────────────────────────────────────
  // Solicitar permissão apenas quando usuário clicar no botão (não auto — mobile bloqueia)

  // Checar eventos do dia e novos eventos ao escalar (polling a cada 3 min)
  useEffect(()=>{
    if(carregando)return;
    const VISTO_KEY=`sf_notif_vistos_${user.id}`;
    const PRIMEIRO_KEY=`sf_notif_primeiro_${user.id}`;

    const check=async(isPrimeiro)=>{
      const hoje=localDateStr();
      if(!resolvedAdmin)return;
      const evsFrescos=await crossLoad(resolvedAdmin,"eventos")||[];
      const fls=await crossLoad(resolvedAdmin,"freelancers")||[];
      const meuFl=fls.find(f=>f.userId===user.id||f.email?.toLowerCase()===user.email?.toLowerCase());
      if(!meuFl)return;
      const vistos=JSON.parse(localStorage.getItem(VISTO_KEY)||"[]");
      const novosVistos=[...vistos];

      evsFrescos.forEach(ev=>{
        const membro=ev.equipe?.find(m=>m.freelancerId===meuFl.id);
        if(!membro)return;
        const chaveEscala=`escala_${ev.id}`;
        if(!vistos.includes(chaveEscala)){
          // Na primeira verificação, apenas marcar como visto sem notificar
          // (evita notificar eventos antigos na primeira vez que o funcionário abre o app)
          if(!isPrimeiro){
            dispararNotificacao("🎪 Você foi escalado!",`${ev.nome} — ${ev.data?ev.data.split("-").reverse().join("/"):""} às ${ev.horaInicio}`,chaveEscala);
          }
          novosVistos.push(chaveEscala);
        }
        // Notificação do dia do evento — sempre notifica (mesmo na primeira vez)
        if(ev.data===hoje){
          const chaveDia=`dia_${ev.id}_${hoje}`;
          if(!vistos.includes(chaveDia)){
            const logistica=[];
            if(ev.horarioQuintal)logistica.push(`Quintal ${ev.horarioQuintal}`);
            if(ev.horarioGalpao)logistica.push(`Galpão ${ev.horarioGalpao}`);
            dispararNotificacao(
              `📅 Evento hoje: ${ev.nome}`,
              `⏰ ${ev.horaInicio}–${ev.horaFim} · 📍 ${ev.local}${logistica.length?"\n🚌 "+logistica.join(" | "):""}`,
              chaveDia
            );
            novosVistos.push(chaveDia);
          }
        }
      });
      if(novosVistos.length!==vistos.length){const capped=novosVistos.length>300?novosVistos.slice(-300):novosVistos;localStorage.setItem(VISTO_KEY,JSON.stringify(capped));}
    };

    // Primeira checagem: marcar tudo como visto sem notificar
    const isPrimeiro=!localStorage.getItem(PRIMEIRO_KEY);
    if(isPrimeiro)localStorage.setItem(PRIMEIRO_KEY,"1");
    check(isPrimeiro);
    const interval=setInterval(()=>check(false),3*60*1000);
    return()=>clearInterval(interval);
  },[carregando,resolvedAdmin]);

  // Encontrar o freelancer pelo userId OU email
  const meuFl=freelancers.find(f=>f.userId===user.id)||freelancers.find(f=>f.email?.toLowerCase()===user.email?.toLowerCase());
  const meusEventos=meuFl?eventos.filter(ev=>Array.isArray(ev.equipe)&&ev.equipe.find(m=>m.freelancerId===meuFl.id)):[];
  const fnCor=nome=>(funcoes.find(f=>f.nome===nome)||{}).cor||"var(--text3)";
  const fmtD=d=>{if(!d)return"";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;};

  // ── Ganhos: agrupar eventos por mês — HOOKS DEVEM VIR ANTES DO RETURN CONDICIONAL ──
  const[gSubAba,setGSubAba]=useState("pendentes");
  const[gFMes,setGFMes]=useState("");

  if(carregando)return(<div style={{minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",flexDirection:"column",gap:16}}><img src={LOGO_URL} alt="EscalaFest" style={{height:90,objectFit:"contain"}}/><div style={{color:"var(--text3)",fontSize:14}}>Carregando...</div></div>);

  const isSecretaria=perfil?.role==="secretario";
  const NAV=isSecretaria?[
    {id:"eventos_admin",label:"Eventos"},
    {id:"disponibilidade_admin",label:"Disponib."},
    {id:"treinamentos_admin",label:"Treinos"},
    {id:"disponibilidade",label:"Minha Disp."},
    {id:"feedback",label:"Feedback"},
  ]:[
    {id:"disponibilidade",label:"Disponibilidade"},
    {id:"eventos",label:"Meus Eventos"},
    {id:"ganhos",label:"Ganhos"},
    {id:"treinamentos",label:"Treinamentos"},
    {id:"feedback",label:"Feedback"},
  ];
  const ganhosPorMes=meusEventos.reduce((acc,ev)=>{
    const mb=ev.equipe?.find(m=>m.freelancerId===meuFl?.id);
    if(!mb||!ev.data)return acc;
    const mes=ev.data.slice(0,7);
    const total=calcCache(mb,ev);
    if(!acc[mes])acc[mes]={mes,total:0,pago:0,pendente:0,eventos:[]};
    acc[mes].total+=total;
    if(mb.pago)acc[mes].pago+=total;
    else acc[mes].pendente+=total;
    acc[mes].eventos.push({...ev,membro:mb});
    return acc;
  },{});
  // Sorted oldest → newest
  const mesesOrdenados=Object.values(ganhosPorMes).sort((a,b)=>a.mes.localeCompare(b.mes));
  const mesesFiltrados=gFMes?mesesOrdenados.filter(m=>m.mes===gFMes):mesesOrdenados;
  const fmtMes=m=>{const[y,mo]=m.split("-");return`${MESES[+mo-1]} ${y}`;};
  const totalGeral=mesesOrdenados.reduce((s,m)=>s+m.total,0);
  const totalPago=mesesOrdenados.reduce((s,m)=>s+m.pago,0);
  const totalPendente=mesesOrdenados.reduce((s,m)=>s+m.pendente,0);
  const totalMesesFiltPend=mesesFiltrados.reduce((s,m)=>s+m.pendente,0);
  const totalMesesFiltPago=mesesFiltrados.reduce((s,m)=>s+m.pago,0);
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",background:"var(--bg)"}}>
      {/* Header — igual ao admin */}
      <header style={{background:"#0C6E7E",borderBottom:"none",padding:"0 20px",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,zIndex:100,boxShadow:"0 1px 4px rgba(0,0,0,.15)"}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <img src={LOGO_URL} alt="EscalaFest" style={{height:40,objectFit:"contain"}}/>
          {!mob&&<span style={{fontSize:11,fontWeight:600,color:"rgba(255,255,255,.55)",letterSpacing:"0.08em",textTransform:"uppercase"}}>Colaborador</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {!mob&&<button onClick={()=>{setCarregando(true);window.location.reload();}} className="sf-header-btn" title="Atualizar" style={{width:32,height:32,borderRadius:"50%",background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.18)",color:"rgba(255,255,255,.9)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit",fontSize:17,lineHeight:1,padding:0}}>↻</button>}
          <div title={perfil?.nome||user.email} style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.12))",border:"1px solid rgba(255,255,255,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"#fff",userSelect:"none",flexShrink:0}}>{(perfil?.nome||user.email||"?")[0].toUpperCase()}</div>
          {!mob&&<button onClick={onLogout} style={{background:"rgba(0,0,0,.2)",border:"1px solid rgba(255,255,255,.15)",borderRadius:6,padding:"4px 10px",color:"rgba(255,255,255,.85)",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:500}}>Sair</button>}
        </div>
      </header>
      {/* Layout */}
      <div style={{display:"flex",flex:1,overflow:"hidden",minHeight:0}}>
        {/* Sidebar desktop */}
        {!mob&&(<nav style={{width:220,background:"var(--sidebar)",display:"flex",flexDirection:"column",flexShrink:0}}>
          <div style={{padding:"16px 20px 12px",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
            <img src={LOGO_URL} alt="EscalaFest" style={{height:36,objectFit:"contain",display:"block"}}/>
          </div>
          <div style={{padding:"6px 0",flex:1,overflowY:"auto"}}>
            {NAV.map(n=>{const Icon=NAV_ICONS[n.id]||NAV_ICONS["disponibilidade"];return(<button key={n.id} onClick={()=>setAba(n.id)} className="sf-sidebar-item" style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px 10px 16px",background:aba===n.id?"rgba(12,110,126,.18)":"transparent",borderTop:"none",borderRight:"none",borderBottom:"none",borderLeft:aba===n.id?"3px solid #0C6E7E":"3px solid transparent",color:aba===n.id?"#E2E8F0":"#94A3B8",fontWeight:aba===n.id?600:400,fontSize:13,cursor:"pointer",width:"100%",textAlign:"left",fontFamily:"inherit",position:"relative",transition:"background .15s,color .15s"}}>
              <span style={{width:16,height:16,opacity:aba===n.id?1:.7,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon/></span>
              <span style={{flex:1}}>{n.label}</span>
              {n.id==="feedback"&&pendFeedbackCount>0&&<span style={{background:"#EF4444",color:"#fff",borderRadius:20,fontSize:10,fontWeight:700,padding:"1px 6px",flexShrink:0,lineHeight:"16px"}}>{pendFeedbackCount}</span>}
            </button>);})}
          </div>
          <div style={{padding:"12px 14px 20px",borderTop:"1px solid rgba(255,255,255,.06)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"rgba(255,255,255,.04)",borderRadius:10,marginBottom:10}}>
              <div style={{width:30,height:30,borderRadius:"50%",background:"linear-gradient(135deg,#0C6E7E,#1D4ED8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"#fff",flexShrink:0}}>{(perfil?.nome||user.email||"?")[0].toUpperCase()}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,color:"#CBD5E1",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{perfil?.nome||(user.email?.split("@")[0])||"Colaborador"}</div>
                <div style={{fontSize:10,color:"#475569",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.email}</div>
              </div>
            </div>
            <button onClick={onLogout} style={{background:"transparent",border:"1px solid rgba(239,68,68,.25)",borderRadius:6,color:"#EF4444",cursor:"pointer",fontSize:11,padding:"6px 10px",fontFamily:"inherit",width:"100%",textAlign:"center"}}>Encerrar sessão</button>
          </div>
        </nav>)}
        {/* Conteúdo */}
        <main style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",position:"relative",background:"var(--bg)"}}>
          {salvando&&<div style={{position:"fixed",bottom:24,right:24,background:"#0F172A",borderRadius:12,padding:"9px 16px",fontSize:12,color:"#E2E8F0",zIndex:999,fontWeight:500,boxShadow:"0 8px 28px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:9,backdropFilter:"blur(8px)"}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:"#0C6E7E",flexShrink:0,animation:"pulseDot 1.4s ease-in-out infinite"}}/>
            Sincronizando...
          </div>}
          {notifPermissao==="default"&&"Notification" in window&&(
            <div style={{background:"#EFF6FF",borderBottom:"1px solid #BFDBFE",padding:"10px 24px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <span style={{fontSize:13,color:"var(--text)",flex:1}}>Ative as notificações para receber alertas de novas escalas e eventos do dia.</span>
              <button onClick={async()=>{const ok=await pedirPermissaoNotificacao();setNotifPermissao(ok?"granted":"denied");if(ok){dispararNotificacao("✅ EscalaFest","Notificações ativadas!","sf-teste");}}} style={{background:"var(--primary)",border:"none",borderRadius:"var(--radius)",padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>Ativar notificações</button>
            </div>
          )}
          {notifPermissao==="granted"&&(
            <div style={{background:"var(--success-light)",borderBottom:"1px solid #BBF7D0",padding:"8px 24px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <span style={{fontSize:12,color:"var(--success)",flex:1}}>Notificações ativas</span>
              <button onClick={()=>{localStorage.removeItem(`sf_notif_vistos_${user.id}`);localStorage.removeItem(`sf_notif_primeiro_${user.id}`);dispararNotificacao("🎪 EscalaFest","Notificações funcionando!","teste");}} style={{background:"transparent",border:"1px solid #BBF7D0",borderRadius:6,padding:"4px 12px",color:"var(--success)",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Testar</button>
            </div>

                    <button key={mes} onClick={()=>setGFMes(mes)} style={{flexShrink:0,padding:"5px 12px",borderRadius:6,border:`1px solid ${gFMes===mes?"var(--primary)":"var(--border)"}`,background:gFMes===mes?"var(--primary)":"var(--card)",color:gFMes===mes?"#fff":"var(--text2)",fontSize:12,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
                      {MESES[+mo-1].slice(0,3)} {y.slice(2)}

            {/* Lista de eventos */}
            {mesesFiltrados.length===0&&<div style={{textAlign:"center",color:"var(--text3)",padding:"32px 0",fontSize:13}}>Nenhum evento neste período.</div>}
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {mesesFiltrados.map(({mes,pago,pendente,eventos:evs},i)=>{
                const evsFiltrados=evs.filter(ev=>gSubAba==="pagos"?ev.membro.pago:!ev.membro.pago).sort((a,b)=>a.data.localeCompare(b.data));

                  <div key={mes} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",overflow:"hidden"}}>

                      <div style={{fontWeight:700,color:"var(--text)",fontSize:14}}>{fmtMes(mes)}</div>
                      <div style={{fontSize:14,fontWeight:800,color:gSubAba==="pagos"?"var(--success)":"var(--warning)"}}>R$ {totalSub.toFixed(2).replace(".",",")}</div>
                    </div>
                    {gSubAba==="pagos"&&<div style={{height:3,background:"var(--success)"}}/>}
                    {gSubAba==="pendentes"&&pendente>0&&<div style={{height:3,background:"var(--warning)"}}/>}
                    <div style={{padding:"8px 10px",display:"flex",flexDirection:"column",gap:6}}>
                      {evsFiltrados.map(ev=>(
                        <div key={ev.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:"var(--bg)",borderRadius:"var(--radius)"}}>

                          </div>
                          <div style={{textAlign:"right",flexShrink:0}}>
                            <div style={{fontWeight:700,color:ev.membro?.pago?"var(--success)":"var(--warning)",fontSize:14}}>R$ {calcCache(ev.membro||{},ev).toFixed(2).replace(".",",")}</div>
                            {ev.membro.bonus?.ativo&&(()=>{const n=NIVEIS_BONUS.find(x=>x.id===ev.membro.bonus.nivel);return n?<div style={{fontSize:10,color:n.cor}}>+R${n.valor}</div>:null;})()}
                          </div>
                        </div>
                      ))}
                    </div>
                    <div style={{padding:"8px 14px",borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-between"}}>
                      <span style={{fontSize:11,color:"var(--text3)"}}>{evsFiltrados.length} evento{evsFiltrados.length!==1?"s":""}</span>
                      <span style={{fontSize:13,fontWeight:700,color:"var(--text)"}}>R$ {totalSub.toFixed(2).replace(".",",")}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {aba==="eventos"&&<MeusEventosFl meuFl={meuFl} meusEventos={meusEventos} fnCor={fnCor} fmtD={fmtD} freelancers={freelancers} user={user} confirmacoes={confirmacoes} setConfirmacoes={setConfirmacoes}/>}
        {aba==="treinamentos"&&<AbaTreinamentos treinamentos={treinamentos} setTreinamentos={setTreinamentos} readOnly adminId={resolvedAdmin} user={user} perfil={perfil}/>}
        {aba==="feedback"&&<AbaFeedback meuFl={meuFl} meusEventos={meusEventos} user={user} adminId={resolvedAdmin} perguntas={perguntas} onPendingChange={setPendFeedbackCount}/>}
        </main>
      </div>
      {/* Mobile nav — fora do flex row, fixo na base */}
      {mob&&(<nav style={{background:"var(--sidebar)",borderTop:"1px solid rgba(255,255,255,.06)",display:"flex",flexShrink:0}}>
        <div style={{display:"flex",flex:1,overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          {NAV.map(n=>{const Icon=NAV_ICONS[n.id]||NAV_ICONS["disponibilidade"];return(<button key={n.id} onClick={()=>setAba(n.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 14px",background:"transparent",border:"none",borderBottom:aba===n.id?"2px solid #0C6E7E":"2px solid transparent",color:aba===n.id?"#5EEAD4":"#64748B",fontWeight:aba===n.id?600:400,fontSize:10,cursor:"pointer",fontFamily:"inherit",flexShrink:0,minWidth:60,position:"relative",transition:"color .15s"}}>
            <span style={{width:18,height:18,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon/></span>
            <span>{n.label==="Disponibilidade"?"Disp.":n.label==="Minha Disp."?"Minha":n.label==="Meus Eventos"?"Eventos":n.label==="Treinamentos"?"Treinos":n.label}</span>
            {n.id==="feedback"&&pendFeedbackCount>0&&<span style={{position:"absolute",top:6,right:6,background:"#EF4444",color:"#fff",borderRadius:20,fontSize:8,fontWeight:700,padding:"0 4px",lineHeight:"14px"}}>{pendFeedbackCount}</span>}
          </button>);})}
        </div>
        <div style={{display:"flex",borderLeft:"1px solid rgba(255,255,255,.06)",flexShrink:0}}>
          <button onClick={()=>{setCarregando(true);window.location.reload();}} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 12px",background:"transparent",border:"none",color:"#475569",fontSize:18,cursor:"pointer",fontFamily:"inherit"}}>↻</button>
          <button onClick={onLogout} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 12px",background:"transparent",border:"none",color:"#EF4444",fontSize:16,cursor:"pointer",fontFamily:"inherit"}}>⏻</button>
        </div>
      </nav>)}
    </div>
  );
}

// ── ABA EQUIPE COM CRIAR CONTA ─────────────────────────────────────────────────
function AbaEquipeAdmin({freelancers,setFreelancers,eventos,funcoes,adminUser,maxFl,onUpgrade,temSecretaria,temMotorista}){
  const[modal,setModal]=useState(false);const[modalCriar,setModalCriar]=useState(false);
  const[form,setForm]=useState({});const[formCriar,setFormCriar]=useState({email:"",senha:"",nome:"",telefone:"",funcoes:[],pix:"",obs:"",secretaria:false,motorista:false});
  const[busca,setBusca]=useState("");const[confirmar,setConfirmar]=useState(null);const[loading,setLoading]=useState(false);const[msg,setMsg]=useState(null);
  const salvar=()=>{if(!form.nome)return;if(form.id)setFreelancers(fl=>fl.map(f=>f.id===form.id?{...form}:f));else setFreelancers(fl=>[...fl,{...form,id:Date.now()}]);setModal(false);};
  const excluir=id=>{setFreelancers(fl=>fl.filter(f=>f.id!==id));setConfirmar(null);};
  const togFn=fn=>setForm(f=>({...f,funcoes:(f.funcoes||[]).includes(fn)?f.funcoes.filter(x=>x!==fn):[...(f.funcoes||[]),fn]}));
  const togFnC=fn=>setFormCriar(f=>({...f,funcoes:(f.funcoes||[]).includes(fn)?f.funcoes.filter(x=>x!==fn):[...(f.funcoes||[]),fn]}));
  const evCount=id=>eventos.filter(ev=>ev.equipe?.find(m=>m.freelancerId===id)).length;
  const[filtroBonus,setFiltroBonus]=useState("todos");
  const filtBase=[...freelancers].filter(f=>f.nome?.toLowerCase().includes(busca.toLowerCase())).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  const filt=filtroBonus==="todos"?filtBase:filtroBonus==="sem"?filtBase.filter(f=>!f.nivelBonus):filtBase.filter(f=>f.nivelBonus===filtroBonus);
  const fnCor=nome=>(funcoes.find(f=>f.nome===nome)||{}).cor||"var(--text3)";
  const criarFuncionario=async()=>{
    if(!formCriar.email||!formCriar.senha||!formCriar.nome){setMsg({tipo:"erro",texto:"Preencha e-mail, senha e nome."});return;}
    setLoading(true);setMsg(null);

    // Criar um cliente Supabase separado para não afetar a sessão do admin
    const sbTemp=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const{data,error}=await sbTemp.auth.signUp({email:formCriar.email,password:formCriar.senha});

    if(error){
      setMsg({tipo:"erro",texto:error.message==="User already registered"?"Este e-mail já está cadastrado.":error.message});
      setLoading(false);return;
    }

    const uid=data.user?.id;
    if(uid){
      const roleAtrib=formCriar.motorista?"motorista":formCriar.secretaria?"secretario":"funcionario";
      await sb.from("sf_perfis").upsert({
        id:uid,role:roleAtrib,
        nome:formCriar.nome,telefone:formCriar.telefone,
        funcoes:formCriar.funcoes,pix:formCriar.pix,obs:formCriar.obs,
        admin_id:adminUser.id
      });
      const novoFl={
        id:Date.now(),nome:formCriar.nome,telefone:formCriar.telefone,
        email:formCriar.email,funcoes:formCriar.funcoes,pix:formCriar.pix,
        obs:formCriar.obs,userId:uid,secretaria:formCriar.secretaria,motorista:formCriar.motorista
      };
      setFreelancers(fl=>[...fl,novoFl]);
      const tipoLabel=formCriar.motorista?"motorista":formCriar.secretaria?"secretária":"funcionário";
      setMsg({tipo:"ok",texto:`✅ Conta de ${tipoLabel} criada! Envie o link do app, o e-mail "${formCriar.email}" e a senha.`});
    } else {
      setMsg({tipo:"erro",texto:"Não foi possível obter o ID do usuário."});
    }
    setLoading(false);
  };
  return(
    <div style={{padding:24,flex:1,overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:20,fontWeight:800,letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:28,height:28,borderRadius:8,background:"#2563EB",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            Equipe
          </h2>
          <p style={{color:"var(--text3)",margin:"4px 0 0 36px",fontSize:12,fontWeight:500}}>{filt.length} de {freelancers.length} profissionais</p>
        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍 Buscar..." style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"8px 14px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit"}}/>
          <Btn onClick={()=>{
            if(freelancers.length>=(maxFl||9999)){onUpgrade&&onUpgrade();return;}
            setFormCriar({email:"",senha:"",nome:"",telefone:"",funcoes:[],pix:"",obs:"",secretaria:false,motorista:false});setMsg(null);setModalCriar(true);
          }}>👤 Criar Acesso Funcionário</Btn>
          <Btn variant="ghost" onClick={()=>{
            if(freelancers.length>=(maxFl||9999)){onUpgrade&&onUpgrade();return;}
            setForm({nome:"",telefone:"",email:"",funcoes:[],pix:"",obs:""});setModal(true);
          }}>＋ Freelancer sem login</Btn>
          {maxFl&&maxFl<9999&&<div style={{fontSize:11,color:"var(--text3)",alignSelf:"center"}}>{freelancers.length}/{maxFl} funcionários</div>}
        </div>
      </div>
      {/* Filtros de bonificação */}
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {[["todos","Todos",freelancers.length],["sem","Sem bônus",freelancers.filter(f=>!f.nivelBonus).length],...NIVEIS_BONUS.map(n=>[n.id,`⭐ ${n.label}`,freelancers.filter(f=>f.nivelBonus===n.id).length])].map(([v,l,n])=>(
          <button key={v} onClick={()=>setFiltroBonus(v)} style={{background:filtroBonus===v?"var(--primary-light)":"var(--card)",border:`1px solid ${filtroBonus===v?"var(--primary)":"var(--border)"}`,borderRadius:10,padding:"7px 14px",color:filtroBonus===v?"var(--primary)":"var(--text2)",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
            {l} <span style={{background:filtroBonus===v?"var(--primary-light)":"var(--surface)",borderRadius:20,padding:"1px 7px",fontSize:11,color:filtroBonus===v?"var(--primary)":"var(--text3)"}}>{n}</span>

                <div style={{fontSize:12,color:"var(--text3)"}}>📱 {f.telefone}</div>
                {f.email&&<div style={{fontSize:11,color:"var(--text3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>✉️ {f.email}</div>}
                <div style={{fontSize:12,color:"var(--text3)"}}>{evCount(f.id)} eventos</div>
                {f.userId&&<div style={{fontSize:10,color:"var(--success)",marginTop:2}}>✅ Acesso ao app</div>}
                {f.secretaria&&<div style={{fontSize:10,color:"#8b5cf6",marginTop:2,fontWeight:700}}>🔑 Secretária</div>}

// ── ERROR BOUNDARY ────────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={erro:null};}
  static getDerivedStateFromError(e){return{erro:e};}
  componentDidCatch(e,info){console.error("[EscalaFest] Erro:",e,info);}
  render(){
    if(this.state.erro){
      return(
        <div style={{minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"#F8FAFC",flexDirection:"column",gap:16,padding:24,textAlign:"center"}}>
          <div style={{fontSize:32}}>⚠️</div>
          <div style={{fontWeight:700,color:"#0F172A",fontSize:16}}>Algo deu errado</div>
          <div style={{fontSize:12,color:"#64748B",maxWidth:320}}>{this.state.erro?.message||"Erro inesperado"}</div>
          <button onClick={()=>window.location.reload()} style={{background:"#2563EB",color:"#fff",border:"none",borderRadius:8,padding:"10px 24px",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Recarregar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const Loader=()=>{
  const[slow,setSlow]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setSlow(true),6000);return()=>clearTimeout(t);},[]);
  return(

    </div>
  );
};

// ── CARD TREINO (componente separado para evitar perda de foco no mobile) ─────
function CardTreino({t,past,readOnly,meuId,meuNome,onTogglePresenca,onSalvarComentario,onExcluirComentario,treinoAberto,setTreinoAberto,interacoes}){
  const[novoComentario,setNovoComentario]=useState("");
  const inputRef=useRef(null);
  const inter=interacoes||{confirmados:{},comentarios:[]};
  const confirmados=inter.confirmados||{};
  const comentarios=[...(inter.comentarios||[])].sort((a,b)=>a.at.localeCompare(b.at));
  const euConfirmei=!!confirmados[meuId];
  const nConfirmados=Object.keys(confirmados).length;
  const aberto=treinoAberto===t.id;
  const fmtDia=d=>{if(!d)return"";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;};
  const diasRestantes=d=>{const diff=Math.ceil((new Date(d)-new Date())/(1000*60*60*24));if(diff<0)return null;if(diff===0)return"Hoje!";if(diff===1)return"Amanhã";return`em ${diff} dias`;};
  const fmtHora=iso=>{try{return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch{return"";}};
  const dias=diasRestantes(t.data);

  const enviar=()=>{
    if(!novoComentario.trim())return;
    onSalvarComentario(t,novoComentario.trim());
    setNovoComentario("");
    // Manter foco no input após enviar
    setTimeout(()=>inputRef.current?.focus(),50);
  };

  return(
    <div style={{background:"var(--card)",border:`1px solid ${past?"var(--border)":euConfirmei?"var(--success-light)":"var(--primary-light)"}`,borderRadius:16,overflow:"hidden",opacity:past?0.85:1}}>
      <div style={{padding:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,color:"var(--text)",fontSize:16,marginBottom:4}}>{t.titulo}</div>
            {t.descricao&&<div style={{fontSize:13,color:"var(--text2)",marginBottom:6}}>{t.descricao}</div>}
          </div>
          {dias&&<span style={{background:"var(--primary-light)",color:"var(--primary)",border:"1px solid #8b5cf633",borderRadius:8,fontSize:11,fontWeight:700,padding:"3px 10px",whiteSpace:"nowrap",marginLeft:8}}>{dias}</span>}
        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:14}}>
          <span style={{fontSize:13,color:"var(--text2)"}}>📅 {fmtDia(t.data)}</span>
          {t.hora&&<span style={{fontSize:13,color:"var(--text2)"}}>⏰ {t.hora}</span>}
          {t.local&&<span style={{fontSize:13,color:"var(--text2)"}}>📍 {t.local}</span>}
        </div>
        {!past&&(
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
            <button onClick={()=>onTogglePresenca(t)} style={{background:euConfirmei?"var(--success-light)":"var(--surface)",border:`1px solid ${euConfirmei?"var(--success)":"var(--border)"}`,borderRadius:10,padding:"8px 16px",color:euConfirmei?"var(--success)":"var(--text2)",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
              {euConfirmei?"✅ Confirmado!":"⬜ Confirmar presença"}
            </button>
            {nConfirmados>0&&<div style={{fontSize:12,color:"var(--text3)"}}>
              <span style={{color:"var(--success)",fontWeight:700}}>{nConfirmados}</span> {nConfirmados===1?"confirmação":"confirmações"}
              {!readOnly&&<span style={{color:"var(--text3)",marginLeft:4}}>({Object.values(confirmados).map(c=>c.nome).join(", ")})</span>}
            </div>}
          </div>
        )}
        {past&&nConfirmados>0&&<div style={{fontSize:12,color:"var(--text3)",marginBottom:12}}>✅ {nConfirmados} {nConfirmados===1?"pessoa confirmou":"pessoas confirmaram"}</div>}
        <button onClick={()=>setTreinoAberto(aberto?null:t.id)} style={{display:"flex",alignItems:"center",gap:6,background:"transparent",border:"none",color:"var(--text3)",cursor:"pointer",fontFamily:"inherit",fontSize:12,padding:0,marginBottom:!readOnly&&!past?10:0}}>
          <span style={{fontSize:14}}>💬</span>
          {comentarios.length>0?`${comentarios.length} comentário${comentarios.length!==1?"s":""}`:("Comentários e dúvidas")}
          <span style={{fontSize:10,marginLeft:2}}>{aberto?"▲":"▼"}</span>
        </button>
        {!readOnly&&!past&&(
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <Btn small variant="ghost" style={{flex:1,justifyContent:"center"}} onClick={()=>{}/* handled by parent */}>Editar</Btn>
            <Btn small variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>{}/* handled by parent */}>Excluir</Btn>
          </div>
        )}
      </div>
      {aberto&&(
        <div style={{borderTop:"1px solid var(--border)",padding:"14px 20px",background:"var(--bg)"}}>
          {comentarios.length===0&&<div style={{fontSize:13,color:"var(--text3)",marginBottom:14,textAlign:"center"}}>Nenhum comentário ainda.</div>}
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
            {comentarios.map(c=>(
              <div key={c.id} style={{background:"var(--card)",borderRadius:10,padding:"10px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
                <div style={{width:30,height:30,borderRadius:"50%",background:avatarColor(c.nome||"?"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",flexShrink:0}}>
                  {(c.nome||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span style={{fontSize:12,fontWeight:700,color:"var(--text)"}}>{c.nome}</span>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:10,color:"var(--text3)"}}>{fmtHora(c.at)}</span>
                      {(c.userId===meuId||!readOnly)&&<button onClick={()=>onExcluirComentario(t,c.id)} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:12,padding:"0 2px",opacity:0.6}}>✕</button>}
                    </div>
                  </div>
                  <div style={{fontSize:13,color:"var(--text2)",wordBreak:"break-word"}}>{c.texto}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <input
              ref={inputRef}
              value={novoComentario}
              onChange={e=>setNovoComentario(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar();}}}
              placeholder="Escreva um comentário ou dúvida..."
              style={{flex:1,background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 14px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit"}}
            />
            <button onClick={enviar} disabled={!novoComentario.trim()} style={{background:"var(--primary)",border:"none",borderRadius:10,padding:"9px 16px",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",opacity:novoComentario.trim()?1:0.4}}>
              Enviar
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ABA TREINAMENTOS ──────────────────────────────────────────────────────────
function AbaTreinamentos({treinamentos,setTreinamentos,adminId,readOnly,user,perfil,freelancers}) /* refactored */{
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({});
  const[confirmar,setConfirmar]=useState(null);
  const[treinoAberto,setTreinoAberto]=useState(null);
  const[filtro,setFiltro]=useState("todos");
  const[verPass,setVerPass]=useState(false);
  // interacoes: {treinoId: {confirmados:{userId:{nome,at}}, comentarios:[{id,userId,nome,texto,at}]}}
  const[interacoes,setInteracoes]=useState({});
  const[carregandoInt,setCarregandoInt]=useState(false);
  const hoje=localDateStr();
  const meuId=user?.id;
  const meuNome=perfil?.nome||user?.email||"Você";
  const resolvedAdminId=adminId||user?.id;

  // Carregar interações: admin carrega de todos os freelancers, funcionário só as suas
  useEffect(()=>{
    if(!resolvedAdminId||!treinamentos.length)return;
    setCarregandoInt(true);
    const carregarTodas=async()=>{
      let merged={};
      if(!readOnly){
        // Admin: carregar interações de todos os freelancers com userId
        const comUserId=(freelancers||[]).filter(f=>f.userId);
        // Também carregar as próprias do admin
        const fontes=[{userId:meuId},...comUserId];
        await Promise.all(fontes.map(async f=>{
          const dados=await loadInteracoes(f.userId,resolvedAdminId);
          // Merge: para cada treinoId, mesclar confirmados e comentarios
          Object.entries(dados||{}).forEach(([tid,inter])=>{
            if(!merged[tid])merged[tid]={confirmados:{},comentarios:[]};
            merged[tid].confirmados={...merged[tid].confirmados,...(inter.confirmados||{})};
            // Comentários: adicionar sem duplicar pelo id
            (inter.comentarios||[]).forEach(c=>{
              if(!merged[tid].comentarios.find(x=>x.id===c.id))
                merged[tid].comentarios.push(c);
            });
          });
        }));
        // Ordenar comentários por data
        Object.values(merged).forEach(m=>{m.comentarios.sort((a,b)=>a.at.localeCompare(b.at));});
      } else {
        // Funcionário: carregar só as suas próprias
        merged=await loadInteracoes(meuId,resolvedAdminId)||{};
      }
      setInteracoes(merged);
      setCarregandoInt(false);
    };
    carregarTodas();
  },[resolvedAdminId,treinamentos.length,readOnly]);

  // Salvar interações do usuário atual
  const salvarMinhasInteracoes=async(novasInter)=>{
    await saveInteracoes(meuId,resolvedAdminId,novasInter);
  };

  // Obter interações mescladas para exibição (só admin vê tudo, funcionário vê as suas)
  const getInter=(tid)=>interacoes[tid]||{confirmados:{},comentarios:[]};

  const togglePresenca=(treino)=>{
    const tid=String(treino.id);
    // Atualiza localmente
    const minhasInter={...interacoes};
    if(!minhasInter[tid])minhasInter[tid]={confirmados:{},comentarios:[]};
    const novosConf={...minhasInter[tid].confirmados};
    if(novosConf[meuId])delete novosConf[meuId];
    else novosConf[meuId]={nome:meuNome,at:new Date().toISOString()};
    minhasInter[tid]={...minhasInter[tid],confirmados:novosConf};
    setInteracoes({...minhasInter});
    // Salvar só as minhas interações
    const minhas={};
    Object.entries(minhasInter).forEach(([k,v])=>{
      const confMeu=v.confirmados[meuId]?{[meuId]:v.confirmados[meuId]}:{};
      const comsMeus=v.comentarios.filter(c=>c.userId===meuId);
      if(Object.keys(confMeu).length||comsMeus.length)
        minhas[k]={confirmados:confMeu,comentarios:comsMeus};
    });
    salvarMinhasInteracoes(minhas);
  };

  const salvarComentario=(treino,texto)=>{
    const tid=String(treino.id);
    const novo={id:Date.now(),userId:meuId,nome:meuNome,texto,at:new Date().toISOString()};
    const minhasInter={...interacoes};
    if(!minhasInter[tid])minhasInter[tid]={confirmados:{},comentarios:[]};
    minhasInter[tid]={...minhasInter[tid],comentarios:[...minhasInter[tid].comentarios,novo]};
    setInteracoes({...minhasInter});
    // Salvar só as minhas
    const minhas={};
    Object.entries(minhasInter).forEach(([k,v])=>{
      const confMeu=v.confirmados[meuId]?{[meuId]:v.confirmados[meuId]}:{};
      const comsMeus=v.comentarios.filter(c=>c.userId===meuId);
      if(Object.keys(confMeu).length||comsMeus.length)
        minhas[k]={confirmados:confMeu,comentarios:comsMeus};
    });
    salvarMinhasInteracoes(minhas);
  };

  const excluirComentario=(treino,comentId)=>{
    const tid=String(treino.id);
    setInteracoes(prev=>{
      const novo={...prev,[tid]:{...prev[tid],comentarios:(prev[tid]?.comentarios||[]).filter(c=>c.id!==comentId)}};
      // Salvar
      const minhas={};
      Object.entries(novo).forEach(([k,v])=>{
        const confMeu=v.confirmados[meuId]?{[meuId]:v.confirmados[meuId]}:{};
        const comsMeus=v.comentarios.filter(c=>c.userId===meuId);
        if(Object.keys(confMeu).length||comsMeus.length)
          minhas[k]={confirmados:confMeu,comentarios:comsMeus};
      });
      salvarMinhasInteracoes(minhas);
      return novo;
    });
  };

  const ordenados=[...treinamentos].sort((a,b)=>a.data.localeCompare(b.data)||(a.hora||"").localeCompare(b.hora||""));
  const proximos=ordenados.filter(t=>t.data>=hoje);
  const passados=ordenados.filter(t=>t.data<hoje).reverse();

  const aplicarFiltro=lista=>{
    if(filtro==="confirmados")return lista.filter(t=>getInter(String(t.id)).confirmados[meuId]);
    if(filtro==="pendentes")return lista.filter(t=>!getInter(String(t.id)).confirmados[meuId]);
    return lista;
  };

  const salvar=()=>{
    if(!form.titulo||!form.data)return;

const PLANOS = [
  {id:"amador",  nome:"Amador",          preco:29.90, precoAnual:345.00, maxFl:10, secretario:false, motorista:false, cor:"#3b82f6", desc:"Sistema completo para equipes pequenas"},
  {id:"pequena", nome:"Pequena Empresa",  preco:49.90, precoAnual:560.00, maxFl:25, secretario:true,  motorista:false, cor:"#8b5cf6", desc:"Com secretária incluída, sem motorista"},
  {id:"grande",  nome:"Grande Empresa",   preco:65.00, precoAnual:700.00, maxFl:40, secretario:true,  motorista:true,  cor:"#0C6E7E", desc:"Acesso completo: secretária e motorista"},
];
const TRIAL_DIAS = 7;
const TRIAL_MAX_FL = 5;

function getPlanoAtual(perfil) {
  if(!perfil) return null;
  const hoje = new Date();

  // Plano pago — verificar vencimento
  if(perfil.plano) {
    const venc = perfil.plano_vencimento ? new Date(perfil.plano_vencimento) : null;
    const planoVencido = venc && hoje > venc;
    const cancelado = !!perfil.plano_cancelado_em;

    if(planoVencido) {
      // Venceu — volta ao trial/gratuito
      return { plano: null, trialAtivo: false, diasRestantes: 0, diasUsados: 999, planoVencido: true };
    }
    // Ativo (mesmo cancelado, até vencer)
    const diasParaVencer = venc ? Math.max(0, Math.ceil((venc - hoje) / (1000*60*60*24))) : null;
    return { plano: perfil.plano, trialAtivo: false, diasRestantes: 0, diasUsados: 0, cancelado, diasParaVencer };
  }

  // Sem plano — verificar trial
  const trialInicio = perfil.trialInicio ? new Date(perfil.trialInicio) : null;
  if(trialInicio) {
    const diasTrial = Math.floor((hoje - trialInicio) / (1000*60*60*24));
    const trialAtivo = diasTrial < TRIAL_DIAS;
    const diasRestantes = Math.max(0, TRIAL_DIAS - diasTrial);
    return { plano: null, trialAtivo, diasRestantes, diasUsados: diasTrial };
  }
  return { plano: null, trialAtivo: false, diasRestantes: 0, diasUsados: 999 };
}

const MASTER_EMAILS = ["biribinhabr2@gmail.com"];

function isMaster(userEmail) {
  return MASTER_EMAILS.includes((userEmail||"").toLowerCase());
}

// Plano Amador é o plano equivalente ao trial gratuito
const PLANO_TRIAL = PLANOS.find(p => p.id === "amador");

function getMaxFl(perfil, userEmail) {
  if(isMaster(userEmail)) return 9999; // admin master — sem limite
  const {plano, trialAtivo} = getPlanoAtual(perfil) || {};
  if(trialAtivo) return PLANO_TRIAL?.maxFl ?? 10; // trial = Amador (10 func.)
  if(!plano) return TRIAL_MAX_FL;
  const p = PLANOS.find(p => p.id === plano);
  return p ? p.maxFl : TRIAL_MAX_FL;
}

// Verifica se o plano atual inclui acesso à secretária
function getSecretariaAcesso(perfil, userEmail) {
  if(isMaster(userEmail)) return true;
  const {plano, trialAtivo} = getPlanoAtual(perfil) || {};
  if(trialAtivo) return PLANO_TRIAL?.secretario ?? false; // trial = Amador (sem secretária)

  const p = PLANOS.find(p => p.id === plano);
  return p ? p.secretario : false;
}

}

function TelaPagamento({perfil,onClose,onPlanoAtivado,userEmail,userId}){
  const[selecionado,setSelecionado]=useState(null);
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState(null);
  const[anual,setAnual]=useState(false);
  const info = getPlanoAtual(perfil);

  const iniciarPagamento=async(plano)=>{
    setLoading(true);
    setMsg(null);
    try{
      const SUPA_FUNC_URL = `${SUPA_URL}/functions/v1/asaas-checkout`;

      const response = await fetch(SUPA_FUNC_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPA_KEY,
          "Authorization": `Bearer ${SUPA_KEY}`,
        },
        body: JSON.stringify({
          plano_id:    plano.id,
          plano_nome:  plano.nome,
          plano_preco: plano.precoExib ?? plano.preco,
          plano_desc:  plano.desc,
          user_id:     userId || "",
          anual:       plano.anual ?? false,
        })
      });

      const data = await response.json();

      if(data.checkout_url){
        window.open(data.checkout_url, "_blank");
        setMsg({tipo:"info", texto:"✅ Janela de pagamento aberta! Conclua o pagamento — o plano é ativado automaticamente assim que confirmado."});
        // Inicia polling: aguarda o webhook do Asaas atualizar sf_perfis
        aguardarAtivacao(plano.id);
      } else {
        throw new Error(data.error || "Sem link de pagamento");
      }
    } catch(e){
      console.error("Pagamento erro:", e);
      setMsg({tipo:"erro", texto:"Sem conexão com o servidor. Verifique sua internet e tente novamente."});
    }
    setLoading(false);
  };

  /** Polling: verifica a cada 3 s se o plano foi ativado (máx ~2 min). */
  const aguardarAtivacao=(planoId)=>{
    setLoading(false);
    const MAX=40;
    let tentativas=0;
    const timer=setInterval(async()=>{
      tentativas++;
      try{
        const{data}=await sb.from("sf_perfis").select("plano,plano_vencimento,plano_ativado_em").eq("id",userId).single();
        if(data?.plano===planoId){
          clearInterval(timer);
          // Delega a atualização do perfil para o App via onPlanoAtivado
          if(onPlanoAtivado) await onPlanoAtivado(planoId);
          onClose&&onClose();
          return;
        }
      }catch(e){console.warn("Poll perfil:",e);}
      if(tentativas>=MAX){
        clearInterval(timer);
        alert("⏳ Pagamento recebido, mas a ativação ainda está sendo processada.\n\nRecarregue a página em alguns instantes. Se o plano não aparecer em 5 minutos, entre em contato com o suporte.");
      }
    },3000);
  };

  if(isMaster(userEmail)) return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(3px)"}}>
      <div style={{background:"var(--card)",borderRadius:20,padding:32,textAlign:"center",maxWidth:380}}>
        <div style={{fontSize:48,marginBottom:12}}>👑</div>
        <h2 style={{margin:"0 0 8px",color:"var(--text)"}}>Conta Master</h2>
        <p style={{color:"var(--text2)",fontSize:14,margin:"0 0 20px"}}>Esta conta tem acesso ilimitado e está isenta de pagamento.</p>
        <Btn onClick={onClose}>Fechar</Btn>
      </div>
    </div>
  );
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(3px)"}}>
      <div style={{background:"var(--card)",borderRadius:20,padding:24,width:"100%",maxWidth:600,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 48px rgba(0,0,0,.2)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div>
            <h2 style={{margin:0,fontSize:20,fontWeight:700,color:"var(--text)"}}>Escolha seu plano</h2>
            {info?.trialAtivo
              ?<p style={{margin:"4px 0 0",fontSize:13,color:"var(--success)"}}>✅ Trial ativo — {info.diasRestantes} dia{info.diasRestantes!==1?"s":""} restante{info.diasRestantes!==1?"s":""}</p>
              :!info?.plano&&<p style={{margin:"4px 0 0",fontSize:13,color:"var(--danger)"}}>⚠️ Trial encerrado — plano gratuito limitado a {TRIAL_MAX_FL} funcionários</p>
            }
          </div>
          {onClose&&<button onClick={onClose} style={{background:"var(--surface)",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",color:"var(--text2)",fontSize:16}}>✕</button>}
        </div>

        {/* Trial info */}
        {info?.trialAtivo&&(
        <div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#166534"}}>
          🎁 Você está no <strong>trial gratuito</strong> — {info.diasRestantes} dia{info.diasRestantes!==1?"s":""} restante{info.diasRestantes!==1?"s":""}. Após o trial é necessário assinar para continuar usando.

          <div style={{display:"flex",gap:0,background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,overflow:"hidden"}}>
            <button onClick={()=>setAnual(false)} style={{padding:"8px 20px",background:!anual?"var(--primary)":"transparent",color:!anual?"#fff":"var(--text2)",border:"none",fontSize:13,fontWeight:!anual?700:400,cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>Mensal</button>

            </button>

        </div>

            return(
              <div key={p.id} onClick={()=>setSelecionado({...p, precoExib, anual})} style={{border:`2px solid ${selecionado?.id===p.id?p.cor:atual?"#BBF7D0":"var(--border)"}`,borderRadius:14,padding:18,cursor:"pointer",background:selecionado?.id===p.id?p.cor+"0A":atual?"#F0FDF4":"var(--card)",transition:"all .15s",position:"relative"}}>
                {atual&&<div style={{position:"absolute",top:10,right:10,fontSize:10,fontWeight:700,background:"var(--success)",color:"#fff",borderRadius:4,padding:"2px 6px"}}>ATIVO</div>}
                {anual&&!atual&&<div style={{position:"absolute",top:10,right:10,fontSize:10,fontWeight:700,background:"#DCFCE7",color:"#16A34A",borderRadius:4,padding:"2px 6px"}}>-{economy}%</div>}
                <div style={{fontWeight:800,color:p.cor,fontSize:17,marginBottom:2}}>{p.nome}</div>

                {anual&&<div style={{fontSize:11,color:"var(--text3)",marginBottom:6}}>≈ R$ {(p.precoAnual/12).toFixed(2).replace(".",",")} /mês</div>}

                <div style={{display:"flex",flexDirection:"column",gap:4}}>

                  <div style={{fontSize:12,color:"var(--text)"}}>💬 Mensagem automática no WhatsApp</div>
                  {p.secretario
                    ? <div style={{fontSize:12,color:p.cor,fontWeight:600}}>🔑 Acesso à secretária</div>
                    : <div style={{fontSize:12,color:"var(--text3)"}}>❌ Sem acesso à secretária</div>
                  }
                  {p.motorista
                    ? <div style={{fontSize:12,color:p.cor,fontWeight:600}}>🚗 Módulo de motoristas</div>
                    : <div style={{fontSize:12,color:"var(--text3)"}}>❌ Sem módulo de motoristas</div>
                  }
                  <div style={{fontSize:12,color:"var(--success)"}}>🎁 7 dias grátis</div>
                </div>
              </div>
            );
          })}
        </div>

        {msg&&<div style={{background:msg.tipo==="erro"?"#FEF2F2":"#EFF6FF",border:`1px solid ${msg.tipo==="erro"?"#FECACA":"#BFDBFE"}`,borderRadius:10,padding:"10px 14px",fontSize:13,color:msg.tipo==="erro"?"var(--danger)":"var(--primary)",marginBottom:16}}>{msg.texto}</div>}

        <div style={{display:"flex",gap:10,justifyContent:"flex-end",flexWrap:"wrap"}}>
          {onClose&&<Btn variant="ghost" onClick={onClose}>Agora não</Btn>}
          <Btn
            style={{background:selecionado?selecionado.cor:"#9CA3AF",border:"none",color:"#fff",opacity:selecionado?1:0.6}}
            onClick={()=>selecionado&&iniciarPagamento({...selecionado, preco: selecionado.precoExib||selecionado.preco})}
          >{loading?"Aguarde...":selecionado?`Pagar R$ ${(selecionado.precoExib||selecionado.preco).toFixed(2).replace(".",",")} — ${selecionado.nome}${selecionado.anual?" (anual)":""}` :"Selecione um plano"}</Btn>
        </div>

        <div style={{marginTop:16,fontSize:11,color:"var(--text3)",textAlign:"center"}}>
          Pagamento seguro via Asaas (PIX · Cartão) · Cancele quando quiser
        </div>
      </div>
    </div>
  );
}

// Banner de trial/upgrade
function BannerPlano({perfil,onUpgrade,userEmail}){
  if(isMaster(userEmail)) return null; // master isento
  const info = getPlanoAtual(perfil);
  if(!info) return null;
  if(info.trialAtivo && info.diasRestantes > 3) return null;
  if(info.plano) return null;

  const urgente = !info.trialAtivo || info.diasRestantes <= 1;
  return(
    <div style={{background:urgente?"#FEF2F2":"#FFFBEB",borderBottom:`1px solid ${urgente?"#FECACA":"#FDE68A"}`,padding:"10px 20px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",zIndex:50}}>
      <span style={{fontSize:13,color:urgente?"var(--danger)":"var(--warning)",fontWeight:600,flex:1}}>
        {info.trialAtivo
          ?`⏳ Trial expira em ${info.diasRestantes} dia${info.diasRestantes!==1?"s":""}! Assine para manter acesso completo.`
          :`🔒 Trial encerrado. Limitado a ${TRIAL_MAX_FL} funcionários. Assine para liberar o acesso completo.`
        }
      </span>
      <button onClick={onUpgrade} style={{background:urgente?"var(--danger)":"var(--warning)",border:"none",borderRadius:8,padding:"7px 16px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
        Ver planos
      </button>
    </div>
  );
}
