<script>
// Fallback: captura erros e mostra detalhes completos
function mostrarErro(msg,detalhe){
  var el=document.getElementById('root');
  if(el){
    el.innerHTML='<div style="padding:24px;font-family:sans-serif;background:#fff;min-height:100vh">'+
      '<h2 style="color:#dc2626;margin:0 0 8px">Erro ao carregar</h2>'+
      '<pre style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px;font-size:12px;color:#7f1d1d;white-space:pre-wrap;word-break:break-all;margin-bottom:16px;max-width:640px">'+(msg||'Erro desconhecido')+(detalhe?'\n\n'+detalhe:'')+'</pre>'+
      '<p style="font-size:12px;color:#64748b;margin-bottom:16px">Abra o DevTools (F12) → aba Console para ver detalhes completos.</p>'+
      '<button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer">Tentar novamente</button>'+
      '</div>';
  }
}
window._sfAppReady=false;
window.addEventListener('error',function(e){
  if(!window._sfAppReady) mostrarErro(e.message,(e.filename?'Arquivo: '+e.filename:'')+(e.lineno?'\nLinha: '+e.lineno+', Col: '+e.colno:''));
});
window.addEventListener('unhandledrejection',function(e){
  if(!window._sfAppReady) mostrarErro('Promise rejeitada: '+(e.reason&&e.reason.message||String(e.reason)));
});
// Timeout generoso para conexões lentas no mobile (Babel ~7 MB via CDN)
setTimeout(function(){
  if(!window._sfAppReady){
    var el=document.getElementById('root');
    if(el){
      el.innerHTML='<div style="padding:24px;font-family:sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc">'+
        '<p style="color:#64748b;font-size:14px;margin:0 0 8px">Demorou mais que o esperado...</p>'+
        '<p style="color:#94a3b8;font-size:12px;margin:0 0 16px">Verifique a conexão com a internet (jsDelivr CDN).</p>'+
        '<button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600">Recarregar</button>'+
        '</div>';
    }
  }
},40000);
</script>

// ── TOAST ─────────────────────────────────────────────────────────────────────
const ToastCtx = createContext(null);
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const add=useCallback((msg,tipo="erro")=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,tipo}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4500);
  },[]);
  const corMap={erro:["#FEF2F2","#DC2626","#FECACA"],ok:["#F0FDF4","#16A34A","#BBF7D0"],aviso:["#FFFBEB","#EA580C","#FED7AA"]};
  return(
    <ToastCtx.Provider value={add}>
      {children}
      <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:9999,display:"flex",flexDirection:"column",gap:8,alignItems:"center",pointerEvents:"none",maxWidth:"calc(100vw - 32px)"}}>
        {toasts.map(t=>{const[bg,cor,border]=corMap[t.tipo]||corMap.erro;return(
          <div key={t.id} style={{background:bg,color:cor,border:`1px solid ${border}`,borderRadius:10,padding:"10px 18px",fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,.12)",minWidth:220,maxWidth:420,textAlign:"center",pointerEvents:"auto",lineHeight:1.4}}>
            {t.msg}
          </div>
        );})}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast=()=>useContext(ToastCtx);

// ── useAsyncError ─────────────────────────────────────────────────────────────
function useAsyncError(){
  const addToast=useToast();
  return useCallback(async(fn,msgErro)=>{
    try{ return await fn(); }
    catch(e){
      const msg=msgErro||(e?.message&&e.message!=="Failed to fetch"?e.message:"Erro ao carregar dados. Verifique a conexão.");
      if(addToast) addToast(msg,"erro");
      console.error(e);
      return null;
    }
  },[addToast]);
}

// Cloud storage — salva/carrega dados do Supabase por tipo
const cloudSave = async (userId, tipo, dados) => {
  const {error} = await sb.from("sf_dados").upsert(
    {user_id: userId, tipo, dados, updated_at: new Date().toISOString()},
    {onConflict: "user_id,tipo"}
  );
  if(error) console.error("Erro ao salvar:", tipo, error);
  return !error;
};
const cloudLoad = async (userId, tipo) => {
  try{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000));
    const query=sb.from("sf_dados").select("dados").eq("user_id",userId).eq("tipo",tipo)
      .order("updated_at",{ascending:false}).limit(1);
    const {data,error} = await Promise.race([query,timeout]);
    if(error || !data?.length) return null;
    return data[0].dados;
  }catch{ return null; }
};
// Salva/carrega interações de treinamento (confirmações + comentários) por usuário

};
const loadInteracoes=async(userId,adminId)=>{

// ── NOTIFICAÇÕES ──────────────────────────────────────────────────────────────
const pedirPermissaoNotificacao=async()=>{
  if(!("Notification" in window))return false;
  if(Notification.permission==="granted")return true;
  try{
    const r=await Notification.requestPermission();
    if(r==="granted"){
      // Resetar "primeiro acesso" para que eventos atuais sejam notificados
      // mas NÃO resetar "vistos" para não re-notificar tudo
    }
    return r==="granted";
  }catch(e){
    return new Promise(resolve=>Notification.requestPermission(r=>resolve(r==="granted")));
  }
};
const dispararNotificacao=(titulo,corpo,tag)=>{
  if(Notification.permission!=="granted")return;
  // Safari iOS: notificações diretas apenas (não suporta SW Blob)
  const isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  if(!isSafari&&window.sfNotify){window.sfNotify(titulo,corpo,tag);return;}
  try{new Notification(titulo,{body:corpo,tag:tag||undefined});}
  catch(e){}
};

// Todas as operações retornam eventos com equipe[] populada.
const evSvc = (() => {
  const _mapTeamRow = r => ({
    _teamId: r.id,
    freelancerId: isNaN(+r.freelancer_id) ? r.freelancer_id : +r.freelancer_id,
    funcao: r.funcao || "",
    cache: +(r.cache_base) || 0,
    obs: r.obs || "",
    pago: r.pago || false,
    turnos: r.turnos || 1,
    bonusMultTurnos: r.bonus_mult_turnos || false,
    bonus: r.bonus_nivel ? {nivel: r.bonus_nivel, ativo: r.bonus_ativo || false} : null,
  });
  const _mapRow = r => ({
    id: r.id,
    legacy_id: r.legacy_id || null,
    nome: r.nome || "",
    tipo: r.tipo || "Outro",
    status: r.status || "Em negociação",
    data: r.data,
    horaInicio: r.hora_inicio ? r.hora_inicio.slice(0,5) : null,
    horaFim: r.hora_fim ? r.hora_fim.slice(0,5) : null,
    local: r.local || "",
    obs: r.obs || "",
    cliente_nome: r.cliente_nome || "",
    cliente_telefone: r.cliente_telefone || "",
    horarioQuintal: r.horario_quintal || null,
    horarioGalpao: r.horario_galpao || null,
    obsLogistica: r.obs_logistica || null,
    google_event_id: r.google_event_id || null,
    google_calendar_synced: r.google_calendar_synced || false,
    updatedAt: r.updated_at || null,
    titulo_original: r.titulo_original || null,
    clienteTriagem: r.cliente || null,
    triagem_status: r.triagem_status || 'pendente',
    duracao_total_min: r.duracao_total_min || null,
    equipe: (r.event_team || []).map(_mapTeamRow),
  });
  const _unmap = d => {
    const db = {};
    if (d.nome !== undefined)             db.nome = d.nome;
    if (d.tipo !== undefined)             db.tipo = d.tipo;
    if (d.status !== undefined)           db.status = d.status;
    if (d.data !== undefined)             db.data = d.data;
    if (d.horaInicio !== undefined)       db.hora_inicio = d.horaInicio || null;
    if (d.horaFim !== undefined)          db.hora_fim = d.horaFim || null;
    if (d.local !== undefined)            db.local = d.local;
    if (d.obs !== undefined)              db.obs = d.obs;
    if (d.cliente_nome !== undefined)     db.cliente_nome = d.cliente_nome;
    if (d.cliente_telefone !== undefined) db.cliente_telefone = d.cliente_telefone;
    if (d.horarioQuintal !== undefined)   db.horario_quintal = d.horarioQuintal || null;
    if (d.horarioGalpao !== undefined)    db.horario_galpao = d.horarioGalpao || null;
    if (d.obsLogistica !== undefined)     db.obs_logistica = d.obsLogistica || null;
    if (d.google_event_id !== undefined)  db.google_event_id = d.google_event_id || null;
    if (d.google_calendar_synced !== undefined) db.google_calendar_synced = d.google_calendar_synced;
    return db;
  };
  const _unmapMember = m => ({
    freelancer_id: String(m.freelancerId),
    funcao: m.funcao || "",
    cache_base: m.cache || 0,
    obs: m.obs || "",
    pago: m.pago || false,
    turnos: m.turnos || 1,
    bonus_mult_turnos: m.bonusMultTurnos || false,
    bonus_nivel: m.bonus?.nivel || null,
    bonus_ativo: m.bonus?.ativo || false,
  });
  const _refetch = async (tenantId, eventId) => {
    const {data, error} = await sb.from("events").select("*, event_team(*)").eq("tenant_id", tenantId).eq("id", eventId).single();
    if (error) throw new Error(error.message);
    return _mapRow(data);
  };
  return {
    async list(tenantId, opts={}) {
      let q = sb.from("events").select("*, event_team(*)").eq("tenant_id", tenantId).order("data", {ascending:true});
      if (opts.from)   q = q.gte("data", opts.from);
      if (opts.to)     q = q.lte("data", opts.to);
      if (opts.status) q = q.eq("status", opts.status);
      const {data, error} = await q;
      if (error) throw new Error(error.message);
      return (data || []).map(_mapRow);
    },
    async get(tenantId, id) {
      let {data, error} = await sb.from("events").select("*, event_team(*)").eq("tenant_id", tenantId).eq("id", id).maybeSingle();
      if (error) throw new Error(error.message);

// ── TRIAGEM: lógica de reconhecimento automático de serviços ─────────────────
// (function declarations → hoisted, disponíveis antes da chamada em evSvc.create)
function _sfNormNome(s) {
  return s.toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function _sfExtrairDuracao(texto) {
  let duracaoMin=null,semDuracao=texto;
  let m=texto.match(/\b(\d{1,2}):(\d{2})\b/);
  if(m){duracaoMin=parseInt(m[1],10)*60+parseInt(m[2],10);semDuracao=texto.slice(0,m.index)+texto.slice(m.index+m[0].length);}
  else{
    m=texto.match(/\b(\d{1,2})\s*h\s*(\d{1,2})?\s*(?:min(?:utos?)?)?\b/i);
    if(m){duracaoMin=parseInt(m[1],10)*60+(m[2]?parseInt(m[2],10):0);semDuracao=texto.slice(0,m.index)+texto.slice(m.index+m[0].length);}
    else{m=texto.match(/\b(\d{1,3})\s*min(?:utos?)?\b/i);if(m){duracaoMin=parseInt(m[1],10);semDuracao=texto.slice(0,m.index)+texto.slice(m.index+m[0].length);}}
  }
  return{semDuracao:semDuracao.trim(),duracaoMin};
}
function _sfParseTitulo(titulo) {
  if(!titulo||!titulo.trim())return{blocos:[],cliente:null,restos:''};
  const s=titulo.trim();
  const SEP=/\s*[-–—]\s*/g;let lastMatch=null,m;
  while((m=SEP.exec(s))!==null)lastMatch=m;
  let corpo,cliente;
  if(lastMatch){
    const cand=s.slice(lastMatch.index+lastMatch[0].length).trim();
    if(cand&&/[a-záéíóúãõàâêîôûüçñ]/i.test(cand)&&!cand.includes('+')){corpo=s.slice(0,lastMatch.index).trim();cliente=cand;}
    else{corpo=s;cliente=null;}
  }else{corpo=s;cliente=null;}
  const blocos=corpo.split('+').map(b=>b.trim()).filter(Boolean).map(raw=>{
    const{semDuracao,duracaoMin}=_sfExtrairDuracao(raw);
    return{nomeBruto:raw,nomeNormalizado:_sfNormNome(semDuracao),duracaoMin};
  });
  return{blocos,cliente,restos:corpo};
}
function _sfBigram(a,b) {
  if(!a||!b)return 0;if(a===b)return 1;
  function bg(s){const mp=new Map();for(let i=0;i<s.length-1;i++){const k=s.slice(i,i+2);mp.set(k,(mp.get(k)||0)+1);}return mp;}
  const ma=bg(a),mb=bg(b);let inter=0;
  for(const[k,v]of ma)inter+=Math.min(v,mb.get(k)||0);
  const ta=Math.max(a.length-1,0),tb=Math.max(b.length-1,0);
  return ta+tb===0?0:(2*inter)/(ta+tb);
}
function _sfMatchServico(nomeNorm,allKw) {
  if(!nomeNorm||!allKw||!allKw.length)return null;
  const ex=allKw.filter(k=>k.keyword===nomeNorm);
  if(ex.length===1)return ex[0].serviceId;
  if(ex.length>1){const ids=new Set(ex.map(k=>k.serviceId));return ids.size===1?[...ids][0]:null;}
  const MIN=3,cont=allKw.filter(k=>k.keyword.length>=MIN&&nomeNorm.length>=MIN&&(nomeNorm.includes(k.keyword)||k.keyword.includes(nomeNorm)));
  if(cont.length>0){
    const bySvc=new Map();for(const k of cont){if(!bySvc.has(k.serviceId))bySvc.set(k.serviceId,[]);bySvc.get(k.serviceId).push(k.keyword);}
    if(bySvc.size===1)return[...bySvc.keys()][0];
    let bestId=null,bestLen=-1,amb=false;
    for(const[sid,kws]of bySvc){const mx=Math.max(...kws.map(k=>k.length));if(mx>bestLen){bestLen=mx;bestId=sid;amb=false;}else if(mx===bestLen)amb=true;}
    return amb?null:bestId;
  }
  const scored=allKw.map(k=>({serviceId:k.serviceId,score:_sfBigram(nomeNorm,k.keyword)})).filter(r=>r.score>=0.6);
  if(!scored.length)return null;
  scored.sort((a,b)=>b.score-a.score);
  if(scored.length>=2&&scored[0].score-scored[1].score<0.15){
    const top2=new Set(scored.slice(0,2).map(r=>r.serviceId));
    if(top2.size>1)return null;
  }
  return scored[0].serviceId;
}
async function _sfAplicarKit(tenantId,eventId,serviceId) {
  try{
    const{data:svc}=await sb.from('services').select('template_kit_id').eq('id',serviceId).maybeSingle();
    if(!svc?.template_kit_id)return;
    const{data:items}=await sb.from('event_items').select('id').eq('event_id',eventId).limit(1);
    if(items&&items.length>0)return; // já tem itens, não sobrescreve
    const{data:kitItems}=await sb.from('template_kit_items').select('*').eq('kit_id',svc.template_kit_id).order('ordem');
    if(!kitItems||!kitItems.length)return;
    const rows=kitItems.map((ki,i)=>({tenant_id:tenantId,event_id:eventId,kit_item_id:ki.id,categoria:ki.categoria||'checklist',descricao:ki.nome,obs:ki.obs||null,ordem:ki.ordem??i,concluido:false}));
    await sb.from('event_items').insert(rows);
  }catch(e){console.warn('[triage kit]',e.message);}
}
async function runTriagemEvento(tenantId,eventId,titulo) {
  try{
    // Carregar keywords de todos os serviços do tenant
    const{data:kws}=await sb.from('service_keywords').select('service_id,keyword').limit(2000);
    const allKw=(kws||[]).map(k=>({serviceId:k.service_id,keyword:k.keyword}));
    // Também buscar via join se necessário
    const{blocos,cliente}=_sfParseTitulo(titulo);
    if(!blocos.length){
      await sb.from('events').update({titulo_original:titulo,triagem_status:'nao_identificado'}).eq('id',eventId).eq('tenant_id',tenantId);
      return;
    }
    const duracaoTotal=blocos.reduce((s,b)=>s+(b.duracaoMin||0),0);
    const matched=blocos.map((b,i)=>({...b,serviceId:_sfMatchServico(b.nomeNormalizado,allKw),ordem:i}));
    const allFound=matched.every(b=>b.serviceId);
    const status=allFound?'reconhecido':'nao_identificado';
    await sb.from('events').update({titulo_original:titulo,cliente:cliente||null,duracao_total_min:duracaoTotal||null,triagem_status:status}).eq('id',eventId).eq('tenant_id',tenantId);
    // Substituir event_services
    await sb.from('event_services').delete().eq('event_id',eventId);
    if(matched.length>0){
      await sb.from('event_services').insert(matched.map(b=>({event_id:eventId,service_id:b.serviceId||null,nome_bruto:b.nomeBruto,duracao_min:b.duracaoMin||null,ordem:b.ordem})));
    }
    // Aplicar kit para cada serviço reconhecido
    for(const b of matched){if(b.serviceId)await _sfAplicarKit(tenantId,eventId,b.serviceId);}
  }catch(e){console.warn('[runTriagemEvento]',e.message);}
}

// ── NOTIFICAÇÕES IN-APP ───────────────────────────────────────────────────────
function useInAppNotifications(userId){
  const[notifs,setNotifs]=useState([]);
  const chRef=useRef(null);
  const carregar=useCallback(async()=>{
    if(!userId)return;
    try{
      const{data}=await sb.from("notifications").select("*").eq("destinatario_id",userId).order("created_at",{ascending:false}).limit(20);
      setNotifs(data||[]);
    }catch(e){console.warn("notifs:",e.message);}
  },[userId]);
  useEffect(()=>{
    carregar();
    const ch=sb.channel(`sf_notifs_${userId}`)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:`destinatario_id=eq.${userId}`},
        p=>{setNotifs(prev=>[p.new,...prev].slice(0,20));})
      .subscribe();
    chRef.current=ch;
    return()=>{if(chRef.current)sb.removeChannel(chRef.current);};
  },[userId,carregar]);
  const marcarLida=useCallback(async id=>{
    await sb.from("notifications").update({lida:true}).eq("id",id);
    setNotifs(p=>p.map(n=>n.id===id?{...n,lida:true}:n));
  },[]);
  const marcarTodas=useCallback(async()=>{
    if(!userId)return;
    await sb.from("notifications").update({lida:true}).eq("destinatario_id",userId).eq("lida",false);
    setNotifs(p=>p.map(n=>({...n,lida:true})));
  },[userId]);
  const naoLidas=notifs.filter(n=>!n.lida).length;
  return{notifs,naoLidas,marcarLida,marcarTodas,recarregar:carregar};
}

const BONUS_INIT = [
  {id:"junior", label:"Júnior", valor:5,  cor:"#3b82f6", tempoMin:180},
  {id:"senior", label:"Sênior", valor:10, cor:"#a855f7", tempoMin:180},
  {id:"master", label:"Master", valor:20, cor:"#f59e0b", tempoMin:180},
];
// Referência global — atualizada pelo App para que calcCache funcione sem prop drilling
let NIVEIS_BONUS = [...BONUS_INIT];
const toMin = h => { if(!h) return 0; const[hh,mm]=h.split(":"); return +hh*60+(+mm||0); };
const duracaoEvento = ev => {
  if(!ev?.horaInicio||!ev?.horaFim) return 0;
  return toMin(ev.horaFim) - toMin(ev.horaInicio);
};
// Calcula cachê total: base × turnos + bônus (× turnos se bonusMultTurnos)
const calcCache = (membro, ev) => {
  if(!membro) return 0;
  const base = membro.cache || 0;
  const turnos = membro.turnos || 1;
  const cacheTotal = base * turnos;
  const bonus = membro.bonus;
  if(!bonus?.ativo) return cacheTotal;
  const nivel = NIVEIS_BONUS.find(n => n.id === bonus.nivel);
  const bonusValor = nivel?.valor || 0;
  const bonusTotal = bonusValor * (membro.bonusMultTurnos && turnos > 1 ? turnos : 1);
  return cacheTotal + bonusTotal;
};
// Normaliza confirmação: suporta formato antigo {confirmado:true} e novo {status:'confirmed'|'declined'}
const getConfStatus = c => {
  if (!c) return 'pending';
  if (c.status) return c.status;
  return c.confirmado ? 'confirmed' : 'pending';
};

              </div>

          <form onSubmit={handleEmail} style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>E-mail</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="seu@email.com"
                style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"9px 12px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",width:"100%"}}/>
            </div>
            {modo!=="esqueci"&&(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1}}>Senha</label>
                <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} required minLength={6} placeholder="••••••••"
                  style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"9px 12px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",width:"100%"}}/>
              </div>
            )}

            {msg&&(
              <div style={{background:msg.tipo==="erro"?"var(--danger-light)":"var(--success-light)",border:`1px solid ${msg.tipo==="erro"?"var(--danger-light)":"var(--success-light)"}`,borderRadius:10,padding:"10px 14px",fontSize:13,color:msg.tipo==="erro"?"var(--danger)":"var(--success)"}}>
                {msg.texto}
              </div>
            )}

            <button type="submit" disabled={loading} style={{background:"var(--primary)",border:"none",borderRadius:"var(--radius)",padding:"10px 20px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginTop:4,width:"100%"}}>
              {loading?"Aguarde...":(modo==="login"?"Entrar":modo==="cadastro"?"Criar conta":"Enviar e-mail")}
            </button>
          </form>

          {/* Links */}
          <div style={{marginTop:20,display:"flex",flexDirection:"column",gap:10,alignItems:"center"}}>
            {modo==="login"&&(<>
              <button onClick={()=>{setModo("esqueci");setMsg(null);}} style={{background:"none",border:"none",color:"var(--text2)",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>Esqueci minha senha</button>
              <button onClick={()=>{setModo("cadastro");setMsg(null);}} style={{background:"none",border:"none",color:"var(--primary)",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>Não tem conta? Criar conta grátis</button>
            </>)}
            {modo==="cadastro"&&(<button onClick={()=>{setModo("login");setMsg(null);}} style={{background:"none",border:"none",color:"var(--primary)",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>Já tem conta? Entrar</button>)}
            {modo==="esqueci"&&(<button onClick={()=>{setModo("login");setMsg(null);}} style={{background:"none",border:"none",color:"var(--primary)",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>← Voltar ao login</button>)}
          </div>
        </div>
      </div>
    </div>
  );
}

let _sfTemplates={};

async function loadTemplatesFrontend(adminId){
  if(!adminId)return;
  try{
    const r=await fetch(`${WA_SERVER_URL}/api/templates?adminId=${adminId}`,{headers:{"bypass-tunnel-reminder":"true","x-api-secret":WA_SECRET,"x-admin-id":adminId}});
    if(!r.ok)return;
    const arr=await r.json();
    _sfTemplates={};
    for(const t of arr) _sfTemplates[t.chave]=t;
  }catch(e){console.warn("[templates] Falha ao carregar templates:",e.message);}
}

function _getTpl(chave){return _sfTemplates[chave]||_TPLDEF[chave]||null;}

function renderTemplateFrontend(corpo,vars){
  return corpo.replace(/\{\{(\w+)\}\}/g,(_,key)=>{
    if(!(key in vars)){console.warn(`[template] {{${key}}} não encontrada`);return"";}
    return vars[key]==null?"":String(vars[key]);
  });
}

const waEscala=(f,ev,m)=>{
  const t=limparTel(f.telefone);if(!t)return null;
  const tpl=_getTpl("confirmacao_presenca");

  const msg=renderTemplateFrontend(tpl?.corpo||_TPLDEF.confirmacao_presenca.corpo,{nome:f.nome,evento:ev.nome,data:fmtDate(ev.data),hora_inicio:ev.horaInicio||"",hora_fim:ev.horaFim||"",local:ev.local||"",funcao:m.funcao,cache:m.cache.toFixed(2).replace(".",",")});
  return`https://wa.me/55${t}?text=${encodeURIComponent(msg)}`;
};
const waPag=(f,ev,m)=>{
  const t=limparTel(f.telefone);if(!t)return null;
  const tpl=_getTpl("aviso_pagamento");
  if(tpl&&tpl.ativo===false)return null;

  return`https://wa.me/55${t}?text=${encodeURIComponent(msg)}`;
};

// ── ABA FUNÇÕES ────────────────────────────────────────────────────────────────
function AbaFuncoes({funcoes,setFuncoes}){
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({});
  const[confirmar,setConfirmar]=useState(null);
  const salvar=()=>{if(!form.nome)return;if(form.id)setFuncoes(f=>f.map(x=>x.id===form.id?{...form}:x));else setFuncoes(f=>[...f,{...form,id:Date.now(),pedirObs:!!form.pedirObs}]);setModal(false);};
  const excluir=id=>{setFuncoes(f=>f.filter(x=>x.id!==id));setConfirmar(null);};
  return(
    <div style={{padding:"24px 28px",flex:1,overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:12,paddingBottom:20,borderBottom:"1px solid var(--border)"}}>
        <div>
          <h2 style={{color:"var(--text)",margin:0,fontSize:20,fontWeight:800,letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:28,height:28,borderRadius:8,background:"#7C3AED",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            </span>
            Funções
          </h2>
          <p style={{color:"var(--text3)",margin:"4px 0 0 36px",fontSize:12,fontWeight:500}}>Gerencie funções e cachês padrão</p>
        </div>
        <Btn onClick={()=>{setForm({nome:"",cor:"var(--primary)",cacheDefault:0,pedirObs:false});setModal(true);}}>+ Nova função</Btn>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:14}}>
        {funcoes.map(fn=>(
          <Card key={fn.id}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
              <div style={{width:40,height:40,borderRadius:8,background:fn.cor+"18",border:`1px solid ${fn.cor}44`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><div style={{width:12,height:12,borderRadius:"50%",background:fn.cor}}/></div>
              <div style={{flex:1}}><div style={{fontWeight:700,color:"var(--text)",fontSize:16}}>{fn.nome}</div><div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}><div style={{width:10,height:10,borderRadius:"50%",background:fn.cor}}/><span style={{fontSize:11,color:"var(--text3)"}}>{fn.cor}</span></div></div>
            </div>
            <div style={{background:"var(--bg)",borderRadius:8,padding:"9px 12px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",border:"1px solid var(--border)"}}>
              <span style={{fontSize:12,color:"var(--text2)"}}>Cachê padrão</span>
              <span style={{fontSize:15,fontWeight:800,color:fn.cor}}>R$ {(fn.cacheDefault||0).toFixed(2).replace(".",",")}</span>
            </div>
            {fn.pedirObs&&<div style={{background:"#fef9c3",border:"1px solid #fde047",borderRadius:7,padding:"5px 10px",marginBottom:10,fontSize:11,color:"#92400e",display:"flex",alignItems:"center",gap:6}}>
              <span>Solicita observação na escala</span>
            </div>}
            <div style={{display:"flex",gap:8}}>
              <Btn small variant="ghost" style={{flex:1,justifyContent:"center"}} onClick={()=>{setForm({...fn});setModal(true);}}>Editar</Btn>
              <Btn small variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>setConfirmar(fn)}>Excluir</Btn>
            </div>
          </Card>
        ))}
        <button onClick={()=>{setForm({nome:"",cor:"var(--primary)",cacheDefault:0,pedirObs:false});setModal(true);}} style={{border:"2px dashed var(--border2)",borderRadius:"var(--radius-lg)",padding:20,background:"transparent",color:"var(--text3)",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,minHeight:140,fontFamily:"inherit",fontSize:13}}>
          <span style={{fontSize:22,color:"var(--text3)"}}>+</span>Nova função
        </button>
      </div>
      <Modal open={modal} onClose={()=>setModal(false)} title={form.id?"Editar Função":"Nova Função"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Inp label="Nome da Função" value={form.nome||""} onChange={e=>setForm(f=>({...f,nome:e.target.value}))} placeholder="Ex: Mestre de Cerimônias"/>
          <Inp label="Cachê Padrão (R$)" type="number" value={form.cacheDefault||""} onChange={e=>setForm(f=>({...f,cacheDefault:+e.target.value}))} placeholder="0,00"/>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--text2)",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:8}}>Cor da Função</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
              {CORES_PRESET.map(c=>(<button key={c} onClick={()=>setForm(f=>({...f,cor:c}))} style={{width:30,height:30,borderRadius:8,background:c,border:form.cor===c?"3px solid #fff":"2px solid transparent",cursor:"pointer"}}/>))}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="color" value={form.cor||"var(--primary)"} onChange={e=>setForm(f=>({...f,cor:e.target.value}))} style={{width:42,height:38,borderRadius:8,border:"1px solid var(--border)",background:"var(--bg)",cursor:"pointer",padding:2}}/>
              <Inp value={form.cor||""} onChange={e=>setForm(f=>({...f,cor:e.target.value}))} placeholder="var(--primary)" style={{flex:1}}/>
            </div>
          </div>
          {form.nome&&(<div style={{background:"var(--bg)",borderRadius:10,padding:12,display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:12,color:"var(--text2)"}}>Preview:</span>
            <Badge label={form.nome} color={form.cor||"var(--text3)"}/>
            {form.cacheDefault>0&&<span style={{fontSize:13,color:form.cor,fontWeight:700}}>R$ {(+form.cacheDefault).toFixed(2).replace(".",",")}</span>}
          </div>)}
          {/* Checkbox pedirObs */}
          <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",background:form.pedirObs?"#fef9c3":"var(--bg)",border:`1px solid ${form.pedirObs?"#fde047":"var(--border)"}`,borderRadius:10,padding:"11px 14px",transition:"all .15s"}}>
            <input type="checkbox" checked={!!form.pedirObs} onChange={e=>setForm(f=>({...f,pedirObs:e.target.checked}))} style={{width:16,height:16,marginTop:1,accentColor:"#d97706",cursor:"pointer",flexShrink:0}}/>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>Solicitar observação na escala</div>
              <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>Ao escalar um funcionário com esta função, aparece um campo de observação obrigatório. O texto fica visível no PDF de pagamentos.</div>
            </div>
          </label>
          <div style={{display:"flex",justifyContent:"flex-end",gap:10}}><Btn variant="ghost" onClick={()=>setModal(false)}>Cancelar</Btn><Btn onClick={salvar}>Salvar</Btn></div>
        </div>
      </Modal>
      <ConfirmDelete open={!!confirmar} onClose={()=>setConfirmar(null)} onConfirm={()=>excluir(confirmar.id)} titulo={`Excluir função "${confirmar?.nome}"?`} descricao="Esta função será removida. Eventos já escalados não serão afetados."/>
    </div>
  );
}

function ThumbnailCard({att,onOpen,onDelete}){

          </div>
      }
      <button onClick={e=>{e.stopPropagation();onDelete(att);}} style={{position:"absolute",top:3,right:3,background:"#000000bb",border:"none",borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#fff",fontSize:10,padding:0,fontFamily:"inherit",lineHeight:1}}>×</button>
      <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,#000000bb)",padding:"14px 4px 3px",fontSize:9,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",pointerEvents:"none"}}>{att.file_name}</div>
    </div>
  );
}

// Cache de kits por tenant (5 min) — evita N queries quando AbaEventItems abre vários eventos
const _kitCache=new Map();
const _KIT_TTL=5*60*1000;
async function loadKitsCached(tenantId){
  const c=_kitCache.get(tenantId);
  if(c&&Date.now()-c.ts<_KIT_TTL)return{kits:c.kits,imgUrls:c.imgUrls};
  const{data:kitsRaw}=await sb.from("template_kits").select("*").eq("tenant_id",tenantId).order("created_at");
  const{data:itemsRaw}=await sb.from("template_kit_items").select("*").eq("tenant_id",tenantId).order("ordem").order("created_at");
  const kits=(kitsRaw||[]).map(k=>({...k,items:(itemsRaw||[]).filter(i=>i.kit_id===k.id)}));
  const paths=[...new Set([
    ...(kitsRaw||[]).filter(k=>k.capa_image_path).map(k=>k.capa_image_path),
    ...(itemsRaw||[]).filter(i=>i.image_path).map(i=>i.image_path),
  ])];
  const imgUrls={};
  await Promise.all(paths.map(async p=>{
    try{const{data:d}=await sb.storage.from("catalog-images").createSignedUrl(p,3600);if(d?.signedUrl)imgUrls[p]=d.signedUrl;}catch(e){}
  }));
  _kitCache.set(tenantId,{kits,imgUrls,ts:Date.now()});
  return{kits,imgUrls};
}

// Utilitário de compressão de imagem (compartilhado entre AbaModelos e AbaAnexos)
function compressImage(file){
  return new Promise(resolve=>{
    const img=new Image();const burl=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1600;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(burl);
      c.toBlob(b=>resolve(b),"image/webp",0.8);
    };
    img.onerror=()=>{URL.revokeObjectURL(burl);resolve(file);};img.src=burl;
  });
}

function AbaEventItems({eventId,tenantId,readOnly=false,categorias=null,legacyId=null}){
  const[items,setItems]=useState([]);
  const[loading,setLoading]=useState(true);
  const[novos,setNovos]=useState({checklist:"",material:"",figurino:""});
  const[open,setOpen]=useState({checklist:true,material:true,figurino:true});
  const[editId,setEditId]=useState(null);
  const[editText,setEditText]=useState("");
  const[kits,setKits]=useState([]);
  const[imgUrls,setImgUrls]=useState({});
  const[pickerCat,setPickerCat]=useState(null);
  const[lightbox,setLightbox]=useState(null);

  const load=async()=>{
    setLoading(true);
    // Suporta legacy_id (antigo id do sf_dados) para eventos migrados antes do remap
    const _lid=legacyId&&String(legacyId)!==String(eventId)?String(legacyId):null;
    const idFilter=_lid
      ?`event_id.eq.${eventId},event_id.eq.${_lid}`
      :`event_id.eq.${eventId}`;
    const itemsRes=await sb.from("event_items").select("*")
      .or(idFilter)
      .order("ordem",{ascending:true})
      .order("created_at",{ascending:true});
    setItems(itemsRes.data||[]);
    try{const{kits:k,imgUrls:u}=await loadKitsCached(tenantId);setKits(k);setImgUrls(u);}catch(e){}
    setLoading(false);
  };
  useEffect(()=>{if(eventId)load();},[eventId,legacyId]);

  const getItemImg=item=>{
    if(!item.kit_item_id)return null;
    const ki=kits.flatMap(k=>k.items).find(x=>x.id===item.kit_item_id);
    return ki?.image_path?imgUrls[ki.image_path]||null:null;
  };

  const addItem=async(cat)=>{
    const desc=novos[cat].trim();if(!desc)return;
    const ord=items.filter(i=>i.categoria===cat).length;
    const{data,error}=await sb.from("event_items")
      .insert({tenant_id:tenantId,event_id:String(eventId),categoria:cat,descricao:desc,ordem:ord})
      .select().single();
    if(!error&&data){setItems(p=>[...p,data]);setNovos(p=>({...p,[cat]:""}));}
  };

  const addFromTemplates=async(cat,selected)=>{
    const catItems=items.filter(i=>i.categoria===cat);
    const rows=selected.map(({kitItem},idx)=>({tenant_id:tenantId,event_id:String(eventId),categoria:cat,descricao:kitItem.nome,obs:kitItem.obs||null,kit_item_id:kitItem.id,ordem:catItems.length+idx}));
    const{data,error}=await sb.from("event_items").insert(rows).select();
    if(!error&&data)setItems(p=>[...p,...data]);
    setPickerCat(null);
  };

  const toggleItem=async(item)=>{
    const{data,error}=await sb.from("event_items")
      .update({concluido:!item.concluido}).eq("id",item.id).select().single();
    if(!error&&data)setItems(p=>p.map(i=>i.id===item.id?data:i));
  };

  const deleteItem=async(id)=>{
    await sb.from("event_items").delete().eq("id",id);
    setItems(p=>p.filter(i=>i.id!==id));
    if(editId===id){setEditId(null);setEditText("");}
  };

  const saveObs=async()=>{
    if(!editId)return;
    const{data,error}=await sb.from("event_items")
      .update({obs:editText.trim()||null}).eq("id",editId).select().single();
    if(!error&&data)setItems(p=>p.map(i=>i.id===editId?data:i));
    setEditId(null);setEditText("");
  };

  if(loading)return(
    <div style={{marginTop:16,paddingTop:16,borderTop:"1px solid var(--border)",fontSize:12,color:"var(--text3)"}}>
      Carregando itens...
    </div>
  );

  const catEmoji={material:"",figurino:"",checklist:""};

  return(
    <div style={{marginTop:16,paddingTop:16,borderTop:"1px solid var(--border)"}}>
      {EV_ITEM_CATS.filter(cat=>!categorias||categorias.includes(cat.id)).map(cat=>{
        const catItems=items.filter(i=>i.categoria===cat.id);
        if(readOnly&&catItems.length===0)return null;
        const done=catItems.filter(i=>i.concluido).length;

            <div

                <span>{cat.emoji}</span>
                <span>{cat.label}</span>

                  <span style={{background:allDone?"var(--success-light)":"var(--bg)",color:allDone?"var(--success)":"var(--text3)",borderRadius:20,fontSize:11,fontWeight:600,padding:"1px 8px",border:"1px solid "+(allDone?"#10b98133":"var(--border)")}}>

                {catItems.length===0&&(

                )}
                <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:catItems.length>0?10:0}}>
                  {catItems.map(item=>{
                    const isEdit=!readOnly&&editId===item.id;
                    const imgUrl=getItemImg(item);
                    return(
                      <div key={item.id} style={{background:"var(--bg)",borderRadius:9,padding:"9px 11px",border:"1px solid var(--border)"}}>

                              style={{width:36,height:36,borderRadius:6,objectFit:"cover",cursor:"pointer",flexShrink:0,border:"1px solid var(--border)"}}/>
                          )}
                          <input

                          />
                          <span style={{flex:1,fontSize:13,color:"var(--text)",textDecoration:item.concluido?"line-through":"none",opacity:item.concluido?0.5:1,lineHeight:1.4}}>
                            {item.descricao}
                          </span>
                          {!readOnly&&(
                            <button
                              onClick={()=>{
                                if(isEdit){setEditId(null);setEditText("");}
                                else{setEditId(item.id);setEditText(item.obs||"");}
                              }}
                              title={item.obs?"Editar observação":"Adicionar observação"}
                              style={{background:"transparent",border:"none",cursor:"pointer",fontSize:14,color:item.obs?"var(--primary)":"var(--text3)",padding:"2px 3px",lineHeight:1,flexShrink:0}}
                            >Editar</button>
                          )}
                          {!readOnly&&(
                            <button
                              onClick={()=>deleteItem(item.id)}

                          )}
                        </div>
                        {isEdit&&(
                          <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid var(--border)"}}>

                              style={{width:"100%",background:"var(--card)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 10px",fontSize:12,color:"var(--text)",fontFamily:"inherit",outline:"none",resize:"vertical",boxSizing:"border-box"}}
